<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f8cff'/%3E%3Cstop offset='1' stop-color='%239b6ce0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 15L49 32L32 49L15 32Z' fill='%23fff'/%3E%3Cpath d='M32 25L39 32L32 39L25 32Z' fill='url(%23g)'/%3E%3C/svg%3E">
<script>/* 主题预置：首帧前落位，避免闪烁；变体/回退顺序见 boot 的 applyTheme */
if(!document.documentElement.dataset.theme){
  try{document.documentElement.dataset.theme = localStorage.getItem('kb-theme')==='light' ? 'light' : 'dark';}
  catch(e){document.documentElement.dataset.theme = 'dark';}
}</script>
<style>
:root{
  --bg:#0c0e14; --bg2:#151a26; --bg3:#1d2536; --bg-hover:#26304a;
  --border:#273044; --border-soft:#1e2536;
  --t-fast:.15s ease; --t-med:.25s cubic-bezier(.4,0,.2,1);
  --fg:#d8dee9; --fg-dim:#8b93a5; --fg-faint:#5c6478;
  --accent:#4f8cff; --accent2:#7aa5ff; --green:#3fb27f; --orange:#e2a03f; --red:#e05c5c;
  --grad:linear-gradient(135deg,#4f8cff,#9b6ce0); /* 派生令牌：主色 --accent + 分区紫(proto #9b6ce0)，首页 hero/统计卡用 */
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  /* M3 补充派生令牌：亮/暗两套主题只换令牌值，选择器不写死色值 */
  color-scheme:dark;
  --topbar-bg:rgba(12,14,20,.85); --mask-bg:rgba(0,0,0,.5);
  --scrollbar:#2b3348; --scrollbar-hover:#3d4763;
  --row-alt:rgba(255,255,255,.015); --pre-hl:rgba(255,255,255,.03);
  --sel:rgba(79,140,255,.35); --nav-active:rgba(79,140,255,.16); --focus:rgba(122,165,255,.55);
  --mark-bg:rgba(226,160,63,.45);
  --tk-s:#62c48f; --tk-f:#b48ce0; /* 语法高亮字面值令牌化，浅色主题换深字色 */
  --shadow-sm:0 1px 2px rgba(0,0,0,.25); --shadow-lg:0 8px 24px rgba(0,0,0,.35);
}
/* M3 浅色主题：由 M1 深色令牌同族派生（同色相提明度），正文对比度均 ≥4.5:1 */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5fa; --bg2:#ffffff; --bg3:#e9edf5; --bg-hover:#dbe3f1;
  --border:#d3dbe9; --border-soft:#e3e8f2;
  --fg:#28303f; --fg-dim:#5b6577; --fg-faint:#9099ab;
  --accent:#3a72e8; --accent2:#2d64d8; --green:#177e57; --orange:#a86e12; --red:#c94f4f;
  --grad:linear-gradient(135deg,#3a72e8,#8a5cd6);
  --topbar-bg:rgba(243,245,250,.85); --mask-bg:rgba(15,25,50,.32);
  --scrollbar:#c4cdde; --scrollbar-hover:#a5b2cb;
  --row-alt:rgba(20,40,90,.03); --pre-hl:rgba(20,40,90,.045);
  --sel:rgba(58,114,232,.22); --nav-active:rgba(58,114,232,.13); --focus:rgba(45,100,216,.5);
  --mark-bg:rgba(214,150,30,.35);
  --tk-s:#147a4d; --tk-f:#7d3fc4;
  --shadow-sm:0 1px 3px rgba(25,42,80,.12); --shadow-lg:0 8px 24px rgba(25,42,80,.16);
}
html[data-theme="light"] .md blockquote{border-left-color:#b7c9ec}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px;scrollbar-width:thin;scrollbar-color:var(--scrollbar) transparent}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','Noto Sans SC',sans-serif;line-height:1.75}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* custom scrollbars: sidebar / main / code blocks / toc */
#sidebar::-webkit-scrollbar,#main::-webkit-scrollbar,.md pre::-webkit-scrollbar,#toc::-webkit-scrollbar{width:10px;height:10px}
#sidebar::-webkit-scrollbar-thumb,#main::-webkit-scrollbar-thumb,.md pre::-webkit-scrollbar-thumb,#toc::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:8px;border:2px solid transparent;background-clip:content-box}
#sidebar::-webkit-scrollbar-thumb:hover,#main::-webkit-scrollbar-thumb:hover,.md pre::-webkit-scrollbar-thumb:hover,#toc::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}
#sidebar::-webkit-scrollbar-track,#main::-webkit-scrollbar-track,.md pre::-webkit-scrollbar-track,#toc::-webkit-scrollbar-track{background:transparent}

/* ===== topbar ===== */
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--topbar-bg);backdrop-filter:blur(12px) saturate(1.2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:100}
#topbar .logo{font-weight:700;font-size:1.05rem;letter-spacing:.5px;white-space:nowrap}
#topbar .logo .em{color:var(--accent)}
/* M3: 主题切换按钮（亮/暗），图标由 JS 注入 */
#themebtn{flex-shrink:0;width:34px;height:34px;border:1px solid var(--border);background:var(--bg3);color:var(--fg-dim);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color var(--t-fast),border-color var(--t-fast)}
#themebtn:hover{color:var(--fg);border-color:var(--accent)}
#themebtn .ico-svg{width:16px;height:16px}
#searchbox{flex:1;max-width:560px;position:relative}
#searchbox input{width:100%;height:34px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:0 12px 0 34px;font-size:.9rem;outline:none;transition:border var(--t-fast),box-shadow var(--t-fast)}
#searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
#searchbox .icon{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--fg-faint);pointer-events:none}
#searchclear{position:absolute;right:8px;top:8px;width:20px;height:20px;border:none;background:none;color:var(--fg-dim);cursor:pointer;display:none;font-size:1rem}
#topbar .meta{margin-left:auto;font-size:.75rem;color:var(--fg-dim);white-space:nowrap;text-align:right}
#topbar .meta b{color:var(--green);font-weight:600}

/* ===== layout ===== */
#layout{display:flex;padding-top:52px;height:100vh}
#sidebar{width:290px;min-width:290px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;height:calc(100vh - 52px);position:sticky;top:52px}
#main{flex:1;min-width:0;overflow-y:auto;height:calc(100vh - 52px);scroll-behavior:smooth}

/* ===== sidebar ===== */
#nav{padding:14px 12px 30px}
.nav-sec{margin-bottom:6px}
.nav-sec-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none;transition:background var(--t-fast)}
.nav-sec-head:hover,.nav-item:hover{background:var(--bg-hover)}
.nav-sec-head .ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--sec,var(--fg-dim));background:var(--sec-a12,var(--bg3));flex-shrink:0}
.nav-sec-head .ico .ico-svg{width:15px;height:15px}
.nav-sec-head .name{font-weight:600;font-size:.92rem}
.nav-sec-head .cnt{margin-left:auto;font-size:.72rem;color:var(--fg-dim);background:var(--bg3);border-radius:10px;padding:1px 8px}
.nav-sec-head .arrow{margin-left:6px;color:var(--fg-faint);font-size:.7rem;transition:transform var(--t-fast)}
.nav-sec.open .nav-sec-head .arrow{transform:rotate(90deg)}
.nav-items{display:none;padding:2px 0 6px}
.nav-sec.open .nav-items{display:block}
.nav-item{display:block;padding:6px 12px 6px 44px;font-size:.87rem;color:var(--fg-dim);text-decoration:none;border-radius:7px;margin:1px 4px;cursor:pointer;transition:all var(--t-fast);line-height:1.45}
.nav-item:hover{color:var(--fg)}
.nav-item.active{color:var(--fg);background:var(--nav-active);box-shadow:inset 2px 0 0 var(--accent)}
.nav-sec.cur .nav-sec-head{background:var(--sec-a12);box-shadow:inset 2px 0 0 var(--sec)}
.nav-sec.cur .nav-sec-head .name{color:var(--fg)}
/* M1 评审项：侧栏次级小字对比度修正 —— 只调局部选择器，不动全局 --fg-faint 令牌 */
.nav-item .sub{display:block;font-size:.72rem;color:var(--fg-dim);margin-top:1px}
#nav .empty-sec{padding:2px 12px 6px 44px;font-size:.8rem;color:var(--fg-faint);font-style:italic}
.nav-recent{margin:14px 4px 0;padding-top:12px;border-top:1px dashed var(--border)}
.nav-recent .h{font-size:.75rem;color:var(--fg-faint);padding:0 10px 6px;letter-spacing:.5px}
.commit-item{padding:6px 10px;border-radius:7px;font-size:.78rem;color:var(--fg-dim);cursor:default}
.commit-item:hover{background:var(--bg3)}
.commit-item .cm{color:var(--fg);display:block;line-height:1.4;margin-bottom:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.commit-item .cd{font-size:.7rem;color:var(--fg-dim)}
.commit-item .cd b{color:var(--green);font-weight:600}

/* ===== article ===== */
#article{max-width:820px;margin:0 auto;padding:36px 48px 80px}
/* M3: 文档页头 = 面包屑（分区 → 文档路径）+ 元信息行（只用管线下发数据里真实存在的字段） */
/* 坑：本文件是占位符替换模板，注释里不得出现任何占位符字面量 —— build 的 str.replace 会全量替换 */
#crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:.8rem;color:var(--fg-faint);margin-bottom:12px}
#crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
#crumbs a:hover{text-decoration:underline}
#crumbs .sep{color:var(--border)}
#crumbs .path{font-family:var(--mono);font-size:.72rem;color:var(--fg-dim);background:var(--bg3);border:1px solid var(--border-soft);border-radius:6px;padding:1px 8px;word-break:break-all}
#docmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 20px}
#docmeta .dm{font-size:.74rem;color:var(--fg-faint)}
#docmeta .dm b{color:var(--fg-dim);font-weight:600;font-family:var(--mono)}
.md h1{font-size:1.7rem;line-height:1.3;margin:0 0 10px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.md h2{font-size:1.28rem;margin:40px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.md h3{font-size:1.08rem;margin:30px 0 10px}
.md h4{font-size:1rem;margin:22px 0 8px}
.md p{margin:12px 0}
.md a{color:var(--accent2)}
.md ul,.md ol{padding-left:26px;margin:10px 0}
.md li{margin:4px 0}
.md blockquote{border-left:3px solid var(--border-soft);background:rgba(79,140,255,.07);padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0;color:var(--fg-dim)}
.md blockquote p{margin:4px 0}
.md code{font-family:var(--mono);font-size:.85em;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.md pre{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:14px 0;line-height:1.55;box-shadow:inset 0 1px 0 var(--pre-hl)}
.md pre code{background:none;border:none;padding:0;font-size:.83rem}
/* syntax highlight tokens (M2，M3 令牌化以适配双主题)：深浅各一套取值 ——
   k=accent2 / n=orange / c=fg-faint / p=accent 随令牌自动切换；s 与 f 为字面值令牌
   （深色 = --green 提亮 #62c48f / 分区紫提亮 #b48ce0；浅色 = 白底深字 #147a4d / #7d3fc4） */
.md pre code .tk-k{color:var(--accent2)}
.md pre code .tk-s{color:var(--tk-s)}
.md pre code .tk-n{color:var(--orange)}
.md pre code .tk-c{color:var(--fg-faint);font-style:italic}
.md pre code .tk-f{color:var(--tk-f)}
.md pre code .tk-p{color:var(--accent)}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.88rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border-soft);padding:7px 12px;text-align:left;vertical-align:top}
.md th{background:var(--bg3);font-weight:600;white-space:nowrap}
.md tr:nth-child(even) td{background:var(--row-alt)}
.md hr{border:none;border-top:1px solid var(--border);margin:26px 0}
.md img{max-width:100%;border-radius:8px}
.md input[type=checkbox]{margin-right:6px}

/* code copy button */
.codewrap{position:relative}
.copybtn{position:absolute;top:8px;right:8px;background:var(--bg3);border:1px solid var(--border);color:var(--fg-dim);border-radius:6px;font-size:.72rem;padding:3px 10px;cursor:pointer;opacity:0;transition:opacity var(--t-fast)}
.codewrap:hover .copybtn{opacity:1}
.copybtn:hover{color:var(--fg);border-color:var(--accent)}
.copybtn.ok{color:var(--green);border-color:var(--green)}

/* tag chips（文档元信息行 + 标签云共用） */
.chip{font-size:.74rem;border:1px solid var(--border);background:var(--bg2);border-radius:20px;padding:2px 12px;color:var(--fg-dim)}
.chip.tag{color:var(--accent2);border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.08);cursor:pointer}
.chip.tag:hover{background:rgba(79,140,255,.18)}

/* ===== TOC（M3：≥1450px 悬浮目录；<1450px 右侧抽屉 + FAB 入口，复用 --t-med 与遮罩模式） ===== */
#toc{position:fixed;right:16px;top:110px;width:210px;font-size:.76rem;max-height:calc(100vh - 160px);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity var(--t-med)}
#toc.show{opacity:1;pointer-events:auto}
#toc .drawer-h{display:none}
#toc .h{color:var(--fg-faint);letter-spacing:1px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}
#toc a{display:block;color:var(--fg-dim);text-decoration:none;padding:3px 0 3px 8px;border-left:2px solid transparent;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc a:hover{color:var(--fg)}
#toc a.lv2{padding-left:16px}
#toc a.lv3{padding-left:26px;font-size:.72rem}
#toc a.on{color:var(--accent2);border-left-color:var(--accent)}
/* M3: 窄屏目录入口（FAB + 抽屉 + 遮罩）—— 仅 <1450px 生效 */
#tocfab{display:none;position:fixed;right:22px;bottom:26px;width:44px;height:44px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--fg-dim);align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-lg);z-index:130;transition:color var(--t-fast),border-color var(--t-fast)}
#tocfab:hover{color:var(--accent);border-color:var(--accent)}
#tocfab svg{width:19px;height:19px}
#tocfab.hide{display:none!important}
#tocmask{display:none}
@media(max-width:1450px){
  #toc{display:block;top:52px;right:0;bottom:0;left:auto;width:min(330px,86vw);max-height:none;background:var(--bg2);border-left:1px solid var(--border);border-radius:0;opacity:1;pointer-events:auto;transform:translateX(105%);transition:transform var(--t-med);z-index:150;padding:0 14px 20px}
  #toc.open{transform:translateX(0)}
  #toc .h{display:none}
  #toc .drawer-h{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;font-weight:600;color:var(--fg);padding:16px 2px 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
  #tocclose{border:none;background:none;color:var(--fg-dim);font-size:1rem;cursor:pointer;padding:4px 6px}
  #tocclose:hover{color:var(--fg)}
  #tocmask.show{display:block;position:fixed;inset:52px 0 0 0;background:var(--mask-bg);z-index:140}
  #tocfab.on{display:flex}
}

/* ===== welcome（M2 首页改版：hero + 统计卡 + 分类卡片，视觉语言沿用 M1 tokens） ===== */
#welcome{max-width:820px;margin:0 auto;padding:30px 48px 80px}
.ico-svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.hero{text-align:center;padding:22px 0 4px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;color:var(--fg-dim);border:1px solid var(--border);background:var(--bg2);border-radius:30px;padding:5px 16px;margin-bottom:20px}
.hero-badge .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,178,127,.45)}70%{box-shadow:0 0 0 9px rgba(63,178,127,0)}100%{box-shadow:0 0 0 0 rgba(63,178,127,0)}}
.hero h1{font-size:clamp(1.95rem,4.5vw,2.7rem);font-weight:800;letter-spacing:1px;line-height:1.25;margin:0 0 12px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--fg-dim);font-size:.95rem;max-width:600px;margin:0 auto 18px}
.hero-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.hero-meta .hm{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-family:var(--mono);color:var(--fg-faint);border:1px solid var(--border);background:var(--bg2);border-radius:9px;padding:3px 10px}
.hero-meta .hm b{color:var(--fg-dim);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0 38px}
.stat{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;overflow:hidden;box-shadow:var(--shadow-sm);transition:all var(--t-fast)}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;background:var(--grad);opacity:.7}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.stat .n{font-size:1.7rem;font-weight:700;line-height:1.2;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:.78rem;color:var(--fg-dim);margin-top:3px}
.stat>svg{position:absolute;right:13px;top:14px;width:17px;height:17px;color:var(--fg-faint);opacity:.55}
.wsec{margin-bottom:36px}
.wsec>h2{display:flex;align-items:center;gap:9px;font-size:1.2rem;margin-bottom:12px}
.wsec>h2 svg{width:17px;height:17px;color:var(--accent2);flex-shrink:0}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.cat{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-sm);transition:all var(--t-fast)}
.cat::after{content:'';position:absolute;left:0;right:0;top:0;height:2.5px;background:linear-gradient(90deg,var(--sc),transparent 70%);opacity:0;transition:opacity var(--t-fast)}
.cat:hover{transform:translateY(-2px);border-color:var(--sc-line,var(--accent));box-shadow:var(--shadow-lg)}
.cat:hover::after{opacity:1}
.cat .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cat .icochip{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sc);background:var(--sc-soft);flex-shrink:0}
.cat .icochip .ico-svg{width:17px;height:17px}
.cat .top .nm{font-weight:700;font-size:.95rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .cbadge{font-size:.68rem;color:var(--sc);background:var(--sc-soft);border-radius:12px;padding:1.5px 10px;flex-shrink:0;white-space:nowrap}
.cat .d{font-size:.8rem;color:var(--fg-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.cat .foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:.7rem;color:var(--fg-faint);font-family:var(--mono)}
.cat .go{color:var(--sc);opacity:0;transform:translateX(-4px);transition:all var(--t-fast);font-family:inherit}
.cat:hover .go{opacity:1;transform:none}
.kcard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all var(--t-fast);box-shadow:var(--shadow-sm)}
.kcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kcard .t{font-weight:600;font-size:.95rem;margin-bottom:4px;color:var(--fg)}

.kcard .m{font-size:.72rem;color:var(--fg-faint);margin-top:8px}
.kcard .m b{color:var(--orange);font-weight:600}

/* ===== mobile ===== */
#burger{display:none}

  .hero{padding-top:10px}
  .statgrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

}

/* ===== print（M3：仅留正文，代码块/表格完整可读且避免内部断页） ===== */
@media print{
  @page{margin:12mm}
  html,body{background:#fff;color:#111}
  #topbar,#sidebar,#toc,#tocfab,#tocmask,#mask,.copybtn{display:none!important}
  #layout{padding-top:0;height:auto;display:block}
  #main{height:auto;overflow:visible}
  #article,#welcome{max-width:100%;padding:0}
  .codewrap,.md pre,.md blockquote,.md img,.stat,.cat,.kcard{page-break-inside:avoid;break-inside:avoid}
  .md pre{background:#f5f6f8;border:1px solid #d8dce4;box-shadow:none}
  .md code{background:#f0f1f5;border-color:#d8dce4}
  .md th{background:#eef1f6}
  .md tr:nth-child(even) td{background:#fafbfd}
  .md table{display:table;font-size:.8rem}
  .md blockquote{background:#f2f6ff;border-left-color:#b7c9ec;color:#333}
  .md a{color:#1a4fb8;text-decoration:none}
  .md a[href^="http"]::after{content:" (" attr(href) ")";font-size:.85em;color:#777;word-break:break-all}
  mark.sr{background:#f3dd8f;color:#111}
  .stat,.cat,.kcard{box-shadow:none;border-color:#d8dce4}
  .cat:hover,.kcard:hover,.stat:hover{transform:none}
  .hero-badge .pulse{animation:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>

/* ============ DATA ============ */

const SYNC_INFO = { date:"__SYNC_DATE__", sha:"__HEAD_SHA__" };

 * 取不到时回退现值；未来 kb_build_viewer.py 在 KB 上下发 repo/branch 即自动生效 */
const REPO_META = { repo: KB.repo || 'YYM642443594/KnowledgeBase', branch: KB.branch || 'develop' };

/* ============ SVG 图标体系（M2） ============
 * 分区 emoji 由 kb_build_viewer.py 的 SECTIONS 元数据下发（脚本禁改），

const ICO = p => '<svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
const SEC_ICON = {

  imu:   ICO('<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>'),
  stm32: ICO('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'),
  qt:    ICO('<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>'),

};
const UI_ICON = {

  layers: ICO('<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/>'),

  clock:  ICO('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>'),
  file:   ICO('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'),
  type:   ICO('<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>'),
  image:  ICO('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>'),
  /* M3: 主题切换（太阳=当前深色点击转浅色；月亮=当前浅色点击转深色） */
  sun:    ICO('<circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="3.5"/><line x1="12" y1="20.5" x2="12" y2="22.5"/><line x1="4.6" y1="4.6" x2="6" y2="6"/><line x1="18" y1="18" x2="19.4" y2="19.4"/><line x1="1.5" y1="12" x2="3.5" y2="12"/><line x1="20.5" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="19.4" x2="6" y2="18"/><line x1="18" y1="6" x2="19.4" y2="4.6"/>'),
  moon:   ICO('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>')
};
function secIcon(sec){ return SEC_ICON[sec.id] || esc(sec.icon); } /* 未知分区回退 emoji */

/* ============ 代码语法高亮（M2：零依赖轻量分词器） ============
 * 覆盖库内常见语言：C/C++、JS/TS/QML、Python、Sh/Bash/PS、JSON，其余语言走通用规则
 * （注释/字符串/数字），text、tex、mermaid 等纯文本类直接原样输出。配色见 .tk-* 主题。 */
const HL_KW_SRC = {
  c:   'alignas alignof auto bool break case char class const constexpr continue default do double else enum extern false float for goto if inline int int8_t int16_t int32_t int64_t long NULL nullptr private protected public register return short signed sizeof static struct switch template this true typedef typename union unsigned void volatile while uint8_t uint16_t uint32_t uint64_t size_t ssize_t ptrdiff_t wchar_t',
  js:  'async await break case catch class const continue debugger default delete do else export extends false finally for from function get if import in instanceof let new null of return set static super switch this throw true undefined try typeof var void while with yield',
  py:  'and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True self try while with yield',
  sh:  'break case cd continue do done echo elif else esac exit export fi for function if in local return set source then unset until while',
  json:'true false null'
};
const HL_DQ = '"(?:[^"\\\\\\n]|\\\\.)*"',   HL_DQ_U = '"[^"\\n]*';
const HL_SQ = "'(?:[^'\\\\\\n]|\\\\.)*'",   HL_SQ_U = "'[^'\\n]*";
const HL_BT = '`(?:[^`\\\\]|\\\\.)*`',      HL_BT_U = '`[\\s\\S]*';
const HL_NUM = '\\b(?:0[xX][0-9a-fA-F]+|\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)[uUlLfF]*';
const HL_ID  = '[A-Za-z_]\\w*';
function HL_LINE(cm){ return [[cm + '[^\\n]*', 'c']]; }
const HL_LANG_DEFS = {
  c:   { kw:'c',   parts: [['/\\*[\\s\\S]*?(?:\\*/)|/\\*[\\s\\S]*', 'c']].concat(HL_LINE('//'),
               [['^[ \\t]*#[^\\n]*', 'p']], [[HL_DQ,'s'],[HL_DQ_U,'s'],[HL_SQ,'s'],[HL_SQ_U,'s']],
               [[HL_NUM,'n']], [[HL_ID,'id']]) },
  js:  { kw:'js',  parts: [['/\\*[\\s\\S]*?(?:\\*/)|/\\*[\\s\\S]*', 'c']].concat(HL_LINE('//'),
               [[HL_BT,'s'],[HL_BT_U,'s'],[HL_DQ,'s'],[HL_DQ_U,'s'],[HL_SQ,'s'],[HL_SQ_U,'s']],
               [[HL_NUM,'n']], [[HL_ID,'id']]) },
  py:  { kw:'py',  parts: [['"""[\\s\\S]*?"""|"""[\\s\\S]*|\'\'\'[\\s\\S]*?\'\'\'|\'\'\'[\\s\\S]*', 's']].concat(HL_LINE('#'),
               [['^[ \\t]*@[\\w.]+', 'p']], [[HL_DQ,'s'],[HL_DQ_U,'s'],[HL_SQ,'s'],[HL_SQ_U,'s']],
               [[HL_NUM,'n']], [[HL_ID,'id']]) },
  sh:  { kw:'sh',  parts: HL_LINE('#').concat([[HL_DQ,'s'],[HL_DQ_U,'s'],[HL_SQ,'s'],[HL_SQ_U,'s']],
               [['\\$\\{[^}\\n]*\\}|\\$[\\w?#@!*]+', 'p']], [[HL_NUM,'n']], [[HL_ID,'id']]) },
  json:{ kw:'json',parts: [[HL_DQ,'s'],[HL_DQ_U,'s'],[HL_NUM,'n'],[HL_ID,'id']] },
  generic:{ kw:null, parts: [['/\\*[\\s\\S]*?(?:\\*/)|/\\*[\\s\\S]*', 'c']].concat(HL_LINE('//'), HL_LINE('#'),
               [[HL_DQ,'s'],[HL_DQ_U,'s'],[HL_SQ,'s'],[HL_SQ_U,'s']], [[HL_NUM,'n']], [[HL_ID,'id']]) }
};
const HL_MAP = { c:'c', h:'c', cpp:'c', 'c++':'c', cxx:'c', hpp:'c', cc:'c', ino:'c',
  js:'js', javascript:'js', ts:'js', typescript:'js', jsx:'js', tsx:'js', qml:'js',
  py:'py', python:'py', py3:'py',
  sh:'sh', bash:'sh', shell:'sh', zsh:'sh', console:'sh', powershell:'sh', ps1:'sh',
  json:'json' };
const HL_PLAIN = new Set(['', 'text', 'plain', 'txt', 'tex', 'latex', 'md', 'markdown', 'mermaid', 'diff']);
const HL_LANGS = {};
Object.keys(HL_LANG_DEFS).forEach(k=>{
  const def = HL_LANG_DEFS[k];
  HL_LANGS[k] = {
    ty: def.parts.map(p=>p[1]),
    re: new RegExp(def.parts.map(p=>'(' + p[0] + ')').join('|'), 'gm'),
    kw: def.kw ? new Set(HL_KW_SRC[def.kw].split(/\s+/)) : new Set()
  };
});
function hlHighlight(src, langRaw){
  const lang = String(langRaw || '').trim().split(/\s+/)[0].toLowerCase();
  if(HL_PLAIN.has(lang)) return esc(src);
  const L = HL_LANGS[HL_MAP[lang] || 'generic'];
  const re = L.re; re.lastIndex = 0;
  let out = '', last = 0, m;
  while((m = re.exec(src)) !== null){
    if(m.index > last) out += esc(src.slice(last, m.index));
    let t = '';
    for(let g = 1; g < m.length; g++) if(m[g] !== undefined){ t = L.ty[g-1]; break; }
    if(t === 'id'){
      if(L.kw.has(m[0])) t = 'k';
      else {
        let j = re.lastIndex;
        while(j < src.length && (src[j] === ' ' || src[j] === '\t')) j++;
        t = (src[j] === '(') ? 'f' : '';
      }
    }
    out += t ? '<span class="tk-' + t + '">' + esc(m[0]) + '</span>' : esc(m[0]);
    last = re.lastIndex;
    if(m[0].length === 0) re.lastIndex++;   /* 防空匹配死循环 */
  }
  out += esc(src.slice(last));
  return out;
}

/* ============ marked setup ============ */
marked.setOptions({ gfm:true, breaks:false, headerIds:true, mangle:false });

const renderer = new marked.Renderer();
renderer.link = function(href, title, text){
  let out = marked.Renderer.prototype.link.call(this, href, title, text);
  if(href && !/^(https?:|#|mailto:)/.test(href)) out = out.replace('<a ','<a data-intlink="'+href+'" ');
  return out;
};
renderer.code = function(code, lang){
  const id = 'c'+(renderer._ci=(renderer._ci||0)+1);
  /* M2: 语法着色（hlHighlight 内部完成转义；复制按钮读 textContent，不受 span 影响） */
  const body = hlHighlight(code, lang);
  return '<div class="codewrap"><button class="copybtn" data-copy="'+id+'">复制</button><pre><code id="'+id+'">'+body+'</code></pre></div>';
};
marked.use({renderer});

/* ============ state ============ */
const state = { current:null, searchQ:"", navOpen:new Set() };

/* ============ routing ============ */
function parseHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  return h || "";
}
function docByHash(hash){
  for(const s of KB.sections) for(const d of s.docs) if(d.hash === hash) return {doc:d, sec:s};
  return null;
}

/* ============ navigation ============ */
function buildNav(filter){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let matchCount = 0;
  const q = (filter||"").toLowerCase();
  KB.sections.forEach(sec=>{
    const docs = sec.docs.filter(d=>{
      if(!q) return true;
      return (d.title+d.relPath+(d.desc||"")+(d.tags||"").join(" ")).toLowerCase().includes(q)
          || (d._text||"").toLowerCase().includes(q);
    });
    if(q && docs.length===0) return;
    matchCount += docs.length;
    const el = document.createElement('div');
    el.className = 'nav-sec'+(state.navOpen.has(sec.id)||q ? ' open':'');
    el.dataset.sec = sec.id;
    el.style.setProperty('--sec', sec.color);
    el.style.setProperty('--sec-a12', sec.color+'1f');
    const icoHtml = secIcon(sec);   /* M2: SVG 线性图标覆盖 emoji（背景色由 --sec-a12 提供） */
    el.innerHTML = '<div class="nav-sec-head"><span class="ico">'+icoHtml+'</span><span class="name">'+esc(sec.name)+'</span><span class="cnt">'+docs.length+'</span><span class="arrow">▶</span></div><div class="nav-items"></div>';
    const items = el.querySelector('.nav-items');
    if(docs.length===0){
      items.innerHTML = '<div class="empty-sec">暂无文档</div>';
    }
    docs.forEach(d=>{
      const a = document.createElement('a');
      a.className = 'nav-item'; a.dataset.hash = d.hash;
      a.innerHTML = esc(d.title) + (q && d._text ? highlightSnippet(d._text, q) : '');
      a.onclick = ()=>{ location.hash = '#'+d.hash; if(window.innerWidth<900) closeSidebar(); };
      items.appendChild(a);
    });
    el.querySelector('.nav-sec-head').onclick = ()=>{
      const isOpen = el.classList.toggle('open');
      if(isOpen) state.navOpen.add(sec.id); else state.navOpen.delete(sec.id);
    };
    nav.appendChild(el);
  });
  /* recent commits panel */
  if(!q){
    const r = document.createElement('div');
    r.className = 'nav-recent';
    r.innerHTML = '<div class="h">最近提交 · develop</div>' + COMMITS.slice(0,8).map(c=>
      '<div class="commit-item"><span class="cm">'+esc(c.msg)+'</span><span class="cd"><b>'+c.sha+'</b> · '+c.date.slice(0,10)+'</span></div>'
    ).join('');
    nav.appendChild(r);
  }
  setActiveNav();   /* boot order: renderDoc runs before buildNav, so re-apply here */
  return matchCount;
}
function highlightSnippet(text,q){
  const i = text.toLowerCase().indexOf(q);
  if(i<0) return '';
  const s = Math.max(0,i-18), e = Math.min(text.length,i+q.length+26);
  return '<span class="sub">…'+esc(text.slice(s,i))+'<b style="color:var(--orange)">'+esc(text.slice(i,i+q.length))+'</b>'+esc(text.slice(i+q.length,e))+'…</span>';
}
function setActiveNav(){
  document.querySelectorAll('.nav-item').forEach(a=>{
    a.classList.toggle('active', a.dataset.hash===state.current);
  });
  document.querySelectorAll('.nav-sec.cur').forEach(el=>el.classList.remove('cur'));
  const found = state.current ? docByHash(state.current) : null;
  if(found){
    const el = document.querySelector('.nav-sec[data-sec="'+found.sec.id+'"]');
    if(el){
      el.classList.add('cur');
      if(!el.classList.contains('open')){ el.classList.add('open'); state.navOpen.add(found.sec.id); }
    }
  }
}

/* ============ markdown processing ============ */
function stripFrontMatter(md){
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if(!m) return {meta:{}, body:md};
  const meta = {};
  m[1].split(/\r?\n/).forEach(line=>{
    const kv = line.match(/^(\w[\w-]*):\s*(.*)$/);
    if(!kv) return;
    let v = kv[2].trim();
    if(v.startsWith('[') && v.endsWith(']')) v = v.slice(1,-1).split(',').map(x=>x.trim().replace(/^["\']|["\']$/g,'')).filter(Boolean);
    meta[kv[1]] = v;
  });
  return {meta, body: md.slice(m[0].length)};
}
function resolveLinks(html, doc){
  /* rewrite internal md links for click interception; anchor-only links left alone */
  const base = doc.relPath.includes('/') ? doc.relPath.slice(0, doc.relPath.lastIndexOf('/')+1) : '';
  html = html.replace(/data-intlink="([^"]+)"/g, (m,p)=>{
    let clean = p.split('#')[0].split('?')[0];
    let parts = (base + clean).split('/');
    const st = [];
    parts.forEach(p2=>{ if(p2===''||p2==='.') return; if(p2==='..') st.pop(); else st.push(p2); });
    const norm = st.join('/');
    const target = KB.byPath[norm];
    if(target) return 'data-intlink="#'+target.hash+'"';
    return 'data-extmd="'+esc(p)+'"';
  });
  /* embedded images: src attributes use various separators (\\ . ./ 00.image|00.Image); resolve to embedded data URIs */
  html = html.replace(/(<img\s[^>]*src=")([^"]*00[.\/\\]?[Ii]mage[\/\\][^"]*)(")/g, (m,pre,src,post)=>{
    let fn = src.split(/[\/\\]/).pop();
    let parts = (base + "00.Image/" + fn).split('/');
    const st = [];
    parts.forEach(p2=>{ if(p2===''||p2==='.') return; if(p2==='..') st.pop(); else st.push(p2); });
    const data = (KB.images||{})[st.join('/')];
    return data ? pre+data+post : m;
  });
  return html;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============ renderers ============ */
function renderWelcome(){
  document.getElementById('welcome').style.display='';
  document.getElementById('article').style.display='none';
  document.getElementById('toc').classList.remove('show');
  const totalDocs = KB.sections.reduce((n,s)=>n+s.docs.length,0);
  const totalChars = KB.sections.reduce((n,s)=>n+s.docs.reduce((m,d)=>m+stripFrontMatter(d.content).body.length,0),0);
  const imgCount = Object.keys(KB.images||{}).length;
  const fmtChars = totalChars>=10000 ? (totalChars/10000).toFixed(1).replace(/\.0$/,'')+'万' : String(totalChars);
  const tagCount = {};
  KB.sections.forEach(s=>s.docs.forEach(d=>(d.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1)));
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]);
  const w = document.getElementById('welcome');
  w.innerHTML = `
  <div class="hero">
    <div class="hero-badge"><span class="pulse"></span>离线单文件 · 纯本地渲染 · 无服务端</div>
    <h1>个人<em>知识库</em></h1>
    <div class="sub">嵌入式固件 · 上位机 · 协议 · Linux 运维 — 快速浏览与全文检索你的知识沉淀</div>
    <div class="hero-meta">
      <span class="hm">仓库 <b>${esc(REPO_META.repo)}</b></span>
      <span class="hm">分支 <b>${esc(REPO_META.branch)}</b></span>
      <span class="hm">同步 <b>${SYNC_INFO.date}</b></span>
      <span class="hm">HEAD <b>${SYNC_INFO.sha}</b></span>
    </div>
  </div>
  <div class="statgrid">
    <div class="stat">${UI_ICON.layers}<div class="n">${KB.sections.length}</div><div class="l">知识分类</div></div>
    <div class="stat">${UI_ICON.file}<div class="n">${totalDocs}</div><div class="l">文档总数</div></div>
    <div class="stat">${UI_ICON.type}<div class="n">${fmtChars}</div><div class="l">总字数</div></div>
    <div class="stat">${UI_ICON.image}<div class="n">${imgCount}</div><div class="l">内嵌图示</div></div>
  </div>
  <div class="wsec"><h2>${UI_ICON.layers}知识分类</h2><div class="catgrid">${
    KB.sections.map(s=>{
      const first = s.docs[0];
      return `<div class="cat" style="--sc:${s.color};--sc-soft:${s.color}21;--sc-line:${s.color}59"${first?` onclick="location.hash='#${first.hash}'"`:''}>
        <div class="top"><span class="icochip">${secIcon(s)}</span><span class="nm">${esc(s.name)}</span><span class="cbadge">${s.docs.length} 篇</span></div>
        <div class="d">${esc(s.desc)}</div>
        <div class="foot"><span>${esc(s.dir)}</span><span class="go">浏览 →</span></div>
      </div>`;
    }).join('')
  }</div></div>
  <div class="wsec"><h2>${UI_ICON.list}全部文档</h2><div class="cardgrid">${
    KB.sections.flatMap(s=>s.docs.map(d=>`
      <div class="kcard" onclick="location.hash='#${d.hash}'">
        <div class="t">${esc(d.title)}</div>
        <div class="d">${esc(d.desc||'')}</div>
        <div class="m">${esc(s.name)} · <b>${d.sizeKB}</b> KB</div>
      </div>`)).join('')
  }</div></div>
  <div class="wsec"><h2>${UI_ICON.tag}标签云</h2><div class="tagcloud">${
    topTags.map(([t,n])=>`<span class="chip tag" onclick="doTagSearch('${esc(t)}')">#${esc(t)} <span style="opacity:.6">${n}</span></span>`).join('')
  }</div></div>
  <div class="wsec"><h2>${UI_ICON.clock}最近更新</h2>${
    COMMITS.slice(0,10).map(c=>`<div class="commit-item" style="padding:8px 4px;border-bottom:1px solid var(--border);border-radius:0"><span class="cm" style="-webkit-line-clamp:1">${esc(c.msg)}</span><span class="cd"><b>${c.sha}</b> · ${c.date}</span></div>`).join('')
  }</div>`;
}
window.doTagSearch = function(t){ document.getElementById('search').value = t; onSearchInput(); };

function renderDoc(hash){
  const found = docByHash(hash);
  if(!found){ renderWelcome(); state.current=null; setActiveNav(); return; }
  const {doc, sec} = found;
  state.current = hash;
  document.getElementById('welcome').style.display='none';
  const art = document.getElementById('article'); art.style.display='';
  /* M3 页头：面包屑 = 分区 → 文档路径；元信息仅渲染数据里真实存在的字段 */
  document.getElementById('crumbs').innerHTML =
    '<a onclick="location.hash=\'\'">首页</a><span class="sep">/</span>' +
    '<a onclick="buildNavClear()">'+esc(sec.name)+'</a><span class="sep">/</span>' +
    '<span class="path">'+esc(doc.relPath)+'</span>';
  const metas = [];
  if(doc.updated) metas.push('<span class="dm">更新 <b>'+esc(doc.updated)+'</b></span>');
  if(doc.created) metas.push('<span class="dm">创建 <b>'+esc(doc.created)+'</b></span>');
  if(doc.sizeKB != null) metas.push('<span class="dm">大小 <b>'+esc(doc.sizeKB)+'</b> KB</span>');
  (doc.tags||[]).forEach(t=>metas.push('<span class="chip tag" onclick="doTagSearch(\''+esc(t)+'\')">#'+esc(t)+'</span>'));
  document.getElementById('docmeta').innerHTML = metas.join('');
  /* markdown */
  const {body} = stripFrontMatter(doc.content);
  let html = marked.parse(body);
  html = resolveLinks(html, doc);
  const c = document.getElementById('content');
  c.innerHTML = html;
  /* first h1 replaced by doc title context */
  window.buildNavClear = function(){ document.getElementById('search').value=''; onSearchInput(); };
  /* heading ids */
  const used = {};
  c.querySelectorAll('h1,h2,h3,h4').forEach(h=>{
    let id = h.textContent.trim().replace(/[^\w\u4e00-\u9fa5]+/g,'-').toLowerCase();
    if(used[id]!=null){ used[id]++; id = id+'-'+used[id]; } else used[id]=0;
    h.id = 'h-'+id;
  });
  buildTOC(c);
  applySearchHighlight();
  setActiveNav();
  document.getElementById('main').scrollTop = 0;
  const links = [...document.querySelectorAll('#toclist a')];
  if(links.length){
    links.forEach(a=>a.addEventListener('click', e=>{
      e.preventDefault();
      const el = document.getElementById(a.getAttribute('href').slice(1));
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      closeToc();   /* 抽屉模式下点选后收起；桌面态无 .open，调用无副作用 */
    }));
  }
}
function buildTOC(container){
  const hs = [...container.querySelectorAll('h2,h3')];
  const tl = document.getElementById('toclist');
  const fab = document.getElementById('tocfab');
  if(hs.length < 3){ document.getElementById('toc').classList.remove('show'); tl.innerHTML=''; fab.classList.remove('on'); return; }
  document.getElementById('toc').classList.add('show');
  fab.classList.add('on');
  tl.innerHTML = hs.map(h=>'<a href="#'+h.id+'" class="lv'+h.tagName[1]+'">'+esc(h.textContent)+'</a>').join('');
}
/* ============ TOC 抽屉（M3：<1450px 的目录入口，与移动端侧栏同款遮罩模式） ============ */
function openToc(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mask').classList.remove('show');
  document.getElementById('toc').classList.add('open');
  document.getElementById('tocmask').classList.add('show');
  document.getElementById('tocfab').classList.add('hide');
}
function closeToc(){
  document.getElementById('toc').classList.remove('open');
  document.getElementById('tocmask').classList.remove('show');
  document.getElementById('tocfab').classList.remove('hide');
}
function initTocFab(){
  const fab = document.getElementById('tocfab');
  fab.innerHTML = UI_ICON.list;
  fab.onclick = openToc;
  document.getElementById('tocclose').onclick = closeToc;
  document.getElementById('tocmask').onclick = closeToc;
}
/* scrollspy（M3：当前小节高亮 + 目录项自动跟随滚入视野，深浅主题均以 accent 竖条呈现） */
let spyTick=false, spyLast=null;
document.getElementById('main').addEventListener('scroll', ()=>{
  if(spyTick) return; spyTick=true;
  requestAnimationFrame(()=>{
    spyTick=false;
    const links = [...document.querySelectorAll('#toclist a')];
    if(!links.length) return;
    let cur = links[0];
    for(const a of links){
      const el = document.getElementById(a.getAttribute('href').slice(1));
      if(el && el.getBoundingClientRect().top < 120) cur = a;
    }
    links.forEach(a=>a.classList.toggle('on', a===cur));
    if(cur && cur!==spyLast && document.getElementById('toc').classList.contains('show')){
      cur.scrollIntoView({block:'nearest'});   /* 仅滚动 #toc 自身，不牵动页面 */
    }
    spyLast = cur;
  });
});

/* ============ search ============ */
function onSearchInput(){
  const v = document.getElementById('search').value;
  document.getElementById('searchclear').style.display = v ? 'block':'none';
  state.searchQ = v;
  buildNav(v);
  if(v) showSearchResults(v); else { if(state.current) renderDoc(state.current); else renderWelcome(); }
}
function showSearchResults(q){
  state.current=null; setActiveNav();
  document.getElementById('welcome').style.display='none';
  const art = document.getElementById('article'); art.style.display='';
  document.getElementById('toc').classList.remove('show');
  document.getElementById('crumbs').innerHTML = '搜索 “'+esc(q)+'”';
  document.getElementById('docmeta').innerHTML='';
  const ql = q.toLowerCase();
  const hits = [];
  KB.sections.forEach(s=>s.docs.forEach(d=>{
    const t = (d.title+d.relPath).toLowerCase().includes(ql);
    const i = (d._text||'').toLowerCase().indexOf(ql);
    if(t || i>=0){
      let snip = '';
      if(i>=0){
        const raw = d._text; const s0=Math.max(0,i-40), e0=Math.min(raw.length,i+q.length+80);
        snip = esc(raw.slice(s0,i))+'<mark class="sr">'+esc(raw.slice(i,i+q.length))+'</mark>'+esc(raw.slice(i+q.length,e0));
      }
      hits.push({d,s,t,snip});
    }
  }));
  document.getElementById('content').innerHTML = hits.length ?
    '<h1 style="font-size:1.4rem">找到 '+hits.length+' 个匹配</h1>' + hits.map(h=>
      '<div class="kcard" style="margin:10px 0" onclick="location.hash=\'#'+h.d.hash+'\'"><div class="t">'+h.d.title+'</div>'+(h.snip?'<div class="d" style="-webkit-line-clamp:3">'+h.snip+'</div>':'')+'<div class="m">'+esc(h.s.name)+' · '+esc(h.d.relPath)+'</div></div>'
    ).join('') : '<p style="color:var(--fg-dim)">没有匹配的文档。</p>';
}
function applySearchHighlight(){
  const q = state.searchQ; if(!q || !state.current) return;
  const c = document.getElementById('content');
  const walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
  const nodes=[]; let n;
  while(n=walker.nextNode()){
    if(n.parentElement.closest('pre,code,button')) continue;
    if(n.nodeValue.toLowerCase().includes(q.toLowerCase())) nodes.push(n);
  }
  nodes.forEach(node=>{
    const frag = document.createDocumentFragment();
    let rest = node.nodeValue, lower = rest.toLowerCase(), ql=q.toLowerCase();
    let idx;
    while((idx = lower.indexOf(ql)) >= 0){
      frag.appendChild(document.createTextNode(rest.slice(0,idx)));
      const mk = document.createElement('mark'); mk.className='sr'; mk.textContent = rest.slice(idx, idx+q.length);
      frag.appendChild(mk);
      rest = rest.slice(idx+q.length); lower = rest.toLowerCase();
    }
    frag.appendChild(document.createTextNode(rest));
    node.parentNode.replaceChild(frag, node);
  });
}

/* ============ link & copy clicks ============ */
document.addEventListener('click', e=>{
  const cp = e.target.closest('.copybtn');
  if(cp){
    const code = document.getElementById(cp.dataset.copy);
    navigator.clipboard.writeText(code.textContent).then(()=>{ cp.textContent='已复制'; cp.classList.add('ok'); setTimeout(()=>{cp.textContent='复制';cp.classList.remove('ok');},1500); });
    return;
  }
  const il = e.target.closest('a[data-intlink]');
  if(il){ e.preventDefault(); const h=il.getAttribute('data-intlink'); if(h.startsWith('#')) location.hash=h; return; }
  const anc = e.target.closest('#content a[href^="#"]');
  if(anc){
    e.preventDefault();
    const h = decodeURIComponent(anc.getAttribute('href').slice(1));
    const el = document.getElementById('h-'+h) || document.getElementById(h);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const ex = e.target.closest('a[data-extmd]');
  if(ex){ e.preventDefault(); alert('该链接指向仓库内未收录或非 .md 文件：\n'+ex.getAttribute('data-extmd')); return; }
  const a = e.target.closest('#content a[href^="http"]');
  if(a){ a.target='_blank'; a.rel='noopener'; }
});

/* ============ mobile sidebar ============ */
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('mask').classList.remove('show'); }
document.getElementById('burger').onclick = ()=>{ closeToc(); document.getElementById('sidebar').classList.toggle('open'); document.getElementById('mask').classList.toggle('show'); };
document.getElementById('mask').onclick = closeSidebar;

/* ============ theme（M3：默认深色，切换即时生效，localStorage 记忆） ============ */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('kb-theme', t); }catch(e){}
  document.getElementById('themebtn').innerHTML = t==='light' ? UI_ICON.moon : UI_ICON.sun;
}
document.getElementById('themebtn').onclick = ()=>{
  applyTheme(document.documentElement.dataset.theme==='light' ? 'dark' : 'light');
};

/* ============ boot ============ */
applyTheme(document.documentElement.dataset.theme || 'dark');   /* 图标就位；属性已由 <head> 预置脚本落位 */
document.getElementById('trepo').textContent = REPO_META.repo;
document.getElementById('tbranch').textContent = REPO_META.branch;
initTocFab();
document.getElementById('search').addEventListener('input', onSearchInput);
document.getElementById('searchclear').onclick = ()=>{ document.getElementById('search').value=''; onSearchInput(); };
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('search').focus(); }
  if(e.key==='Escape' && document.activeElement===document.getElementById('search')){ document.getElementById('search').value=''; onSearchInput(); }
});
window.addEventListener('hashchange', ()=>{
  const h = parseHash();
  if(h.startsWith('h-')) return;          /* in-page heading anchor: native scroll, keep view */
  if(state.searchQ) return;
  if(docByHash(h)){ renderDoc(h); return; }
  const el = document.getElementById('h-'+h) || document.getElementById(h);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  renderDoc(h);
});
if(parseHash()){ renderDoc(parseHash()); } else { renderWelcome(); }
buildNav("");   /* populate sidebar on boot */
</script>
