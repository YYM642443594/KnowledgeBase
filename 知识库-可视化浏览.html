加重因素：0x08004400 与用户校准偏置区（USERCALIBRATIONPARAM2）共用， 页内容可能是校准浮点数据而非参数，裸读取会把垃圾数据误当配置迁移 根因2：延迟落盘机制下，复位/升级入口未强制落盘 - 配置写入采用延迟落盘（见第五节）： 仅标脏， 主循环静默期 2 秒后由 统一擦写 - 复位/升级指令（Hex 0x0500 / 0x0014 / 0x0604、AT+RST、CAN 0x110）执行路径 未调用 → 静默期内（含 2 秒内）触发 复位/升级，脏数据未落盘即断电重启，配置丢失 三、修复方案 1. 参数页迁移至 Loader 擦除范围外的唯一安全区 页 地址 说明 ---------------- 参数页 A 0x08003000 活跃页 参数页 B 0x08003400 冗余备份页 旧裸迁移源 0x08004400 仅旧固件一次性迁移读取，不再写入 - 两页均位于量产 Loader ROM（0x08004800 起）之前的空闲区， 升级擦除（0x08004800 以上）永不触碰 - 硬约束：任何参数存储地址迁移，必须确保新地址不在 Loader 擦除范围内 2. A/B 双页参数保护（掉电必有一份完整数据） 写入流程（ ）： - 页头 12 字节：Magic(4B) + Sequence(4B, 单调递增) + Crc(4B) + 数据 - 读取时双页校验（Magic + CRC32），双有效取 Sequence 高者 （无符号差值 ，序号回绕安全）， 单有效取该页，双无效走出厂默认/裸迁移 - CRC 失败的场景：写入中途掉电——此时另一页必为上一版完整数据 3. 旧格式迁移体系（跨版本升级兼容） 历史参数页格式按写入时 计算 CRC，需按对应旧长度复验： 格式 版本 特征 迁移要点 ---------------------------- 当前 V3.0.0.22+ 含 Reserved99 预留区 直接使用 L3 V3.0.0.20~21 无预留区，前缀与当前一致 拷贝旧长度 104B，预留区清零 L2 V3.0.0.16~19 无 UserCanSimpDataPushCfg/0x0022 位 拷贝旧长度 + 位域重映射 + 串口0默认使能 L1 V3.0.0.14/15 另无 AccScale/GyroScale，位域前移 4B 分段搬运 + 位域重映射 + 标志单独搬 裸数据 V3.0.0.13- 无 Magic 包装直写旧地址 0x08004400 读取，必须 ConfigInitFlag==0xA5 校验才迁移（防把校准浮点当参数） - 位域重映射：旧版无 DataPacket0x0022 位，插入后 PPSStatus/PPSMode/ZeroBias 整体后移 1 位，按位重映射搬运 - 关键设计：旧长度一律由当前布局相对推导（offsetof），不使用绝对字节数—— 枚举容器 ABI 变化会使 sizeof 漂移，绝对值校验会失效 4. 配置持久化闭环（复位/升级入口 Flush 兜底） - 延迟落盘目的：连续配置指令只落盘一次，避免 UART 传输中擦写 Flash 停转 CPU 丢数据 - 5 个复位/升级入口全部补齐 Flush：Hex 0x0500（复位）、Hex 0x0014（重启）、 Hex 0x0604（进升级）、AT+RST、CAN 0x110 - Flush 内部先查脏标记，无脏直接返回——不会产生无意义的 Flash 擦写 - Flush 落盘的 Flash 写入停转 CPU 发生在应答发送之后，不影响应答送达 - 注意：配置变更后必须 在主循环被调用 才会落盘，仅标脏不调用 Process 则断电即丢 四、运维注意事项（存量设备补救） 量产设备（develop 旧固件，参数在 0x08004400）第一次升级新固件，SN 必丢 （旧地址在 Loader 擦除范围内，无解），需上位机配合补救流程： 1. 升级前查询 SN（留档） 2. 执行量产 Loader 升级 3. 用 0x0602 重写 SN 4. 之后的新固件参数已在新址，升级不再丢 五、验证清单 - x 烧新固件后重配 + 重写 SN 一次（新参数页首启） - x 配置 + SN → 0x0604 升级 → SN/配置保留（核心） - x 升级后再升级 → 保留 - x 量程四入口非法值纠正（AT / Hex 0x0022 / Hex 0x050C / CAN 0x115） - x 0x22 应答负载 10 字节 + 设置回显生效值 - x 设置后重启持久化 - x 配置后 2 秒内立即发复位/升级指令 → 配置保留（Flush 兜底验证点） 六、硬约束（后续开发红线） 1. Flash 写前必须先扇区擦除（GD32F103T8 1KB 对齐） 2. 禁止使用 0x08004400 地址（用户校准偏置数据占用） 3. 任何参数存储地址迁移必须确保不在量产 Loader 擦除范围内 （303/333 唯一安全区 0x08003000/0x08003400） 4. 所有设备复位/升级入口必须在应答后、复位前调用 5. 不得引用 的 API 6. 预留区扩展规则：新增字段只动 Reserved 区间（声明在 Reserved 之前、 Reserved 减对应字节数），禁止改动现有字段顺序/类型、禁止在预留区前插入 字段——保证 Flash 布局与 CRC 长度恒定，避免再产生旧格式迁移","content":"# 量产 Loader 升级 SN 丢失与参数页安全迁移报告（2026-10-23）\n\n## 一、测试现象\n\n- 量产设备（develop 旧固件）执行量产 Loader 升级后，**SN 序列号丢失**\n- 部分场景配置项（波特率、推送配置、量程）同样丢失，重启后回到出厂默认值\n- 后续排查发现升级链路还有第二个隐患：**配置后 2 秒内立即复位/升级，配置丢失**\n\n## 二、根因分析\n\n### 根因1：旧参数页地址落在量产 Loader 的擦除范围内\n\n```text\nGD32F103T8 Flash 布局（128KB，0x08000000~0x0801FFFF）\n0x08000000 ┌──────────────────┐\n           │ APP 前                       │\n0x08004400 │ 旧参数页（裸 ProductInfo_S）  │ ←★ 与用户校准偏置区共用，\n           │                              │   且在 Loader 擦除范围内\n0x08004800 ├──────────────────┤\n           │ 量产 Loader ROM (8.98KB)     │ ← 升级时硬编码擦除\n           │                              │   0x08004800~0x0801FFFF\n0x0801FFFF └──────────────────┘\n```\n\n- 量产 Loader 升级 APP 时**硬编码擦除到 0x0801FFFF**，旧参数页 0x08004400\n  在擦除范围内 → 升级即丢\n- 加重因素：0x08004400 与**用户校准偏置区（USER_CALIBRATION_PARAM_2）共用**，\n  页内容可能是校准浮点数据而非参数，裸读取会把垃圾数据误当配置迁移\n\n### 根因2：延迟落盘机制下，复位/升级入口未强制落盘\n\n- 配置写入采用**延迟落盘**（见第五节）：`BspProductInfoSaveToFlash()` 仅标脏，\n  主循环静默期 **2 秒**后由 `BspProductInfoSaveToFlashProcess()` 统一擦写\n- 复位/升级指令（Hex 0x0500 / 0x0014 / 0x0604、AT+RST、CAN 0x110）执行路径\n  **未调用 `BspProductInfoSaveToFlashFlush()`** → 静默期内（含 2 秒内）触发\n  复位/升级，脏数据未落盘即断电重启，配置丢失\n\n## 三、修复方案\n\n### 1. 参数页迁移至 Loader 擦除范围外的唯一安全区\n\n| 页 | 地址 | 说明 |\n|----|------|------|\n| 参数页 A | **0x08003000** | 活跃页 |\n| 参数页 B | **0x08003400** | 冗余备份页 |\n| 旧裸迁移源 | 0x08004400 | 仅旧固件一次性迁移读取，不再写入 |\n\n- 两页均位于量产 Loader ROM（0x08004800 起）**之前的空闲区**，\n  升级擦除（0x08004800 以上）**永不触碰**\n- **硬约束：任何参数存储地址迁移，必须确保新地址不在 Loader 擦除范围内**\n\n### 2. A/B 双页参数保护（掉电必有一份完整数据）\n\n写入流程（`BspProductInfoWriteToDualPage`）：\n\n```text\n构造 ProductInfoFlash_S {Magic=\"PI35\", Sequence+1, Crc32, Data}\n  → 写入非活跃页（1KB 页擦除后写入）\n  → 校验通过后切换活跃页序号\n```\n\n- 页头 12 字节：Magic(4B) + Sequence(4B, 单调递增) + Crc(4B) + 数据\n- 读取时双页校验（Magic + CRC32），**双有效取 Sequence 高者**\n  （无符号差值 `(int)(SeqA - SeqB) >= 0`，序号回绕安全），\n  单有效取该页，双无效走出厂默认/裸迁移\n- CRC 失败的场景：写入中途掉电——此时另一页必为上一版完整数据\n\n### 3. 旧格式迁移体系（跨版本升级兼容）\n\n历史参数页格式按写入时 `sizeof` 计算 CRC，需按对应旧长度复验：\n\n| 格式 | 版本 | 特征 | 迁移要点 |\n|------|------|------|----------|\n| 当前 | V3.0.0.22+ | 含 Reserved[99] 预留区 | 直接使用 |\n| L3 | V3.0.0.20~21 | 无预留区，前缀与当前一致 | 拷贝旧长度 104B，预留区清零 |\n| L2 | V3.0.0.16~19 | 无 UserCanSimpDataPushCfg/0x0022 位 | 拷贝旧长度 + 位域重映射 + 串口0默认使能 |\n| L1 | V3.0.0.14/15 | 另无 AccScale/GyroScale，位域前移 4B | 分段搬运 + 位域重映射 + 标志单独搬 |\n| 裸数据 | V3.0.0.13- | 无 Magic 包装直写旧地址 | 0x08004400 读取，**必须 ConfigInitFlag==0xA5 校验**才迁移（防把校准浮点当参数） |\n\n- 位域重映射：旧版无 DataPacket0x0022 位，插入后 PPSStatus/PPSMode/ZeroBias\n  整体后移 1 位，按位重映射搬运\n- 关键设计：**旧长度一律由当前布局相对推导（offsetof），不使用绝对字节数**——\n  枚举容器 ABI 变化会使 sizeof 漂移，绝对值校验会失效\n\n### 4. 配置持久化闭环（复位/升级入口 Flush 兜底）\n\n```text\n配置指令 → BspProductInfoSaveToFlash()  仅标脏(G_ProductInfoDirty + Tick)\n主循环   → BspProductInfoSaveToFlashProcess()  静默期2秒满且脏 → 擦写落盘\n复位/升级 → 应答发出后、复位执行前 → BspProductInfoSaveToFlashFlush() 强制立即落盘\n```\n\n- 延迟落盘目的：连续配置指令只落盘一次，避免 UART 传输中擦写 Flash 停转 CPU 丢数据\n- **5 个复位/升级入口全部补齐 Flush**：Hex 0x0500（复位）、Hex 0x0014（重启）、\n  Hex 0x0604（进升级）、AT+RST、CAN 0x110\n- Flush 内部先查脏标记，无脏直接返回——**不会产生无意义的 Flash 擦写**\n- Flush 落盘的 Flash 写入停转 CPU 发生在应答发送之后，不影响应答送达\n- 注意：配置变更后必须 `BspProductInfoSaveToFlashProcess()` 在主循环被调用\n  才会落盘，仅标脏不调用 Process 则断电即丢\n\n## 四、运维注意事项（存量设备补救）\n\n**量产设备（develop 旧固件，参数在 0x08004400）第一次升级新固件，SN 必丢**\n（旧地址在 Loader 擦除范围内，无解），需上位机配合补救流程：\n\n1. 升级前查询 SN（留档）\n2. 执行量产 Loader 升级\n3. 用 0x0602 重写 SN\n4. 之后的新固件参数已在新址，升级不再丢\n\n## 五、验证清单\n\n- [x] 烧新固件后重配 + 重写 SN 一次（新参数页首启）\n- [x] 配置 + SN → 0x0604 升级 → SN/配置保留（核心）\n- [x] 升级后再升级 → 保留\n- [x] 量程四入口非法值纠正（AT / Hex 0x0022 / Hex 0x050C / CAN 0x115）\n- [x] 0x22 应答负载 10 字节 + 设置回显生效值\n- [x] 设置后重启持久化\n- [x] 配置后 2 秒内立即发复位/升级指令 → 配置保留（Flush 兜底验证点）\n\n## 六、硬约束（后续开发红线）\n\n1. **Flash 写前必须先扇区擦除**（GD32F103T8 1KB 对齐）\n2. **禁止使用 0x08004400 地址**（用户校准偏置数据占用）\n3. **任何参数存储地址迁移必须确保不在量产 Loader 擦除范围内**\n   （303/333 唯一安全区 0x08003000/0x08003400）\n4. 所有设备复位/升级入口必须在**应答后、复位前**调用\n   `BspProductInfoSaveToFlashFlush()`\n5. `DrvFlashWrite32BitData` 不得引用 `flash.c` 的 API\n6. 预留区扩展规则：新增字段只动 Reserved 区间（声明在 Reserved 之前、\n   Reserved 减对应字节数），**禁止改动现有字段顺序/类型、禁止在预留区前插入\n   字段**——保证 Flash 布局与 CRC 长度恒定，避免再产生旧格式迁移\n"},{"hash":"IMU/GD32F303/0x091时间戳抖动修复报告.md","title":"0x091时间戳抖动修复报告","relPath":"IMU/GD32F303/0x091时间戳抖动修复报告.md","desc":"0x091 时间戳抖动修复报告（2026-10-15） 一、测试现象 1000Hz CAN 推送时，0x091（时间戳报文，小端 uint64，单位 us）相邻包时间戳差值 （包2-包1）在 0.8~1.2ms 之间波动（步进 0.1ms），长期均值恰为 1ms。","created":"","updated":"","tags":[],"sizeKB":8.2,"_text":"0x091 时间戳抖动修复报告（2026-10-15） 一、测试现象 1000Hz CAN 推送时，0x091（时间戳报文，小端 uint64，单位 us）相邻包时间戳差值 （包2-包1）在 0.8~1.2ms 之间波动（步进 0.1ms），长期均值恰为 1ms。理论上应为 1ms。 二、根因分析 时间戳产生链路（修复前）： 根因： 的递增时刻 = 主循环执行到 1kHz 分支的时刻，而非硬件节拍时刻。 主循环执行相位受单圈耗时波动（指令解析、推送、CAN 入队、Flash 处理）影响， 绕 SysTick 边界漂移达 ±200us。DWT 差值累加如实记录了\"相邻两圈的真实执行间隔\"： 某圈巡回晚 → 差值 1ms，下一圈补偿 → <1ms（0.8+1.2=2.0ms 的配对特征）。 DWT 方案无累积误差，故均值精确 1ms——与测试现象完全吻合。 不是 CAN 发送问题，是时间戳源的锁存位置问题。 三、方案对比与选型 方案 分辨率 相邻差值 结论 ------------------------------ 原实现：主循环 DWT 累加 1us 0.8~1.2ms 波动 抖动源为主循环巡回延迟 ±200us SysTick ISR 内 1ms 严格 1000us 分辨率退化，无法满足 us 级对齐需求 选定：SysTick ISR 内时基差值累加（时基源由主工程注入） 1us ≈1ms ± 中断响应延迟（通常 <±50us） 抖动缩小一个数量级，分辨率保留 选型依据：读数点移入 SysTick 中断后，抖动源从\"主循环巡回延迟（几百 us）\" 收敛为\"中断响应延迟（几 us～几十 us，仅被 CAN TX 等高优先级中断抢占时出现）\"； DWT 换算同源（核心时钟），PPS 频偏校准（GSlopeA/GSkewingB）语义不变。 四、修改清单 文件 修改 ------------ 新增 时基源函数指针类型（返回距上次调用的微秒增量）与注册接口 移除 （bsp 子仓库为共用代码，不得直接依赖 MCU 底层接口）； 内直接 （增量累加，无差值基准变量，彻底平台无关）；未注册时不累加 新增 351 平台段： （static，DWT 32 位差分 + 回绕 + 换算的增量契约时基源）与 （固化\"时基初始化→增量基准预热→注册\"顺序，消除 dwttimerinit 重复调用清零 CYCCNT 的风险），并附面向其它工程的移植说明 351 兼容层声明 （平台相关实现收敛于平台兼容层，bspdrv 351 层本已包含 dwt.h） （主工程） 删除 与 （类型由 baseincludes.h 传递，无其它使用）；原三行（dwttimerinit→预热→注册）替换为一次 调用 删除 1kHz 分支 DWT 累加（ / / 共 7 行）及已无用的静态变量 ；200Hz/100Hz 分支的 （算法 dt 测量）不受影响 依赖注入架构（bsp 共用代码与 MCU 底层解耦，增量契约，平台实现收敛于 bspdrv）： 自愈设计：时基源注册晚于 SysTick 使能时，未注册期间不累加； 在注册前预热一次基准，注册后首拍增量即为正常 1ms 量级。 五、验证状态 - 静态诊断：两文件均为空 - 待办：Keil 编译 → 上板 1000Hz 推送复测 - 预期：0x091 相邻时间戳差值收敛到 1.00±0.05ms 六、时间戳修改规范（后续约束） 1. 的累加只允许发生在 （SysTick 1ms 中断）内 2. 禁止在主循环任何位置调用 累加时间（该 API 保留但不应使用） 3. 0x091 等时间戳消费方只读 ，不做二次补偿 4. 复位时间必须走 （已封装基准清理），不得直接写 5. bsp 子仓库共用文件禁止直接包含 等 MCU 底层头文件或调用底层接口； 底层能力一律由主工程经函数 API 注入（如 注册时基源） 6. 平台相关实现统一收敛到 bspdrv 各项目兼容层（如 351 平台段的 / ），主工程只调用平台 初始化入口，不直接接触底层细节；其它工程移植时在各自平台段按增量契约实现即可 七、二次问题：注入源回绕周期不匹配（补充，修复待上板复测） 现象：上板偶发 0x091 时间戳跳变到 4259176.902 ms（约 71 分钟的虚假运行时间）。 根因：第一版注入契约让主工程返回 （把绝对 CYCCNT 换算成\"绝对微秒\"），但该换算把 2³² 周期映射成 0~35791393 us， 源的回绕周期变成 35.79s（2³²/120MHz）而非 2³² us（71.6min）；bsp 侧却按 模 2³² 做差值累加。每当 SysTick 读数跨越 35.79s 回绕点，该次差值被算成： 即每次回绕点跨越向 GSysRunTime 猛加约 71 分钟。\"偶尔出现\"= 每 35.79s 的 回绕点跨越一次才触发一次。 教训： 的设计语义是\"差分周期数→微秒\"（输入小值）， 不能把它的输出当\"模 2³² 的绝对微秒\"用——换算破坏了回绕周期的一致性 （周期数模 2³² ≠ 微秒数模 2³²）。 修复：注入契约改为增量语义——时基源实现收敛至 bspdrv.c 平台段 （static）内部持有 周期基准，返回 （32 位无符号差分天然处理 CYCCNT 回绕，仅 SysTick 1ms 调用一次、永不漏圈）；bsp 侧退化为纯累加 ，差值/回绕逻辑全部封死在平台实现内，彻底平台无关。 初始化/预热/注册顺序由 一并封装固化（dwttimerinit 清零 CYCCNT 的重复调用风险随之消除），主工程仅调用这一个入口。 约束补充： - 注入源若为增量契约，只允许注入方（SysTick ISR）调用，禁止其它位置调用（会偷走增量） - 注入源若为绝对值契约，必须保证其回绕周期恰为 2³² us，否则差值方不能用模 2³² 处理回绕； 优先选用增量契约，把平台回绕细节封死在主工程实现内","content":"# 0x091 时间戳抖动修复报告（2026-10-15）\n\n## 一、测试现象\n\n1000Hz CAN 推送时，0x091（时间戳报文，小端 uint64，单位 us）相邻包时间戳差值\n（包2-包1）在 **0.8~1.2ms** 之间波动（步进 0.1ms），长期均值恰为 1ms。理论上应为 1ms。\n\n## 二、根因分析\n\n时间戳产生链路（修复前）：\n\n```text\nSysTick_Handler (1ms硬件节拍, gd32f30x_it.c)\n  └─ BspSysTickMs()                 ← 仅 RunFlag=1、RunSysTicks++\n主循环 1kHz 分支 (bsp_function.c, RunSysTicks % RUN_1000Hz == 0)\n  ├─ SensorSystem_ReadData() / BspSensorDataProcess()\n  ├─ BspSysRunTimeSet(DWT差值)      ← ★ G_SysRunTime 在此累加\n  └─ check_and_send_message() / BspUserDataPushControlCenter()\n       └─ 0x091 打包读取 BspSysRunTimeGet()   (bsp_data_interaction.c)\n```\n\n**根因**：`G_SysRunTime` 的递增时刻 = 主循环执行到 1kHz 分支的时刻，而非硬件节拍时刻。\n主循环执行相位受单圈耗时波动（指令解析、推送、CAN 入队、Flash 处理）影响，\n绕 SysTick 边界漂移达 ±200us。DWT 差值累加如实记录了\"相邻两圈的真实执行间隔\"：\n某圈巡回晚 → 差值 >1ms，下一圈补偿 → <1ms（0.8+1.2=2.0ms 的配对特征）。\nDWT 方案无累积误差，故均值精确 1ms——与测试现象完全吻合。\n**不是 CAN 发送问题，是时间戳源的锁存位置问题。**\n\n## 三、方案对比与选型\n\n| 方案 | 分辨率 | 相邻差值 | 结论 |\n|------|--------|----------|------|\n| 原实现：主循环 DWT 累加 | 1us | 0.8~1.2ms 波动 | 抖动源为主循环巡回延迟 ±200us |\n| SysTick ISR 内 `+= 1000` | 1ms | 严格 1000us | 分辨率退化，无法满足 us 级对齐需求 |\n| **选定：SysTick ISR 内时基差值累加（时基源由主工程注入）** | **1us** | **≈1ms ± 中断响应延迟（通常 <±50us）** | 抖动缩小一个数量级，分辨率保留 |\n\n选型依据：读数点移入 SysTick 中断后，抖动源从\"主循环巡回延迟（几百 us）\"\n收敛为\"中断响应延迟（几 us～几十 us，仅被 CAN TX 等高优先级中断抢占时出现）\"；\nDWT 换算同源（核心时钟），PPS 频偏校准（G_SlopeA/G_SkewingB）语义不变。\n\n## 四、修改清单\n\n| 文件 | 修改 |\n|------|------|\n| `bsp/00.Code/inc/bsp_run_ctrl.h` | 新增 `BspUsTimeSource_F` 时基源函数指针类型（**返回距上次调用的微秒增量**）与注册接口 `BspSysUsTimeSourceRegister()` |\n| `bsp/00.Code/src/bsp_run_ctrl.c` | **移除 `#include \"dwt.h\"`**（bsp 子仓库为共用代码，不得直接依赖 MCU 底层接口）；`BspSysTickMs()` 内直接 `G_SysRunTime += G_UsTimeSource()`（增量累加，无差值基准变量，彻底平台无关）；未注册时不累加 |\n| `bsp/00.Code/src/bsp_drv.c` | 新增 351 平台段：`BspDrvUsTimeSourceGet()`（static，DWT 32 位差分 + 回绕 + 换算的增量契约时基源）与 `BspDrvUsTimeSourceInit()`（固化\"时基初始化→增量基准预热→注册\"顺序，消除 dwt_timer_init 重复调用清零 CYCCNT 的风险），并附面向其它工程的移植说明 |\n| `bsp/00.Code/inc/bsp_drv.h` | 351 兼容层声明 `BspDrvUsTimeSourceInit()`（平台相关实现收敛于平台兼容层，bsp_drv 351 层本已包含 dwt.h） |\n| `system/main/main.c`（主工程） | 删除 `SysUsTimeSourceGet()` 与 `#include \"dwt.h\"`（类型由 base_includes.h 传递，无其它使用）；原三行（dwt_timer_init→预热→注册）替换为一次 `BspDrvUsTimeSourceInit()` 调用 |\n| `bsp/00.Code/src/bsp_function.c` | 删除 1kHz 分支 DWT 累加（`CycleNow`/`LastCycle1ms`/`BspSysRunTimeSet` 共 7 行）及已无用的静态变量 `LastCycle1ms`；200Hz/100Hz 分支的 `last_clock_us`（算法 dt 测量）不受影响 |\n\n依赖注入架构（bsp 共用代码与 MCU 底层解耦，增量契约，平台实现收敛于 bsp_drv）：\n\n```text\nbsp_drv.c 351平台段（平台兼容层,已含dwt.h）   bsp 子仓库（共用,平台无关）\n┌─────────────────────────────────┐         ┌──────────────────────────────┐\n│ BspDrvUsTimeSourceInit():        │         │ BspSysTickMs() (SysTick 1ms) │\n│  dwt_timer_init→预热→注册(一次)  │─注册注入─▶│  G_SysRunTime += G_UsTimeSource();│\n│ BspDrvUsTimeSourceGet():         │         │  (纯累加,增量契约)            │\n│  差分=dwt_cycles32()-LastCycles  │        └──────────────────────────────┘\n│  return dwt_us_from_cycles32(    │\n│    差分)  ←回绕/换算都在此        │\n└─────────────────────────────────┘\n主工程 main.c 只调用 BspDrvUsTimeSourceInit() 一次,不接触任何 DWT 细节\n```\n\n自愈设计：时基源注册晚于 SysTick 使能时，未注册期间不累加；`BspDrvUsTimeSourceInit()`\n在注册前预热一次基准，注册后首拍增量即为正常 1ms 量级。\n\n## 五、验证状态\n\n- 静态诊断：两文件均为空\n- 待办：Keil 编译 → 上板 1000Hz 推送复测\n- 预期：0x091 相邻时间戳差值收敛到 **1.00±0.05ms**\n\n## 六、时间戳修改规范（后续约束）\n\n1. `G_SysRunTime` 的累加**只允许**发生在 `BspSysTickMs()`（SysTick 1ms 中断）内\n2. 禁止在主循环任何位置调用 `BspSysRunTimeSet()` 累加时间（该 API 保留但不应使用）\n3. 0x091 等时间戳消费方只读 `BspSysRunTimeGet()`，不做二次补偿\n4. 复位时间必须走 `BspSysRunTimeReset()`（已封装基准清理），不得直接写 `G_SysRunTime = 0`\n5. bsp 子仓库共用文件**禁止**直接包含 `dwt.h` 等 MCU 底层头文件或调用底层接口；\n   底层能力一律由主工程经函数 API 注入（如 `BspSysUsTimeSourceRegister()` 注册时基源）\n6. 平台相关实现统一收敛到 bsp_drv 各项目兼容层（如 351 平台段的\n   `BspDrvUsTimeSourceGet()`/`BspDrvUsTimeSourceInit()`），主工程只调用平台\n   初始化入口，不直接接触底层细节；其它工程移植时在各自平台段按增量契约实现即可\n\n## 七、二次问题：注入源回绕周期不匹配（补充，修复待上板复测）\n\n**现象**：上板偶发 0x091 时间戳跳变到 **4259176.902 ms**（约 71 分钟的虚假运行时间）。\n\n**根因**：第一版注入契约让主工程返回 `dwt_us_from_cycles32(dwt_cycles32())`\n（把绝对 CYCCNT 换算成\"绝对微秒\"），但该换算把 2³² 周期映射成 0~35791393 us，\n**源的回绕周期变成 35.79s（2³²/120MHz）而非 2³² us（71.6min）**；bsp 侧却按\n模 2³² 做差值累加。每当 SysTick 读数跨越 35.79s 回绕点，该次差值被算成：\n\n```text\n2³² − 35791394 + 1000 = 4259176902 us = 4259176.902 ms  ← 与实测分毫不差\n```\n\n即每次回绕点跨越向 G_SysRunTime 猛加约 71 分钟。\"偶尔出现\"= 每 35.79s 的\n回绕点跨越一次才触发一次。\n\n**教训**：`dwt_us_from_cycles32()` 的设计语义是\"差分周期数→微秒\"（输入小值），\n不能把它的输出当\"模 2³² 的绝对微秒\"用——换算破坏了回绕周期的一致性\n（周期数模 2³² ≠ 微秒数模 2³²）。\n\n**修复**：注入契约改为**增量语义**——时基源实现收敛至 bsp_drv.c 平台段\n`BspDrvUsTimeSourceGet()`（static）内部持有 `static LastCycles` 周期基准，返回\n`dwt_us_from_cycles32(NowCycles - LastCycles)`（32 位无符号差分天然处理 CYCCNT\n回绕，仅 SysTick 1ms 调用一次、永不漏圈）；bsp 侧退化为纯累加\n`G_SysRunTime += G_UsTimeSource()`，差值/回绕逻辑全部封死在平台实现内，彻底平台无关。\n初始化/预热/注册顺序由 `BspDrvUsTimeSourceInit()` 一并封装固化（dwt_timer_init\n清零 CYCCNT 的重复调用风险随之消除），主工程仅调用这一个入口。\n\n**约束补充**：\n- 注入源若为增量契约，**只允许**注入方（SysTick ISR）调用，禁止其它位置调用（会偷走增量）\n- 注入源若为绝对值契约，必须保证其回绕周期恰为 2³² us，否则差值方不能用模 2³² 处理回绕；\n  优先选用增量契约，把平台回绕细节封死在主工程实现内\n"},{"hash":"IMU/GD32F303/AT与HEX及CAN指令集说明.md","title":"AT与HEX及CAN指令集说明","relPath":"IMU/GD32F303/AT与HEX及CAN指令集说明.md","desc":"订阅位受 0x0011（HEX）、CAN 0x104、AT+MSGID 三处控制，推送判定读 shadow 运行态镜像（Op=0x01 即时生效）。","created":"","updated":"","tags":[],"sizeKB":8.2,"_text":"AT / HEX / CAN 指令集说明（2026-10-23） 工程：IMU303351（GD32F303，共用 BSPIMU.git 子仓库） 源码：bspparse.c 三张指令表 / （含 生产标定区）/ 关联文档：《PPS功能实现说明.md》《参数页升级SN乱码与预留区扩展机制报告.md》 一、AT 指令（串口文本，\\r\\n 结尾，回显式应答） 指令 功能 备注 ------------------ 查询固件版本 应答使用 等发送缓冲空闲，防数据交织 / 设置/查询串口波特率 保存后重启生效 / AT 数据推送开关设置/查询 控制 AT 数据推送频率 控制 HEX 数据包订阅控制 n=1/2/10/13/22 对应 0x0001/0002/0010/0013/0022 包；写 shadow+工作副本并落盘 / 查询/设置坐标系统 / PPS 开关设置/查询 开启置 （AT 来源），关闭归 0；落盘 / PPS 模式设置/查询 0:空 1:校准内部时间戳 2:PPS脉冲触发推送 CAN 波特率设置 查询 SN 号 零偏校准 置 标志并落盘 查询数据时间 数据链路与开关状态配置 Buf7=0x00 一键关闭四路推送（AT/HEX/CAN 完整流/CAN 精简流）；=0x03 时精简流频率同步完整流频率 主图 3D 数据推送频率 与 同处理器分发 原始数据推送频率 加速度量程配置/查询 白名单校验 角速度量程配置/查询 查询 Flash 存储的全部配置 A/B 双页 dump：序号、CRC、SN、各配置项、PPS switchType；区分 OK/OK(legacy)/BAD Flash 写保护开关 YAW 角归零重置 设备重启 查询全部 AT 指令列表 自描述 查询配置参数汇总 二、HEX 指令（串口二进制帧） 2.1 帧格式 - CRC16 校验，小端； 不含 CRC，上限 255 - ：0x00=查询 0x01=设置（仅 RAM，掉电不保存，运行态即时生效）0x02=设置并保存（Flash） - 应答帧使用 回包 2.2 用户配置指令（CMD=0x00） ID 处理器 功能 ------------------ 0x03 版本查询（应答 8B） 0x04 HEX 推送频率设置（PushStatus + DataPushFre，Op=0x01 仅写 shadow） 0x05 修改蓝牙名称（Data 16B） 0x06 算法模式设置/查询 0x07 HEX 推送总开关（ ） 0x11 数据包订阅控制（包 ID 0x0001/0002/0010/0013/0022 逐包开关，即 HEX 侧 MSGID 控制） 0x12 PPS 控制（查询/开关/模式；开启置 ） 0x14 设备重启 0x15 坐标系统设置（应答 10B） 0x16 串口波特率设置/查询 0x17 CAN 波特率设置/查询 0x18 查询 SN 号（应答 24B） 0x19 修改数据时间（应答 8B） 0x20 零偏校准 0x21 YAW 角归零重置（应答 9B） 0x22 加速度/角速度量程配置（应答 10B） 2.3 其它 HEX 指令 CMD ID 功能 ---------------- 0x01 0x01 A 值查询 0x01 0x03 电池状态查询 2.4 生产/标定指令（ ，产测工装/上位机使用） CMD ID 功能 ---------------- 0x01 0x10 / 0x12 / 0x15 / 0x21 单板测试广播 / 温标测试 / 数据采集 / 单板测试写入 SN 0x04 0x17 / 0x18 / 0x19 转台标定 / 下载转台参数 / 下载温漂参数 0x05 0x00 / 0x01 / 0x02 / 0x06 / 0x0B / 0x0C 设备复位 / 主图数据推送控制 / 原始数据刷新控制 / 加速度校准 / 获取参数 / 设置参数 0x06 0x01~0x09 设置硬件号 / 设置 SN / 打开串口 / 进入升级模式 / 查询电池电量 / 修改蓝牙名称 / 磁力计校准 / 硬件号查询 / YAW 归零 0x07 0x01 设置 A 值 0x08 0x01 / 0x02 标定台控制 / 标定台温控 三、HEX 数据推送包（设备 → 上位机，SendCmd=0x00 + SendID） SendID 包结构 内容 ---------------------- 0x0001 传感器数据包（姿态等） 0x0002 2B 状态包 0x0010 扩展数据包 0x0013 PPS 状态包：锁定状态 + PPSMode + 校准时间戳（时间恒用 ） 0x0022 量程数据包 推送行为：各包按订阅位（ ）与 HEX 通道总开关（0x0004 PushStatus + DataPushFre）周期推送；PPS 模式 2 且 时改由脉冲触发（详见《PPS功能实现说明.md》）。订阅位受 0x0011（HEX）、CAN 0x104、AT+MSGID 三处控制，推送判定读 shadow 运行态镜像（Op=0x01 即时生效）。 另有主图 3D / 原始数据独立推送帧（SendCmd 0x04~0x07 系， 组包），不受 HEX 包订阅控制，仅受各自 PushStatus/频率与 PPS 模式 1 时间戳校准影响。 四、CAN 指令（CAN ID 0x100~0x115，8 字节数据） CAN ID 处理器 功能 ---------------------- 0x100 版本查询 0x101 推送频率配置（同时作用于完整流与精简流，二者保持同频） 0x102 IMU 坐标系设置/查询 0x103 数据流（完整流）推送开关；Op=0x01 仅写 shadow 0x104 MSGID 控制：子 ID 0x01/02/10/13/22 逐包订阅 HEX 数据包 0x105 / 0x106 / SN 低 8 字节 / 高 8 字节查询 0x107 CAN 波特率设置/查询 0x108 串口波特率设置/查询 0x109 PPS 控制（Playload0=模式 1=锁定 2=开关；开启置 ） 0x110 设备重启 0x111 零偏校准 0x112 YAW 角归零重置 0x113 UART 串口开关控制 0x114 精简数据流（原始数据）推送开关（仅开关；频率统一由 0x101 管理） 0x115 加速度/角速度量程配置 五、三接口配置语义对照（PPS 与推送开关） 配置项 AT HEX CAN 存储字段 ----------------------------------- PPS 开关 AT+PPS=ON/OFF 0x0012 0x109 PPSStatus（PPSSwitchType=1/2/3 记录来源） PPS 模式 AT+PPSMODE 0x0012 0x109 PPSMode（0/1/2） 推送总开关 AT+SET（AT 路）/ AT+DATALINK（四路） 0x0004 / 0x0007 0x103 / 0x114 UserATDataPushCfg / UserHexDataPushCfg / UserCanDataPushCfg / UserCanSimpDataPushCfg 的 PushStatus 推送频率 AT+PUSHFRQ / AT+GRAPHRQ / AT+ORIGRQ 0x0004 0x101（完整+精简同频） 对应 DataPushFre 包订阅 AT+MSGID 0x0011 0x104 DataPacket0x0001/0002/0010/0013/0022 通用规则：设置类 Op=0x01（HEX）/未带保存标志（CAN）只写 shadow（运行态即时生效，掉电不保存）；Op=0x02 写 shadow+工作副本并 （延迟落盘）；查询类 Op=0x00 回显 shadow 当前值。","content":"# AT / HEX / CAN 指令集说明（2026-10-23）\n\n> 工程：IMU_303_351（GD32F303，共用 BSP_IMU.git 子仓库）\n> 源码：bsp_parse.c 三张指令表 `G_BSPATParseCMD` / `G_BSPHexParseCMD`（含 `G_BSPParseCMD` 生产标定区）/ `G_BSPCANParse`\n> 关联文档：《PPS功能实现说明.md》《参数页升级SN乱码与预留区扩展机制报告.md》\n\n## 一、AT 指令（串口文本，\\r\\n 结尾，回显式应答）\n\n| 指令 | 功能 | 备注 |\n|------|------|------|\n| `AT+VERSION?` | 查询固件版本 | 应答使用 `BspParseSendDataWait` 等发送缓冲空闲，防数据交织 |\n| `AT+BAUD=<n>` / `AT+BAUD?` | 设置/查询串口波特率 | 保存后重启生效 |\n| `AT+SET=ON/OFF` / `AT+SET?` | AT 数据推送开关设置/查询 | 控制 `UserATDataPushCfg.PushStatus` |\n| `AT+PUSHFRQ=<ms>` | AT 数据推送频率 | 控制 `UserATDataPushCfg.DataPushFre` |\n| `AT+MSGID=<n>,<0/1>` | HEX 数据包订阅控制 | n=1/2/10/13/22 对应 0x0001/0002/0010/0013/0022 包；写 shadow+工作副本并落盘 |\n| `AT+COORDINATE?` / `AT+COORDINATE=<n>` | 查询/设置坐标系统 | |\n| `AT+PPS=ON/OFF` / `AT+PPS?` | PPS 开关设置/查询 | 开启置 `PPSSwitchType=1`（AT 来源），关闭归 0；落盘 |\n| `AT+PPSMODE=<0/1/2>` / `AT+PPSMODE?` | PPS 模式设置/查询 | 0:空 1:校准内部时间戳 2:PPS脉冲触发推送 |\n| `AT+CANBAUD=<n>` | CAN 波特率设置 | |\n| `AT+SN?` | 查询 SN 号 | |\n| `AT+ZEROBIASCAL` | 零偏校准 | 置 `ZeroBiasCalibration` 标志并落盘 |\n| `AT+DATATIME?` | 查询数据时间 | |\n| `AT+DATALINK=<n>` | 数据链路与开关状态配置 | **Buf[7]=0x00 一键关闭四路推送**（AT/HEX/CAN 完整流/CAN 精简流）；=0x03 时精简流频率同步完整流频率 |\n| `AT+GRAPHRQ=<ms>` | 主图 3D 数据推送频率 | 与 `AT+ORIGRQ` 同处理器分发 |\n| `AT+ORIGRQ=<ms>` | 原始数据推送频率 | |\n| `AT+ACCSCALECFG=<n>` | 加速度量程配置/查询 | 白名单校验 |\n| `AT+GYROSCALECFG=<n>` | 角速度量程配置/查询 | |\n| `AT+FLASHCFG` | 查询 Flash 存储的全部配置 | A/B 双页 dump：序号、CRC、SN、各配置项、PPS switchType；区分 OK/OK(legacy)/BAD |\n| `AT+FLASHPROTECT=<0/1>` | Flash 写保护开关 | |\n| `AT+YAWRESET` | YAW 角归零重置 | |\n| `AT+RST` | 设备重启 | |\n| `AT+CMD` | 查询全部 AT 指令列表 | 自描述 |\n| `AT+CONFIG` | 查询配置参数汇总 | |\n\n## 二、HEX 指令（串口二进制帧）\n\n### 2.1 帧格式\n\n```text\nAA 55 | CMD | ID | Op | LenL LenH | Data... | CRC16L CRC16H\n```\n\n- CRC16 校验，小端；`Len` 不含 CRC，上限 255\n- `Op`：0x00=查询 0x01=设置（仅 RAM，掉电不保存，运行态即时生效）0x02=设置并保存（Flash）\n- 应答帧使用 `BspBuildUserReplyDataPackaging(SEND_CMD_0X00_E, 同ID, ...)` 回包\n\n### 2.2 用户配置指令（CMD=0x00）\n\n| ID | 处理器 | 功能 |\n|----|--------|------|\n| 0x03 | `BspVersionGet_0003` | 版本查询（应答 8B） |\n| 0x04 | `BspPushFreSet_0004` | HEX 推送频率设置（PushStatus + DataPushFre，Op=0x01 仅写 shadow） |\n| 0x05 | `BspReviseBleName_0005` | 修改蓝牙名称（Data 16B） |\n| 0x06 | `BspAlgorithmMode_0006` | 算法模式设置/查询 |\n| 0x07 | `BspUserDataSwitch_0007` | HEX 推送总开关（`UserHexDataPushCfg.PushStatus`） |\n| 0x11 | `BspUserPushDataPackCtrl_0011` | 数据包订阅控制（包 ID 0x0001/0002/0010/0013/0022 逐包开关，即 HEX 侧 MSGID 控制） |\n| 0x12 | `BspPPSSwitchCtrl_0012` | PPS 控制（查询/开关/模式；开启置 `PPSSwitchType=2`） |\n| 0x14 | `BspDevRst_0014` | 设备重启 |\n| 0x15 | `BspSetCoordinateSystem_0015` | 坐标系统设置（应答 10B） |\n| 0x16 | `BspUartRate_0016` | 串口波特率设置/查询 |\n| 0x17 | `BspCanRate_0017` | CAN 波特率设置/查询 |\n| 0x18 | `BspQuerySN_0018` | 查询 SN 号（应答 24B） |\n| 0x19 | `BspModificationDataTime_0019` | 修改数据时间（应答 8B） |\n| 0x20 | `BspZeroCalibration_0020` | 零偏校准 |\n| 0x21 | `BspYawReset_0021` | YAW 角归零重置（应答 9B） |\n| 0x22 | `BspHexScaleCfg_0022` | 加速度/角速度量程配置（应答 10B） |\n\n### 2.3 其它 HEX 指令\n\n| CMD | ID | 功能 |\n|-----|-----|------|\n| 0x01 | 0x01 | A 值查询 |\n| 0x01 | 0x03 | 电池状态查询 |\n\n### 2.4 生产/标定指令（`G_BSPParseCMD`，产测工装/上位机使用）\n\n| CMD | ID | 功能 |\n|-----|-----|------|\n| 0x01 | 0x10 / 0x12 / 0x15 / 0x21 | 单板测试广播 / 温标测试 / 数据采集 / 单板测试写入 SN |\n| 0x04 | 0x17 / 0x18 / 0x19 | 转台标定 / 下载转台参数 / 下载温漂参数 |\n| 0x05 | 0x00 / 0x01 / 0x02 / 0x06 / 0x0B / 0x0C | 设备复位 / 主图数据推送控制 / 原始数据刷新控制 / 加速度校准 / 获取参数 / 设置参数 |\n| 0x06 | 0x01~0x09 | 设置硬件号 / 设置 SN / 打开串口 / 进入升级模式 / 查询电池电量 / 修改蓝牙名称 / 磁力计校准 / 硬件号查询 / YAW 归零 |\n| 0x07 | 0x01 | 设置 A 值 |\n| 0x08 | 0x01 / 0x02 | 标定台控制 / 标定台温控 |\n\n## 三、HEX 数据推送包（设备 → 上位机，SendCmd=0x00 + SendID）\n\n| SendID | 包结构 | 内容 |\n|--------|--------|------|\n| 0x0001 | `PushUserData0x0001_S` | 传感器数据包（姿态等） |\n| 0x0002 | 2B | 状态包 |\n| 0x0010 | `PushUserData0x0010_S` | 扩展数据包 |\n| 0x0013 | `PushUserData0x0013_S` | PPS 状态包：锁定状态 + PPSMode + 校准时间戳（时间恒用 `BspPPSCalibratedUsGet()`） |\n| 0x0022 | `PushUserData0x0022_S` | 量程数据包 |\n\n推送行为：各包按订阅位（`DataPacket0x00XX`）与 HEX 通道总开关（0x0004 PushStatus + DataPushFre）周期推送；PPS 模式 2 且 `PPSSwitchType=2` 时改由脉冲触发（详见《PPS功能实现说明.md》）。订阅位受 0x0011（HEX）、CAN 0x104、AT+MSGID 三处控制，推送判定读 shadow 运行态镜像（Op=0x01 即时生效）。\n\n另有主图 3D / 原始数据独立推送帧（SendCmd 0x04~0x07 系，`BspBuildRadioResponse` 组包），不受 HEX 包订阅控制，仅受各自 PushStatus/频率与 PPS 模式 1 时间戳校准影响。\n\n## 四、CAN 指令（CAN ID 0x100~0x115，8 字节数据）\n\n| CAN ID | 处理器 | 功能 |\n|--------|--------|------|\n| 0x100 | `BspCanVersion_100` | 版本查询 |\n| 0x101 | `BspCanPushFreq_101` | 推送频率配置（同时作用于完整流与精简流，二者保持同频） |\n| 0x102 | `BspCanIMUCoordinate_102` | IMU 坐标系设置/查询 |\n| 0x103 | `BspCanDataStreamStatus_103` | 数据流（完整流）推送开关；Op=0x01 仅写 shadow |\n| 0x104 | `BspCanMsgIDCtrl_104` | MSGID 控制：子 ID 0x01/02/10/13/22 逐包订阅 HEX 数据包 |\n| 0x105 / 0x106 | `BspCanSNLow8_105` / `BspCanSNHeigh8_106` | SN 低 8 字节 / 高 8 字节查询 |\n| 0x107 | `BspCanRate_107` | CAN 波特率设置/查询 |\n| 0x108 | `BspUARTBaudRate_108` | 串口波特率设置/查询 |\n| 0x109 | `BspPPSCtrl_109` | PPS 控制（Playload[0]=模式 [1]=锁定 [2]=开关；开启置 `PPSSwitchType=3`） |\n| 0x110 | `BspDevRst_110` | 设备重启 |\n| 0x111 | `BspZeroBiasCalibration_111` | 零偏校准 |\n| 0x112 | `BspYawReset_112` | YAW 角归零重置 |\n| 0x113 | `BspUARTCtrl_113` | UART 串口开关控制 |\n| 0x114 | `BspUserCanSimpDataPushCfg_114` | 精简数据流（原始数据）推送开关（仅开关；频率统一由 0x101 管理） |\n| 0x115 | `BspCanScaleCfg_115` | 加速度/角速度量程配置 |\n\n## 五、三接口配置语义对照（PPS 与推送开关）\n\n| 配置项 | AT | HEX | CAN | 存储字段 |\n|--------|-----|------|------|----------|\n| PPS 开关 | AT+PPS=ON/OFF | 0x0012 | 0x109 | PPSStatus（PPSSwitchType=1/2/3 记录来源） |\n| PPS 模式 | AT+PPSMODE | 0x0012 | 0x109 | PPSMode（0/1/2） |\n| 推送总开关 | AT+SET（AT 路）/ AT+DATALINK（四路） | 0x0004 / 0x0007 | 0x103 / 0x114 | UserATDataPushCfg / UserHexDataPushCfg / UserCanDataPushCfg / UserCanSimpDataPushCfg 的 PushStatus |\n| 推送频率 | AT+PUSHFRQ / AT+GRAPHRQ / AT+ORIGRQ | 0x0004 | 0x101（完整+精简同频） | 对应 DataPushFre |\n| 包订阅 | AT+MSGID | 0x0011 | 0x104 | DataPacket0x0001/0002/0010/0013/0022 |\n\n**通用规则**：设置类 Op=0x01（HEX）/未带保存标志（CAN）只写 shadow（运行态即时生效，掉电不保存）；Op=0x02 写 shadow+工作副本并 `BspProductInfoSaveToFlash()`（延迟落盘）；查询类 Op=0x00 回显 shadow 当前值。\n"},{"hash":"IMU/GD32F303/PPS功能实现说明.md","title":"PPS功能实现说明","relPath":"IMU/GD32F303/PPS功能实现说明.md","desc":"关键实现： 的订阅判定读 shadow（运行态镜像） 而非 工作副本： 原因：0x104/0x0011 的 Op=0x01（写 RAM，掉电不保存）路径只更新 shadow， 读 shadow 才能即时生效；Op=0x02（写 Flash）两者同步写，行为一致。","created":"","updated":"","tags":[],"sizeKB":8.7,"_text":"PPS 功能实现说明（2026-10-23） 涉及文件：bsppps.h/c（驱动层）、bspparse.c（三接口配置）、bspdatainteraction.c（推送分流）、 bspfunction.c（配置纠错）、bspdatainteraction.h（存储）、main.c（上电恢复） 适用工程：IMU303351 / IMU103303333（共用 BSPIMU.git 子仓库） 一、功能概述 PPS（秒脉冲）输入用于 IMU 时间戳校准与脉冲触发推送。三种模式： 模式 名称 行为 ------------------ 0 空 不校准、脉冲不触发推送 1 校准内部时间戳 PPS 捕获回调实时同步校正系数，全部推送报文时间戳使用校准时间 2 PPS 脉冲触发推送 数据推送由 PPS 脉冲沿触发（替代周期推送），推送内容由各通道总开关 PushStatus 决定 二、配置接口（三接口，谁配置谁生效来源） 三个物理接口配置同一组全局 PPS 开关/模式： 接口 指令/报文 开关 模式 ----------------------------- AT 文本 、 、 、 PPSStatus PPSMode HEX 报文 0x0012（Op=0x00 查询/0x01 设置/0x02 设置并保存） PPSStatus PPSMode CAN 报文 0x109（Data0=0x00 查询/0x01 设置/0x02 设置并保存；Playload0=模式 1=锁定 2=开关） PPSStatus PPSMode - 模式值域 0~2，开关值域 0/1， 白名单纠错（非法归 0） - 查询类指令各自回显当前全局 PPSStatus/PPSMode，0x109 额外回显锁定状态 三、模式 1：时间戳校准原理 3.1 校正模型 - 每个有效 PPS 脉冲沿进入 ：DWT 捕获原始时间 → 与上一次捕获差分、 绝对整秒递推，最小二乘/均值方式修正 与 - 未同步前系数为初值（斜率 1/偏移 0），校准输出与原始运行时间一致——无跳变风险 - 信号锁定跟踪：2s 无脉冲判失锁（ ），0x109/0x0013 可查询 3.2 时间戳注入点（全局生效） （bspdatainteraction.c）为全部推送报文（上位机 3D/原始、 AT、HEX 各包、CAN 完整流/精简流）的统一时间戳源： 3.3 关闭/切换行为 - 关闭 PPS（或切换模式）不重置 GSlopeA/GSkewingB/GPPPSTCLast： 校准时间按最后斜率平滑外推，时间戳单调连续不跳变；重新开启无需重新同步 - 所有通道关闭时 复位信号锁定状态 - 全部关闭时回调直接 return，忽略引脚毛刺（防插拔导致时间戳跳变） 四、模式 2：PPS 脉冲触发推送 4.1 计数器消费机制 - 计数器而非单 bit 标志：主循环两圈之间到来的多个脉冲不丢失，高频 PPS（~700Hz） 推送率可跟随输入，积压下圈补推 - 每圈上限 1 轮：一轮含 AT 帧串口忙等（~2.6ms）或 HEX 全包/CAN 两流入队， 耗时较大，防拖长单圈 - 先无条件消费：关闭/切换期间残留脉冲被清掉，条件恢复时不凭空多推 - 模式 2 进出边界（ 内检测）清残留计数，防切换后旧脉冲推新帧 - 组包/发送仍在主循环上下文，与周期推送/应答帧无重入冲突 4.2 推送内容（各通道总开关决定） 模式 2 激活期间三通道周期推送全部停止（ 门控）， 脉冲触发推送全部总开关开启的通道： 通道 脉冲触发推送 总开关 --------------------------- AT 一帧 AT 数据 HEX 全部已订阅包（0x0001/0002/0010/0013/0022，另受各包订阅位约束） CAN 完整流 完整流数据 CAN 精简流 精简流数据 - 各通道独立开关独立生效：开着哪个推哪个，全关时脉冲无物可推（设备静默属用户主动配置） - 上位机 3D/原始数据为独立通道，不受模式 2 控制（维持周期推送，仅时间戳受模式 1 校准） - 模式 2 退出后周期推送立即恢复（LastPushTick 已过阈值，无需额外处理） 4.3 MSGID 订阅控制（HEX 包级开关） HEX 各包（0x0001/0002/0010/0013/0022）订阅位 由三处控制： CAN 0x104（MsgID 控制）、HEX 0x0011、AT 订阅指令。 关键实现： 的订阅判定读 shadow（运行态镜像） 而非 工作副本： 原因：0x104/0x0011 的 Op=0x01（写 RAM，掉电不保存）路径只更新 shadow， 读 shadow 才能即时生效；Op=0x02（写 Flash）两者同步写，行为一致。 开机时 保证 shadow 与 Flash 配置对齐。 已知遗留：推送总开关 PushStatus（0x103/0x0004 等）的 Op=0x01 路径同样只写 shadow， 调度层仍读工作副本，属既有行为，未统一。 五、存储与兼容 5.1 预留区与字段回退记录 预留区 100B 当前未启用任何字段。曾实现过 （u8，记录 PPS 开关 来源接口 1:AT 2:HEX 3:CAN，用于模式 2 单通道分流）——声明于 与 Reserved 之间（Reserved 100B→99B，sizeof 恒 204B）。后该方案回退删除， Reserved 恢复 100B： - 回退原因：模式 2 推送语义最终定为\"各通道总开关 PushStatus 独立决定\"，无需来源记录 - 回退兼容性：删 1B 字段 + Reserved +1B 相互抵消，sizeof/CRC 长度不变， 旧格式页迁移不受影响；曾保存过 SwitchType 的设备该字节落在新固件 ， 不读不校验，无需处理 - 经验：字段引入/删除只要始终\"在注释与 Reserved 之间声明 + 同步增减 Reserved 字节数\"， 即可保证任何版本间双向兼容 - 预留区规程（见《参数页升级SN乱码与预留区扩展机制报告》）： 5.2 上电恢复 main.c 初始化段从配置恢复运行态（否则上电后 PPS 运行态始终为关闭）： 六、0x0013 报文说明 0x0013 为 PPS 状态报文： 字段填锁定状态（ ）、 填全局模式；时间戳恒用校准时间（ ）。 其推送归属：模式 2 激活时随 HEX 通道其它已订阅包一并由脉冲触发； 非模式 2 时保持周期推送（回退语义）。 七、实现避坑清单 要点 --------- 1 模式 2 消费点门控用运行态接口（ ），勿读工作副本——Op=0x01 设置路径不同步工作副本 2 内做模式 2 进出边界清计数，切换模式不残留旧脉冲 3 0x0013 在 内直接推（周期/脉冲两入口互斥不双发，由调度层 TrigMode2Active 门控保证） 4 HEX 订阅判定读 shadow，保证 MSGID 指令 Op=0x01 写 RAM 即时生效 5 AT 指令字符串比较用 ，防止 \"AT+PPSMODE?\" 被 \"AT+PPSMODE=\" 前缀分支截获 6 AT 关键应答使用 等发送缓冲空闲，防数据交织 7 PPS 信号消抖窗口 1ms（支持至 700Hz 输入）；全通道关闭时回调忽略脉冲防毛刺 8 AT 推送帧内含时间戳回退检测（ 开头，检测原始时基回退自动停推）：检测用原始时基、输出用统一时间戳源（模式 1 为校准时间），两源整秒对齐存在 ≤1s 相位差，勿跨源比较否则模式切换瞬间会误触发停推","content":"# PPS 功能实现说明（2026-10-23）\n\n> 涉及文件：bsp_pps.h/c（驱动层）、bsp_parse.c（三接口配置）、bsp_data_interaction.c（推送分流）、\n> bsp_function.c（配置纠错）、bsp_data_interaction.h（存储）、main.c（上电恢复）\n> 适用工程：IMU_303_351 / IMU_103_303_333（共用 BSP_IMU.git 子仓库）\n\n## 一、功能概述\n\nPPS（秒脉冲）输入用于 IMU 时间戳校准与脉冲触发推送。三种模式：\n\n| 模式 | 名称 | 行为 |\n|------|------|------|\n| 0 | 空 | 不校准、脉冲不触发推送 |\n| 1 | 校准内部时间戳 | PPS 捕获回调实时同步校正系数，全部推送报文时间戳使用校准时间 |\n| 2 | PPS 脉冲触发推送 | 数据推送由 PPS 脉冲沿触发（替代周期推送），推送内容由各通道总开关 PushStatus 决定 |\n\n## 二、配置接口（三接口，谁配置谁生效来源）\n\n三个物理接口配置**同一组**全局 PPS 开关/模式：\n\n| 接口 | 指令/报文 | 开关 | 模式 |\n|------|-----------|------|------|\n| AT 文本 | `AT+PPS=ON/OFF`、`AT+PPSMODE=n`、`AT+PPS?`、`AT+PPSMODE?` | PPSStatus | PPSMode |\n| HEX 报文 | 0x0012（Op=0x00 查询/0x01 设置/0x02 设置并保存） | PPSStatus | PPSMode |\n| CAN 报文 | 0x109（Data[0]=0x00 查询/0x01 设置/0x02 设置并保存；Playload[0]=模式 [1]=锁定 [2]=开关） | PPSStatus | PPSMode |\n\n- 模式值域 0~2，开关值域 0/1，`BspDefaultCfgCheck()` 白名单纠错（非法归 0）\n- 查询类指令各自回显当前全局 PPSStatus/PPSMode，0x109 额外回显锁定状态\n\n## 三、模式 1：时间戳校准原理\n\n### 3.1 校正模型\n\n```text\n校准时间(us) = 原始运行时间 × G_SlopeA(频偏斜率) + G_SkewingB(整秒对齐偏移)\n```\n\n- 每个有效 PPS 脉冲沿进入 `BspPPS1SCallback()`：DWT 捕获原始时间 → 与上一次捕获差分、\n  绝对整秒递推，最小二乘/均值方式修正 `G_SlopeA` 与 `G_SkewingB`\n- 未同步前系数为初值（斜率 1/偏移 0），校准输出与原始运行时间一致——无跳变风险\n- 信号锁定跟踪：2s 无脉冲判失锁（`BspPPSLockStatusGet()`），0x109/0x0013 可查询\n\n### 3.2 时间戳注入点（全局生效）\n\n`BspPushTimestampGet()`（bsp_data_interaction.c）为全部推送报文（上位机 3D/原始、\nAT、HEX 各包、CAN 完整流/精简流）的统一时间戳源：\n\n```c\nif (BspPPSStatusCtrlGet() == 1 && BspPPSModeGet() == 1)\n    return BspPPSCalibratedUsGet();   /* 任一接口把PPS配为模式1即全局校准 */\nreturn BspSysRunTimeGet();\n```\n\n### 3.3 关闭/切换行为\n\n- 关闭 PPS（或切换模式）**不重置** G_SlopeA/G_SkewingB/G_PPPS_TC_Last：\n  校准时间按最后斜率平滑外推，时间戳单调连续不跳变；重新开启无需重新同步\n- 所有通道关闭时 `BspPPSStatusCtrlSet(0)` 复位信号锁定状态\n- 全部关闭时回调直接 return，忽略引脚毛刺（防插拔导致时间戳跳变）\n\n## 四、模式 2：PPS 脉冲触发推送\n\n### 4.1 计数器消费机制\n\n```text\nEXTI 捕获回调(BspPPS1SCallback, 中断上下文)\n  └─ 任一通道 PPS 开启时 G_PPSTriggerCount++ (volatile, 饱和防溢出)\n主循环 BspUserDataPushControlCenter()(每圈轮询)\n  ├─ 门控: BspPPSModeGet()==2 && BspPPSStatusCtrlGet()==1\n  ├─ TrigCnt = BspPPSTriggerConsume(1)   ← 每圈最多消费 1 轮\n  └─ 按 PushStatus 推送全部开启通道(见 4.2)\n```\n\n- **计数器而非单 bit 标志**：主循环两圈之间到来的多个脉冲不丢失，高频 PPS（~700Hz）\n  推送率可跟随输入，积压下圈补推\n- **每圈上限 1 轮**：一轮含 AT 帧串口忙等（~2.6ms）或 HEX 全包/CAN 两流入队，\n  耗时较大，防拖长单圈\n- **先无条件消费**：关闭/切换期间残留脉冲被清掉，条件恢复时不凭空多推\n- 模式 2 进出边界（`BspPPSModeSet()` 内检测）清残留计数，防切换后旧脉冲推新帧\n- 组包/发送仍在主循环上下文，与周期推送/应答帧无重入冲突\n\n### 4.2 推送内容（各通道总开关决定）\n\n模式 2 激活期间三通道周期推送**全部停止**（`TrigMode2Active` 门控），\n脉冲触发推送全部总开关开启的通道：\n\n| 通道 | 脉冲触发推送 | 总开关 |\n|------|-------------|--------|\n| AT | 一帧 AT 数据 | `UserATDataPushCfg.PushStatus` |\n| HEX | 全部已订阅包（0x0001/0002/0010/0013/0022，另受各包订阅位约束） | `UserHexDataPushCfg.PushStatus` |\n| CAN 完整流 | 完整流数据 | `UserCanDataPushCfg.PushStatus` |\n| CAN 精简流 | 精简流数据 | `UserCanSimpDataPushCfg.PushStatus` |\n\n- 各通道独立开关独立生效：开着哪个推哪个，全关时脉冲无物可推（设备静默属用户主动配置）\n- 上位机 3D/原始数据为独立通道，不受模式 2 控制（维持周期推送，仅时间戳受模式 1 校准）\n- 模式 2 退出后周期推送立即恢复（LastPushTick 已过阈值，无需额外处理）\n\n### 4.3 MSGID 订阅控制（HEX 包级开关）\n\nHEX 各包（0x0001/0002/0010/0013/0022）订阅位 `DataPacket0x00XX:1` 由三处控制：\nCAN 0x104（MsgID 控制）、HEX 0x0011、AT 订阅指令。\n\n**关键实现**：`BspPushUserHexData()` 的订阅判定读 **shadow（运行态镜像）** 而非\n工作副本：\n\n```c\npProductInfo_S pSub = BspProductInfoShadowGet();\nif (pSub->DataPacket0x0001 == 1) { BspPushSensorDataToUser_0x0001(); } ...\n```\n\n原因：0x104/0x0011 的 **Op=0x01（写 RAM，掉电不保存）路径只更新 shadow**，\n读 shadow 才能即时生效；Op=0x02（写 Flash）两者同步写，行为一致。\n开机时 `BspSyncProductInfoToShadow()` 保证 shadow 与 Flash 配置对齐。\n\n> 已知遗留：推送总开关 PushStatus（0x103/0x0004 等）的 Op=0x01 路径同样只写 shadow，\n> 调度层仍读工作副本，属既有行为，未统一。\n\n## 五、存储与兼容\n\n### 5.1 预留区与字段回退记录\n\n预留区 100B 当前**未启用任何字段**。曾实现过 `PPSSwitchType`（u8，记录 PPS 开关\n来源接口 1:AT 2:HEX 3:CAN，用于模式 2 单通道分流）——声明于 `UserCanSimpDataPushCfg`\n与 Reserved 之间（Reserved 100B→99B，sizeof 恒 204B）。后该方案回退删除，\nReserved 恢复 100B：\n\n- 回退原因：模式 2 推送语义最终定为\"各通道总开关 PushStatus 独立决定\"，无需来源记录\n- **回退兼容性**：删 1B 字段 + Reserved +1B 相互抵消，sizeof/CRC 长度不变，\n  旧格式页迁移不受影响；曾保存过 SwitchType 的设备该字节落在新固件 `Reserved[0]`，\n  不读不校验，无需处理\n- 经验：字段引入/删除只要始终\"在注释与 Reserved 之间声明 + 同步增减 Reserved 字节数\"，\n  即可保证任何版本间双向兼容\n- 预留区规程（见《参数页升级SN乱码与预留区扩展机制报告》）：\n\n```text\n新增字段 = 在注释与 Reserved 之间声明 + Reserved 减对应字节数 + 维护分配表\n新字段默认值必须为 0 语义；多字节字段放 4 对齐偏移；\n禁止改动现有字段顺序/类型；禁止在预留区之前插入字段\n```\n\n### 5.2 上电恢复\n\nmain.c 初始化段从配置恢复运行态（否则上电后 PPS 运行态始终为关闭）：\n\n```c\nBspPPSStatusCtrlSet(pProductInfoShadow->PPSStatus);\nBspPPSModeSet(pProductInfoShadow->PPSMode);\n```\n\n## 六、0x0013 报文说明\n\n0x0013 为 PPS 状态报文：`PPSStatus` 字段填锁定状态（`BspPPSLockStatusGet()`）、\n`PPSMode` 填全局模式；时间戳恒用校准时间（`BspPPSCalibratedUsGet()`）。\n其推送归属：模式 2 激活时随 HEX 通道其它已订阅包一并由脉冲触发；\n非模式 2 时保持周期推送（回退语义）。\n\n## 七、实现避坑清单\n\n| # | 要点 |\n|---|------|\n| 1 | 模式 2 消费点门控用运行态接口（`BspPPSStatusCtrlGet/BspPPSModeGet`），勿读工作副本——Op=0x01 设置路径不同步工作副本 |\n| 2 | `BspPPSModeSet()` 内做模式 2 进出边界清计数，切换模式不残留旧脉冲 |\n| 3 | 0x0013 在 `BspPushUserHexData` 内直接推（周期/脉冲两入口互斥不双发，由调度层 TrigMode2Active 门控保证） |\n| 4 | HEX 订阅判定读 shadow，保证 MSGID 指令 Op=0x01 写 RAM 即时生效 |\n| 5 | AT 指令字符串比较用 `sizeof(\"AT+PPSMODE?\")-1`，防止 \"AT+PPSMODE?\" 被 \"AT+PPSMODE=\" 前缀分支截获 |\n| 6 | AT 关键应答使用 `BspParseSendDataWait` 等发送缓冲空闲，防数据交织 |\n| 7 | PPS 信号消抖窗口 1ms（支持至 700Hz 输入）；全通道关闭时回调忽略脉冲防毛刺 |\n| 8 | AT 推送帧内含时间戳回退检测（`BspPushUserATData` 开头，检测原始时基回退自动停推）：检测用原始时基、输出用统一时间戳源（模式 1 为校准时间），两源整秒对齐存在 ≤1s 相位差，勿跨源比较否则模式切换瞬间会误触发停推 |\n"},{"hash":"IMU/GD32F303/Readme.md","title":"Readme","relPath":"IMU/GD32F303/Readme.md","desc":"GD32F303 平台（工程 IMU303351） - 固件工程：IMU303351 - 硬件平台：GD32F303CB，Cortex-M4 @ 120MHz - 服务产品：351 文档索引 文档 主题 ------------ 0x091…","created":"","updated":"","tags":[],"sizeKB":0.8,"_text":"GD32F303 平台（工程 IMU303351） - 固件工程：IMU303351 - 硬件平台：GD32F303CB，Cortex-M4 @ 120MHz - 服务产品：351 文档索引 文档 主题 ------------ 0x091时间戳抖动修复报告 时间戳源锁存位置问题、时基源注入架构（增量契约）、回绕周期一致性；末尾附时间戳修改规范 串口丢字节修复报告 SysTick 内 64 位软件除法拖长最高优先级中断致 ORE 丢字节，修复为 32 位硬件除法（数学等价推导） 跨平台参考 - GD32F103/921600波特率串口丢字节排查报告：103 平台同款根因五层排查，防御规范跨平台通用","content":"# GD32F303 平台（工程 IMU_303_351）\n\n- **固件工程**：IMU_303_351\n- **硬件平台**：GD32F303CB，Cortex-M4 @ 120MHz\n- **服务产品**：351\n\n## 文档索引\n\n| 文档 | 主题 |\n|------|------|\n| [0x091时间戳抖动修复报告](0x091时间戳抖动修复报告.md) | 时间戳源锁存位置问题、时基源注入架构（增量契约）、回绕周期一致性；末尾附时间戳修改规范 |\n| [串口丢字节修复报告](串口丢字节修复报告.md) | SysTick 内 64 位软件除法拖长最高优先级中断致 ORE 丢字节，修复为 32 位硬件除法（数学等价推导） |\n\n## 跨平台参考\n\n- [GD32F103/921600波特率串口丢字节排查报告](../GD32F103/921600波特率串口丢字节排查报告.md)：103 平台同款根因五层排查，防御规范跨平台通用\n"},{"hash":"IMU/GD32F303/串口丢字节修复报告.md","title":"串口丢字节修复报告","relPath":"IMU/GD32F303/串口丢字节修复报告.md","desc":"教训：插桩计数必须最先快照 STAT0 4. 屏蔽法 A/B 定位：SysTick 处理链中 d40b955 后唯一新增逻辑是 us 时基累加（71b191c）。","created":"","updated":"","tags":[],"sizeKB":5.1,"_text":"串口丢字节修复报告（2026-10-19） 现象：921600bps 连发 AT 指令随机丢字节（0.2%~0.95%）｜根因：SysTick 中断（优先级 0）里的 us 时基换算使用 64 位软件除法，拖长中断逼近 1 字节时间（10.86µs），概率性阻塞 USART0 接收造成溢出｜修复：改 32 位硬件除法（数学等价），72540 字节零丢失 关联：本次问题正是《0x091时间戳抖动修复报告》选定\"SysTick ISR 内时基差值累加\"方案时引入的回归——时基源移入 SysTick 的同时，把 DWT 换算的 64 位除法也带进了最高优先级中断。 一、测试现象 - 平台：GD32F303CB（Cortex-M4，120MHz），USART0 @ 921600bps，PC 串口工具连发 （13 字节/条） - 指令被\"抠掉\"单个字符且位置随机： 、 、 、 …… - 丢失率约 0.2%~0.95%，轮次间波动（3575 发丢 34 字节；1014 发丢 2 字节） - 关键线索：d40b955 之前的版本同样测试从不丢失 二、排查路径（按时间序） 1. 驱动与配置比对： 确认 USART 驱动、时钟树（120MHz PLL）、波特率分频（误差 +0.16%）、NVIC 分组全部零改动——洗清链路配置 2. 回传法：RX 中断内把收到的字节原样回发，PC 对比\"发送流 vs 回传流\"。回传流同样残缺 → 字节确实没被设备正确接收，问题在设备侧；期间观察到一处 R→S 位翻转，一度误导向线级干扰（后判定为独立偶发噪声） 3. ORE 插桩失效的陷阱：中断里加 ORE/FERR/NERR 计数，读数恒为 0——GD32（F1 型 USART）的 ORERR 标志会被\"读 STAT0 → 读 DATA\"序列自动清除，而 RX 中断的正常处理路径恰好就是这个序列，标志在计数代码看到之前就被清掉了。教训：插桩计数必须最先快照 STAT0 4. 屏蔽法 A/B 定位：SysTick 处理链中 d40b955 后唯一新增逻辑是 us 时基累加（71b191c）。只屏蔽它、保留调度与喂狗 → 连发 50089 字节零丢失 → 根因锁定 5. 修复验证：换 32 位硬件除法、恢复累加 → 连发 72540 字节零丢失 → 闭环 三、根因分析 问题代码（ ，SysTick 每 1ms 经函数指针调用一次）： 因果链： 1. Cortex-M4 没有 64 位硬件除法， 编译为 软件例程（数十轮移位减法），约 400~700 周期，加 Flash 等待周期实际 4~8µs 2. SysTick 配置为抢占优先级 0，高于 USART0 的 (1,0)——SysTick 可随时打断串口接收中断 3. 921600bps 下 1 字节时间仅 10.86µs。SysTick 恰好落在字节接收窗口时，RX 中断被推迟 6~10µs，逼近但通常不超过 10.86µs 4. 边际状态 → 概率性溢出（RXNE 未及时读走 → ORE → 丢 1 字节），丢失率低且随环境波动，与实测吻合 5. 回传模式下 RX 中断本身更长（内含 TBE 忙等），裕量更小 → 丢失率更高（0.95% vs 0.2%），同样吻合 四、修复方案 改为 32 位硬件除法（1 条 UDIV 指令，2~12 周期）： 数学等价性： 为整 MHz 时（120MHz、108MHz 均满足）， 即 120MHz 下就是 ，与原 64 位算法结果逐位一致，零精度损失。已在头文件加注释禁止回退成 64 位写法。 五、验证数据（纯回传模式统计） 阶段 发送/接收 丢失 说明 ------------ 修复前 3575 / 3541 34 字节（0.95%） 含 1 处位翻转（线级噪声，独立偶发） 修复前 1014 / 1012 2 字节（0.2%） 丢失率波动，符合边际时序特征 屏蔽 SysTick 时基累加 50089 / 50089 0 A/B 对照，锁定方向 修复后（累加恢复） 72540 / 72540 0 根因闭环，时基功能保留 六、经验总结 1. 高优先级中断纪律：优先级高于串口 RX 的中断里，禁用 64 位乘除（软除法数百周期）、 、double 浮点（M4F 的 FPU 只有单精度） 2. 中断时长预算：任何可能阻塞 RX 的执行路径，总时长必须显著小于最高波特率下 1 字节时间（921600→10.86µs，460800→21.7µs，115200→86.8µs） 3. USART 错误标志的自动清除陷阱：ORERR/FERR 会被\"读 STAT0 → 读 DATA\"序列顺带清除，中断内插桩计数必须最先快照 STAT0，否则恒为 0 并误导排查 4. 回传法（echo 分流）：RX 中断内回发收到的字节，PC 对比发送流与回传流，一步二分\"链路层 vs 设备软件层\"，是串口丢字节问题的高效首查手段 5. 边际时序问题的指纹：丢失率低（<1%）且轮次间波动、丢失位置随机、与软件负载正相关——见到这种模式优先怀疑\"某段代码时长逼近字节时间\"","content":"# 串口丢字节修复报告（2026-10-19）\n\n> 现象：921600bps 连发 AT 指令随机丢字节（0.2%~0.95%）｜根因：SysTick 中断（优先级 0）里的 us 时基换算使用 64 位软件除法，拖长中断逼近 1 字节时间（10.86µs），概率性阻塞 USART0 接收造成溢出｜修复：改 32 位硬件除法（数学等价），72540 字节零丢失\n>\n> 关联：本次问题正是《0x091时间戳抖动修复报告》选定\"SysTick ISR 内时基差值累加\"方案时引入的回归——时基源移入 SysTick 的同时，把 DWT 换算的 64 位除法也带进了最高优先级中断。\n\n## 一、测试现象\n\n- 平台：GD32F303CB（Cortex-M4，120MHz），USART0 @ 921600bps，PC 串口工具连发 `AT+VERSION?`（13 字节/条）\n- 指令被\"抠掉\"单个字符且位置随机：`AT+VERSIO?`、`AT+VERION?`、`A+VERSION?`、`ATVERSION?`……\n- 丢失率约 0.2%~0.95%，轮次间波动（3575 发丢 34 字节；1014 发丢 2 字节）\n- 关键线索：d40b955 之前的版本同样测试从不丢失\n\n## 二、排查路径（按时间序）\n\n1. **驱动与配置比对**：`git diff d40b955^` 确认 USART 驱动、时钟树（120MHz PLL）、波特率分频（误差 +0.16%）、NVIC 分组全部零改动——洗清链路配置\n2. **回传法**：RX 中断内把收到的字节原样回发，PC 对比\"发送流 vs 回传流\"。回传流同样残缺 → 字节确实没被设备正确接收，问题在设备侧；期间观察到一处 R→S 位翻转，一度误导向线级干扰（后判定为独立偶发噪声）\n3. **ORE 插桩失效的陷阱**：中断里加 ORE/FERR/NERR 计数，读数恒为 0——**GD32（F1 型 USART）的 ORERR 标志会被\"读 STAT0 → 读 DATA\"序列自动清除**，而 RX 中断的正常处理路径恰好就是这个序列，标志在计数代码看到之前就被清掉了。教训：插桩计数必须最先快照 STAT0\n4. **屏蔽法 A/B 定位**：SysTick 处理链中 d40b955 后唯一新增逻辑是 us 时基累加（71b191c）。只屏蔽它、保留调度与喂狗 → 连发 50089 字节零丢失 → 根因锁定\n5. **修复验证**：换 32 位硬件除法、恢复累加 → 连发 72540 字节零丢失 → 闭环\n\n## 三、根因分析\n\n问题代码（`dwt.h`，SysTick 每 1ms 经函数指针调用一次）：\n\n```c\nstatic inline uint32_t dwt_us_from_cycles32(uint32_t diff_cycles) {\n    return (uint32_t)(((uint64_t)diff_cycles * 1000000ULL) / (uint64_t)SystemCoreClock);\n}\n```\n\n因果链：\n\n1. Cortex-M4 **没有 64 位硬件除法**，`(uint64_t)/(uint64_t)` 编译为 `__aeabi_uldivmod` 软件例程（数十轮移位减法），约 400~700 周期，加 Flash 等待周期实际 **4~8µs**\n2. SysTick 配置为**抢占优先级 0**，高于 USART0 的 (1,0)——SysTick 可随时打断串口接收中断\n3. 921600bps 下 **1 字节时间仅 10.86µs**。SysTick 恰好落在字节接收窗口时，RX 中断被推迟 6~10µs，逼近但通常不超过 10.86µs\n4. 边际状态 → **概率性**溢出（RXNE 未及时读走 → ORE → 丢 1 字节），丢失率低且随环境波动，与实测吻合\n5. 回传模式下 RX 中断本身更长（内含 TBE 忙等），裕量更小 → 丢失率更高（0.95% vs 0.2%），同样吻合\n\n## 四、修复方案\n\n改为 32 位硬件除法（1 条 UDIV 指令，2~12 周期）：\n\n```c\nstatic inline uint32_t dwt_us_from_cycles32(uint32_t diff_cycles)\n{\n    return diff_cycles / (uint32_t)(SystemCoreClock / 1000000U);\n}\n```\n\n数学等价性：`SystemCoreClock` 为整 MHz 时（120MHz、108MHz 均满足），\n\n```\nfloor(diff × 10⁶ / Fclk) ≡ floor(diff / (Fclk / 10⁶))\n```\n\n即 120MHz 下就是 `diff / 120`，与原 64 位算法结果逐位一致，零精度损失。已在头文件加注释禁止回退成 64 位写法。\n\n## 五、验证数据（纯回传模式统计）\n\n| 阶段 | 发送/接收 | 丢失 | 说明 |\n|---|---|---|---|\n| 修复前 | 3575 / 3541 | 34 字节（0.95%） | 含 1 处位翻转（线级噪声，独立偶发） |\n| 修复前 | 1014 / 1012 | 2 字节（0.2%） | 丢失率波动，符合边际时序特征 |\n| 屏蔽 SysTick 时基累加 | 50089 / 50089 | **0** | A/B 对照，锁定方向 |\n| 修复后（累加恢复） | 72540 / 72540 | **0** | 根因闭环，时基功能保留 |\n\n## 六、经验总结\n\n1. **高优先级中断纪律**：优先级高于串口 RX 的中断里，禁用 64 位乘除（软除法数百周期）、`printf`、double 浮点（M4F 的 FPU 只有单精度）\n2. **中断时长预算**：任何可能阻塞 RX 的执行路径，总时长必须显著小于最高波特率下 1 字节时间（921600→10.86µs，460800→21.7µs，115200→86.8µs）\n3. **USART 错误标志的自动清除陷阱**：ORERR/FERR 会被\"读 STAT0 → 读 DATA\"序列顺带清除，中断内插桩计数必须最先快照 STAT0，否则恒为 0 并误导排查\n4. **回传法（echo 分流）**：RX 中断内回发收到的字节，PC 对比发送流与回传流，一步二分\"链路层 vs 设备软件层\"，是串口丢字节问题的高效首查手段\n5. **边际时序问题的指纹**：丢失率低（<1%）且轮次间波动、丢失位置随机、与软件负载正相关——见到这种模式优先怀疑\"某段代码时长逼近字节时间\"\n"},{"hash":"IMU/GD32F303/参数页升级SN乱码与预留区扩展机制报告.md","title":"参数页升级SN乱码与预留区扩展机制报告","relPath":"IMU/GD32F303/参数页升级SN乱码与预留区扩展机制报告.md","desc":"教训：页头包装结构一旦引入，任何\"读长度=sizeof(结构体)\"的路径都必须显式处理 历史长度差异，兜底迁移不能假设数据区从 0 偏移开始。","created":"","updated":"","tags":[],"sizeKB":5.3,"_text":"参数页升级 SN 乱码与预留区扩展机制报告（2026-10-23） 涉及版本：V3.0.0.14/15 → V3.0.0.21+ 升级链路；A/B 双页参数区（bspdatainteraction.c） 关联工程：IMU303351 / IMU103303333（共用 BSPIMU.git 子仓库） 一、问题现象 设备从 V3.0.0.14/V3.0.0.15 升级到 V3.0.0.21+ 后，AT+SN 查询与上报的 SN 显示为乱码 （如 ），且乱码会被固化（重启不恢复）。 二、根因分析 2.1 参数页格式演进链（真机验证） 版本 页数据长度 差异 ----------------------- L1: V3.0.0.14/15 96B 无量程字段（AccScale/GyroScale） L2: V3.0.0.16~19 100B 含量程；无 UserCanSimpDataPushCfg/0x0022 位 L3: V3.0.0.20~21 104B 无 Reserved 预留区 当前 204B（预留区启用后仍 204B） 头 12B{Magic,Sequence,Crc}+数据 2.2 乱码产生链路 旧固件页（96B，带历史 CRC）在新固件下按 复验 CRC 必然失败 → A/B 双页全部判无效 → 走\"裸迁移\"兜底路径 → 兜底路径把 wrapper 页头 12 字节读进 数据区（偏移错位），SN 字段落进 Magic 小端字节 = \"5IP3\" 系字符 → 乱码被上电初始化流程固化写入。 教训：页头包装结构一旦引入，任何\"读长度=sizeof(结构体)\"的路径都必须显式处理 历史长度差异，兜底迁移不能假设数据区从 0 偏移开始。 三、修复方案 3.1 四级长度复验 + 按格式迁移 按顺序复验 CRC：当前 sizeof(204) → L3(104) → L2(100) → L1(96)， 返回 1/2/3/4 标记格式； 按格式分别迁移： - L3：前缀与当前布局完全一致，直接拷 104B，Reserved 清零 - L2：拷 100B + 旧位域重映射（插入 0x0022 位后 PPSStatus/PPSMode/ZeroBias 整体后移 1 位） + UartxEnable0=1 - L1：拷位域区之前前缀 + 位域搬运至当前偏移后重映射 + ConfigInitFlag 单独搬运 3.2 历史长度必须相对推导，不可绝对硬编码 本工程按短枚举 ABI 编译（枚举容器取可容纳所有枚举值的最小类型）： 实际 2B、 实际 1B，而非直觉的 4B。 按 4B 枚举手推的旧 sizeof（如 124）与真机不符（实际 96），导致 L2 修复反复失败。 3.3 L3 移动锚点陷阱 L3=104 原本等于 ，但预留区启用新字段后该偏移会后移， 锚定它会令 L3 校验长度漂移失效。凡\"历史版本的定长\"必须固化字面常量 （由该版本二进制决定，永不随当前布局变化）。 3.4 预留字段扩展机制（根治未来加字段的升级兼容） 末尾启用 100B（后因 303/333 RAM 缩至 94B）Reserved 区，规程固化在头文件注释： - 新增字段 = 在注释与 Reserved 之间声明 + Reserved 减对应字节数 + 维护分配表 - 新字段默认值必须为 0 语义（旧页该位置恒为 0，迁移后即合法默认值） - 多字节字段放 4 对齐偏移；禁止改动现有字段顺序/类型、禁止在预留区前插入字段 - 效果：布局与 CRC 长度恒定，后续加字段无需再做格式迁移 已启用字段： （PPS 开关来源，100→99）、PPS 三通道配置组等。 3.5 读取路径 RAM 优化（303/333 约束） 303/333 为 20KB RAM，双 216B 暂存 + 900B 预留曾使余量压至 104B。 改为单缓冲串行复用（读 A 校验→读 B 覆盖→胜者为 A 时重读 A）+ Reserved 缩至 94B， 余量恢复至 ~3.5KB。单主循环上下文调用无并发，Flush 构造阶段改读 8B 页头取活跃页序号。 四、验证结论 - 351 测试设备（V3.0.0.15→21+ 升级链）dump 显示 PageA 、SN 完整保留 - 旧页升级后 SN 不再丢失；已损坏设备需一次性重写 SN - 303/333 拉取同版 bsp 后编译通过，RAM 余量 ~3.5KB 五、经验教训汇总 教训 --------- 1 带页头包装的 Flash 参数区，兜底迁移路径最容易成为升级事故源，必须按历史格式长度显式复验 2 sizeof 推算必须以目标编译器真实 ABI 为准（短枚举容器按最小可容纳类型），以真机 dump 输出为最终证据 3 历史定长用字面常量固化，禁止锚定会随布局漂移的 offsetof 4 预留区机制 + \"新字段默认 0 语义\"规程，是结构体演进与旧页兼容的最小成本组合 5 RAM 紧张的工程（20KB 级）做双页备份时优先考虑串行复用单缓冲 6 离线手工转录 hex 复算 CRC 与存储值不符时，优先怀疑转录笔误而非算法差异，用设备端原位计算交叉验证（本例即为转录笔误，算法自始正确） 7 921600 波特率随机丢应答，设备端无 ORE/复位痕迹时优先排查 USB 转串口链路（详见 303333 工程同名报告）","content":"# 参数页升级 SN 乱码与预留区扩展机制报告（2026-10-23）\n\n> 涉及版本：V3.0.0.14/15 → V3.0.0.21+ 升级链路；A/B 双页参数区（bsp_data_interaction.c）\n> 关联工程：IMU_303_351 / IMU_103_303_333（共用 BSP_IMU.git 子仓库）\n\n## 一、问题现象\n\n设备从 V3.0.0.14/V3.0.0.15 升级到 V3.0.0.21+ 后，AT+SN 查询与上报的 SN 显示为乱码\n（如 `53IP?+Z351`），且乱码会被固化（重启不恢复）。\n\n## 二、根因分析\n\n### 2.1 参数页格式演进链（真机验证）\n\n| 版本 | 页数据长度 | 差异 |\n|------|-----------|------|\n| L1: V3.0.0.14/15 | 96B | 无量程字段（AccScale/GyroScale） |\n| L2: V3.0.0.16~19 | 100B | 含量程；无 UserCanSimpDataPushCfg/0x0022 位 |\n| L3: V3.0.0.20~21 | 104B | 无 Reserved 预留区 |\n| 当前 | 204B（预留区启用后仍 204B） | 头 12B{Magic,Sequence,Crc}+数据 |\n\n### 2.2 乱码产生链路\n\n旧固件页（96B，带历史 CRC）在新固件下按 `sizeof(ProductInfo_S)` 复验 CRC 必然失败\n→ A/B 双页全部判无效 → 走\"裸迁移\"兜底路径 → 兜底路径把 **wrapper 页头 12 字节读进\n数据区**（偏移错位），SN 字段落进 Magic 小端字节 `35 49 50 33` = \"5IP3\" 系字符\n→ 乱码被上电初始化流程固化写入。\n\n**教训：页头包装结构一旦引入，任何\"读长度=sizeof(结构体)\"的路径都必须显式处理\n历史长度差异，兜底迁移不能假设数据区从 0 偏移开始。**\n\n## 三、修复方案\n\n### 3.1 四级长度复验 + 按格式迁移\n\n`BspProductInfoPageCheck()` 按顺序复验 CRC：当前 sizeof(204) → L3(104) → L2(100) → L1(96)，\n返回 1/2/3/4 标记格式；`BspProductInfoLoadFromFlash()` 按格式分别迁移：\n\n- **L3**：前缀与当前布局完全一致，直接拷 104B，Reserved 清零\n- **L2**：拷 100B + 旧位域重映射（插入 0x0022 位后 PPSStatus/PPSMode/ZeroBias 整体后移 1 位）\n  + UartxEnable[0]=1\n- **L1**：拷位域区之前前缀 + 位域搬运至当前偏移后重映射 + ConfigInitFlag 单独搬运\n\n### 3.2 历史长度必须相对推导，不可绝对硬编码\n\n本工程按**短枚举 ABI** 编译（枚举容器取可容纳所有枚举值的最小类型）：\n`DataPushFre_E` 实际 2B、`ArithmeticMode_E` 实际 1B，而非直觉的 4B。\n按 4B 枚举手推的旧 sizeof（如 124）与真机不符（实际 96），导致 L2 修复反复失败。\n\n```c\n/* 一律由当前布局相对推导 */\n#define PRODUCT_INFO_LEGACY2_DATA_SIZE   (offsetof(ProductInfo_S, UserCanSimpDataPushCfg))\n#define PRODUCT_INFO_LEGACY_BITS_OFFSET  (offsetof(ProductInfo_S, ConfigInitFlag) - 2U)\n#define PRODUCT_INFO_LEGACY1_BITS_OFFSET (PRODUCT_INFO_LEGACY_BITS_OFFSET - 4U)\n/* L3 例外:必须用历史定值,见 3.3 */\n#define PRODUCT_INFO_LEGACY3_DATA_SIZE   104U\n```\n\n### 3.3 L3 移动锚点陷阱\n\nL3=104 原本等于 `offsetof(Reserved)`，但**预留区启用新字段后该偏移会后移**，\n锚定它会令 L3 校验长度漂移失效。凡\"历史版本的定长\"必须固化字面常量\n（由该版本二进制决定，永不随当前布局变化）。\n\n### 3.4 预留字段扩展机制（根治未来加字段的升级兼容）\n\n`ProductInfo_S` 末尾启用 100B（后因 303/333 RAM 缩至 94B）Reserved 区，规程固化在头文件注释：\n\n- 新增字段 = 在注释与 Reserved 之间声明 + Reserved 减对应字节数 + 维护分配表\n- 新字段默认值必须为 0 语义（旧页该位置恒为 0，迁移后即合法默认值）\n- 多字节字段放 4 对齐偏移；禁止改动现有字段顺序/类型、禁止在预留区前插入字段\n- **效果：布局与 CRC 长度恒定，后续加字段无需再做格式迁移**\n\n已启用字段：`PPSSwitchType`（PPS 开关来源，100→99）、PPS 三通道配置组等。\n\n### 3.5 读取路径 RAM 优化（303/333 约束）\n\n303/333 为 20KB RAM，双 216B 暂存 + 900B 预留曾使余量压至 104B。\n改为**单缓冲串行复用**（读 A 校验→读 B 覆盖→胜者为 A 时重读 A）+ Reserved 缩至 94B，\n余量恢复至 ~3.5KB。单主循环上下文调用无并发，Flush 构造阶段改读 8B 页头取活跃页序号。\n\n## 四、验证结论\n\n- 351 测试设备（V3.0.0.15→21+ 升级链）dump 显示 PageA `crc=OK(legacy)`、SN 完整保留\n- 旧页升级后 SN 不再丢失；已损坏设备需一次性重写 SN\n- 303/333 拉取同版 bsp 后编译通过，RAM 余量 ~3.5KB\n\n## 五、经验教训汇总\n\n| # | 教训 |\n|---|------|\n| 1 | 带页头包装的 Flash 参数区，兜底迁移路径最容易成为升级事故源，必须按历史格式长度显式复验 |\n| 2 | sizeof 推算必须以目标编译器真实 ABI 为准（短枚举容器按最小可容纳类型），以真机 dump 输出为最终证据 |\n| 3 | 历史定长用字面常量固化，禁止锚定会随布局漂移的 offsetof |\n| 4 | 预留区机制 + \"新字段默认 0 语义\"规程，是结构体演进与旧页兼容的最小成本组合 |\n| 5 | RAM 紧张的工程（20KB 级）做双页备份时优先考虑串行复用单缓冲 |\n| 6 | 离线手工转录 hex 复算 CRC 与存储值不符时，优先怀疑转录笔误而非算法差异，用设备端原位计算交叉验证（本例即为转录笔误，算法自始正确） |\n| 7 | 921600 波特率随机丢应答，设备端无 ORE/复位痕迹时优先排查 USB 转串口链路（详见 303_333 工程同名报告） |\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Readme.md","title":"Readme","relPath":"IMU/Linux-UartTestVerifDemo/Readme.md","desc":"串口验证程序 (Linux-UartTestVerifDemo) 2026-10-26 归档：源工程 （分支 ），Linux 上位机侧的志翔 IMU 示例 Demo 与自测试程序。","created":"","updated":"","tags":[],"sizeKB":5.2,"_text":"串口验证程序 (Linux-UartTestVerifDemo) 2026-10-26 归档：源工程 （分支 ），Linux 上位机侧的志翔 IMU 示例 Demo 与自测试程序。单可执行 ，参数选择三大功能。本目录整理各模块的功能实现（Doc/）并快照源码（Code/）。 工程定位 属性 说明 ------------ 平台 Linux PC（gcc + pthread，无第三方依赖） 对象 志翔 IMU 设备（串口，志翔私有协议，默认 921600 8N1） 形态 单可执行 ，参照 分支的三层架构（驱动/队列/协议）与统计方式 版本 V1.7.8（2026-10-22，详见 Doc/07 版本史与源工程 Readme） 三大功能（示例 Demo + 自测试程序） 功能 名称 内容 模块 ------------------------ 1（默认） 数据流统计 接收推送报文，数据包1/2/3/4 帧级统计（帧数/平均Hz/瞬时Hz/帧间隔极值）+ 最新帧物理量解析 + 设备时间戳Δt统计，验证帧率/断流/解析正确性 bspuartprotocol + main 2 AT 指令验证 依据《用户协议》第2章 40 条用例逐条下发，按文档应答格式判定，配置自动还原 bspattest 3 HEX 协议验证 依据《用户协议》第3.2章 19 个报文 ID 逐 ID 验证（32 条用例含异常组），另有压力/暴力模式（fuzz 轰炸/截断恢复等 5 项） bsphextest 模块导航（功能实现文档） 文档 模块 要点 ------------------ 01-架构与线程模型 总体设计 三层架构、SPSC 双线程流水线、优雅退出 02-串口驱动 drvserial termios 原始模式 8N1、八档波特率、ASYNCLOWLATENCY 03-环形队列 bspuartqueue 4KB SPSC 无锁环形队列、满丢弃计数 04-协议层 bspuartprotocol 帧同步状态机、CRC16、帧级统计、数据包1~4解析、Δt统计 05-AT指令验证 bspattest 用例表驱动、混流容错（剔帧+双条件判定）、成对自动还原 06-HEX协议验证 bsphextest 19 ID 全覆盖、查询缓存动态还原、异常组、压力模式 07-主入口与构建运行 main.c / run.sh 功能分发、参数解析、一键编译菜单脚本 目录结构 快速上手 《用户协议》全量文档（AT 指令表、3.2 章串口交互协议）存于源工程 ，本目录文档只摘录测试程序涉及的关键帧格式与判定规则。 沉淀经验（详见各模块文档） 1. 混流容错：数据流推送帧与 AT 应答/HEX 应答同串口共存且可能字节级交织——先按帧结构整帧剔除 推送帧，再做文本/帧判定（02/05/06） 2. 无锁 SPSC 队列：单生产者/单消费者各持一个下标，volatile 即可安全解耦收发节奏（03） 3. 全样本 Δt 统计：设备时间戳差值不做异常过滤，回退/重置直接体现在极值（04） 4. 副作用安全：风险组用例一律\"先查原值→设避让档→自动还原\"，无法还原的项有意排除（05/06） 5. 固件即权威：文档缺失/不一致处逐 ID 对照固件 核实（0x0022 应答长度、SN 倒序等）（06） 6. 串口抢占陷阱：两实例同读一串口会瓜分字节流，双方都无法组帧——排障先查 （07）","content":"# `IMU Linux` 串口验证程序 (Linux-UartTestVerifDemo)\n\n> 2026-10-26 归档：源工程 `IMUDemo`（分支 `feature/LinuxUartTestVerifDemo`），Linux 上位机侧的志翔 IMU 示例 Demo 与自测试程序。单可执行 `imu_test`，参数选择三大功能。本目录整理**各模块的功能实现**（Doc/）并快照源码（Code/）。\n\n## 工程定位\n\n| 属性 | 说明 |\n|------|------|\n| 平台 | Linux PC（gcc + pthread，无第三方依赖） |\n| 对象 | 志翔 IMU 设备（串口，志翔私有协议，默认 921600 8N1） |\n| 形态 | 单可执行 `imu_test`，参照 `feature/LinuxCanTestVerifDemo` 分支的三层架构（驱动/队列/协议）与统计方式 |\n| 版本 | V1.7.8（2026-10-22，详见 [Doc/07](Doc/07-主入口与构建运行.md) 版本史与源工程 Readme） |\n\n## 三大功能（示例 Demo + 自测试程序）\n\n| 功能 | 名称 | 内容 | 模块 |\n|------|------|------|------|\n| 1（默认） | 数据流统计 | 接收推送报文，数据包1/2/3/4 帧级统计（帧数/平均Hz/瞬时Hz/帧间隔极值）+ 最新帧物理量解析 + 设备时间戳Δt统计，验证帧率/断流/解析正确性 | bsp_uart_protocol + main |\n| 2 | AT 指令验证 | 依据《用户协议》第2章 40 条用例逐条下发，按文档应答格式判定，配置自动还原 | bsp_at_test |\n| 3 | HEX 协议验证 | 依据《用户协议》第3.2章 19 个报文 ID 逐 ID 验证（32 条用例含异常组），另有压力/暴力模式（fuzz 轰炸/截断恢复等 5 项） | bsp_hex_test |\n\n## 模块导航（功能实现文档）\n\n| 文档 | 模块 | 要点 |\n|------|------|------|\n| [01-架构与线程模型](Doc/01-架构与线程模型.md) | 总体设计 | 三层架构、SPSC 双线程流水线、优雅退出 |\n| [02-串口驱动](Doc/02-串口驱动模块-drv_serial.md) | drv_serial | termios 原始模式 8N1、八档波特率、ASYNC_LOW_LATENCY |\n| [03-环形队列](Doc/03-环形队列模块-bsp_uart_queue.md) | bsp_uart_queue | 4KB SPSC 无锁环形队列、满丢弃计数 |\n| [04-协议层](Doc/04-协议层模块-bsp_uart_protocol.md) | bsp_uart_protocol | 帧同步状态机、CRC16、帧级统计、数据包1~4解析、Δt统计 |\n| [05-AT指令验证](Doc/05-AT指令验证模块-bsp_at_test.md) | bsp_at_test | 用例表驱动、混流容错（剔帧+双条件判定）、成对自动还原 |\n| [06-HEX协议验证](Doc/06-HEX协议验证模块-bsp_hex_test.md) | bsp_hex_test | 19 ID 全覆盖、查询缓存动态还原、异常组、压力模式 |\n| [07-主入口与构建运行](Doc/07-主入口与构建运行.md) | main.c / run.sh | 功能分发、参数解析、一键编译菜单脚本 |\n\n## 目录结构\n\n```text\nLinux-UartTestVerifDemo/\n├── Readme.md                ← 本索引\n├── Doc/                     ← 各模块功能实现文档\n│   ├── 01-架构与线程模型.md\n│   ├── 02-串口驱动模块-drv_serial.md\n│   ├── 03-环形队列模块-bsp_uart_queue.md\n│   ├── 04-协议层模块-bsp_uart_protocol.md\n│   ├── 05-AT指令验证模块-bsp_at_test.md\n│   ├── 06-HEX协议验证模块-bsp_hex_test.md\n│   └── 07-主入口与构建运行.md\n└── Code/                    ← 源码快照（与源工程 00.Code/ 一致）\n    ├── main.c               统一入口：功能分发 + 统计主循环、线程管理\n    ├── drv_serial.c/h       串口驱动模块（termios，8N1，低延迟）\n    ├── bsp_uart_queue.c/h   字节流 SPSC 环形队列（4KB）\n    ├── bsp_uart_protocol.c/h 协议层：帧同步/CRC16/统计/数据包1~4解析\n    ├── bsp_at_test.c/h      AT 指令逐条验证器\n    ├── bsp_hex_test.c/h     HEX 交互协议逐报文验证器\n    └── run.sh               一键编译运行脚本\n```\n\n## 快速上手\n\n```bash\ncd Code && ./run.sh                          # 编译+菜单（默认 /dev/ttyUSB0 @921600）\n./imu_test /dev/ttyUSB0 921600 10            # 功能1：统计 10 秒\n./imu_test /dev/ttyUSB0 921600 2 1           # 功能2：AT 验证（含风险组，自动还原）\n./imu_test /dev/ttyUSB0 921600 3 2           # 功能3：HEX 压力/暴力模式\n```\n\n> 《用户协议》全量文档（AT 指令表、3.2 章串口交互协议）存于源工程 `01.Doc/用户协议.md`，本目录文档只摘录测试程序涉及的关键帧格式与判定规则。\n\n## 沉淀经验（详见各模块文档）\n\n1. **混流容错**：数据流推送帧与 AT 应答/HEX 应答同串口共存且可能字节级交织——先按帧结构整帧剔除 `AA 55` 推送帧，再做文本/帧判定（02/05/06）\n2. **无锁 SPSC 队列**：单生产者/单消费者各持一个下标，volatile 即可安全解耦收发节奏（03）\n3. **全样本 Δt 统计**：设备时间戳差值不做异常过滤，回退/重置直接体现在极值（04）\n4. **副作用安全**：风险组用例一律\"先查原值→设避让档→自动还原\"，无法还原的项有意排除（05/06）\n5. **固件即权威**：文档缺失/不一致处逐 ID 对照固件 `bsp_parse.c` 核实（0x0022 应答长度、SN 倒序等）（06）\n6. **串口抢占陷阱**：两实例同读一串口会瓜分字节流，双方都无法组帧——排障先查 `lsof`（07）\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Doc/01-架构与线程模型.md","title":"01-架构与线程模型","relPath":"IMU/Linux-UartTestVerifDemo/Doc/01-架构与线程模型.md","desc":"代码风格约定 单函数体不超过 30 行（约 20 行为宜），超出即按职责拆分——V1.7.7 重构后 143 个函数全部达标，拆分后行为不变（pty 全量冒烟回归验证）。","created":"","updated":"","tags":[],"sizeKB":3.7,"_text":"01 架构与线程模型 源码：Code/main.c、Code/drvserial.c、Code/bspuartqueue.c、Code/bspuartprotocol.c 三层架构 参照 （CAN 分支）分层，换平台只换驱动层： 层 模块 职责 依赖 ---------------------- 驱动层 drvserial 仅封装系统调用（open/read/write/termios），不含任何协议逻辑 无 队列层 bspuartqueue 字节流缓冲，解耦接收与解析节奏 无 协议层 bspuartprotocol 帧同步、CRC16 校验、帧级统计、数据包解析 无（纯函数+内部静态状态） 应用层 main / bspattest / bsphextest 功能分发、线程管理、显示；AT/HEX 验证器自管串口事务 驱动层（+协议层 CRC 算法思想） 线程模型（功能1 数据流统计） - 接收线程： 阻塞读 → 逐字节入队；维护 （最近收字节时刻）与 累计 - 解析线程：逐字节 喂状态机（内部完成 CRC 校验/统计/解析） - 主线程：每秒打印统计表；终端模式利用固定 31 行布局原地回退刷新，管道模式退化为 5 秒全量打印 设计要点 1. SPSC 无锁：单生产者单消费者，各持一个下标， 保证可见性，无锁无阻塞（详见 03） 2. 优雅退出：SIGINT/SIGTERM 信号处理只置 （异步安全），驱动层 的 自旋重试保证信号能打断阻塞读；退出时打印最终汇总（接收字节数/CRC 通过帧数/队列丢弃字节/各包统计） 3. 单调钟计时：所有时刻取 ，不受系统时间跳变影响；平均 Hz = (帧数−1) ÷ (末帧−首帧时刻) 4. 只统计 CRC 通过帧：坏帧、非法长度帧自动剔除并可恢复同步，帧间夹垃圾字节不受影响 功能分发（单程序三功能） 功能 第3参数 功能参数 走向 ----------------------------- 1 数据流统计（默认） 非 2/3，视为秒数 秒数，0=直到 Ctrl-C ：起双线程+主循环打印 2 AT 指令验证 0=仅安全组（默认），1=+风险组 （自管串口事务） 3 HEX 协议验证 0=仅安全组，1=+风险/异常组，2=压力模式 （自管串口事务） 功能 2/3 为\"事务式\"验证（发一帧→等应答），不走路由队列，直接在验证器内部完成收发与混流容错；功能 1 为\"流水线式\"持续接收，走双线程+队列。 代码风格约定 单函数体不超过 30 行（约 20 行为宜），超出即按职责拆分——V1.7.7 重构后 143 个函数全部达标，拆分后行为不变（pty 全量冒烟回归验证）。","content":"# 01 架构与线程模型\n\n> 源码：[Code/main.c](../Code/main.c)、[Code/drv_serial.c](../Code/drv_serial.c)、[Code/bsp_uart_queue.c](../Code/bsp_uart_queue.c)、[Code/bsp_uart_protocol.c](../Code/bsp_uart_protocol.c)\n\n## 三层架构\n\n参照 `feature/LinuxCanTestVerifDemo`（CAN 分支）分层，换平台只换驱动层：\n\n```text\nmain(入口分发+统计显示) ── bsp_uart_protocol(帧同步/CRC/统计/解析)\n     │       │                  │\n     │       └─ bsp_at_test / bsp_hex_test(指令与协议验证)\n     │                          │\nbsp_uart_queue(字节流SPSC环形队列)\n     │                          │\ndrv_serial(termios串口驱动)\n```\n\n| 层 | 模块 | 职责 | 依赖 |\n|----|------|------|------|\n| 驱动层 | drv_serial | 仅封装系统调用（open/read/write/termios），不含任何协议逻辑 | 无 |\n| 队列层 | bsp_uart_queue | 字节流缓冲，解耦接收与解析节奏 | 无 |\n| 协议层 | bsp_uart_protocol | 帧同步、CRC16 校验、帧级统计、数据包解析 | 无（纯函数+内部静态状态） |\n| 应用层 | main / bsp_at_test / bsp_hex_test | 功能分发、线程管理、显示；AT/HEX 验证器自管串口事务 | 驱动层（+协议层 CRC 算法思想） |\n\n## 线程模型（功能1 数据流统计）\n\n```text\nUartRecvThread(生产者)  --字节流-->  UartQueue  --字节流-->  UartParseThread(消费者)\n   阻塞read()        BspUartQueuePush()         BspUartQueuePop()   帧同步/CRC/统计/解析\n                                                                     │\n                                       主线程: 每秒 BspUartProtocolPrintStat() 刷新显示\n```\n\n- **接收线程**：`DrvSerialRecv` 阻塞读 → `QueuePushBytes` 逐字节入队；维护 `G_LastRxSec`（最近收字节时刻）与 `G_RxBytes` 累计\n- **解析线程**：逐字节 `BspUartProtocolOnByte` 喂状态机（内部完成 CRC 校验/统计/解析）\n- **主线程**：每秒打印统计表；终端模式利用固定 31 行布局原地回退刷新，管道模式退化为 5 秒全量打印\n\n### 设计要点\n\n1. **SPSC 无锁**：单生产者单消费者，各持一个下标，`volatile` 保证可见性，无锁无阻塞（详见 [03](03-环形队列模块-bsp_uart_queue.md)）\n2. **优雅退出**：SIGINT/SIGTERM 信号处理只置 `G_Running=0`（异步安全），驱动层 `read` 的 `EINTR` 自旋重试保证信号能打断阻塞读；退出时打印最终汇总（接收字节数/CRC 通过帧数/队列丢弃字节/各包统计）\n3. **单调钟计时**：所有时刻取 `CLOCK_MONOTONIC`，不受系统时间跳变影响；平均 Hz = (帧数−1) ÷ (末帧−首帧时刻)\n4. **只统计 CRC 通过帧**：坏帧、非法长度帧自动剔除并可恢复同步，帧间夹垃圾字节不受影响\n\n## 功能分发（单程序三功能）\n\n`./imu_test [串口设备] [波特率] [功能] [功能参数]`\n\n| 功能 | 第3参数 | 功能参数 | 走向 |\n|------|--------|---------|------|\n| 1 数据流统计（默认） | 非 2/3，视为秒数 | 秒数，0=直到 Ctrl-C | `RunStatMode`：起双线程+主循环打印 |\n| 2 AT 指令验证 | `2` | 0=仅安全组（默认），1=+风险组 | `BspAtTestRun`（自管串口事务） |\n| 3 HEX 协议验证 | `3` | 0=仅安全组，1=+风险/异常组，2=压力模式 | `BspHexTestRun`（自管串口事务） |\n\n功能 2/3 为\"事务式\"验证（发一帧→等应答），不走路由队列，直接在验证器内部完成收发与混流容错；功能 1 为\"流水线式\"持续接收，走双线程+队列。\n\n## 代码风格约定\n\n单函数体不超过 30 行（约 20 行为宜），超出即按职责拆分——V1.7.7 重构后 143 个函数全部达标，拆分后行为不变（pty 全量冒烟回归验证）。\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Doc/02-串口驱动模块-drv_serial.md","title":"02-串口驱动模块-drv_serial","relPath":"IMU/Linux-UartTestVerifDemo/Doc/02-串口驱动模块-drv_serial.md","desc":"02 串口驱动模块 drvserial 源码：Code/drvserial.c / Code/drvserial.h 定位 Linux termios 串口驱动层，仅封装系统调用，不含任何协议逻辑。","created":"","updated":"","tags":[],"sizeKB":2.7,"_text":"02 串口驱动模块 drvserial 源码：Code/drvserial.c / Code/drvserial.h 定位 Linux termios 串口驱动层，仅封装系统调用，不含任何协议逻辑。更换平台（如 Windows/RTOS）时仅需重写本层，上层不变。 对外接口 Open 配置要点（实现逐条） 配置 做法 目的 ------------------ 打开方式 不作为控制终端，避免串口上的杂散输入影响进程 波特率 数值→宏映射表（9600~921600 八档）， 协议默认 921600，非法波特率直接报错拒开 帧格式 8 数据位 / 无校验 / 1 停止位，无流控（ 、 ） 协议默认 8N1 原始模式 清 、 、 二进制协议透传，不做任何字符处理 读阻塞 ：收到 ≥1 字节即返回 半阻塞读，上层大缓冲读满整包 清残留 后再 丢弃历史残留字节，验证从干净状态开始 USB 低延迟 置 CH340/CP210x 等 USB 转串口默认 1 个 UART FIFO 延迟（约几十 ms 级），置位后降到 1ms 级 收发实现细节 - Recv： 返回 且 时自旋重试——信号（Ctrl+C）只打断一次 read，不丢运行控制；返回 0 = 对端断开（如 USB 拔出），返回负 = 错误 - Send：循环 直到全部发出， 重试，其余错误直接失败返回——保证任意长度指令帧完整落串口 经验沉淀 1. 低延迟标志对 USB 串口必备：验证帧间隔统计（1ms 级）时，未开 的 USB 转串口会把抖动放大到几十 ms，统计结果失真 2. VMIN=1 而非纯阻塞：配合信号驱动退出（sigaction 无 ），Ctrl+C 能即时打断读循环，避免\"退不出\"的假死 3. 原始模式下务必同时清输入标志（ ）与回显标志——否则 0x0A/0x0D 字节会被改写，二进制帧 CRC 必错","content":"# 02 串口驱动模块 drv_serial\n\n> 源码：[Code/drv_serial.c](../Code/drv_serial.c) / [Code/drv_serial.h](../Code/drv_serial.h)\n\n## 定位\n\nLinux termios 串口驱动层，**仅封装系统调用，不含任何协议逻辑**。更换平台（如 Windows/RTOS）时仅需重写本层，上层不变。\n\n## 对外接口\n\n```c\ntypedef struct {\n    int  Fd;        /* 文件描述符, -1=未打开 */\n    char Dev[64];   /* 设备路径, 如 /dev/ttyUSB0 */\n    int  Baud;      /* 波特率数值, 如 921600 */\n} DrvSerial_S;\n\nint  DrvSerialOpen(DrvSerial_S *pDrv);                        /* 打开并配置(Dev/Baud先填好) */\nvoid DrvSerialClose(DrvSerial_S *pDrv);\nint  DrvSerialRecv(DrvSerial_S *pDrv, unsigned char *pBuf, int Len);  /* 阻塞收, >=1字节即返回 */\nint  DrvSerialSend(DrvSerial_S *pDrv, const unsigned char *pBuf, int Len); /* 循环写直到发完 */\n```\n\n## Open 配置要点（实现逐条）\n\n| 配置 | 做法 | 目的 |\n|------|------|------|\n| 打开方式 | `open(Dev, O_RDWR \\| O_NOCTTY \\| O_SYNC)` | 不作为控制终端，避免串口上的杂散输入影响进程 |\n| 波特率 | 数值→宏映射表（9600~921600 八档），`cfsetispeed/cfsetospeed` | 协议默认 921600，非法波特率直接报错拒开 |\n| 帧格式 | 8 数据位 / 无校验 / 1 停止位，无流控（`~CRTSCTS`、`~IXON/IXOFF/IXANY`） | 协议默认 8N1 |\n| 原始模式 | 清 `ICANON/ECHO/ECHOE/ISIG`、`OPOST`、`INLCR/ICRNL` | 二进制协议透传，不做任何字符处理 |\n| 读阻塞 | `VMIN=1, VTIME=0`：收到 ≥1 字节即返回 | 半阻塞读，上层大缓冲读满整包 |\n| 清残留 | `tcflush(TCIOFLUSH)` 后再 `tcsetattr` | 丢弃历史残留字节，验证从干净状态开始 |\n| USB 低延迟 | `TIOCGSERIAL/TIOCSSERIAL` 置 `ASYNC_LOW_LATENCY` | CH340/CP210x 等 USB 转串口默认 1 个 UART FIFO 延迟（约几十 ms 级），置位后降到 1ms 级 |\n\n## 收发实现细节\n\n- **Recv**：`read()` 返回 `<0` 且 `errno==EINTR` 时自旋重试——信号（Ctrl+C）只打断一次 read，不丢运行控制；返回 0 = 对端断开（如 USB 拔出），返回负 = 错误\n- **Send**：循环 `write()` 直到全部发出，`EINTR` 重试，其余错误直接失败返回——保证任意长度指令帧完整落串口\n\n## 经验沉淀\n\n1. **低延迟标志对 USB 串口必备**：验证帧间隔统计（1ms 级）时，未开 `ASYNC_LOW_LATENCY` 的 USB 转串口会把抖动放大到几十 ms，统计结果失真\n2. **VMIN=1 而非纯阻塞**：配合信号驱动退出（sigaction 无 `SA_RESTART`），Ctrl+C 能即时打断读循环，避免\"退不出\"的假死\n3. 原始模式下务必同时清输入标志（`INLCR/ICRNL`）与回显标志——否则 0x0A/0x0D 字节会被改写，二进制帧 CRC 必错\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Doc/03-环形队列模块-bsp_uart_queue.md","title":"03-环形队列模块-bsp_uart_queue","relPath":"IMU/Linux-UartTestVerifDemo/Doc/03-环形队列模块-bsp_uart_queue.md","desc":"03 环形队列模块 bspuartqueue 源码：Code/bspuartqueue.c / Code/bspuartqueue.h 定位 串口字节流环形队列，衔接\"接收线程（生产者）\"与\"解析线程（消费者）\"，解耦两者节奏：串口突发到达时解析线程来不及消费的字节先在队列里缓冲。","created":"","updated":"","tags":[],"sizeKB":2.6,"_text":"03 环形队列模块 bspuartqueue 源码：Code/bspuartqueue.c / Code/bspuartqueue.h 定位 串口字节流环形队列，衔接\"接收线程（生产者）\"与\"解析线程（消费者）\"，解耦两者节奏：串口突发到达时解析线程来不及消费的字节先在队列里缓冲。 数据结构 无锁 SPSC 原理 单生产者/单消费者（Single-Producer/Single-Consumer）场景下不需要锁： 变量 谁写 谁读 ------------------ Head 仅生产者 push 后 仅消费者（判空/判满） Tail 仅消费者 pop 后 仅生产者（判满） - 每个下标只有一个写者 → 单字节写天然原子， 足够，无需内存屏障（x86/ARM 单字读写保证） - 容量取 2 的幂 → 取模运算退化为按位与，push/pop 均为 O(1) - 判满用\"放弃一格\"法： 视为满，牺牲 1 字节容量换无锁实现 满时策略：丢新数据 + 计数 选择\"丢新保旧\"而非\"丢旧保新\"：丢字节必然破坏帧结构，被破坏的帧会被 CRC 拦下， 就是消费不及的直接证据——正常情况必须为 0，0 即解析线程消费不及或突发过大，属于需排查的异常信号（与固件侧\"ISR 队列满丢新字节\"纪律一致）。 对外接口 函数 说明 ------------ 清零三下标 生产者调用：入队 1 字节，满则丢+计数 消费者调用：出队 1 字节，空返回 -1 容量依据 921600bps ≈ 92.16KB/s，4KB ≈ 42ms 突发余量。解析线程每秒只需消费 ~9 万字节（微秒级/字节），余量充足；若未来提速到更高波特率或解析变慢，按\"波特率 × 期望容忍突发时长\"重估容量并保持 2 的幂。","content":"# 03 环形队列模块 bsp_uart_queue\n\n> 源码：[Code/bsp_uart_queue.c](../Code/bsp_uart_queue.c) / [Code/bsp_uart_queue.h](../Code/bsp_uart_queue.h)\n\n## 定位\n\n串口字节流环形队列，衔接\"接收线程（生产者）\"与\"解析线程（消费者）\"，解耦两者节奏：串口突发到达时解析线程来不及消费的字节先在队列里缓冲。\n\n## 数据结构\n\n```c\n#define UART_QUEUE_SIZE 4096   /* 容量(字节, 必须为2的幂): 921600bps下约42ms突发余量 */\n\ntypedef struct {\n    unsigned char Buf[UART_QUEUE_SIZE];\n    volatile unsigned int Head;       /* 写下标(仅生产者改) */\n    volatile unsigned int Tail;       /* 读下标(仅消费者改) */\n    volatile unsigned int DropCount;  /* 满时丢弃字节数 */\n} UartQueue_S;\n```\n\n## 无锁 SPSC 原理\n\n单生产者/单消费者（Single-Producer/Single-Consumer）场景下不需要锁：\n\n| 变量 | 谁写 | 谁读 |\n|------|------|------|\n| Head | 仅生产者 push 后 `Head=(Head+1)&(SIZE-1)` | 仅消费者（判空/判满） |\n| Tail | 仅消费者 pop 后 `Tail=(Tail+1)&(SIZE-1)` | 仅生产者（判满） |\n\n- 每个下标只有一个写者 → 单字节写天然原子，`volatile` 足够，无需内存屏障（x86/ARM 单字读写保证）\n- 容量取 2 的幂 → 取模运算退化为按位与，push/pop 均为 O(1)\n- **判满用\"放弃一格\"法**：`(Head+1)%SIZE == Tail` 视为满，牺牲 1 字节容量换无锁实现\n\n## 满时策略：丢新数据 + 计数\n\n```c\nvoid BspUartQueuePush(UartQueue_S *pQ, unsigned char Byte)\n{\n    unsigned int Next = (pQ->Head + 1) % UART_QUEUE_SIZE;\n    if (Next == pQ->Tail) { pQ->DropCount++; return; }  /* 满则丢弃并累加 */\n    pQ->Buf[pQ->Head] = Byte;\n    pQ->Head = Next;\n}\n```\n\n选择\"丢新保旧\"而非\"丢旧保新\"：丢字节必然破坏帧结构，被破坏的帧会被 CRC 拦下，`DropCount` 就是消费不及的直接证据——**正常情况必须为 0**，>0 即解析线程消费不及或突发过大，属于需排查的异常信号（与固件侧\"ISR 队列满丢新字节\"纪律一致）。\n\n## 对外接口\n\n| 函数 | 说明 |\n|------|------|\n| `BspUartQueueInit` | 清零三下标 |\n| `BspUartQueuePush` | 生产者调用：入队 1 字节，满则丢+计数 |\n| `BspUartQueuePop` | 消费者调用：出队 1 字节，空返回 -1 |\n\n## 容量依据\n\n921600bps ≈ 92.16KB/s，4KB ≈ **42ms 突发余量**。解析线程每秒只需消费 ~9 万字节（微秒级/字节），余量充足；若未来提速到更高波特率或解析变慢，按\"波特率 × 期望容忍突发时长\"重估容量并保持 2 的幂。\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Doc/04-协议层模块-bsp_uart_protocol.md","title":"04-协议层模块-bsp_uart_protocol","relPath":"IMU/Linux-UartTestVerifDemo/Doc/04-协议层模块-bsp_uart_protocol.md","desc":"04 协议层模块 bspuartprotocol 源码：Code/bspuartprotocol.c / Code/bspuartprotocol.h 定位 志翔 IMU 串口私有协议层：帧同步状态机 + CRC16 校验 + 帧级统计 + 数据包1/2/3/4 解析 + 设备时间戳Δt统计。","created":"","updated":"","tags":[],"sizeKB":4.1,"_text":"04 协议层模块 bspuartprotocol 源码：Code/bspuartprotocol.c / Code/bspuartprotocol.h 定位 志翔 IMU 串口私有协议层：帧同步状态机 + CRC16 校验 + 帧级统计 + 数据包1/2/3/4 解析 + 设备时间戳Δt统计。纯函数+内部静态状态，与平台无关。 帧格式与 CRC16 - LEN 为整帧长度（帧头 6 字节 + 数据域 + CRC 2 字节），数据域长度 = LEN − 8，多字节字段小端（intel） - CRC16：初值 、多项式 （反向 LSBF），计算范围 = 帧头至数据域末字节（不含 CRC 本身）。 独立导出，AT/HEX 验证器同算法参考 帧同步状态机（7 状态） - 逐字节喂入（ ），任一环节不符合即回退重同步（SYNC2 不符退回重找 0xAA） - 进入 PAYLOAD 前校验 LEN 合法性（ 是否落在数据域容量内），非法长度帧直接剔除 - 帧收完后 CRC 校验：只统计校验通过的帧；坏帧/垃圾字节不影响后续帧同步（帧间夹噪声自动剔除） - 状态机同时累计 （喂入字节数）与 （CRC 失败帧数）两个诊断计数 帧级统计（与 CAN 分支字段对齐） 每个报文 ID 独立维护 ： 字段 含义 ------------ Count 累计帧数（CRC 通过） 平均Hz (Count−1) ÷ (末帧时刻−首帧时刻)，全程平均 InstHz / WinStart / WinCount 瞬时Hz：1 秒滑动窗口 LastIntMs / MinIntMs / MaxIntMs / SumInt 帧间隔：当前/最小/最大/累计求平均 统计对象：数据包1（0x0001，87 字节）/ 数据包2（0x0010，44）/ 数据包3（0x0013，105）/ 数据包4（0x0022，38）， ，ID→下标映射 。 判读参考：50Hz 推送 → 平均间隔 ≈ 20.0ms；最大ms 无大跳 → 流稳定无断流；最小 1ms 级毛刺/最大百万毫秒级跳变 → 设备侧丢帧或时间戳异常。 设备时间戳Δt统计（数据包2/3/4） ：相邻帧设备 us 时间戳之差的 最新/平均/最小/最大/样本数。 - 与 CAN 分支 0x091 同语义：全样本无过滤——时间戳回退、重置、乱序不丢弃，直接体现在极值（最小可能为负/接近 0，最大百万 ms 级），异常即证据，不做静默吞掉 - 按报文 ID 定位数据域内时间戳字段偏移，无时间戳的数据包1 不参与 数据包解析（最新帧物理量） 每包独立解析函数（ ），小端逐字段取出，存入 对应结构： 数据包 ID 数据域 内容 -------------------------- 1 0x0001 87B 频率/日期时间/加计XYZ+模长/陀螺XYZ+模长/温度/姿态RPY/四元数/磁场 2 0x0010 44B 时间戳us/加计XYZ/陀螺XYZ/姿态RPY 3 0x0013 105B 数据包1 全集 + 时间戳us + PPS锁定与模式 + 预留 4 0x0022 38B 时间戳us/加计XYZ/陀螺XYZ 自检要点：加计静止模长 ≈ 9.8 m/s²、四元数模长 ≈ 1、温度常温 20~40℃。 对外接口 函数 说明 ------------ 喂 1 字节，返回 1=完成一帧且 CRC 通过 按 Index(0~3) 只读获取 ID/统计/Δt统计 诊断计数 打印统计表+各包最新解析值+Δt行 CRC16 算法导出 终端原地刷新机制 打印块固定 行（表头2+统计表4+空行+解析表头+4包解析20行+Δt 3行）：终端模式（Tty=1）每秒打印后光标回退 31 行原位覆盖重绘，配合 起始+清行尾（ ）防止长行残留顶乱表格列；管道模式（Tty=0）退化为 5 秒全量打印，便于重定向留档。","content":"# 04 协议层模块 bsp_uart_protocol\n\n> 源码：[Code/bsp_uart_protocol.c](../Code/bsp_uart_protocol.c) / [Code/bsp_uart_protocol.h](../Code/bsp_uart_protocol.h)\n\n## 定位\n\n志翔 IMU 串口私有协议层：帧同步状态机 + CRC16 校验 + 帧级统计 + 数据包1/2/3/4 解析 + 设备时间戳Δt统计。纯函数+内部静态状态，与平台无关。\n\n## 帧格式与 CRC16\n\n```text\nAA 55 | CMD | ID | LEN_L LEN_H | DATA... | CRC_L CRC_H\n```\n\n- **LEN 为整帧长度**（帧头 6 字节 + 数据域 + CRC 2 字节），数据域长度 = LEN − 8，多字节字段小端（intel）\n- **CRC16**：初值 `0x3692`、多项式 `0x8408`（反向 LSBF），计算范围 = 帧头至数据域末字节（不含 CRC 本身）。`BspUartCrc16(pBuf, n)` 独立导出，AT/HEX 验证器同算法参考\n\n## 帧同步状态机（7 状态）\n\n```text\nWAIT_SYNC1(0xAA) → WAIT_SYNC2(0x55) → WAIT_CMD → WAIT_ID → WAIT_LEN_L → WAIT_LEN_H → PAYLOAD(整帧长-6字节)\n```\n\n- 逐字节喂入（`BspUartProtocolOnByte`），任一环节不符合即回退重同步（SYNC2 不符退回重找 0xAA）\n- 进入 PAYLOAD 前校验 LEN 合法性（`LEN-8` 是否落在数据域容量内），非法长度帧直接剔除\n- 帧收完后 CRC 校验：**只统计校验通过的帧**；坏帧/垃圾字节不影响后续帧同步（帧间夹噪声自动剔除）\n- 状态机同时累计 `FeedBytes`（喂入字节数）与 `CrcFail`（CRC 失败帧数）两个诊断计数\n\n## 帧级统计（与 CAN 分支字段对齐）\n\n每个报文 ID 独立维护 `UartFrameStat_S`：\n\n| 字段 | 含义 |\n|------|------|\n| Count | 累计帧数（CRC 通过） |\n| 平均Hz | (Count−1) ÷ (末帧时刻−首帧时刻)，全程平均 |\n| InstHz / WinStart / WinCount | 瞬时Hz：1 秒滑动窗口 |\n| LastIntMs / MinIntMs / MaxIntMs / SumInt | 帧间隔：当前/最小/最大/累计求平均 |\n\n统计对象：数据包1（0x0001，87 字节）/ 数据包2（0x0010，44）/ 数据包3（0x0013，105）/ 数据包4（0x0022，38），`UART_MSG_NUM=4`，ID→下标映射 `MsgIndex()`。\n\n**判读参考**：50Hz 推送 → 平均间隔 ≈ 20.0ms；最大ms 无大跳 → 流稳定无断流；最小 1ms 级毛刺/最大百万毫秒级跳变 → 设备侧丢帧或时间戳异常。\n\n## 设备时间戳Δt统计（数据包2/3/4）\n\n`UartTsDelta_S`：相邻帧设备 us 时间戳之差的 最新/平均/最小/最大/样本数。\n\n- 与 CAN 分支 0x091 同语义：**全样本无过滤**——时间戳回退、重置、乱序不丢弃，直接体现在极值（最小可能为负/接近 0，最大百万 ms 级），异常即证据，不做静默吞掉\n- `TsOffset(Id)` 按报文 ID 定位数据域内时间戳字段偏移，无时间戳的数据包1 不参与\n\n## 数据包解析（最新帧物理量）\n\n每包独立解析函数（`ParseData1/2/3/4`），小端逐字段取出，存入 `UartFrameStat_S.LastData` 对应结构：\n\n| 数据包 | ID | 数据域 | 内容 |\n|--------|----|--------|------|\n| 1 | 0x0001 | 87B | 频率/日期时间/加计XYZ+模长/陀螺XYZ+模长/温度/姿态RPY/四元数/磁场 |\n| 2 | 0x0010 | 44B | 时间戳us/加计XYZ/陀螺XYZ/姿态RPY |\n| 3 | 0x0013 | 105B | 数据包1 全集 + 时间戳us + PPS锁定与模式 + 预留 |\n| 4 | 0x0022 | 38B | 时间戳us/加计XYZ/陀螺XYZ |\n\n自检要点：加计静止模长 ≈ 9.8 m/s²、四元数模长 ≈ 1、温度常温 20~40℃。\n\n## 对外接口\n\n| 函数 | 说明 |\n|------|------|\n| `BspUartProtocolOnByte` | 喂 1 字节，返回 1=完成一帧且 CRC 通过 |\n| `BspUartProtocolGetMsgId/GetStat/GetTsDelta` | 按 Index(0~3) 只读获取 ID/统计/Δt统计 |\n| `BspUartProtocolGetCrcFail / GetFeedBytes` | 诊断计数 |\n| `BspUartProtocolPrintStat(ElapsedSec, Tty)` | 打印统计表+各包最新解析值+Δt行 |\n| `BspUartCrc16` | CRC16 算法导出 |\n\n## 终端原地刷新机制\n\n打印块固定 `UART_STAT_PRINT_LINES=31` 行（表头2+统计表4+空行+解析表头+4包解析20行+Δt 3行）：终端模式（Tty=1）每秒打印后光标回退 31 行原位覆盖重绘，配合 `\\r` 起始+清行尾（`\\033[K`）防止长行残留顶乱表格列；管道模式（Tty=0）退化为 5 秒全量打印，便于重定向留档。\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Doc/05-AT指令验证模块-bsp_at_test.md","title":"05-AT指令验证模块-bsp_at_test","relPath":"IMU/Linux-UartTestVerifDemo/Doc/05-AT指令验证模块-bsp_at_test.md","desc":"05 AT 指令验证模块 bspattest 源码：Code/bspattest.c / Code/bspattest.h 依据：源工程《用户协议》第 2 章 AT 指令表 定位 AT 指令逐条自动验证器：用例表驱动，逐条下发 → 按文档应答格式判定 → 汇总表输出。","created":"","updated":"","tags":[],"sizeKB":4.2,"_text":"05 AT 指令验证模块 bspattest 源码：Code/bspattest.c / Code/bspattest.h 依据：源工程《用户协议》第 2 章 AT 指令表 定位 AT 指令逐条自动验证器：用例表驱动，逐条下发 → 按文档应答格式判定 → 汇总表输出。入口 ，返回 0=全过 / 1=有失败 / -1=串口打开失败。当前共 40 条用例（模式 0 仅安全组 20 条；模式 1 加风险+异常 40 条）。 用例表结构 分组与覆盖（V1.7.0） 组别 内容 判定 副作用处理 ----------------------------- 安全组 17 条只读查询（ ）+ 开关成对 + 查询类按文档应答逐关键字匹配（如 、 ）且必须收到 ；动作类收到 即过 SET 成对执行后恢复原态 风险组 PPS 开关与模式、MSGID=13/22 推送开关、GRAPHRQ/ORIGRQ 频率、DATALINK 链路开关、ZEROBIASCAL 零偏校准、量程配置（SCALESET）、系统时间设置（TIMESET）、 复位 同上 成对/自动还原（见下） 有意排除 — 掉电保存且断链/改数据语义，自动流程不碰，建议手动单项 副作用安全设计 1. 成对紧邻还原： → ，验证即还原 2. 先查后设再还原： - TIMESET：先 查原时间 → 设测试时间 → 还原原时间（掉电不保存） - SCALESET：先 查原量程 → 设避让档（原值 16g 则设 8g）→ 写回原值 3. 复位置表末： 固定最后执行（断流数秒不影响前面用例） 4. 还原动作不计分，失败清单单列 混流容错（核心难点） 设备数据流（50Hz 文本/二进制推送帧）与 AT 应答共存同一串口，且可能字节级交织（曾致真机假 FAIL： +推送帧+ 关键字被打断、噪声假 提前截断缓冲）。接收路径三步处理： 1. 剔推送帧（ ）：缓冲内滑窗找 ，按帧结构（CMD/ID/LEN）整帧剔除，帧内可见字节不再污染应答文本 2. 过滤不可见字节：剔除后剩余字节转可打印字符入应答缓冲（ ） 3. 双条件完整判定（ ）：要求全部期望关键字齐备 + 其后有 才截断应答；假 （其前无关键字）自动跳过继续等真应答；超时 1200ms 时已有 OK 仍交上层按关键字判定 4. 原始应答片段原样打印（ /汇总表），便于人工复核 单条执行与输出 - 安静模式：每条指令一行（ ），结束后输出对齐汇总表（序号/指令/结果 PASS/FAIL/提取值）+ 失败清单 - 提取值（ ）：按期望关键字从应答中提取对应值（如版本号、波特率数值） - 名称列按 UTF-8 显示宽度补空格（中文按 2 列计），中英混排不错位 关键参数 常量 值 说明 ----------------- 1200 单条应答超时（数据流混流留余量） 1024 过滤后应答缓冲 64 用例上限 pty 冒烟：模式 0 与模式 1（构造假 OK + 推送帧打断关键字交织场景）40/40 PASS。","content":"# 05 AT 指令验证模块 bsp_at_test\n\n> 源码：[Code/bsp_at_test.c](../Code/bsp_at_test.c) / [Code/bsp_at_test.h](../Code/bsp_at_test.h)\n> 依据：源工程《用户协议》第 2 章 AT 指令表\n\n## 定位\n\nAT 指令逐条自动验证器：用例表驱动，逐条下发 → 按文档应答格式判定 → 汇总表输出。入口 `BspAtTestRun(pDev, Baud, RunRisk)`，返回 0=全过 / 1=有失败 / -1=串口打开失败。当前共 **40 条用例**（模式 0 仅安全组 20 条；模式 1 加风险+异常 40 条）。\n\n## 用例表结构\n\n```c\ntypedef struct {\n    char         Cmd[48];     /* 指令文本(可含%d占位, 运行时格式化) */\n    AtCaseType_E Type;        /* QUERY查询 / ACTION动作 / SCALESET量程设置 / TIMESET时间设置 */\n    AtGroup_E    Group;       /* SAFE安全组 / RISK风险组 */\n    const char  *pName;       /* 中文名(汇总表显示) */\n    const char  *pRestore;    /* 还原指令(NULL=无) */\n    const char  *pExpect;     /* 期望应答关键字(逗号分隔) */\n} AtCase_S;\n```\n\n## 分组与覆盖（V1.7.0）\n\n| 组别 | 内容 | 判定 | 副作用处理 |\n|------|------|------|-----------|\n| 安全组 | 17 条只读查询（`VERSION?/BAUD?/SET?/CONFIG/COORDINATE?/PPS?/PPSMODE?/PUSHFRQ?/SN?/DATATIME?/DATALINK?/GRAPHRQ?/ORIGRQ?/CANBAUD?/FLASHCFG/ACCSCALECFG?/GYROSCALECFG?`）+ `SET=OFF/ON` 开关成对 + `YAWRESET` | 查询类按文档应答**逐关键字匹配**（如 `AppVersion:`、`HardwareVersion:`）且必须收到 `OK`；动作类收到 `OK` 即过 | SET 成对执行后恢复原态 |\n| 风险组 | PPS 开关与模式、MSGID=13/22 推送开关、GRAPHRQ/ORIGRQ 频率、DATALINK 链路开关、ZEROBIASCAL 零偏校准、量程配置（SCALESET）、系统时间设置（TIMESET）、`AT+RST` 复位 | 同上 | **成对/自动还原**（见下） |\n| 有意排除 | `BAUD=/COORDINATE=/PUSHFRQ=/CANBAUD=` | — | 掉电保存且断链/改数据语义，自动流程不碰，建议手动单项 |\n\n## 副作用安全设计\n\n1. **成对紧邻还原**：`AT+PPS=ON` → `AT+PPS=OFF`，验证即还原\n2. **先查后设再还原**：\n   - TIMESET：先 `AT+DATATIME?` 查原时间 → 设测试时间 → 还原原时间（掉电不保存）\n   - SCALESET：先 `ACCSCALECFG?/GYROSCALECFG?` 查原量程 → 设避让档（原值 16g 则设 8g）→ 写回原值\n3. **复位置表末**：`AT+RST` 固定最后执行（断流数秒不影响前面用例）\n4. 还原动作不计分，失败清单单列\n\n## 混流容错（核心难点）\n\n设备数据流（50Hz 文本/二进制推送帧）与 AT 应答共存同一串口，且可能**字节级交织**（曾致真机假 FAIL：`AccScaleCf`+推送帧+`g:16` 关键字被打断、噪声假 `OK` 提前截断缓冲）。接收路径三步处理：\n\n```text\nAtPumpBytes(read收包) → AtFilterSliding(滑窗剔帧+转可见文本) → AtRecvResp(完整应答判定)\n```\n\n1. **剔推送帧**（`AtSkipPushFrame/AtTrySkipFrame`）：缓冲内滑窗找 `AA 55`，按帧结构（CMD/ID/LEN）整帧剔除，帧内可见字节不再污染应答文本\n2. **过滤不可见字节**：剔除后剩余字节转可打印字符入应答缓冲（`AtAppendVis`）\n3. **双条件完整判定**（`KeysAllBefore/KeyInBefore`）：要求**全部期望关键字齐备 + 其后有 `OK\\r\\n`** 才截断应答；假 `OK`（其前无关键字）自动跳过继续等真应答；超时 1200ms 时已有 OK 仍交上层按关键字判定\n4. 原始应答片段原样打印（`pNote`/汇总表），便于人工复核\n\n## 单条执行与输出\n\n- 安静模式：每条指令一行（`发送过程不刷屏`），结束后输出对齐汇总表（序号/指令/结果 PASS/FAIL/提取值）+ 失败清单\n- 提取值（`ExtractVals`）：按期望关键字从应答中提取对应值（如版本号、波特率数值）\n- 名称列按 **UTF-8 显示宽度**补空格（中文按 2 列计），中英混排不错位\n\n## 关键参数\n\n| 常量 | 值 | 说明 |\n|------|-----|------|\n| `AT_RESP_TIMEOUT_MS` | 1200 | 单条应答超时（数据流混流留余量） |\n| `AT_RESP_MAX` | 1024 | 过滤后应答缓冲 |\n| `AT_CASE_MAX` | 64 | 用例上限 |\n\n> pty 冒烟：模式 0 与模式 1（构造假 OK + 推送帧打断关键字交织场景）40/40 PASS。\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Doc/06-HEX协议验证模块-bsp_hex_test.md","title":"06-HEX协议验证模块-bsp_hex_test","relPath":"IMU/Linux-UartTestVerifDemo/Doc/06-HEX协议验证模块-bsp_hex_test.md","desc":"入口 ：Mode 0=仅安全组 / 1=+风险+异常组（32 条）/ 2=压力暴力模式。","created":"","updated":"","tags":[],"sizeKB":5.9,"_text":"06 HEX 协议验证模块 bsphextest 源码：Code/bsphextest.c / Code/bsphextest.h 依据：源工程《用户协议》第 3.2 章串口交互协议；固件行为权威 = 固件工程 （2026-10-21 逐 ID 核对） 定位 HEX 交互协议逐报文验证器：19 个报文 ID 常量（对应固件 ）全覆盖，用例表驱动 + 帧级收发 + 混流容错。入口 ：Mode 0=仅安全组 / 1=+风险+异常组（32 条）/ 2=压力暴力模式。 帧格式（与推送协议的差异） - Op： 查询 / 写 RAM（即时生效，掉电丢）/ 写 FLASH（掉电保存） - CRC16 与协议层同算法（初值 0x3692、多项式 0x8408 反向），此处独立实现保持工具自包含 - 帧字段命名访问宏 、 、 ，代码零魔法下标 用例分组（32 条 + 压力模式） 组别 内容 判定 还原策略 --------------------------- 安全组 13 个 ID 查询（0x0003版本/0x0004频率/0x0006算法模式/0x0007推送状态/0x0012PPS/0x0015坐标系/0x0016串口波特率/0x0017CAN波特率/0x0018SN/0x0022量程×2/0x0101A值/0x0103电量）+ 0x0021 YAW 归零（写 RAM 掉电不保存） 应答 CRC 过后按文档校验：数据域长度、值域白名单（频率档 0x01~0x09、坐标系 24 值表、波特率 7 值表、CAN 3 值表、SN 16 字节可打印、量程档位表），并提取关键值 查询结果同步缓存（频率档/算法模式/推送状态/PPS/坐标系），供风险组构造设置值与还原帧 风险组 写 RAM：0x0004 频率、0x0006 算法模式、0x0007 推送开关、0x0011 报文推送开关、0x0012 PPS、0x0015 坐标系、0x0020 零偏、0x0019 时间同步 应答 即过 动态成对还原：设置值避让原值（原 10Hz 则设 20Hz），过完立即用查询缓存构造还原帧下发（不计分）；0x0019 直接同步主机时间 异常组 ① 静默无应答 5 条：CRC 错帧/非法操作符/未知 ID 0x0023/Len 超限/0x0008 磁力计校准（固件 0x00 分发表未实现，真机实测静默）；② 无效应答 1 条：频率非法操作符 0x03（固件末尾无条件应答 DATA0=0）；③ ABNWQ 非法值写入→行为查询 3 条：频率非法档 0x0A 回落档5（50Hz）/坐标系 837 直写无校验/PPS 非法模式 5 归零 无应答类超时即 PASS；写查两步类先验写入应答再查询确认固件行为 ABNWQ 无条件还原（外层统一执行） 有意排除 0x0005 蓝牙名称写入（掉电保存无法还原）、0x0016/0x0017 波特率写入（FLASH-only 断链）、0x0022 量程写入（FLASH-only）、各 ID FLASH 档（Op=0x02） — 掉电保存/断链类不进自动流程 混流容错 - 滑窗取帧：接收缓冲滑窗搜帧头 → CMD/ID 匹配 → CRC 校验，推送报文（如 0x0001）与坏帧自动剔除 - 同 ID 混叠过滤：0x0022 量程与数据包4推送同 ID，按期望应答帧长（18 字节）过滤推送帧混叠 - 事务前清理：每次事务前 清串口残留 - 查询缓存无效时风险项自动 SKIP（避免无法还原） 0x0022 量程查询：文档≠固件的典型案例（V1.6.1~V1.6.4 定因过程） 1. 文档 3.2.3.17 只给设置发送表 → 按设置帧同构构造查询帧真机无应答 2. 改多格式自动探测：类型+预留8（CAN 0x115 查询映射）→ 类型1 → 设置帧同构，命中即标注 3. 仍无应答 → 宽容收包兜底（不限应答长度、跳过推送帧），档位白名单通过即标注 ，失败打印原始帧 hex 4. 查固件源码定因：查询分支只认 类型字节不校验长度（3 格式均可达），但应答 PayLoad=16/整帧 24 字节与文档回复表（10/18）不符——此前按 18 过滤把固件 24 字节应答吞掉造成假超时 5. 终局：固件改回 PayLoad=10 对齐文档；工具 18 直接命中 + 保留 24 宽容兜底兼容旧固件 方法论沉淀：文档缺失/不一致以固件为权威；期望帧长过滤要给\"宽容模式\"留后门，超时诊断要打印原始帧。 其他固件对照要点（逐 ID 核实） - 0x0014 复位仅 RAM 档（Op=0x01）应答并复位，固定放用例表末 - 0x0018 SN 应答按 倒序填充，工具原样显示 - 0x0004 查询按文档补 DATA 字节（查询时填 0）；0x0006 固件实际支持模式 1~5（文档仅列 4 种） - 固件 0xAA55 状态机（ ）无帧接收超时：截断帧后按声明 Len 持续等字节、吞掉后续合法帧内容（错位 2 字节需多次查询恢复）——固件可改进项（建议加帧间超时重置） 压力/暴力模式（功能3 第4参数=2） 项 内容 实测结果 ------------------- 无效应答静默 CRC 末字节翻转 + 未知 CMD 0x09 预期无应答 高频连发 200 帧不等应答连发 固件收 2 帧其余丢弃，不卡死 垃圾前缀重同步 随机 1~16 字节 + 合法版本查询 ×50 轮 50/50 恢复 截断帧恢复 帧只发一半（轮换停在 Len/CRC 域前）×10 轮 10/10 恢复 fuzz 随机帧轰炸 固定种子 0x3692 可复现，1000 帧 50% 伪造 AA55 轰炸后探活存活 安全设计：压力帧全程无持久副作用（CRC 错/未知 CMD 均被固件静默丢弃）；每项结束版本查询探活（3 次重试），失败自动发复位帧兜底重启再探活。 真机回归：模式 2 5/5 PASS；模式 1 全量 32/32 PASS（含 3 条 ABNWQ 还原一致）；pty 冒烟多场景 PASS。","content":"# 06 HEX 协议验证模块 bsp_hex_test\n\n> 源码：[Code/bsp_hex_test.c](../Code/bsp_hex_test.c) / [Code/bsp_hex_test.h](../Code/bsp_hex_test.h)\n> 依据：源工程《用户协议》第 3.2 章串口交互协议；固件行为权威 = 固件工程 `bsp_parse.c`（2026-10-21 逐 ID 核对）\n\n## 定位\n\nHEX 交互协议逐报文验证器：19 个报文 ID 常量（对应固件 `RECV_ID_xxx_E`）全覆盖，用例表驱动 + 帧级收发 + 混流容错。入口 `BspHexTestRun(pDev, Baud, Mode)`：Mode 0=仅安全组 / 1=+风险+异常组（32 条）/ 2=压力暴力模式。\n\n## 帧格式（与推送协议的差异）\n\n```text\n请求帧: AA 55 | CMD(ID高字节) | ID | Op | Len(2,小端,整帧长) | DATA | CRC16(2,小端)\n应答帧: AA 55 | CMD | ID | Len(2) | DATA | CRC16      ← 无 Op 字段\n```\n\n- Op：`0x00` 查询 / `0x01` 写 RAM（即时生效，掉电丢）/ `0x02` 写 FLASH（掉电保存）\n- CRC16 与协议层同算法（初值 0x3692、多项式 0x8408 反向），此处独立实现保持工具自包含\n- 帧字段命名访问宏 `HEX_FR_CMD/ID/LEN`、`HEX_RESP_DATA/DATALEN/DATA0`、`HEX_REQ_DATA`，代码零魔法下标\n\n## 用例分组（32 条 + 压力模式）\n\n| 组别 | 内容 | 判定 | 还原策略 |\n|------|------|------|---------|\n| 安全组 | 13 个 ID 查询（0x0003版本/0x0004频率/0x0006算法模式/0x0007推送状态/0x0012PPS/0x0015坐标系/0x0016串口波特率/0x0017CAN波特率/0x0018SN/0x0022量程×2/0x0101A值/0x0103电量）+ 0x0021 YAW 归零（写 RAM 掉电不保存） | 应答 CRC 过后按文档校验：数据域长度、**值域白名单**（频率档 0x01~0x09、坐标系 24 值表、波特率 7 值表、CAN 3 值表、SN 16 字节可打印、量程档位表），并提取关键值 | 查询结果**同步缓存**（频率档/算法模式/推送状态/PPS/坐标系），供风险组构造设置值与还原帧 |\n| 风险组 | 写 RAM：0x0004 频率、0x0006 算法模式、0x0007 推送开关、0x0011 报文推送开关、0x0012 PPS、0x0015 坐标系、0x0020 零偏、0x0019 时间同步 | 应答 `DATA[0]==0x00` 即过 | **动态成对还原**：设置值避让原值（原 10Hz 则设 20Hz），过完立即用查询缓存构造还原帧下发（不计分）；0x0019 直接同步主机时间 |\n| 异常组 | ① 静默无应答 5 条：CRC 错帧/非法操作符/未知 ID 0x0023/Len 超限/0x0008 磁力计校准（**固件 0x00 分发表未实现**，真机实测静默）；② 无效应答 1 条：频率非法操作符 0x03（固件末尾无条件应答 DATA[0]=0）；③ **ABN_WQ 非法值写入→行为查询** 3 条：频率非法档 0x0A 回落档5（50Hz）/坐标系 837 直写无校验/PPS 非法模式 5 归零 | 无应答类超时即 PASS；写查两步类先验写入应答再查询确认固件行为 | ABN_WQ 无条件还原（外层统一执行） |\n| 有意排除 | 0x0005 蓝牙名称写入（掉电保存无法还原）、0x0016/0x0017 波特率写入（FLASH-only 断链）、0x0022 量程写入（FLASH-only）、各 ID FLASH 档（Op=0x02） | — | 掉电保存/断链类不进自动流程 |\n\n## 混流容错\n\n- **滑窗取帧**：接收缓冲滑窗搜帧头 → CMD/ID 匹配 → CRC 校验，推送报文（如 0x0001）与坏帧自动剔除\n- **同 ID 混叠过滤**：0x0022 量程与数据包4推送同 ID，按期望应答帧长（18 字节）过滤推送帧混叠\n- **事务前清理**：每次事务前 `tcflush` 清串口残留\n- 查询缓存无效时风险项自动 SKIP（避免无法还原）\n\n## 0x0022 量程查询：文档≠固件的典型案例（V1.6.1~V1.6.4 定因过程）\n\n1. 文档 3.2.3.17 只给设置发送表 → 按设置帧同构构造查询帧真机无应答\n2. 改**多格式自动探测**：类型+预留8（CAN 0x115 查询映射）→ 类型1 → 设置帧同构，命中即标注 `[查询格式:xx]`\n3. 仍无应答 → **宽容收包**兜底（不限应答长度、跳过推送帧），档位白名单通过即标注 `[宽容:应答Len=n]`，失败打印原始帧 hex\n4. 查固件源码定因：查询分支只认 `DATA[0]` 类型字节不校验长度（3 格式均可达），但**应答 PayLoad=16/整帧 24 字节**与文档回复表（10/18）不符——此前按 18 过滤把固件 24 字节应答吞掉造成假超时\n5. 终局：固件改回 PayLoad=10 对齐文档；工具 18 直接命中 + 保留 24 宽容兜底兼容旧固件\n\n**方法论沉淀**：文档缺失/不一致以固件为权威；期望帧长过滤要给\"宽容模式\"留后门，超时诊断要打印原始帧。\n\n## 其他固件对照要点（逐 ID 核实）\n\n- 0x0014 复位仅 RAM 档（Op=0x01）应答并复位，固定放用例表末\n- 0x0018 SN 应答按 `SN[15]→SN[0]` 倒序填充，工具原样显示\n- 0x0004 查询按文档补 DATA 字节（查询时填 0）；0x0006 固件实际支持模式 1~5（文档仅列 4 种）\n- 固件 0xAA55 状态机（`HexCmdParse`）**无帧接收超时**：截断帧后按声明 Len 持续等字节、吞掉后续合法帧内容（错位 2 字节需多次查询恢复）——固件可改进项（建议加帧间超时重置）\n\n## 压力/暴力模式（功能3 第4参数=2）\n\n| 项 | 内容 | 实测结果 |\n|----|------|---------|\n| 无效应答静默 | CRC 末字节翻转 + 未知 CMD 0x09 | 预期无应答 |\n| 高频连发 | 200 帧不等应答连发 | 固件收 2 帧其余丢弃，不卡死 |\n| 垃圾前缀重同步 | 随机 1~16 字节 + 合法版本查询 ×50 轮 | 50/50 恢复 |\n| 截断帧恢复 | 帧只发一半（轮换停在 Len/CRC 域前）×10 轮 | 10/10 恢复 |\n| fuzz 随机帧轰炸 | 固定种子 0x3692 可复现，1000 帧 50% 伪造 AA55 | 轰炸后探活存活 |\n\n安全设计：压力帧全程无持久副作用（CRC 错/未知 CMD 均被固件静默丢弃）；每项结束版本查询探活（3 次重试），失败自动发复位帧兜底重启再探活。\n\n> 真机回归：模式 2 5/5 PASS；模式 1 全量 32/32 PASS（含 3 条 ABN_WQ 还原一致）；pty 冒烟多场景 PASS。\n"},{"hash":"IMU/Linux-UartTestVerifDemo/Doc/07-主入口与构建运行.md","title":"07-主入口与构建运行","relPath":"IMU/Linux-UartTestVerifDemo/Doc/07-主入口与构建运行.md","desc":"07 主入口与构建运行（main.c / run.sh） 源码：Code/main.c、Code/run.sh main.c 职责（V1.7.8） 统一入口：参数解析 + 功能分发 + 功能1 的线程管理与统计显示。","created":"","updated":"","tags":[],"sizeKB":4.0,"_text":"07 主入口与构建运行（main.c / run.sh） 源码：Code/main.c、Code/run.sh main.c 职责（V1.7.8） 统一入口：参数解析 + 功能分发 + 功能1 的线程管理与统计显示。当前版本 。 全局对象 对象 用途 ------------ （DrvSerialS） 串口控制块，默认 （UartQueueS） 字节流 SPSC 队列 （sigatomict） 运行标志，SIGINT/SIGTERM 置 0，线程据此退出 统计时长/最近收字节时刻/累计字节/累计 CRC 通过帧 关键函数拆分（≤30 行规范） 函数 职责 ------------ 位置参数解析：设备/波特率/功能/功能参数 分发：第3参数 2→ ，3→ ，其余→功能1 并按秒数处理（兼容旧 uartstat 用法） 功能1：串口+队列初始化、双线程启动、周期打印主循环、收尾汇总 接收线程单轮：阻塞读→入队，维护 RxBytes/LastRxSec 统计显示：单包行/间隔行/Δt行/收尾汇总 节流打印：终端 1 秒原地刷新（回退 31 行覆盖重绘），管道 5 秒全量 参数与用法 功能 参数 功能参数 示例 --------------------------- 1 数据流统计（默认） 非 2/3 视为秒数 0=直到 Ctrl-C 2 AT 指令验证 0=仅安全组（默认），1=+风险组 3 HEX 协议验证 0=仅安全组，1=+风险/异常组，2=压力模式 run.sh 一键脚本流程 构建命令（手动等价）： 排障经验（真机踩坑沉淀） 1. 统计/解析停滞、CRC 失败帧暴涨 → 先查串口抢占： 。曾因 30 分钟长跑的旧实例未退出，新实例 11s 仅收 2 帧、411 帧 CRC 失败——两实例同读会瓜分字节流，任何单实例都组不出完整帧（V1.1.1 定性） 2. \"最新帧解析\"数值不动 → 正常每秒都在变（时间戳走秒）；若完全冻结优先怀疑串口被抢占而非解析逻辑（本工具每帧无条件更新） 3. 队列丢弃字节 0 → 解析线程消费不及，正常应为 0 4. CRC 通过帧数 ≈ 接收字节数 ÷ 平均帧长 → 链路无误码的经验判据 版本史摘要（V1.0.0 → V1.7.8） 阶段 版本 里程碑 -------------------- 统计功能 V1.0.0~V1.2.1（10-15） 数据包1/2/3/4 统计解析 → Δt统计（全样本）→ 终端刷新修复 AT 验证 V1.3.0~V1.4.0（10-15/20） attest 创建（混流假FAIL/Ctrl-C 修复）→ 文档第2章全量覆盖 HEX 验证 V1.5.0~V1.5.2（10-20） hextest 18 ID 全覆盖（RAM 动态还原/有意排除体系） 单程序整合 V1.6.0（10-20） AT/HEX 并入统一入口 imutest，pty 冒烟全过 量程覆盖 V1.7.0~V1.7.9（10-21/22） 新增量程查询/设置 → 交织假FAIL 定因 → 0x0022 查询三格式探测+宽容兜底 → 固件对照定因修复 → 异常组 9 条 压力模式 V1.7.10（10-22） HEX 压力/暴力 5 项（fuzz/截断/重同步/连发/探活兜底）","content":"# 07 主入口与构建运行（main.c / run.sh）\n\n> 源码：[Code/main.c](../Code/main.c)、[Code/run.sh](../Code/run.sh)\n\n## main.c 职责（V1.7.8）\n\n统一入口：参数解析 + 功能分发 + 功能1 的线程管理与统计显示。当前版本 `G_Version = \"V1.7.8\"`。\n\n### 全局对象\n\n| 对象 | 用途 |\n|------|------|\n| `G_Serial`（DrvSerial_S） | 串口控制块，默认 `/dev/ttyUSB0 @921600` |\n| `G_Queue`（UartQueue_S） | 字节流 SPSC 队列 |\n| `G_Running`（sig_atomic_t） | 运行标志，SIGINT/SIGTERM 置 0，线程据此退出 |\n| `G_StartSec / G_LastRxSec / G_RxBytes / G_FrameOk` | 统计时长/最近收字节时刻/累计字节/累计 CRC 通过帧 |\n\n### 关键函数拆分（≤30 行规范）\n\n| 函数 | 职责 |\n|------|------|\n| `ParseSerialArgs` | 位置参数解析：设备/波特率/功能/功能参数 |\n| `DispatchFeature` | 分发：第3参数 2→`BspAtTestRun`，3→`BspHexTestRun`，其余→功能1 并按秒数处理（兼容旧 uart_stat 用法） |\n| `StatInit / StatStartThreads / StatRunLoop / StatFinish` | 功能1：串口+队列初始化、双线程启动、周期打印主循环、收尾汇总 |\n| `RecvOneRound / QueuePushBytes` | 接收线程单轮：阻塞读→入队，维护 RxBytes/LastRxSec |\n| `StatPrintOneMsg / StatPrintIntervals / StatPrintTsDelta / StatPrintSummary` | 统计显示：单包行/间隔行/Δt行/收尾汇总 |\n| `StatMaybePrint` | 节流打印：终端 1 秒原地刷新（回退 31 行覆盖重绘），管道 5 秒全量 |\n\n### 参数与用法\n\n`./imu_test [串口设备] [波特率] [功能] [功能参数]`\n\n| 功能 | 参数 | 功能参数 | 示例 |\n|------|------|---------|------|\n| 1 数据流统计（默认） | 非 2/3 视为秒数 | 0=直到 Ctrl-C | `./imu_test /dev/ttyUSB0 921600 10` |\n| 2 AT 指令验证 | `2` | 0=仅安全组（默认），1=+风险组 | `./imu_test /dev/ttyUSB0 921600 2 1` |\n| 3 HEX 协议验证 | `3` | 0=仅安全组，1=+风险/异常组，2=压力模式 | `./imu_test /dev/ttyUSB0 921600 3 0` |\n\n## run.sh 一键脚本流程\n\n```text\n帮助(-h) → 参数缺省填充 → gcc 编译单目标 imu_test(-O2 -Wall, -lpthread)\n→ 串口存在性检查(不存在则列出 /dev/ttyUSB* /dev/ttyACM*)\n→ 占用检查(lsof, 警告互抢串口) → 交互菜单(1统计/2AT/3HEX, 回车默认)\n→ 模式子菜单(2: 0/1; 3: 0/1/2) → exec imu_test 对应参数\n```\n\n构建命令（手动等价）：\n\n```bash\ngcc -O2 -Wall -o imu_test main.c drv_serial.c bsp_uart_queue.c \\\n    bsp_uart_protocol.c bsp_at_test.c bsp_hex_test.c -lpthread\n```\n\n## 排障经验（真机踩坑沉淀）\n\n1. **统计/解析停滞、CRC 失败帧暴涨** → 先查串口抢占：`lsof /dev/ttyUSB0`。曾因 30 分钟长跑的旧实例未退出，新实例 11s 仅收 2 帧、411 帧 CRC 失败——**两实例同读会瓜分字节流，任何单实例都组不出完整帧**（V1.1.1 定性）\n2. **\"最新帧解析\"数值不动** → 正常每秒都在变（时间戳走秒）；若完全冻结优先怀疑串口被抢占而非解析逻辑（本工具每帧无条件更新）\n3. **队列丢弃字节 > 0** → 解析线程消费不及，正常应为 0\n4. **CRC 通过帧数 ≈ 接收字节数 ÷ 平均帧长** → 链路无误码的经验判据\n\n## 版本史摘要（V1.0.0 → V1.7.8）\n\n| 阶段 | 版本 | 里程碑 |\n|------|------|--------|\n| 统计功能 | V1.0.0~V1.2.1（10-15） | 数据包1/2/3/4 统计解析 → Δt统计（全样本）→ 终端刷新修复 |\n| AT 验证 | V1.3.0~V1.4.0（10-15/20） | at_test 创建（混流假FAIL/Ctrl-C 修复）→ 文档第2章全量覆盖 |\n| HEX 验证 | V1.5.0~V1.5.2（10-20） | hex_test 18 ID 全覆盖（RAM 动态还原/有意排除体系） |\n| 单程序整合 | V1.6.0（10-20） | AT/HEX 并入统一入口 imu_test，pty 冒烟全过 |\n| 量程覆盖 | V1.7.0~V1.7.9（10-21/22） | 新增量程查询/设置 → 交织假FAIL 定因 → 0x0022 查询三格式探测+宽容兜底 → 固件对照定因修复 → 异常组 9 条 |\n| 压力模式 | V1.7.10（10-22） | HEX 压力/暴力 5 项（fuzz/截断/重同步/连发/探活兜底） |\n"}],"bytes":92569.59999999999},{"id":"qt","name":"QT-Tools","dir":"QT-Tools/","icon":"🖥","color":"#e2a03f","desc":"志翔 IMU 上位机（Qt 6 / QML）：Hex 指令、蓝牙、波形与页面性能优化、协议开发规范","docs":[{"hash":"QT-Tools/Readme.md","title":"Readme","relPath":"QT-Tools/Readme.md","desc":"QT-Tools / CommTools 上位机 志翔 IMU 上位机（Qt 6 / QML），串口调试 + Hex 指令 + 3D 姿态 + 固件升级一体工具。","created":"","updated":"","tags":[],"sizeKB":4.8,"_text":"QT-Tools / CommTools 上位机 志翔 IMU 上位机（Qt 6 / QML），串口调试 + Hex 指令 + 3D 姿态 + 固件升级一体工具。 仓库与渠道 项 值 -------- 工程主仓 （develop 分支） bsp 子模块 （Code/CommTools/bsp） 本机路径 （2026-10-10 20 时起；历史位置 已迁） gitee 操作 每条命令带 绕过死代理 GitHub 知识库 本仓库（KnowledgeBase），SSH 推送 本机构建（Qt 6.11.1 MSVC + jom，2026-10-10 20:00 验证通过） 工程现位于 ，Qt Creator 配置为 （NMake Makefiles JOM）。 根目录 build.bat 引用的 与 均已不存在，勿直接使用。 旧 MinGW 6.9.3 方案（E: 路径时期，历史保留）：Qt 仅 mingw64 kit 于 D:\\Qt\\6.9.3， CMake -G Ninja -B build\\cli-Debug，全量 70 步约 1 分钟。 源码结构（与本知识相关部分） - — Hex 指令注册（initCommandGroups）/ 发送构建（buildPayload）/ 回复解析（handleReceivedData） - — 协议结构体（HexS 系列， ） - — CRC16：init=0x3692、poly=0x8408（LSB-first） - — XCOM 风格调试页 - — 协议唯一事实来源； — 开发规范 记录索引 - 2026-10-10 HexCommands 实现核对与修复报告 — 17 条指令全量核对、5 处修复、COM8 实测证据 - 2026-10-10 XCOM 功能对照报告 — DebugPage vs ATK-XCOM - 2026-10-10 波形页优化报告 — 卡顿三根因、Y轴自适应、鼠标缩放/平移查看（X轴§11 / Y轴§13）、滚轮无效根因§14（qmlcachegen 编译下 MouseArea.onWheel 失效，改用 WheelHandler）、数据入口过滤根因(§12)、自测钩子与实测数据 - 2026-10-10 蓝牙功能实现 — Windows 原生双栈(WinRT AEP 扫描+Winsock SPP 免配对直连，Qt Bluetooth 缺失且 Windows 不支持经典 SPP)、cppwinrt 踩坑(/permissive-/experimental-coroutine/runtimeobject)、--btscan 实测 20s 扫到 12 台 - 2026-10-15 页面切换卡顿优化报告 — 第三轮 B7：调试页日志/字节计数 500ms→100ms（10Hz XCOM 级跟手）+ 串口枚举异步化 refreshSerialPortsAsync（根除串口/蓝牙面板快速切换卡顿，Windows 同步枚举阻塞 UI 10-100ms）；COM3@921600 页 0 真实数据验证 - 2026-10-15 页面切换卡顿优化报告 — 两轮共 5 批次：P0（QList<double/seq 增量日志/perfLog 门控/RelWithDebInfo）+ P1/P2（页面 3-6 Loader 延迟加载、波形 C++ 侧供数 fillChart 彻底消灭数组转换与 Qt.po
