<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库</title>
<style>
:root{
  --bg:#0f1117; --bg2:#161a23; --bg3:#1d222e; --border:#2a3040;
  --fg:#d8dee9; --fg-dim:#8b93a5; --fg-faint:#5c6478;
  --accent:#4f8cff; --accent2:#7aa5ff; --green:#3fb27f; --orange:#e2a03f; --red:#e05c5c;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;line-height:1.65}
::selection{background:rgba(79,140,255,.35)}

/* ===== topbar ===== */
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(15,17,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:100}
#topbar .logo{font-weight:700;font-size:1.05rem;letter-spacing:.5px;white-space:nowrap}
#topbar .logo .em{color:var(--accent)}
#searchbox{flex:1;max-width:560px;position:relative}
#searchbox input{width:100%;height:34px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:0 12px 0 34px;font-size:.9rem;outline:none;transition:border .15s}
#searchbox input:focus{border-color:var(--accent)}
#searchbox .icon{position:absolute;left:11px;top:8px;color:var(--fg-faint);pointer-events:none}
#searchclear{position:absolute;right:8px;top:8px;width:20px;height:20px;border:none;background:none;color:var(--fg-dim);cursor:pointer;display:none;font-size:1rem}
#topbar .meta{margin-left:auto;font-size:.75rem;color:var(--fg-dim);white-space:nowrap;text-align:right}
#topbar .meta b{color:var(--green);font-weight:600}

/* ===== layout ===== */
#layout{display:flex;padding-top:52px;height:100vh}
#sidebar{width:290px;min-width:290px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;height:calc(100vh - 52px);position:sticky;top:52px}
#main{flex:1;min-width:0;overflow-y:auto;height:calc(100vh - 52px);scroll-behavior:smooth}

/* ===== sidebar ===== */
#nav{padding:14px 12px 30px}
.nav-sec{margin-bottom:6px}
.nav-sec-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none;transition:background .12s}
.nav-sec-head:hover{background:var(--bg3)}
.nav-sec-head .ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.nav-sec-head .name{font-weight:600;font-size:.92rem}
.nav-sec-head .cnt{margin-left:auto;font-size:.72rem;color:var(--fg-dim);background:var(--bg3);border-radius:10px;padding:1px 8px}
.nav-sec-head .arrow{margin-left:6px;color:var(--fg-faint);font-size:.7rem;transition:transform .18s}
.nav-sec.open .nav-sec-head .arrow{transform:rotate(90deg)}
.nav-items{display:none;padding:2px 0 6px}
.nav-sec.open .nav-items{display:block}
.nav-item{display:block;padding:6px 12px 6px 44px;font-size:.87rem;color:var(--fg-dim);text-decoration:none;border-radius:7px;margin:1px 4px;cursor:pointer;transition:all .12s;line-height:1.45}
.nav-item:hover{color:var(--fg);background:var(--bg3)}
.nav-item.active{color:var(--accent2);background:rgba(79,140,255,.12)}
.nav-item .sub{display:block;font-size:.72rem;color:var(--fg-faint);margin-top:1px}
#nav .empty-sec{padding:2px 12px 6px 44px;font-size:.8rem;color:var(--fg-faint);font-style:italic}
.nav-recent{margin:14px 4px 0;padding-top:12px;border-top:1px dashed var(--border)}
.nav-recent .h{font-size:.75rem;color:var(--fg-faint);padding:0 10px 6px;letter-spacing:.5px}
.commit-item{padding:6px 10px;border-radius:7px;font-size:.78rem;color:var(--fg-dim);cursor:default}
.commit-item:hover{background:var(--bg3)}
.commit-item .cm{color:var(--fg);display:block;line-height:1.4;margin-bottom:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.commit-item .cd{font-size:.7rem;color:var(--fg-faint)}
.commit-item .cd b{color:var(--green);font-weight:600}

/* ===== article ===== */
#article{max-width:920px;margin:0 auto;padding:36px 48px 80px}
#crumbs{font-size:.8rem;color:var(--fg-faint);margin-bottom:18px}
#crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
#crumbs a:hover{text-decoration:underline}
.md h1{font-size:1.75rem;line-height:1.3;margin:0 0 8px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.md h2{font-size:1.35rem;margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.md h3{font-size:1.13rem;margin:26px 0 10px}
.md h4{font-size:1rem;margin:20px 0 8px}
.md p{margin:10px 0}
.md a{color:var(--accent2)}
.md ul,.md ol{padding-left:26px;margin:10px 0}
.md li{margin:4px 0}
.md blockquote{border-left:3px solid var(--accent);background:rgba(79,140,255,.07);padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0;color:var(--fg-dim)}
.md blockquote p{margin:4px 0}
.md code{font-family:var(--mono);font-size:.85em;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.md pre{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:14px 0;line-height:1.55}
.md pre code{background:none;border:none;padding:0;font-size:.83rem}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:.88rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:7px 12px;text-align:left;vertical-align:top}
.md th{background:var(--bg3);font-weight:600;white-space:nowrap}
.md tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.md hr{border:none;border-top:1px solid var(--border);margin:26px 0}
.md img{max-width:100%;border-radius:8px}
.md input[type=checkbox]{margin-right:6px}

/* code copy button */
.codewrap{position:relative}
.copybtn{position:absolute;top:8px;right:8px;background:var(--bg3);border:1px solid var(--border);color:var(--fg-dim);border-radius:6px;font-size:.72rem;padding:3px 10px;cursor:pointer;opacity:0;transition:opacity .15s}
.codewrap:hover .copybtn{opacity:1}
.copybtn:hover{color:var(--fg);border-color:var(--accent)}
.copybtn.ok{color:var(--green);border-color:var(--green)}

/* front-matter chips */
#fmchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.chip{font-size:.74rem;border:1px solid var(--border);background:var(--bg2);border-radius:20px;padding:2px 12px;color:var(--fg-dim)}
.chip.tag{color:var(--accent2);border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.08);cursor:pointer}
.chip.tag:hover{background:rgba(79,140,255,.18)}

/* ===== TOC ===== */
#toc{position:fixed;right:16px;top:110px;width:210px;font-size:.76rem;max-height:calc(100vh - 160px);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s}
#toc.show{opacity:1;pointer-events:auto}
#toc .h{color:var(--fg-faint);letter-spacing:1px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}
#toc a{display:block;color:var(--fg-dim);text-decoration:none;padding:3px 0 3px 8px;border-left:2px solid transparent;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc a:hover{color:var(--fg)}
#toc a.lv2{padding-left:16px}
#toc a.lv3{padding-left:26px;font-size:.72rem}
#toc a.on{color:var(--accent2);border-left-color:var(--accent)}
@media(max-width:1450px){#toc{display:none}}

/* ===== welcome ===== */
#welcome{max-width:920px;margin:0 auto;padding:46px 48px 80px}
#welcome h1{font-size:1.9rem;margin-bottom:6px}
#welcome .sub{color:var(--fg-dim);margin-bottom:30px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0 34px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.stat .n{font-size:1.7rem;font-weight:700;color:var(--accent2)}
.stat .l{font-size:.78rem;color:var(--fg-dim);margin-top:2px}
.wsec{margin-bottom:30px}
.wsec h2{font-size:1.2rem;margin-bottom:12px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.kcard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .15s}
.kcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.kcard .t{font-weight:600;font-size:.95rem;margin-bottom:4px;color:var(--fg)}
.kcard .d{font-size:.8rem;color:var(--fg-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard .m{font-size:.72rem;color:var(--fg-faint);margin-top:8px}
.kcard .m b{color:var(--orange);font-weight:600}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.tagcloud .chip{cursor:pointer}

/* ===== search highlight ===== */
mark.sr{background:rgba(226,160,63,.45);color:inherit;border-radius:3px;padding:0 2px}

/* ===== mobile ===== */
#burger{display:none}
#mask{display:none}
@media(max-width:900px){
  #burger{display:block;background:none;border:1px solid var(--border);color:var(--fg);border-radius:8px;width:36px;height:36px;font-size:1.1rem;cursor:pointer}
  #sidebar{position:fixed;left:0;top:52px;bottom:0;z-index:150;transform:translateX(-105%);transition:transform .22s;height:auto}
  #sidebar.open{transform:translateX(0)}
  #mask.show{display:block;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.5);z-index:140}
  #article,#welcome{padding:26px 20px 70px}
  #topbar .meta{display:none}
}
</style>
</head>
<body>

<div id="topbar">
  <button id="burger" title="目录">☰</button>
  <div class="logo"><span class="em">◆</span> 个人知识库</div>
  <div id="searchbox">
    <span class="icon">🔍</span>
    <input id="search" type="search" placeholder="搜索标题与全文内容…  (Ctrl+K)" autocomplete="off">
    <button id="searchclear" title="清空">✕</button>
  </div>
  <div class="meta">仓库：<b>YYM642443594/KnowledgeBase</b> · develop<br>同步：<b>2026-10-26</b> @ <span id="headsha">78c8f60a</span></div>
</div>

<div id="layout">
  <div id="sidebar"><nav id="nav"></nav></div>
  <div id="mask"></div>
  <main id="main">
    <div id="welcome"></div>
    <article id="article" style="display:none">
      <div id="crumbs"></div>
      <div id="fmchips"></div>
      <div id="content" class="md"></div>
    </article>
  </main>
</div>

<nav id="toc"><div class="h">本页目录</div><div id="toclist"></div></nav>

-32-CAM 踩坑 19（V1.3.0.3）；ESP-8266 退避 4s→16s→64s→256s 封顶 300s NAPT 借道上网 STA 联网即开 NAPT（ + ），断开自动关；单射频预期 10~20Mbps ESP-32 / ESP-32-CAM halwifi WS 网页终端 :81 端口二进制通道广播串口数据；慢客户端处理：ESP-32 登记表+合批缓冲（30ms 合帧），ESP-8266 心跳剔除僵尸+逐客户端发送 ESP-32 bspweb；ESP-8266 V1.0.5.19 补丁 阻塞 connect 卡主循环 建链前置校验（凭据/NTP 门控）+ 非阻塞退避，DNS/TCP 同步阻塞会冻结轮询数秒 ESP-8266 V1.0.2.7 / V1.0.5.1；ESP-32 转发用非阻塞 connect+select Mesh/多 AP 同名 STA 钉住 BSSID+信道免扫描重连（扫描期间 SoftAP 停发信标），8 次失败解锁重扫 ESP-32-CAM 踩坑 26（V1.3.0.6） 烧录口纪律 Linux YYM 机：ESP32-CAM=/dev/ttyUSB1、ESP8266=/dev/ttyUSB0，均 115200（460800 失联）；烧录前后检查 serialsim.py 存活 ESP-32-CAM 硬件表/踩坑 22 归档规则 1. 文档按所属固件工程（芯片平台）归档入对应目录；同平台新报告入该目录，并在本索引「文档索引」表登记 2. 跨平台通用经验不单独建目录，沉淀到本索引「跨平台知识链」区并链接原始文档 3. 文档内引用其它平台文档一律用相对链接（如 ），不写旧顶层目录路径","content":"# ESP 知识库\n\n> 2026-10-26 重组：原三个顶层目录 ESP-32、ESP-32-CAM、ESP-8266 收纳至本知识库，**按芯片平台划分目录**（一个平台目录 = 一个固件工程），与 IMU 知识库同一组织方式。各平台固件版本、硬件占用、验证手册、踩坑记录见对应目录 Readme。\n\n## 平台目录与工程映射\n\n| 目录（芯片平台） | 固件工程 | 主控 | SDK/框架 | 代码仓 / 分支 |\n|------------------|----------|------|----------|---------------|\n| [ESP-32/](ESP-32/) | 串口 ↔ WiFi/蓝牙透传 + 网页终端（配网/串口终端/转发三标签） | ESP32-WROOM-32（ESP32-D0WDQ6，双核 LX6 @ 240MHz，4MB Flash） | ESP-IDF v6.1 | gitee `ESP.git` develop 分支 |\n| [ESP-32-CAM/](ESP-32-CAM/) | 网页视频监控（OV3660 + SD 录像 + 人体检测 + 邮件推送 + 场景联动） | AI-Thinker ESP32-CAM（实测 OV3660，4MB Flash / 8MB PSRAM） | ESP-IDF v6.1 + esp32-camera 2.1.8 | gitee `ESP.git` feature/ESP32-Camer 分支（Linux 本地副本 `/home/yym/sda1/ESP`） |\n| [ESP-8266/](ESP-8266/) | ESP8266-XCOM 串口 WiFi 透传器（五云平台桥 + GPIO 控制 + 防克隆绑定） | ESP8266（NodeMCU v2，板载 CH340） | PlatformIO + Arduino | ESP8266 仓库（远程经 SSH 别名 `git@github-esp8266`） |\n\n> 两个 ESP32 工程同一代码仓不同分支：develop = 串口透传，feature/ESP32-Camer = 摄像头监控。新工程 = 新芯片平台时登记本表并新建同名目录；同平台新功能更新对应目录 Readme，不新建目录。\n\n## 目录结构\n\n```text\nESP/\n├── Readme.md      ← 本索引（工程映射、文档索引、跨平台知识链、归档规则）\n├── ESP-32/        ← 串口透传工程（ESP-IDF，APP→BSP→DRV→HAL→ESP-IDF 四层）\n│   ├── Readme.md\n│   ├── Project_Level_Skill.md   ← ESP-IDF 版架构规范\n│   ├── 一键烧录.bat\n│   └── Doc/                     ← 参考实现（drv_key 按键状态机源码）\n├── ESP-32-CAM/    ← 视频监控工程（ESP-IDF）\n│   └── Readme.md\n└── ESP-8266/      ← XCOM 透传工程（Arduino，main→APP→BSP→HAL→Arduino）\n    ├── Readme.md\n    ├── Project_Level_Skill.md   ← Arduino 版架构规范\n    └── Cloud_Protocol.md        ← 五云平台协议细节\n```\n\n> ESP-32 与 ESP-8266 的 Project_Level_Skill.md 因框架不同（ESP-IDF vs Arduino）内容不同，各自保留在平台目录内。\n\n## 文档索引\n\n| 平台目录 | 文档 | 主题 |\n|----------|------|------|\n| ESP-32 | [Readme.md](ESP-32/Readme.md) | 全模块 HAL/BSP/APP 功能记录、硬件资源表、8 条数据通路、回显/按键/配网/蓝牙/NAT/转发验证手册、MCU 移植提示 |\n| ESP-32 | [Project_Level_Skill.md](ESP-32/Project_Level_Skill.md) | ESP-IDF 四层架构规范（命名/裁剪开关/分层依赖/移植规则） |\n| ESP-32-CAM | [Readme.md](ESP-32-CAM/Readme.md) | 摄像头监控全记录（hal_cam/SD 录像/检测/邮件/场景联动）+ 31 条踩坑 + 遗留 Bug 表 + 版本历史 |\n| ESP-8266 | [Readme.md](ESP-8266/Readme.md) | XCOM 全记录（透传/转发/五云桥/GPIO 闹钟/防克隆）+ 7 条数据通路 + 踩坑表 + 版本修改史 |\n| ESP-8266 | [Project_Level_Skill.md](ESP-8266/Project_Level_Skill.md) | Arduino 单仓分层规范（形态B：HAL 在 01.HAL/，BSP/APP 在 modules/） |\n| ESP-8266 | [Cloud_Protocol.md](ESP-8266/Cloud_Protocol.md) | 阿里/OneNET/巴法/腾讯/华为五云平台指令表、签名格式、主题语义 |\n\n## 跨平台知识链（三工程共通谱系）\n\n```text\n[ESP-8266] ESP8266-develop 工程（配网门户+WS 终端+转发雏形）\n      │  网页谱系移植\n      ├────────────▶ [ESP-32] bsp_web 三标签门户（配网/串口终端/转发）\n      │                      │ 同栈移植 + 摄像头扩展\n      │                      ▼\n      │              [ESP-32-CAM] 四标签门户（配网/视频监控/GPIO 控制/存储）\n      └────────────▶ [ESP-8266] XCOM 五标签门户（+物联网平台/GPIO 控制）\n```\n\n| 共通主题 | 结论 | 出处 |\n|----------|------|------|\n| 配网模型 | SoftAP `ESP32_Config`/192.168.4.1 常开 + NVS 持久化凭据 + 断线自动重连 | ESP-32 / ESP-32-CAM hal_wifi；ESP-8266 AP 常开 |\n| 断线重连策略 | 按原因分类：瞬时类（NO_AP_FOUND/信标丢失）无限退避重连；认证类（密码错）限次防死循环 | ESP-32-CAM 踩坑 19（V1.3.0.3）；ESP-8266 退避 4s→16s→64s→256s 封顶 300s |\n| NAPT 借道上网 | STA 联网即开 NAPT（`LWIP_IP_FORWARD`+`LWIP_IPV4_NAPT`），断开自动关；单射频预期 10~20Mbps | ESP-32 / ESP-32-CAM hal_wifi |\n| WS 网页终端 | :81 端口二进制通道广播串口数据；慢客户端处理：ESP-32 登记表+合批缓冲（30ms 合帧），ESP-8266 心跳剔除僵尸+逐客户端发送 | ESP-32 bsp_web；ESP-8266 V1.0.5.19 补丁 |\n| 阻塞 connect 卡主循环 | 建链前置校验（凭据/NTP 门控）+ 非阻塞退避，DNS/TCP 同步阻塞会冻结轮询数秒 | ESP-8266 V1.0.2.7 / V1.0.5.1；ESP-32 转发用非阻塞 connect+select |\n| Mesh/多 AP 同名 | STA 钉住 BSSID+信道免扫描重连（扫描期间 SoftAP 停发信标），8 次失败解锁重扫 | ESP-32-CAM 踩坑 26（V1.3.0.6） |\n| 烧录口纪律 | Linux YYM 机：ESP32-CAM=/dev/ttyUSB1、ESP8266=/dev/ttyUSB0，均 115200（460800 失联）；烧录前后检查 serial_sim.py 存活 | ESP-32-CAM 硬件表/踩坑 22 |\n\n## 归档规则\n\n1. 文档按**所属固件工程（芯片平台）**归档入对应目录；同平台新报告入该目录，并在本索引「文档索引」表登记\n2. 跨平台通用经验不单独建目录，沉淀到本索引「跨平台知识链」区并链接原始文档\n3. 文档内引用其它平台文档一律用相对链接（如 `../ESP-32/Readme.md`），不写旧顶层目录路径\n"},{"hash":"ESP/ESP-32/Project_Level_Skill.md","title":"Project_Level_Skill","relPath":"ESP/ESP-32/Project_Level_Skill.md","desc":"嵌入式项目架构规范（跨仓库形态 · 通用模板） TOC 0. 使用说明 本文档为跨工程通用模板，可直接复制到任意 MCU 工程根目录使用，无需任何修改。","created":"","updated":"","tags":[],"sizeKB":20.9,"_text":"嵌入式项目架构规范（跨仓库形态 · 通用模板） TOC 0. 使用说明 本文档为跨工程通用模板，可直接复制到任意 MCU 工程根目录使用，无需任何修改。 正文统一使用占位符引用工程参数，使用时按当前工程实际结构对应取值。 0.1 仓库形态 二选一，两种形态共用本文档全部规范，仅代码物理位置与版本管理方式不同： 形态 结构 的含义 ------------------------------ 形态A：主仓库 + 子仓库 HAL 在主仓库，DRV/BSP/APP 在独立 Git 仓库 Git Submodule（第 10 章适用） 形态B：单仓库 HAL 与 DRV/BSP/APP 在同一仓库 主仓库内普通模块目录（第 10 章不适用） 形态B 下，正文中的 （含\"子仓库\"一词及 ）统一读作该模块目录及其 Readme，其余规则一字不改。 0.2 标注约定 - 占位符（如 、 、 、 ）：正文通用规则一律使用占位符，禁止写死工程名，各工程按实际值对应 - 固定目录名（如 ）：为保持跨工程统一而约定的固定名称，各工程必须使用同名目录，不得改名，因此正文直接写出、不作参数化 - （示例）：纯说明性举例，不构成对当前工程的约束 --- 1. 适用范围 适用于基于官方外设驱动库的 C 语言嵌入式项目，使用 Git 管理，支持主仓库 + 子仓库与单仓库两种形态（见第 0.1 节）。 核心目标：HAL 作为主仓库与上层模块的硬件抽象边界，DRV/BSP/APP 与具体 MCU 隔离，实现跨产品代码最大程度复用。 --- 2. 总体架构 软件依赖（严格单向）： 层级 职责 一句话 -------------------- HAL MCU 硬件抽象 MCU 怎么操作 DRV 具体芯片/器件驱动 芯片怎么操作 BSP 当前产品硬件封装 硬件怎么组织 APP 产品业务逻辑 功能怎么实现 --- 3. 命名规范 3.1 文件名前缀（区分层级） 层级 文件前缀 示例 ---------------------- HAL DRV BSP APP 公共 (层级无关配置头, 各层均可包含) 3.2 接口名前缀（CamelCase） 层级 接口前缀 示例 ---------------------- HAL DRV BSP APP 3.3 变量命名 变量类型 命名规则 示例 -------------------------- 全局变量（含 static 文件级变量） + PascalCase 、 局部变量 PascalCase（大驼峰） 、 结构体类型 PascalCase + 结构体指针类型 + PascalCase + 结构体变量 PascalCase 结构体指针变量 + PascalCase 枚举类型 PascalCase + 枚举成员 + UPPERSNAKECASE 、 结构体 typedef 必须同时定义类型和指针类型： 枚举定义示例： 3.4 规则 - 文件名：全小写 + 层级前缀，如 - 函数名：CamelCase + 层级前缀，如 - 全局变量必须以 开头，如 ；static 文件级变量同样以 开头（不区分是否 static） - 结构体类型以 结尾，枚举类型以 结尾 - 指针类型加 前缀，如 - 文件名和接口名必须同时体现层级 3.5 函数注释规范（Doxygen） 子仓库中所有函数（含 内部函数）的定义上方必须有 Doxygen 风格中文注释块，格式统一： 3.5.1 标签必填规则 标签 必填条件 内容要求 -------------------------- 所有函数必填 一句话说明\"做什么\"；禁止写\"无\"/\"略\" 有参数的函数必填 逐参数一行，写明取值范围、单位或格式（如 、 ） 非 函数必填 写明各返回值含义（如 、 ）； 函数省略本行 存在下表任一场景时必填 无注意事项的简单函数可省 3.5.2 必填场景 场景 注释示例 ---------------- 阻塞/耗时 、 超时与重试 调用前置条件 、 调用周期/上下文 、 缓冲区限制 、 副作用 仅写显存类 引脚/资源风险 3.5.3 检查方法 逐文件扫描 中每个函数定义（正则 定位），向上回溯确认紧邻的注释块： 1. 缺 注释块 → 判定缺函数说明 2. 有注释块但缺 或内容敷衍（\"无\"/\"略\"）→ 判定说明不合格 3. 函数命中 3.5.2 任一场景但缺 → 判定缺注意事项 4. 有参数但缺 、非 但缺 → 判定参数/返回值未标注 输出格式： 清单，全部修复后方可通过 Code Review。 3.6 函数实现长度规范 单个函数的功能实现尽量控制在 10~20 行（不含注释与空行），太长会影响阅读与维护。 - 超过 20 行时，优先按功能拆分为职责单一的子函数（如状态机各分支、初始化/收发/保活各环节独立成函数） - 拆分后每个子函数同样遵循本规范；查表、长 分发等结构性代码可适当放宽 - 拆分收益：主流程一眼可读，子函数可独立测试与复用 检查方法：扫描各函数 与配对 之间的有效代码行数，超过 20 行的函数列出清单逐个评估；确无拆分边界的，在函数注释 中说明保留原因。 --- 4. 目录设计 4.1 子仓库统一 inc/src 结构 子仓库内部不按软件层级建目录，统一使用 + ，通过文件名前缀区分层级。 禁止： 正确： 4.2 为什么用 inc/src 而非分层目录 1. 目录结构简单，模块增加不产生目录膨胀 2. 文件名前缀已能明确层级 3. IDE 工程直接配置 + 即可 4. 搜索 / / 可快速定位同层所有文件 --- 5. 各层职责 HAL（主仓库） 负责：GPIO、UART、I2C、SPI、CAN、ADC、PWM、TIMER、DMA、EXTI、FLASH、RTC、NVIC、SysTick 等 MCU 外设。 不负责：传感器业务、产品逻辑、协议解析、状态机。 HAL 是主仓库与 的接口边界，上层模块只依赖 HAL 抽象接口，不依赖具体 MCU 型号。 DRV 负责：具体芯片初始化、寄存器配置、通信、原始数据读取与转换。 例如： 、 、 、 、 （示例） DRV 只能通过 HAL 访问 MCU 硬件，禁止直接操作寄存器或外设指针。 BSP 负责：当前产品硬件资源与 DRV 之间的组合、封装和适配。 例如： （调用 ）、 （调用 ）（示例） APP 负责：产品功能、状态机、数据处理、故障处理、通信等业务逻辑。 APP 通过 BSP 访问硬件，不直接调用 DRV 或 HAL。 --- 6. 依赖规则 6.1 调用链示例 --- 7. 新增代码层级判断 代码内容 所属层 ------------------ GPIO/UART/I2C/SPI/ADC/PWM/TIMER/FLASH 操作 HAL 具体芯片寄存器操作（MPU6050/INA226/SHT3X/OLED） DRV 产品硬件描述（电池电压、设备温度、产品按键） BSP 产品功能逻辑（电池管理、传感器融合、服务器通信） APP 反例：DRV 中写低电量判断/充电控制/上传服务器 → 应放 APP。APP 中直接 → 应通过 BSP→DRV→HAL。 --- 8. HAL 接口稳定性 HAL 接口一旦确定，不应频繁修改函数原型。扩展时优先：增加参数、增加新接口、增加配置结构体，保留旧接口兼容。 HAL 禁止直接操作（示例）： 这些操作必须封装在 HAL 中，对上层透明。 --- 9. MCU 迁移 更换 MCU（如 STM32F103 → GD32F303，示例）时，原则上只需修改 HAL，DRV/BSP/APP 尽可能不变。 9.1 迁移原则 - 子仓库通过 抽象接口访问硬件，不直接依赖任何 MCU 厂商头文件 - 移植的核心任务是在主仓库中用新 MCU 的 SDK 重新实现 HAL 层接口 - 子仓库的 HAL 接口清单、移植步骤和检查清单见 的「MCU移植指南」章节 9.2 迁移阶段 9.3 迁移检查项 (Code Review) - 子仓库零直接依赖 MCU 厂商头文件（无厂商 直接包含）？ - 子仓库无直接寄存器操作（无 形式）？ - HAL 层接口已按 「MCU移植指南」清单全部实现？ - 「MCU移植指南」检查清单已逐项确认？ --- 10. Git Submodule 管理（仅形态A） 不同产品锁定不同 Submodule Commit，互不影响。 --- 11. 内存与中断规范 内存 - 优先使用 、 、固定长度 Buffer、RingBuffer - 减少/避免全局 Buffer 和重复 Buffer - 原则上不使用 中断 中断中只做：读取必要数据 → 写入 Buffer → 设置标志 → 退出。 禁止在中断中执行：长时间循环、阻塞等待、协议解析、大量 printf、浮点计算、长延时。 --- 12. 编译资源检查（MAP 文件分析） 12.1 检查方法 每次编译后， 在输出目录生成 文件。打开 MAP 文件末尾，找到以下三行： 12.2 字段说明 MAP 字段 含义 对应 MCU 资源 ------------------------------ Total RO Size Code + RO Data（只读代码+常量） 占用 Flash Total RW Size RW Data + ZI Data（已初始化+未初始化变量） 占用 SRAM Total ROM Size Code + RO Data + RW Data（实际烧写到Flash的总量） 占用 Flash RW Data 会被存储在 Flash 中，启动时搬运到 SRAM，因此同时占用 Flash 和 SRAM。 12.3 判定规则 将 MAP 文件中的实际占用与所选 的实际 Flash / SRAM 容量对照： 状态 条件 处理 ------------------ ✅ 正常 Flash < 80% 且 SRAM < 80% 无需操作 ⚠️ 警告 Flash ≥ 80% 或 SRAM ≥ 80% 优化代码体积/内存占用 🔴 危险 Flash ≥ 95% 或 SRAM ≥ 95% 必须优化，否则无法继续开发 弱符号兜底检查（条件项）：若工程使用了弱符号兜底文件（如 ，为全部 HAL 公开接口提供 空实现/错误码实现），正式构建后检查 MAP 中该文件应无存活符号——出现存活符号即说明存在\"被上层引用但 HAL 未实现\"的接口，需补齐实现或裁剪上层功能开关。HAL 全实现时兜底文件被强符号覆盖剔除，Flash 占用为 0。维护纪律：HAL 新增公开接口须同步兜底文件补 stub。 编译结果是随每次构建变化的项目数据，不记录于本模板；如需留存历史趋势，记录到 等工程自有文档，避免模板被逐次修改。 --- 13. 功能记录维护 13.1 记录规则 每实现一个新功能，必须同步更新对应范围的 Readme： 范围 文件 记录范围 ---------------------- 主仓库 HAL 层功能（UART/Timer/GPIO/ADC/SPI/I2C 等） 子仓库 BSP/DRV/APP 层功能（串口封装/解析/调度/驱动等） 形态B（单仓库）下，两份记录合并为同一 Readme 的两个章节，记录范围与更新规则不变。 13.2 记录格式 每个模块按统一格式记录： 13.3 更新时机 1. 新增 HAL/BSP/APP 接口时 2. 修改已有接口原型时 3. 删除接口时 4. Code Review 前确认记录已同步 13.4 Code Review 补充检查项 - 主仓库 Readme 已同步 HAL 新增功能？ - 子仓库 Readme 已同步 BSP/DRV/APP 新增功能？ - 每个硬件号的数据流转图已同步更新？（第 13.5 节） 13.5 硬件号数据流转 子仓库 Readme 必须为特性表登记的每个硬件号维护两份材料： 1. 数据通路清单表（主）—— 逐条通路，一表看全\"源→采集→缓存→消费→输出\" 2. 分阶段流程图（辅）—— Mermaid ，按五阶段分组 通路阶段模型（所有硬件号统一）： 清单表格式（每条通路一行，通路编号 P1/P2... 与图中边标注对应；下表为格式示例）： 流程图要求： 1. 五个 subgraph 按阶段命名： / / / / 2. 每个节点标注：所属模块（层前缀）+ 引脚/串口 + 频率或触发方式 3. 边标注通路编号（P1/P2...）与数据内容；虚线 = 中断直达，实线 = 主循环轮询/阻塞 4. 数据左进右出：输入源在最左，物理输出在最右，天然无回边交叉 多硬件号差异速览表（硬件号≥2 时必填；下表为格式示例）： 更新时机（任一触发即须更新清单表+图）： - 特性表功能位或串口字段变化 - 新增/删除模块 - 采样频率槽调整（如超声波 10Hz → 20Hz） - 中断回调注册关系变化 检查要点（Code Review 时逐项核对）： - 清单表通路集合与特性表该行功能位/串口字段一致（无多画/漏画）？ - 每条通路各环节（②③④⑤）对应的调用/数据结构真实存在于代码？ - 中断链（虚线）与主循环链（实线）区分标注？触发方式（中断/轮询/阻塞/AT按需）写实？ - 频率槽标注与 的 调度表一致？ - 图中边编号(P1...)与清单表通路一一对应？ - 多硬件号差异速览表已维护且结论正确？ --- 14. Code Review 检查项 架构 - 主仓库只维护 HAL？ - 只有 + （形态A 时为 Submodule）？ - 遵循 单向依赖？ 命名 - 文件前缀： / / / ？ - 接口前缀： / / / ？ - 文件级变量（含 static） 前缀？ - 结构体 + 指针类型？枚举 后缀？ 注释 - 所有函数（含 ）定义上方均有 Doxygen 注释块？（第 3.5.3 节方法扫描） - 每个函数均有 功能说明，无敷衍内容？ - 有参数的函数逐参数标注 （含取值范围/单位）？ - 非 函数标注 （各返回值含义）？ - 阻塞/超时/前置条件/调用周期/副作用等场景已用 标注注意事项？（第 3.5.2 节场景表） 函数设计 - 单个函数功能实现尽量控制在 10~20 行，超长已按功能拆分为职责单一的子函数？（第 3.6 节） 分层 - DRV 只通过 HAL 访问硬件，无寄存器直接操作？ - BSP 无业务逻辑，只做硬件封装？ - ","content":"# 嵌入式项目架构规范（跨仓库形态 · 通用模板）\n\n[TOC]\n\n\n## 0. 使用说明\n\n> 本文档为跨工程通用模板，可直接复制到任意 MCU 工程根目录使用，**无需任何修改**。\n> 正文统一使用占位符引用工程参数，使用时按当前工程实际结构对应取值。\n\n### 0.1 仓库形态\n\n`<仓库形态>` 二选一，两种形态共用本文档全部规范，仅代码物理位置与版本管理方式不同：\n\n| 形态 | 结构 | `<子仓库>` 的含义 |\n|------|------|------------------|\n| 形态A：主仓库 + 子仓库 | HAL 在主仓库，DRV/BSP/APP 在独立 Git 仓库 | Git Submodule（第 10 章适用） |\n| 形态B：单仓库 | HAL 与 DRV/BSP/APP 在同一仓库 | 主仓库内普通模块目录（第 10 章不适用） |\n\n形态B 下，正文中的 `<子仓库>`（含\"子仓库\"一词及 `<子仓库Readme>`）统一读作该模块目录及其 Readme，其余规则一字不改。\n\n### 0.2 标注约定\n\n- **占位符**（如 `<子仓库>`、`<厂商库目录>`、`<IDE>`、`<MCU>`）：正文通用规则一律使用占位符，禁止写死工程名，各工程按实际值对应\n- **固定目录名**（如 `01.HAL`）：为保持跨工程统一而约定的固定名称，各工程必须使用同名目录，不得改名，因此正文直接写出、不作参数化\n- **（示例）**：纯说明性举例，不构成对当前工程的约束\n\n---\n\n## 1. 适用范围\n\n适用于基于官方外设驱动库的 C 语言嵌入式项目，使用 Git 管理，支持**主仓库 + 子仓库**与**单仓库**两种形态（见第 0.1 节）。\n\n核心目标：**HAL 作为主仓库与上层模块的硬件抽象边界，DRV/BSP/APP 与具体 MCU 隔离，实现跨产品代码最大程度复用。**\n\n---\n\n## 2. 总体架构\n\n```text\n主工程/\n├── <厂商库目录>/              ← 官方库 (CMSIS + 外设驱动库)\n├── 01.HAL/                    ← MCU 硬件抽象层 (主仓库维护，固定目录名，见 0.2)\n│   ├── inc/\n│   └── src/\n├── <子仓库>/                  ← DRV/BSP/APP 所在目录\n│   ├── inc/                   ←   形态A: Git Submodule (独立仓库)\n│   └── src/                   ←   形态B: 主仓库内普通模块目录\n└── <IDE工程目录>/\n```\n\n软件依赖（严格单向）：\n\n```text\nAPP → BSP → DRV → HAL → 厂商官方库 → MCU\n```\n\n| 层级 | 职责 | 一句话 |\n|------|------|--------|\n| HAL | MCU 硬件抽象 | MCU 怎么操作 |\n| DRV | 具体芯片/器件驱动 | 芯片怎么操作 |\n| BSP | 当前产品硬件封装 | 硬件怎么组织 |\n| APP | 产品业务逻辑 | 功能怎么实现 |\n\n---\n\n## 3. 命名规范\n\n### 3.1 文件名前缀（区分层级）\n\n| 层级 | 文件前缀 | 示例 |\n|------|----------|------|\n| HAL | `hal_` | `hal_uart.c` |\n| DRV | `drv_` | `drv_mpu6050.c` |\n| BSP | `bsp_` | `bsp_battery.c` |\n| APP | `app_` | `app_parse.c` |\n| 公共 | `cfg_` | `cfg_modules.h` (层级无关配置头, 各层均可包含) |\n\n### 3.2 接口名前缀（CamelCase）\n\n| 层级 | 接口前缀 | 示例 |\n|------|----------|------|\n| HAL | `Hal` | `HalUartInit()` |\n| DRV | `Drv` | `DrvMpu6050GetData()` |\n| BSP | `Bsp` | `BspBatteryCurrentGet()` |\n| APP | `App` | `AppParseProcess()` |\n\n### 3.3 变量命名\n\n| 变量类型 | 命名规则 | 示例 |\n|----------|----------|------|\n| 全局变量（含 static 文件级变量） | `G_` + PascalCase | `G_SystemTick`、`G_RxBuf` |\n| 局部变量 | PascalCase（大驼峰） | `DataLen`、`RecvCount` |\n| 结构体类型 | PascalCase + `_S` | `HalUartRxBuffer_S` |\n| 结构体指针类型 | `p` + PascalCase + `_S` | `pHalUartRxBuffer_S` |\n| 结构体变量 | PascalCase | `HalUartRxBuffer` |\n| 结构体指针变量 | `p` + PascalCase | `pHalUartRxBuffer` |\n| 枚举类型 | PascalCase + `_E` | `RunFreCtrl_E` |\n| 枚举成员 | `层级_` + UPPER_SNAKE_CASE | `HAL_UART_1`、`RUN_100Hz` |\n\n结构体 typedef 必须同时定义类型和指针类型：\n\n```c\ntypedef struct\n{\n    unsigned char buf[HAL_UART_RX_BUF_SIZE];\n    unsigned int  head;\n    unsigned int  tail;\n    unsigned int  count;\n} HalUartRxBuffer_S, *pHalUartRxBuffer_S;\n```\n\n枚举定义示例：\n\n```c\ntypedef enum\n{\n    HAL_UART_1 = 1,\n    HAL_UART_2,\n    HAL_UART_3\n} HalUartPort_E;\n```\n\n### 3.4 规则\n\n- 文件名：全小写 + 层级前缀，如 `drv_ina226.c`\n- 函数名：CamelCase + 层级前缀，如 `DrvIna226Init()`\n- 全局变量必须以 `G_` 开头，如 `G_SystemTick`；static 文件级变量同样以 `G_` 开头（不区分是否 static）\n- 结构体类型以 `_S` 结尾，枚举类型以 `_E` 结尾\n- 指针类型加 `p` 前缀，如 `pHalUartRxBuffer_S`\n- 文件名和接口名必须同时体现层级\n\n### 3.5 函数注释规范（Doxygen）\n\n子仓库中**所有函数（含 `static` 内部函数）**的定义上方必须有 Doxygen 风格中文注释块，格式统一：\n\n```c\n/**\n * @brief 一句话功能说明\n * @param 参数名 参数含义说明（含取值范围/单位/格式）\n * @retval 返回值说明（各返回值含义）\n * @note 注意事项\n */\n```\n\n#### 3.5.1 标签必填规则\n\n| 标签 | 必填条件 | 内容要求 |\n|------|----------|----------|\n| `@brief` | 所有函数必填 | 一句话说明\"做什么\"；禁止写\"无\"/\"略\" |\n| `@param` | 有参数的函数必填 | 逐参数一行，写明取值范围、单位或格式（如 `0~127, 单位像素`、`\"%d\"/\"%.1f\"格式串`） |\n| `@retval` | 非 `void` 函数必填 | 写明各返回值含义（如 `0成功 -1失败`、`BSP_WIFI_OK/BSP_WIFI_ERROR`）；`void` 函数省略本行 |\n| `@note` | 存在下表任一场景时必填 | 无注意事项的简单函数可省 |\n\n#### 3.5.2 `@note` 必填场景\n\n| 场景 | 注释示例 |\n|------|----------|\n| 阻塞/耗时 | `最坏阻塞约15s，勿在中断中调用`、`I2C整屏刷新约10ms` |\n| 超时与重试 | `重试3次，单次超时15s` |\n| 调用前置条件 | `须在Init后调用`、`须先Attach绑定引脚，否则写操作被忽略` |\n| 调用周期/上下文 | `必须在1ms定时中断中调用`、`1Hz主循环轮询调用，不可重入` |\n| 缓冲区限制 | `输出缓冲区至少InLen*2+1字节`、`payload超长自动截断` |\n| 副作用 | `写入前自动整页擦除，同页旧数据一并清除` |\n| 仅写显存类 | `仅写显存，需调用Refresh后屏幕才更新` |\n| 引脚/资源风险 | `PA13/PA14为SWD调试口，黑名单拒绝绑定` |\n\n#### 3.5.3 检查方法\n\n逐文件扫描 `<子仓库>/src/*.c` 中每个函数定义（正则 `^[a-zA-Z_][a-zA-Z0-9_ \\*]*\\([^;]*\\)\\s*$` 定位），向上回溯确认紧邻的注释块：\n\n1. 缺 `/**` 注释块 → 判定**缺函数说明**\n2. 有注释块但缺 `@brief` 或内容敷衍（\"无\"/\"略\"）→ 判定**说明不合格**\n3. 函数命中 3.5.2 任一场景但缺 `@note` → 判定**缺注意事项**\n4. 有参数但缺 `@param`、非 `void` 但缺 `@retval` → 判定**参数/返回值未标注**\n\n输出格式：`文件名:行号 函数名 缺失项` 清单，全部修复后方可通过 Code Review。\n\n### 3.6 函数实现长度规范\n\n单个函数的功能实现**尽量控制在 10~20 行**（不含注释与空行），太长会影响阅读与维护。\n\n- 超过 20 行时，优先按功能拆分为职责单一的子函数（如状态机各分支、初始化/收发/保活各环节独立成函数）\n- 拆分后每个子函数同样遵循本规范；查表、长 `switch-case` 分发等结构性代码可适当放宽\n- 拆分收益：主流程一眼可读，子函数可独立测试与复用\n\n检查方法：扫描各函数 `{` 与配对 `}` 之间的有效代码行数，超过 20 行的函数列出清单逐个评估；确无拆分边界的，在函数注释 `@note` 中说明保留原因。\n\n---\n\n## 4. 目录设计\n\n### 4.1 子仓库统一 inc/src 结构\n\n子仓库内部**不按软件层级建目录**，统一使用 `inc/` + `src/`，通过文件名前缀区分层级。\n\n禁止：\n\n```text\n<子仓库>/\n├── APP/\n├── BSP/\n└── DRV/\n```\n\n正确：\n\n```text\n<子仓库>/\n├── inc/\n│   ├── app_main.h\n│   ├── bsp_sensor.h\n│   └── drv_mpu6050.h\n└── src/\n    ├── app_main.c\n    ├── bsp_sensor.c\n    └── drv_mpu6050.c\n```\n\n### 4.2 为什么用 inc/src 而非分层目录\n\n1. 目录结构简单，模块增加不产生目录膨胀\n2. 文件名前缀已能明确层级\n3. IDE 工程直接配置 `src/*.c` + `inc/` 即可\n4. 搜索 `drv_` / `bsp_` / `app_` 可快速定位同层所有文件\n\n---\n\n## 5. 各层职责\n\n### HAL（主仓库）\n\n负责：GPIO、UART、I2C、SPI、CAN、ADC、PWM、TIMER、DMA、EXTI、FLASH、RTC、NVIC、SysTick 等 MCU 外设。\n\n**不负责**：传感器业务、产品逻辑、协议解析、状态机。\n\nHAL 是主仓库与 `<子仓库>` 的接口边界，上层模块只依赖 HAL 抽象接口，不依赖具体 MCU 型号。\n\n### DRV\n\n负责：具体芯片初始化、寄存器配置、通信、原始数据读取与转换。\n\n例如：`drv_mpu6050`、`drv_ina226`、`drv_sht3x`、`drv_oled`、`drv_ml307`（示例）\n\n**DRV 只能通过 HAL 访问 MCU 硬件，禁止直接操作寄存器或外设指针。**\n\n### BSP\n\n负责：当前产品硬件资源与 DRV 之间的组合、封装和适配。\n\n例如：`bsp_battery`（调用 `drv_ina226`）、`bsp_sensor`（调用 `drv_mpu6050`）（示例）\n\n### APP\n\n负责：产品功能、状态机、数据处理、故障处理、通信等业务逻辑。\n\n**APP 通过 BSP 访问硬件，不直接调用 DRV 或 HAL。**\n\n---\n\n## 6. 依赖规则\n\n```text\n允许：  APP→BSP   BSP→DRV   DRV→HAL\n        任意层→cfg_modules.h (层级无关编译配置头, 只含宏开关)\n        任意层→HAL公开类型 (仅类型引用豁免: 上层对外接口可用HalGpioPort_E、\n        串口号枚举等HAL公开类型作参数, 类型引用不构成跳层调用依赖;\n        仍禁止调用Hal*函数或依赖HAL内部实现)\n\n禁止：  APP→DRV   APP→HAL   BSP→HAL   BSP→APP\n        DRV→BSP   DRV→APP   HAL→任意上层\n```\n\n### 6.1 调用链示例\n\n```text\nAppBatteryProcess()\n    ↓\nBspBatteryCurrentGet()\n    ↓\nDrvIna226GetCurrent()\n    ↓\nHalI2cRead()\n    ↓\nI2C 外设 → INA226\n```\n\n---\n\n## 7. 新增代码层级判断\n\n| 代码内容 | 所属层 |\n|----------|--------|\n| GPIO/UART/I2C/SPI/ADC/PWM/TIMER/FLASH 操作 | HAL |\n| 具体芯片寄存器操作（MPU6050/INA226/SHT3X/OLED） | DRV |\n| 产品硬件描述（电池电压、设备温度、产品按键） | BSP |\n| 产品功能逻辑（电池管理、传感器融合、服务器通信） | APP |\n\n**反例**：DRV 中写低电量判断/充电控制/上传服务器 → 应放 APP。APP 中直接 `I2C_SendData()` → 应通过 BSP→DRV→HAL。\n\n---\n\n## 8. HAL 接口稳定性\n\nHAL 接口一旦确定，不应频繁修改函数原型。扩展时优先：增加参数、增加新接口、增加配置结构体，保留旧接口兼容。\n\nHAL 禁止直接操作（示例）：\n\n```c\nGPIOA->ODR    I2C1->DR    USART1->DR    TIM2->CNT\n```\n\n这些操作必须封装在 HAL 中，对上层透明。\n\n---\n\n## 9. MCU 迁移\n\n更换 MCU（如 STM32F103 → GD32F303，示例）时，**原则上只需修改 HAL**，DRV/BSP/APP 尽可能不变。\n\n### 9.1 迁移原则\n\n- 子仓库通过 `Hal*()` 抽象接口访问硬件，不直接依赖任何 MCU 厂商头文件\n- 移植的核心任务是在主仓库中用新 MCU 的 SDK 重新实现 HAL 层接口\n- 子仓库的 HAL 接口清单、移植步骤和检查清单见 `<子仓库Readme>` 的「MCU移植指南」章节\n\n### 9.2 迁移阶段\n\n```\n阶段1: HAL重建 (主仓库)     — 新建工程/替换官方库/重新实现HAL接口/配置SysTick\n阶段2: 子仓库集成            — 引入<子仓库>(形态A:Submodule/形态B:模块目录)/配置编译/确认零厂商头文件依赖\n阶段3: 硬件适配 (子仓库)     — 调整BSP引脚分配/调整APP层参数\n阶段4: 验证                  — 编译/MAP分析/烧录测试/更新文档\n```\n\n### 9.3 迁移检查项 (Code Review)\n\n- [ ] 子仓库零直接依赖 MCU 厂商头文件（无厂商 `xxx.h` 直接包含）？\n- [ ] 子仓库无直接寄存器操作（无 `外设->` 形式）？\n- [ ] HAL 层接口已按 `<子仓库Readme>`「MCU移植指南」清单全部实现？\n- [ ] `<子仓库Readme>`「MCU移植指南」检查清单已逐项确认？\n\n---\n\n## 10. Git Submodule 管理（仅形态A）\n\n```bash\n# 添加子仓库\ngit submodule add <repo_url> <子仓库>\n\n# 克隆主工程（含子仓库）\ngit clone <project>\ncd <project>\ngit submodule update --init --recursive\n\n# 更新子仓库\ncd <子仓库>\ngit pull\ncd ..\ngit add <子仓库>\ngit commit -m \"Update <子仓库>\"\n```\n\n不同产品锁定不同 Submodule Commit，互不影响。\n\n---\n\n## 11. 内存与中断规范\n\n### 内存\n\n- 优先使用 `const`、`static`、固定长度 Buffer、RingBuffer\n- 减少/避免全局 Buffer 和重复 Buffer\n- 原则上不使用 `malloc/free`\n\n### 中断\n\n中断中只做：读取必要数据 → 写入 Buffer → 设置标志 → 退出。\n\n**禁止**在中断中执行：长时间循环、阻塞等待、协议解析、大量 printf、浮点计算、长延时。\n\n---\n\n## 12. 编译资源检查（MAP 文件分析）\n\n### 12.1 检查方法\n\n每次编译后，`<IDE>` 在输出目录生成 `.map` 文件。打开 MAP 文件末尾，找到以下三行：\n\n```text\nTotal RO  Size (Code + RO Data)                XXXXX (  XX.XXkB)\nTotal RW  Size (RW Data + ZI Data)             XXXXX (  XX.XXkB)\nTotal ROM Size (Code + RO Data + RW Data)      XXXXX (  XX.XXkB)\n```\n\n### 12.2 字段说明\n\n| MAP 字段 | 含义 | 对应 MCU 资源 |\n|----------|------|--------------|\n| Total RO Size | Code + RO Data（只读代码+常量） | 占用 Flash |\n| Total RW Size | RW Data + ZI Data（已初始化+未初始化变量） | 占用 SRAM |\n| Total ROM Size | Code + RO Data + RW Data（实际烧写到Flash的总量） | 占用 Flash |\n\n> **RW Data** 会被存储在 Flash 中，启动时搬运到 SRAM，因此同时占用 Flash 和 SRAM。\n\n### 12.3 判定规则\n\n将 MAP 文件中的实际占用与所选 `<MCU>` 的实际 Flash / SRAM 容量对照：\n\n```\nFlash 占用 = Total ROM Size\nSRAM 占用  = Total RW Size\n\nFlash 使用率 = Flash 占用 / MCU Flash 总量 × 100%\nSRAM 使用率  = SRAM 占用  / MCU SRAM 总量 × 100%\n```\n\n| 状态 | 条件 | 处理 |\n|------|------|------|\n| ✅ 正常 | Flash < 80% 且 SRAM < 80% | 无需操作 |\n| ⚠️ 警告 | Flash ≥ 80% 或 SRAM ≥ 80% | 优化代码体积/内存占用 |\n| 🔴 危险 | Flash ≥ 95% 或 SRAM ≥ 95% | 必须优化，否则无法继续开发 |\n\n**弱符号兜底检查（条件项）**：若工程使用了弱符号兜底文件（如 `hal_stub.c`，为全部 HAL 公开接口提供 `__weak` 空实现/错误码实现），正式构建后检查 MAP 中该文件应**无存活符号**——出现存活符号即说明存在\"被上层引用但 HAL 未实现\"的接口，需补齐实现或裁剪上层功能开关。HAL 全实现时兜底文件被强符号覆盖剔除，Flash 占用为 0。维护纪律：HAL 新增公开接口须同步兜底文件补 stub。\n\n> 编译结果是随每次构建变化的项目数据，**不记录于本模板**；如需留存历史趋势，记录到 `<主仓库Readme>` 等工程自有文档，避免模板被逐次修改。\n\n---\n\n## 13. 功能记录维护\n\n### 13.1 记录规则\n\n每实现一个新功能，必须同步更新对应范围的 Readme：\n\n| 范围 | 文件 | 记录范围 |\n|------|------|----------|\n| 主仓库 | `<主仓库Readme>` | HAL 层功能（UART/Timer/GPIO/ADC/SPI/I2C 等） |\n| 子仓库 | `<子仓库Readme>` | BSP/DRV/APP 层功能（串口封装/解析/调度/驱动等） |\n\n形态B（单仓库）下，两份记录合并为同一 Readme 的两个章节，记录范围与更新规则不变。\n\n### 13.2 记录格式\n\n每个模块按统一格式记录：\n\n```markdown\n### 模块名\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 功能A | `FuncA()` | 简要说明 |\n| 功能B | `FuncB()` | 简要说明 |\n```\n\n### 13.3 更新时机\n\n1. 新增 HAL/BSP/APP 接口时\n2. 修改已有接口原型时\n3. 删除接口时\n4. Code Review 前确认记录已同步\n\n### 13.4 Code Review 补充检查项\n\n- [ ] 主仓库 Readme 已同步 HAL 新增功能？\n- [ ] 子仓库 Readme 已同步 BSP/DRV/APP 新增功能？\n- [ ] 每个硬件号的数据流转图已同步更新？（第 13.5 节）\n\n### 13.5 硬件号数据流转\n\n子仓库 Readme 必须为**特性表登记的每个硬件号**维护**两份材料**：\n\n1. **数据通路清单表**（主）—— 逐条通路，一表看全\"源→采集→缓存→消费→输出\"\n2. **分阶段流程图**（辅）—— Mermaid `flowchart LR`，按五阶段分组\n\n**通路阶段模型**（所有硬件号统一）：\n\n```\n①输入源 → ②采集/解析(BSP·DRV·APP) → ③数据缓存/命令 → ④决策(APP) → ⑤输出\n```\n\n**清单表格式**（每条通路一行，通路编号 P1/P2... 与图中边标注对应；下表为格式示例）：\n\n```markdown\n| 通路 | ①输入源 | ②采集/解析 | 触发·频率 | ③数据落点 | ④消费方 | ⑤输出 |\n|------|---------|-----------|----------|----------|---------|-------|\n| P1 避障 | HC-SR04(PB5/PB6) | app_func 阻塞测距 | 10Hz槽 | DistCm缓存 | app_car 避障状态机 | 电机+舵机 |\n| P3 语音 | 语音模块(UART2) | AppCarVoiceRxIsr置码 | RXNE中断→10Hz消费 | G_VoiceCmd | app_car | 电机+舵机 |\n```\n\n**流程图要求**：\n\n1. 五个 subgraph 按阶段命名：`①输入源`/`②采集/解析`/`③数据缓存/命令`/`④决策`/`⑤输出`\n2. 每个节点标注：所属模块（层前缀）+ 引脚/串口 + 频率或触发方式\n3. 边标注通路编号（P1/P2...）与数据内容；**虚线 `-.->` = 中断直达，实线 `-->` = 主循环轮询/阻塞**\n4. 数据左进右出：输入源在最左，物理输出在最右，天然无回边交叉\n\n**多硬件号差异速览表**（硬件号≥2 时必填；下表为格式示例）：\n\n```markdown\n| 维度 | C000 | C001 |\n|------|------|------|\n| 主动采集源 | ... | ... |\n| 中断链 | ... | ... |\n| 闭环决策 | 无(指令直控) | app_car状态机 |\n```\n\n**更新时机**（任一触发即须更新清单表+图）：\n\n- 特性表功能位或串口字段变化\n- 新增/删除模块\n- 采样频率槽调整（如超声波 10Hz → 20Hz）\n- 中断回调注册关系变化\n\n**检查要点**（Code Review 时逐项核对）：\n\n- [ ] 清单表通路集合与特性表该行功能位/串口字段一致（无多画/漏画）？\n- [ ] 每条通路各环节（②③④⑤）对应的调用/数据结构真实存在于代码？\n- [ ] 中断链（虚线）与主循环链（实线）区分标注？触发方式（中断/轮询/阻塞/AT按需）写实？\n- [ ] 频率槽标注与 `app_main.c` 的 `AppProcess` 调度表一致？\n- [ ] 图中边编号(P1...)与清单表通路一一对应？\n- [ ] 多硬件号差异速览表已维护且结论正确？\n\n---\n\n## 14. Code Review 检查项\n\n**架构**\n- [ ] 主仓库只维护 HAL？\n- [ ] `<子仓库>` 只有 `inc/` + `src/`（形态A 时为 Submodule）？\n- [ ] 遵循 `APP → BSP → DRV → HAL` 单向依赖？\n\n**命名**\n- [ ] 文件前缀：`hal_` / `drv_` / `bsp_` / `app_`？\n- [ ] 接口前缀：`Hal` / `Drv` / `Bsp` / `App`？\n- [ ] 文件级变量（含 static）`G_` 前缀？\n- [ ] 结构体 `_S` + `p` 指针类型？枚举 `_E` 后缀？\n\n**注释**\n- [ ] 所有函数（含 `static`）定义上方均有 `/** */` Doxygen 注释块？（第 3.5.3 节方法扫描）\n- [ ] 每个函数均有 `@brief` 功能说明，无敷衍内容？\n- [ ] 有参数的函数逐参数标注 `@param`（含取值范围/单位）？\n- [ ] 非 `void` 函数标注 `@retval`（各返回值含义）？\n- [ ] 阻塞/超时/前置条件/调用周期/副作用等场景已用 `@note` 标注注意事项？（第 3.5.2 节场景表）\n\n**函数设计**\n- [ ] 单个函数功能实现尽量控制在 10~20 行，超长已按功能拆分为职责单一的子函数？（第 3.6 节）\n\n**分层**\n- [ ] DRV 只通过 HAL 访问硬件，无寄存器直接操作？\n- [ ] BSP 无业务逻辑，只做硬件封装？\n- [ ] APP 不直接调用 DRV 或 HAL？\n\n**移植**\n- [ ] 更换 MCU 只需修改 HAL？\n- [ ] HAL 接口保持兼容？\n- [ ] 第 9.3 节迁移检查项已逐项确认？\n\n**资源**\n- [ ] Flash 使用率 < 80%？\n- [ ] SRAM 使用率 < 80%？\n- [ ] 若使用弱符号兜底文件：MAP 中无兜底文件存活符号？（有 = 存在未实现的 HAL 接口，见第 12.3 节）\n\n**文档**\n- [ ] 主仓库 Readme 已同步 HAL 新增功能？\n- [ ] 子仓库 Readme 已同步 BSP/DRV/APP 新增功能？\n- [ ] 每个硬件号的数据流转图（Mermaid）已同步更新且与特性表/调度表一致？（第 13.5 节）\n\n---\n\n## 15. 架构总则\n\n> 主仓库只维护 HAL，DRV/BSP/APP 集中在 `<子仓库>`（形态A 为 Submodule，形态B 为仓库内模块目录）。\n> 子仓库统一 `inc/src` 目录，通过 `hal_/drv_/bsp_/app_` 文件名前缀和 `Hal/Drv/Bsp/App` 接口前缀区分层级。\n> 严格遵循 `APP → BSP → DRV → HAL` 单向依赖，软件层级通过文件名、接口名和调用关系体现，不通过目录体现。\n> 本文档为通用模板，工程差异通过占位符体现，复制到任意新工程无需任何修改。\n"},{"hash":"ESP/ESP-32/Readme.md","title":"Readme","relPath":"ESP/ESP-32/Readme.md","desc":"按键槽位与 GPIO 解耦： 宏改一个 GPIO 号即可把任意空闲脚绑为按键（GPIO6~11 连接模组 Flash 被黑名单拒绝；GPIO34~39 仅输入且无内部上下拉，低有效键需外部上拉）。","created":"","updated":"","tags":[],"sizeKB":38.1,"_text":"ESP32-WROOM-32 工程功能记录 - MCU：ESP32-WROOM-32（SoC：ESP32-D0WDQ6，双核 Xtensa LX6 @ 240MHz，4MB Flash / 520KB SRAM） - SDK：ESP-IDF v6.1（本机安装于 ，工具链 ，激活脚本 ；v5.x 亦可编译） - 版本号规则： （如 V1.0.0.0），小功能完成末位+1、大功能完成第3位+1；状态 JSON 字段与页面状态卡同步显示 - 架构： 四层单向依赖，规范见 ProjectLevelSkill.md - IDE：VS Code（Trae）+ ESP-IDF 扩展，或 idf.py 命令行 目录结构 硬件资源占用表 外设 引脚/资源 用途 归属模块 --------------------------------- UART0 TX=GPIO1 / RX=GPIO3，115200-8N1 调试口（与日志输出/固件下载复用； 控制是否挂驱动，挂驱动后控制台接收被接管） haluart / bspuart UART1 TX=GPIO18 / RX=GPIO19，115200-8N1 扩展口（GPIO 矩阵重映射，模组默认脚 9/10 接 Flash 不可用； 控制） haluart / bspuart UART2 TX=GPIO17 / RX=GPIO16，115200-8N1 通信口（网页串口工具/蓝牙 SPP 透传口，波特率可经网页在线修改； 控制） haluart / bspuart / appnet GPIO2 GPIO2，推挽输出 板载运行指示灯（DevKitC 板载 LED） halled / bspled / appled GPIO0 GPIO0，输入上拉，低有效 板载 BOOT 按键（DevKitC 板载，默认绑定；Strapping 脚：上电时按住进下载模式，运行期作普通按键无影响） halkey / bspkey / appkey WiFi 射频（无引脚）；SoftAP /192.168.4.1 + STA 配网热点常开 + 凭据连接路由（NVS 持久化，断线自动重连）；STA 联网后热点开 NAPT 中继，手机连热点即可借道上网；与蓝牙共存（ ） halwifi / bspwifi / appnet BT 射频（无引脚）；经典蓝牙 SPP 服务端 蓝牙串口透传通道（手机/电脑蓝牙串口客户端接入） halspp / bspbt / appnet ESP32-WROOM-32 共 3 路硬件串口，全部已在 建档（使能开关 + 波特率 + 引脚集中配置），按需启用；GPIO16/17 在 WROOM-32 上空闲，若换 WROVER 模组此两脚被 PSRAM 占用，须改引脚（改 宏即可）。按键槽位与 GPIO 解耦： 宏改一个 GPIO 号即可把任意空闲脚绑为按键（GPIO6~11 连接模组 Flash 被黑名单拒绝；GPIO34~39 仅输入且无内部上下拉，低有效键需外部上拉）。WiFi+蓝牙固件约 1.5MB，分区表已改 4MB Flash + factory 3MB（ ），从 2MB 配置升级首次烧录前建议 。 HAL 层功能记录 haluart（UART 驱动，封装 ESP-IDF uart 事件队列驱动） 功能 API 说明 ----------------- 串口初始化 帧格式经 可配置（波特率/数据位 5~8/校验无偶奇/停止位 1、1.5、2/流控 RTS、CTS 及引脚）；0 值字段取默认 8N1 无流控；装驱动（RX 环形缓冲 256B + 事件队列 20 深）+ 每串口接收分发任务（栈 3072B，优先级 5） 串口反初始化 删任务、卸驱动、释放缓冲 运行时改波特率 不重初始化直接更新指定串口波特率 阻塞发送 无 TX 环形缓冲直写 FIFO， 约束等待发送完成 读取数据 从驱动环形缓冲读取，超时 0 = 立即返回已有数据 查询可读字节数 轮询场景使用 清空接收 清缓冲 + 复位事件队列 事件回调注册 全串口共用回调按 Port 区分；事件在接收任务上下文上抛（非中断） 事件链： 。帧间隔超时 3 符号时间触发 RX 事件。 halled（LED GPIO 驱动，封装 ESP-IDF gpio 驱动） 功能 API 说明 ----------------- LED 初始化 按引脚表（ 内 ）配置推挽输出并默认熄灭，可重复调用 LED 状态控制 点亮/熄灭/翻转（TOGGLE 经电平缓存取反）， 编号寻址 引脚映射集中在 的 （HALLED1 → GPIO2）；上层经 枚举访问，不感知 GPIO 编号。 halkey（按键 GPIO 驱动，封装 ESP-IDF gpio 驱动） 功能 API 说明 ----------------- 绑定任意 GPIO 为按键 指定按键编号（ 槽位）+ 任意 GPIO（0~39）+ 有效电平（低/高）；配置为输入并按有效电平使能内部上/下拉；GPIO6~11（模组 Flash）黑名单拒绝，GPIO34~39 无内部上下拉（低有效需外部上拉）；重复绑定覆盖旧绑定 读取按键电平 非阻塞直读输入电平与有效电平比对，1=按下 / 0=松开 / -1=未绑定或参数非法；无消抖（消抖由 BSP 状态机完成） 按键槽位（HALKEY1~4）与 GPIO 编号完全解耦，运行时经 绑定任意 GPIO；上层经槽位编号访问，不感知 GPIO。 halwifi（WiFi 驱动，封装 ESP-IDF espwifi/netif/nvsflash，AP+STA 双模） 功能 API 说明 ----------------- WiFi 初始化 初始化 NVS/netif/espwifi 并启动 SoftAP+STA 双模：SoftAP 常开供配网，STA 用于连接路由器；热点配置经 （SSID/密码/信道 1~13/最大接入 1~4），密码空串=开放热点，0 值字段取默认（信道 1 / 接入 2） STA 凭据保存 SSID/密码写入 NVS（命名空间 ，键 / ）持久化，掉电不丢 STA 凭据读取 从 NVS 读回凭据（自动截断至缓冲尺寸），供上层展示/回填 STA 凭据清除 擦除 NVS 凭据（键不存在视为已清除）；供“清除配网”接口使用 STA 信号强度查询 当前关联 AP 的 RSSI（dBm 负值），未连接返回失败 STA 发起连接 从 NVS 读凭据写入 STA 配置并连接（无凭据返回失败）；断开后可再次调用重试 STA 断开 主动断开当前连接 STA 状态查询 返回 IDLE（无凭据/未连接）/ CONNECTING（连接中）/ CONNECTED（已获 IP） STA IP 查询 输出点分十进制 IP 字符串（含结束符最长 16B） STA 收发字节查询 开机累计 TX/RX 字节（数据源 包事件，含 NAPT 中继流量；32bit 自然回绕，上层差值法求速率）※当前固件未集成，接口随网速显示功能预留 SoftAP NAT 中继 无新增 API（事件内自动启停） STA 联网即开 NAPT：热点客户端报文改写源地址借道 STA 上网 + DHCP 下发 DNS（优先上游网关，退回 223.5.5.5）；STA 断开自动关闭、重连自动恢复 周边热点扫描 阻塞式全信道扫描（约 1.5~3s），按 RSSI 降序同名去重，最多 20 条（SSID/信号强度/是否加密）；扫描期间 SoftAP 信标短暂停发属正常 事件回调注册 GOTIP / DISCONNECTED 事件上抛（运行于 ESP-IDF 事件任务上下文） 事件链： 。STA 关联参数：认证门槛取 （任意认证模式可关联）+ PMF capable（兼容 WPA3/混合网络）。 NAPT 热点中继（sdkconfig： + ）：STA 联网即自动开启 —— 热点客户端（192.168.4.x）经 NAPT 改写源地址借道 STA 上网，DNS 由 DHCP 下发（优先上游网关，无效退回 223.5.5.5）；STA 断开自动关闭、重连自动恢复。单射频半双工中继，预期带宽 10~20Mbps，高清视频可能缓冲。 halhttp（HTTP/WebSocket 服务器驱动，封装 ESP-IDF esphttpserver，双实例架构） 功能 API 说明 ----------------- 服务器初始化 启动双实例：实例1（80 端口：内置页+/api 接口，并发 4）；实例2（81 端口：WebSocket 专用，并发 4，ctrlport 32769 与实例1区分，sendwaittimeout=1s）；socket 总预算 URI 注册 按 注册路径+方法（GET/POST/WS）+回调；WS 路由自动注册到 81 端口实例；配置须长期保活（建议常量/静态存储） 请求体长度 POST 请求体长度（字节） 请求体接收 读 POST 请求体到调用方缓冲（表单解析用） 请求应答 按 HTTP 状态码/Content-Type/响应体回复 WebSocket 收帧 读一帧 WS 数据；超长帧自动丢弃不阻塞 WebSocket 推送 向全部在册且握手完成的 WS 连接推二进制帧（跨任务安全但可能阻塞，勿在主循环/事件任务高频调用） WebSocket 文本推送 同上，推文本帧（JSON 状态用） WS 连接登记表机制：81 实例配 回调精确登记/注销连接 fd（fd 号为 VFS 全局分配不可盲扫，实测可达 57）； 钩子（需 ）标记握手完成——IDF 握手时不调 URI 处理器，握手未完成前推送会打乱 101 响应故设就绪门控；推送失败≠会话死亡不注销（超时/窗口满仅暂时不可达），注销只由 closefn 唯一负责，否则洪水期一次超时就把活连接踢出名单致显示永久停止。 的 为厂商句柄占位，上层保持 opaque。 halspp（经典蓝牙 SPP 驱动，封装 ESP-IDF Bluedroid SPP，服务端模式） 功能 API 说明 ----------------- SPP 初始化 初始化 BT 控制器（CLASSICBT）+ Bluedroid 协议栈 + SPP 增强模式，并以服务端身份启动 SPP 服务（异步，INIT 事件内拉起）被动等待客户端接入；入参设备名/服务名 SPP 发送 向已连接客户端发数据；未连接返回 -2，链路拥塞（CONG）返回 -3 暂缓重发 连接状态查询 1=已连接 / 0=未连接 事件回调注册 OPENED / CLOSED / DATA 事件上抛（运行于 Bluedroid 事件任务上下文） 事件链： ；单连接模型，新客户端接入自动接管旧连接。 BSP 层功能记录 bspuart（板载串口封装：覆盖全部 3 路硬件串口） 功能 API 说明 ----------------- 板载串口初始化 按 使能宏（ / / ）逐路初始化 DBG（UART0）/EXT（UART1）/COMM（UART2），波特率/引脚集中在 配置，帧格式默认 8N1；先挂事件转发再逐路 Init，某路失败不阻断其余路 板载串口反初始化 指定路转调 ，卸驱动释放资源 运行时改波特率 指定路转调 ，不重初始化 语义串口发送 语义号（DBG/EXT/COMM）经映射表转发对应硬件串口 语义串口读取 同上 查询可读字节数 同上 清空接收 指定路清接收缓冲 + 复位事件队列 事件回调注册 接收 HAL 事件（反查映射表）转为带 Port 号的板级语义事件转发 APP bspled（板载灯封装） 功能 API 说明 ----------------- 板载灯初始化 转调 HAL LED 初始化 板载灯设置 语义灯号/状态（ / ）→ HAL 硬件灯号映射输出 语义映射集中在 ： （运行灯）→ （GPIO2 板载灯）。LED 为 GPIO 直控器件，无 DRV 层（第 2 节注）。 bspkey（按键消抖扫描状态机：按住/按下/松开/单击/双击/长按/连发事件识别） 功能 API 说明 ----------------- 按键模块初始化 复位全部按键状态机，清空绑定与事件标志 绑定任意 GPIO 为按键 转调 并复位该键状态机；返回 0 成功 / -1 参数 / -2 裁剪 / -3 HAL 失败 扫描状态机 须由 APP 以 10ms（ ）周期调用；内部 20ms（ ）消抖采样，事件识别方式与 Doc/drvkey 标志位状态机一致；未绑定按键自动跳过 查询消费按键事件 传入事件标志（ ，可按位或）查询，命中返回 1 并清除已消费标志（HOLD 为电平态不清除）；0 未命中 长按阈值配置 运行时修改长按判定时间（默认 3000ms，双击窗口 50ms / 连发周期 100ms 在 宏配置） 按键为 GPIO 直控器件，无 DRV 层（第 2 节注），BSP 直达 HAL；状态机移植自 Doc/drvkey（0~4 态：空闲→按下→双击窗口→双击松开→长按连发），事件标志 0x01~0x40 与参考实现一致。 bspwifi（板载 WiFi 封装：配网热点参数 + 自动重连组织） 功能 API 说明 ----------------- WiFi 模块初始化 以 集中定义的热点参数（SSID /密码 /信道 6/接入 2）初始化 AP+STA 双模；NVS 有凭据则自动发起 STA 连接 配网凭据下发 保存 SSID/密码到 NVS 并连接（网页表单提交路径）；IDLE 态直接发起，连接中/已连接态先断开、由断开事件回调自动以新凭据重连（规避 disconnect 未完成即 connect 的状态冲突） 当前 SSID 查询 从 NVS 读回已配网 SSID（状态栏展示用） 完整凭据读取 读回完整 SSID+密码（配网接口失败时恢复原配置用） 凭据清除 擦除 NVS 凭据（“清除配网”接口，清除后重启回纯热点待配网态） 信号强度查询 当前关联 AP 的 RSSI（dBm 负值），未连接返回失败 周边热点扫描 转发 HAL 扫描（阻塞 1.5~3s，最多 20 条）；扫描期间挂起自动重连（扫描与关联互斥），扫描结束恢复连接尝试 STA 状态查询 IDLE / CONNECTING / CONNECTED 板级语义 STA IP 查询 点分十进制 IP 字符串 STA 收发字节查","content":"# ESP32-WROOM-32 工程功能记录\n\n- **MCU**：ESP32-WROOM-32（SoC：ESP32-D0WDQ6，双核 Xtensa LX6 @ 240MHz，4MB Flash / 520KB SRAM）\n- **SDK**：ESP-IDF **v6.1**（本机安装于 `F:\\00.Code\\11ESP\\esp-idf`，工具链 `D:\\software\\31ESP`，激活脚本 `F:\\00.Code\\11ESP\\idf-env.bat`；v5.x 亦可编译）\n- **版本号规则**：`V主.次.大功能.小功能`（如 V1.0.0.0），小功能完成末位+1、大功能完成第3位+1；状态 JSON `ver` 字段与页面状态卡同步显示\n- **架构**：`APP → BSP → DRV → HAL → ESP-IDF` 四层单向依赖，规范见 [Project_Level_Skill.md](Project_Level_Skill.md)\n- **IDE**：VS Code（Trae）+ ESP-IDF 扩展，或 idf.py 命令行\n\n## 目录结构\n\n```text\nESP-32/\n├── inc/                       ← 四层头文件平铺（文件名前缀区分层级）\n│   ├── cfg_modules.h          ← 功能裁剪开关宏（CFG_XXX_EN）\n│   ├── hal_uart.h\n│   ├── hal_led.h\n│   ├── hal_key.h\n│   ├── hal_http.h\n│   ├── hal_spp.h\n│   ├── hal_wifi.h\n│   ├── bsp_uart.h\n│   ├── bsp_led.h\n│   ├── bsp_key.h\n│   ├── bsp_bt.h\n│   ├── bsp_web.h\n│   ├── bsp_wifi.h\n│   ├── bsp_store.h\n│   ├── app_uart.h\n│   ├── app_led.h\n│   ├── app_key.h\n│   ├── app_net.h\n│   ├── app_forward.h\n│   ├── web_page_ported.h        ← 内置网页（由参考工程 web_page.h 自动生成 + 手工增量，勿手改结构）\n│   └── app_main.h\n├── src/                       ← 与 inc/ 同名对应（新增 bsp_store.c / app_forward.c）\n│   ├── hal_uart.c\n│   ├── hal_led.c\n│   ├── hal_key.c\n│   ├── hal_http.c\n│   ├── hal_spp.c\n│   ├── hal_wifi.c\n│   ├── bsp_uart.c\n│   ├── bsp_led.c\n│   ├── bsp_key.c\n│   ├── bsp_bt.c\n│   ├── bsp_web.c\n│   ├── bsp_wifi.c\n│   ├── app_uart.c\n│   ├── app_led.c\n│   ├── app_key.c\n│   ├── app_net.c\n│   └── app_main.c\n├── CMakeLists.txt             ← 工程构建入口\n├── main/CMakeLists.txt        ← 汇总 src/*.c 到 main 组件\n├── partitions.csv             ← 自定义分区表（4MB Flash：nvs 24KB + factory 3MB）\n├── sdkconfig.defaults         ← 首次构建默认配置（生成 sdkconfig 后纳入版本管理）\n└── Readme.md\n```\n\n## 硬件资源占用表\n\n| 外设 | 引脚/资源 | 用途 | 归属模块 |\n|------|-----------|------|----------|\n| UART0 | TX=GPIO1 / RX=GPIO3，115200-8N1 | 调试口（与日志输出/固件下载复用；`BSP_UART_DBG_EN` 控制是否挂驱动，挂驱动后控制台接收被接管） | hal_uart / bsp_uart |\n| UART1 | TX=GPIO18 / RX=GPIO19，115200-8N1 | 扩展口（GPIO 矩阵重映射，模组默认脚 9/10 接 Flash 不可用；`BSP_UART_EXT_EN` 控制） | hal_uart / bsp_uart |\n| UART2 | TX=GPIO17 / RX=GPIO16，115200-8N1 | 通信口（**网页串口工具/蓝牙 SPP 透传口**，波特率可经网页在线修改；`BSP_UART_COMM_EN` 控制） | hal_uart / bsp_uart / app_net |\n| GPIO2 | GPIO2，推挽输出 | 板载运行指示灯（DevKitC 板载 LED） | hal_led / bsp_led / app_led |\n| GPIO0 | GPIO0，输入上拉，低有效 | 板载 BOOT 按键（DevKitC 板载，默认绑定；**Strapping 脚**：上电时按住进下载模式，运行期作普通按键无影响） | hal_key / bsp_key / app_key |\n| WiFi | 射频（无引脚）；SoftAP `ESP32_Config`/192.168.4.1 + STA | 配网热点常开 + 凭据连接路由（NVS 持久化，断线自动重连）；**STA 联网后热点开 NAPT 中继，手机连热点即可借道上网**；与蓝牙共存（`ESP_COEX_SW_COEXIST_ENABLE`） | hal_wifi / bsp_wifi / app_net |\n| BT | 射频（无引脚）；经典蓝牙 SPP 服务端 `ESP32-UART` | 蓝牙串口透传通道（手机/电脑蓝牙串口客户端接入） | hal_spp / bsp_bt / app_net |\n\n> ESP32-WROOM-32 共 3 路硬件串口，全部已在 `bsp_uart.h` 建档（使能开关 + 波特率 + 引脚集中配置），按需启用；GPIO16/17 在 WROOM-32 上空闲，若换 WROVER 模组此两脚被 PSRAM 占用，须改引脚（改 `bsp_uart.h` 宏即可）。按键槽位与 GPIO 解耦：`app_key.h` 宏改一个 GPIO 号即可把任意空闲脚绑为按键（GPIO6~11 连接模组 Flash 被黑名单拒绝；GPIO34~39 仅输入且无内部上下拉，低有效键需外部上拉）。WiFi+蓝牙固件约 1.5MB，分区表已改 4MB Flash + factory 3MB（`partitions.csv`），从 2MB 配置升级首次烧录前建议 `idf.py erase-flash`。\n\n## HAL 层功能记录\n\n### hal_uart（UART 驱动，封装 ESP-IDF uart 事件队列驱动）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 串口初始化 | `HalUartInit()` | 帧格式经 `HalUartConfig_S` 可配置（波特率/数据位 5~8/校验无偶奇/停止位 1、1.5、2/流控 RTS、CTS 及引脚）；0 值字段取默认 8N1 无流控；装驱动（RX 环形缓冲 256B + 事件队列 20 深）+ 每串口接收分发任务（栈 3072B，优先级 5） |\n| 串口反初始化 | `HalUartDeinit()` | 删任务、卸驱动、释放缓冲 |\n| 运行时改波特率 | `HalUartSetBaud()` | 不重初始化直接更新指定串口波特率 |\n| 阻塞发送 | `HalUartSend()` | 无 TX 环形缓冲直写 FIFO，`TimeoutMs` 约束等待发送完成 |\n| 读取数据 | `HalUartRead()` | 从驱动环形缓冲读取，超时 0 = 立即返回已有数据 |\n| 查询可读字节数 | `HalUartRxCountGet()` | 轮询场景使用 |\n| 清空接收 | `HalUartRxClear()` | 清缓冲 + 复位事件队列 |\n| 事件回调注册 | `HalUartSetCallback()` | 全串口共用回调按 Port 区分；事件在接收任务上下文上抛（非中断） |\n\n事件链：`uart 驱动 ISR（ESP-IDF 内部 FromISR 入队）→ 每串口接收任务 → 回调（RX / RX_OVF / RX_FULL）`。帧间隔超时 3 符号时间触发 RX 事件。\n\n### hal_led（LED GPIO 驱动，封装 ESP-IDF gpio 驱动）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| LED 初始化 | `HalLedInit()` | 按引脚表（`hal_led.c` 内 `G_LedPinTable`）配置推挽输出并默认熄灭，可重复调用 |\n| LED 状态控制 | `HalLedCtrl()` | 点亮/熄灭/翻转（TOGGLE 经电平缓存取反），`HalLed_E` 编号寻址 |\n\n> 引脚映射集中在 `hal_led.c` 的 `G_LedPinTable`（HAL_LED_1 → GPIO2）；上层经 `HalLed_E` 枚举访问，不感知 GPIO 编号。\n\n### hal_key（按键 GPIO 驱动，封装 ESP-IDF gpio 驱动）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 绑定任意 GPIO 为按键 | `HalKeyBind()` | 指定按键编号（`HalKey_E` 槽位）+ 任意 GPIO（0~39）+ 有效电平（低/高）；配置为输入并按有效电平使能内部上/下拉；GPIO6~11（模组 Flash）黑名单拒绝，GPIO34~39 无内部上下拉（低有效需外部上拉）；重复绑定覆盖旧绑定 |\n| 读取按键电平 | `HalKeyRead()` | 非阻塞直读输入电平与有效电平比对，1=按下 / 0=松开 / -1=未绑定或参数非法；无消抖（消抖由 BSP 状态机完成） |\n\n> 按键槽位（HAL_KEY_1~4）与 GPIO 编号完全解耦，运行时经 `HalKeyBind` 绑定任意 GPIO；上层经槽位编号访问，不感知 GPIO。\n\n### hal_wifi（WiFi 驱动，封装 ESP-IDF esp_wifi/netif/nvs_flash，AP+STA 双模）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| WiFi 初始化 | `HalWifiInit()` | 初始化 NVS/netif/esp_wifi 并启动 SoftAP+STA 双模：SoftAP 常开供配网，STA 用于连接路由器；热点配置经 `HalWifiApConfig_S`（SSID/密码/信道 1~13/最大接入 1~4），密码空串=开放热点，0 值字段取默认（信道 1 / 接入 2） |\n| STA 凭据保存 | `HalWifiStaConfigSave()` | SSID/密码写入 NVS（命名空间 `wifi`，键 `ssid`/`pwd`）持久化，掉电不丢 |\n| STA 凭据读取 | `HalWifiStaConfigLoad()` | 从 NVS 读回凭据（自动截断至缓冲尺寸），供上层展示/回填 |\n| STA 凭据清除 | `HalWifiStaConfigClear()` | 擦除 NVS 凭据（键不存在视为已清除）；供“清除配网”接口使用 |\n| STA 信号强度查询 | `HalWifiStaRssiGet()` | 当前关联 AP 的 RSSI（dBm 负值），未连接返回失败 |\n| STA 发起连接 | `HalWifiStaConnect()` | 从 NVS 读凭据写入 STA 配置并连接（无凭据返回失败）；断开后可再次调用重试 |\n| STA 断开 | `HalWifiStaDisconnect()` | 主动断开当前连接 |\n| STA 状态查询 | `HalWifiStaStateGet()` | 返回 IDLE（无凭据/未连接）/ CONNECTING（连接中）/ CONNECTED（已获 IP） |\n| STA IP 查询 | `HalWifiStaIpGet()` | 输出点分十进制 IP 字符串（含结束符最长 16B） |\n| STA 收发字节查询 | `HalWifiStaTrafficGet()` | 开机累计 TX/RX 字节（数据源 `CONFIG_ESP_NETIF_REPORT_DATA_TRAFFIC` 包事件，含 NAPT 中继流量；32bit 自然回绕，上层差值法求速率）※当前固件未集成，接口随网速显示功能预留 |\n| SoftAP NAT 中继 | 无新增 API（事件内自动启停） | STA 联网即开 NAPT：热点客户端报文改写源地址借道 STA 上网 + DHCP 下发 DNS（优先上游网关，退回 223.5.5.5）；STA 断开自动关闭、重连自动恢复 |\n| 周边热点扫描 | `HalWifiScanGet()` | 阻塞式全信道扫描（约 1.5~3s），按 RSSI 降序同名去重，最多 20 条（SSID/信号强度/是否加密）；扫描期间 SoftAP 信标短暂停发属正常 |\n| 事件回调注册 | `HalWifiSetCallback()` | GOT_IP / DISCONNECTED 事件上抛（运行于 ESP-IDF 事件任务上下文） |\n\n事件链：`esp_wifi 驱动 → ESP-IDF 事件循环任务 → 事件回调（GOT_IP / DISCONNECTED）→ BSP 转发 APP`。STA 关联参数：认证门槛取 `WIFI_AUTH_OPEN`（任意认证模式可关联）+ PMF capable（兼容 WPA3/混合网络）。\n\n> **NAPT 热点中继**（sdkconfig：`LWIP_IP_FORWARD` + `LWIP_IPV4_NAPT`）：STA 联网即自动开启 —— 热点客户端（192.168.4.x）经 NAPT 改写源地址借道 STA 上网，DNS 由 DHCP 下发（优先上游网关，无效退回 223.5.5.5）；STA 断开自动关闭、重连自动恢复。单射频半双工中继，预期带宽 10~20Mbps，高清视频可能缓冲。\n\n### hal_http（HTTP/WebSocket 服务器驱动，封装 ESP-IDF esp_http_server，双实例架构）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 服务器初始化 | `HalHttpInit()` | 启动**双实例**：实例1（80 端口：内置页+/api 接口，并发 4）；实例2（81 端口：WebSocket 专用，并发 4，ctrl_port 32769 与实例1区分，send_wait_timeout=1s）；socket 总预算 `CONFIG_LWIP_MAX_SOCKETS=16` |\n| URI 注册 | `HalHttpUriRegister()` | 按 `HalHttpUri_S` 注册路径+方法（GET/POST/WS）+回调；**WS 路由自动注册到 81 端口实例**；配置须长期保活（建议常量/静态存储） |\n| 请求体长度 | `HalHttpReqContentLen()` | POST 请求体长度（字节） |\n| 请求体接收 | `HalHttpReqContentRecv()` | 读 POST 请求体到调用方缓冲（表单解析用） |\n| 请求应答 | `HalHttpReqRespond()` | 按 HTTP 状态码/Content-Type/响应体回复 |\n| WebSocket 收帧 | `HalHttpReqWsRecv()` | 读一帧 WS 数据；超长帧自动丢弃不阻塞 |\n| WebSocket 推送 | `HalHttpWsPush()` | 向**全部在册且握手完成**的 WS 连接推二进制帧（跨任务安全但可能阻塞，勿在主循环/事件任务高频调用） |\n| WebSocket 文本推送 | `HalHttpWsPushText()` | 同上，推文本帧（JSON 状态用） |\n\n> **WS 连接登记表机制**：81 实例配 `open_fn/close_fn` 回调精确登记/注销连接 fd（fd 号为 VFS 全局分配不可盲扫，实测可达 57）；`ws_post_handshake_cb` 钩子（需 `CONFIG_HTTPD_WS_POST_HANDSHAKE_CB_SUPPORT=y`）标记握手完成——**IDF 握手时不调 URI 处理器**，握手未完成前推送会打乱 101 响应故设就绪门控；**推送失败≠会话死亡不注销**（超时/窗口满仅暂时不可达），注销只由 close_fn 唯一负责，否则洪水期一次超时就把活连接踢出名单致显示永久停止。`HalHttpReq_S` 的 `pRaw` 为厂商句柄占位，上层保持 opaque。\n\n### hal_spp（经典蓝牙 SPP 驱动，封装 ESP-IDF Bluedroid SPP，服务端模式）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| SPP 初始化 | `HalSppInit()` | 初始化 BT 控制器（CLASSIC_BT）+ Bluedroid 协议栈 + SPP 增强模式，并以服务端身份启动 SPP 服务（异步，INIT 事件内拉起）被动等待客户端接入；入参设备名/服务名 |\n| SPP 发送 | `HalSppSend()` | 向已连接客户端发数据；未连接返回 -2，链路拥塞（CONG）返回 -3 暂缓重发 |\n| 连接状态查询 | `HalSppIsConnected()` | 1=已连接 / 0=未连接 |\n| 事件回调注册 | `HalSppSetCallback()` | OPENED / CLOSED / DATA 事件上抛（运行于 Bluedroid 事件任务上下文） |\n\n事件链：`BT 控制器 → Bluedroid 事件任务 → SPP 回调（OPENED/CLOSED/DATA）→ BSP 转发 APP`；单连接模型，新客户端接入自动接管旧连接。\n\n## BSP 层功能记录\n\n### bsp_uart（板载串口封装：覆盖全部 3 路硬件串口）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 板载串口初始化 | `BspUartInit()` | 按 `bsp_uart.h` 使能宏（`BSP_UART_DBG_EN`/`BSP_UART_EXT_EN`/`BSP_UART_COMM_EN`）逐路初始化 DBG（UART0）/EXT（UART1）/COMM（UART2），波特率/引脚集中在 `bsp_uart.h` 配置，帧格式默认 8N1；先挂事件转发再逐路 Init，某路失败不阻断其余路 |\n| 板载串口反初始化 | `BspUartDeinit()` | 指定路转调 `HalUartDeinit()`，卸驱动释放资源 |\n| 运行时改波特率 | `BspUartSetBaud()` | 指定路转调 `HalUartSetBaud()`，不重初始化 |\n| 语义串口发送 | `BspUartSend()` | `BspUart_E` 语义号（DBG/EXT/COMM）经映射表转发对应硬件串口 |\n| 语义串口读取 | `BspUartRead()` | 同上 |\n| 查询可读字节数 | `BspUartRxCountGet()` | 同上 |\n| 清空接收 | `BspUartRxClear()` | 指定路清接收缓冲 + 复位事件队列 |\n| 事件回调注册 | `BspUartSetCallback()` | 接收 HAL 事件（反查映射表）转为带 Port 号的板级语义事件转发 APP |\n\n### bsp_led（板载灯封装）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 板载灯初始化 | `BspLedInit()` | 转调 HAL LED 初始化 |\n| 板载灯设置 | `BspLedSet()` | 语义灯号/状态（`BspLed_E`/`BspLedState_E`）→ HAL 硬件灯号映射输出 |\n\n> 语义映射集中在 `bsp_led.c`：`BSP_LED_RUN`（运行灯）→ `HAL_LED_1`（GPIO2 板载灯）。LED 为 GPIO 直控器件，无 DRV 层（第 2 节注）。\n\n### bsp_key（按键消抖扫描状态机：按住/按下/松开/单击/双击/长按/连发事件识别）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 按键模块初始化 | `BspKeyInit()` | 复位全部按键状态机，清空绑定与事件标志 |\n| 绑定任意 GPIO 为按键 | `BspKeyBind()` | 转调 `HalKeyBind` 并复位该键状态机；返回 0 成功 / -1 参数 / -2 裁剪 / -3 HAL 失败 |\n| 扫描状态机 | `BspKeyTick()` | 须由 APP 以 10ms（`BSP_KEY_TICK_PERIOD_MS`）周期调用；内部 20ms（`BSP_KEY_SCAN_PERIOD_MS`）消抖采样，事件识别方式与 Doc/drv_key 标志位状态机一致；未绑定按键自动跳过 |\n| 查询消费按键事件 | `BspKeyCheck()` | 传入事件标志（`BSP_KEY_HOLD/DOWN/UP/SINGLE/DOUBLE/LONG/REPEAT`，可按位或）查询，命中返回 1 并清除已消费标志（HOLD 为电平态不清除）；0 未命中 |\n| 长按阈值配置 | `BspKeyTimeLongSet()` | 运行时修改长按判定时间（默认 3000ms，双击窗口 50ms / 连发周期 100ms 在 `bsp_key.h` 宏配置） |\n\n> 按键为 GPIO 直控器件，无 DRV 层（第 2 节注），BSP 直达 HAL；状态机移植自 Doc/drv_key（0~4 态：空闲→按下→双击窗口→双击松开→长按连发），事件标志 0x01~0x40 与参考实现一致。\n\n### bsp_wifi（板载 WiFi 封装：配网热点参数 + 自动重连组织）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| WiFi 模块初始化 | `BspWifiInit()` | 以 `bsp_wifi.h` 集中定义的热点参数（SSID `ESP32_Config`/密码 `12345678`/信道 6/接入 2）初始化 AP+STA 双模；NVS 有凭据则自动发起 STA 连接 |\n| 配网凭据下发 | `BspWifiConfigSet()` | 保存 SSID/密码到 NVS 并连接（网页表单提交路径）；IDLE 态直接发起，连接中/已连接态先断开、由断开事件回调自动以新凭据重连（规避 disconnect 未完成即 connect 的状态冲突） |\n| 当前 SSID 查询 | `BspWifiConfigSsidGet()` | 从 NVS 读回已配网 SSID（状态栏展示用） |\n| 完整凭据读取 | `BspWifiConfigGet()` | 读回完整 SSID+密码（配网接口失败时恢复原配置用） |\n| 凭据清除 | `BspWifiConfigClear()` | 擦除 NVS 凭据（“清除配网”接口，清除后重启回纯热点待配网态） |\n| 信号强度查询 | `BspWifiStaRssiGet()` | 当前关联 AP 的 RSSI（dBm 负值），未连接返回失败 |\n| 周边热点扫描 | `BspWifiScanGet()` | 转发 HAL 扫描（阻塞 1.5~3s，最多 20 条）；扫描期间挂起自动重连（扫描与关联互斥），扫描结束恢复连接尝试 |\n| STA 状态查询 | `BspWifiStaStateGet()` | IDLE / CONNECTING / CONNECTED 板级语义 |\n| STA IP 查询 | `BspWifiStaIpGet()` | 点分十进制 IP 字符串 |\n| STA 收发字节查询 | `BspWifiStaTrafficGet()` | ※当前固件未集成（随网速显示功能预留） |\n| 事件回调注册 | `BspWifiSetCallback()` | GOT_IP / DISCONNECTED 事件转发 APP；**断线时本层自动重连**（DISCONNECTED 事件内重发 `HalWifiStaConnect`，重试上限 `BSP_WIFI_RETRY_MAX`=20 次防密码错误死循环，GOT_IP 清零计数） |\n\n> WiFi 为片上外设，无 DRV 层（第 2 节注），BSP 直达 HAL；热点参数集中在 `bsp_wifi.h`，换板改此处。\n\n### bsp_web（板载网页封装：暗色单页三标签 + /api 接口 + WS 通道，参照 ESP8266-develop 工程）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 网页模块初始化 | `BspWebInit()` | 启动双实例 HTTP 服务器并注册 9 路由：GET `/`（内置暗色单页：**配网/串口终端/转发**三标签，GitHub 风格，由参考工程 web_page.h 自动生成于 `web_page_ported.h`）；GET `/api/status`（状态 JSON）、GET `/api/scan`（扫描列表 ssid/rssi/secure）；POST `/api/wifi`（同步等连接 12s，失败恢复原配置）、POST `/api/serial`（波特率 300~2000000 + NVS 持久化）、POST `/api/forward`（转发配置+蓝牙开关）、POST `/api/reboot`、POST `/api/resetwifi`（清凭据+延时重启）；WS `/`（81 端口数据通道） |\n| 事件回调注册 | `BspWebSetCallback()` | 上抛 3 类事件：WS_OPEN / WS_DATA（网页终端发送数据）/ FORWARD_SET（转发配置提交，格式 `proto\\nip\\nport\\nbt`）；回调运行于 HTTP 服务器任务上下文 |\n| 状态提供者注册 | `BspWebStatusProviderSet()` | APP 层注册回调供 `/api/status` 拉取实时状态 JSON（避免 BSP 反向依赖 APP） |\n| WS 二进制广播 | `BspWebWsBroadcast()` | 向全部在册且握手完成的连接推二进制帧（内部经 HAL 登记表定向，单次调用即达全部） |\n| WS 文本广播 | `BspWebWsBroadcastText()` | 同上推文本帧（状态 JSON 用） |\n\n> 页面 JS 3s 轮询 `/api/status` + WS 文本推送双路刷新状态卡（模式/SSID/IP/信号强度/波特率/内存/运行时长/收发字节/转发状态）；`/api/wifi` 同步阻塞等待（vTaskDelay 让出 CPU 保证 WiFi 事件推进）；`/api/reboot` 与 `/api/resetwifi` 应答后经 esp_timer 延时 500ms 重启（先送响应再重启）；表单经 URL 解码（`%XX` 与 `+`）拆字段。\n\n### bsp_bt（板载蓝牙封装：经典蓝牙 SPP 透传通道）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 蓝牙模块初始化 | `BspBtInit()` | 以 `bsp_bt.h` 集中定义的设备名 `ESP32-UART` / 服务名 `ESP32_SPP` 启动 SPP 服务端，等待手机/电脑蓝牙串口客户端接入 |\n| SPP 发送 | `BspBtSppSend()` | 向已连接客户端透传数据 |\n| 连接状态查询 | `BspBtSppIsConnected()` | 1=已连接 / 0=未连接 |\n| 事件回调注册 | `BspBtSetCallback()` | OPENED / CLOSED / DATA 事件转发 APP（DATA 数据仅回调期间有效） |\n\n> 蓝牙为片上外设，无 DRV 层（第 2 节注），BSP 直达 HAL；与 WiFi 共存依赖 `CONFIG_ESP_COEX_SW_COEXIST_ENABLE` 软件共存。\n\n### bsp_store（板载配置存储封装：NVS 键值对，对应参考工程 LittleFS /config.txt 机制）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 存储初始化 | `BspStoreInit()` | 打开 NVS 命名空间 `xcom`（句柄常开复用；须在 WiFi 初始化（NVS 就绪）后调用） |\n| 字符串写入/读取 | `BspStoreSetStr()` / `BspStoreGetStr()` | 键值对字符串，写入立即 commit 持久化 |\n| 整型写入/读取 | `BspStoreSetU32()` / `BspStoreGetU32()` | 32 位无符号整型，读取无键返回默认值 |\n\n> 当前存储键：`baud`（波特率）、`fwproto`/`fwip`/`fwport`（转发配置）、`btsw`（蓝牙转发开关）；WiFi 凭据仍在 `wifi` 命名空间由 hal_wifi 管理。\n\n## APP 层功能记录\n\n### app_uart（串口回显业务）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 业务初始化 | `AppUartInit()` | 注册回调 + 初始化板载串口（`BspUartInit` 按使能宏逐路），回显业务挂 COMM 口；`CFG_APP_NET_EN=1` 时通信口回调在 `AppNetInit` 末尾被 app_net 接管（本业务退化为 EXT/DBG 口可用） |\n| 事件处理 | `AppUartEventHandler()`（内部） | RX/RX_FULL 事件读取数据原样回发，单帧超 128B 分批搬运 |\n| 业务发送 | `AppUartSend()` | 对外上报/应答统一出口（转 BSP 通信口） |\n\n### app_led（LED 闪烁策略）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 业务初始化 | `AppLedInit()` | 转调 BSP 板载灯初始化 |\n| 闪烁策略处理 | `AppLedBlinkProcess()` | 运行灯 1Hz 心跳（500ms 翻转一次），按主循环调度周期累加节拍 |\n\n### app_key（按键事件消费业务）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 业务初始化 | `AppKeyInit()` | 初始化 BSP 按键模块并按 `app_key.c` 顶部宏（`APP_KEY_1_GPIO_NUM`/`APP_KEY_1_ACTIVE_LOW`）绑定默认按键（BSP_KEY_1 → GPIO0 BOOT 键，低有效）；换绑任意 GPIO 只改该宏；绑定失败打印告警不阻断启动 |\n| 扫描驱动与事件消费 | `AppKeyProcess()` | 先驱动 `BspKeyTick()` 扫描状态机，再消费事件：单击翻转运行灯 + 打印，双击/长按/连发打印事件名（演示用，用户在此挂自己的业务） |\n\n### app_net（网络业务：WiFi 配网 + 网页串口终端 + 转发 + 蓝牙的数据路由中枢）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 业务初始化 | `AppNetInit()` | 依次拉起 bsp_wifi → bsp_store（加载持久化波特率/蓝牙开关并应用）→ bsp_web（注册事件回调 + 状态提供者 + 创建 ws_tx 发送任务）→ bsp_bt → 接管 UART0/UART2 回调 → app_forward（按持久化配置恢复转发通道） |\n| 周期处理 | `AppNetProcess()` | 主循环槽：转发通道轮询（TCP 重连/收数据 + UDP 收数据）+ NTP 首次成功日志；**不含任何 WS 推送**（全部在 ws_tx 任务，防阻塞发送冻结主循环） |\n| WS 发送任务 | `AppNetWsTxTask()`（内部） | 专职任务（10ms 节拍）：合批排水 + 发送回显排水 + 状态推送（3s 周期/事件请求）；所有可能阻塞的 WS 推送集中于此，慢客户端仅延迟显示不冻结系统 |\n| 合批缓冲追加 | `AppNetWsTxAppend()` | 串口/转发入向/回显数据先入乒乓双缓冲（512B×2，跨任务安全）；满 30ms 或缓冲将满时合并为一帧广播（防 10ms 级高频逐帧推送卡顿） |\n\n**数据路由规则**（本模块为五条业务通路的中枢）：\n\n| 输入事件 | 路由动作 |\n|---------|---------|\n| UART2/UART0 RX（外部串口设备/COM15 → ESP32） | 三路转发：① 经合批缓冲 → WS 广播到网页终端；② SPP 发给已连接蓝牙客户端（受蓝牙转发开关控制，NVS 持久化默认关）；③ 网络转发推送（AppForwardPush）；收发计数累加 |\n| WS_DATA（网页终端发送） | 写 UART2 + UART0 TX（COM15 串口助手可见）+ 同步网络转发 + 经回显缓冲广播回终端（发送可见） |\n| BT DATA（蓝牙客户端发送） | 写 UART2 TX（到达外部串口设备） |\n| FORWARD_SET（转发配置提交） | 拆四段 `proto\\nip\\nport\\nbt`：蓝牙开关立即生效并持久化；转发参数交 app_forward 校验/持久化/应用 |\n| WS_OPEN（新网页连接） | 不做即时推送（3s 周期推送兜底；握手上下文推送会死锁服务器任务） |\n\n> 状态 JSON 与参考工程 `/api/status` 字段一致：`ver/mode/ssid/ip/rssi/heap/baud/uptime/rx/tx/ws/fwproto/fwip/fwport/fwup/fwrx/fwtx/bt`（3s 周期 + WS 文本推送双路刷新页面状态卡）。WS 与蓝牙之间不互转（均为远端，仅与串口互通），避免回环。\n\n### app_forward（串口转发业务：UART2 ↔ TCP 客户端/UDP 双向透传，参照 ESP8266-develop 工程移植）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 初始化恢复 | `AppForwardInit()` | 从 NVS 加载转发配置（fwproto/fwip/fwport）并按上次配置恢复通道 |\n| 配置设置 | `AppForwardConfigSet()` | 校验（IP 格式/端口 1~65535）+ NVS 持久化 + 立即应用（关闭旧通道建新通道） |\n| 轮询 | `AppForwardPoll()` | 主循环槽（10ms）：TCP 非阻塞连接 select 探测 + 2s 重连；网络入向数据 → 写 UART2 + 经合批缓冲显示到网页终端 + 计数 |\n| 串口→网络 | `AppForwardPush()` | 串口 RX 数据推送到网络目标（TCP 已连接才发，未连接丢弃；UDP 直接 sendto，本地绑 INADDR_ANY 对称端口） |\n| 状态查询 | `AppForwardXxxGet()` 系列 | proto/ip/port/up/rx/tx 供状态 JSON 组装（TCP up=已连接，UDP up=socket 已建） |\n\n> 转发目标必须是设备可达地址（VMware 虚拟网卡等本机专用网段路由不到，UDP 无连接故“已连接”但丢包、TCP 诚实报连不上）；网络入向数据同时写入串口与网页终端显示（双向可视）。\n\n### app_main（应用入口与主调度）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 启动调度 | `app_main()` | 打印横幅 → 初始化业务模块（按开关宏裁剪，app_net 网络业务最后初始化：蓝牙协议栈装载阻塞数秒属正常）→ 主循环按 `APP_MAIN_PROCESS_PERIOD_MS`（10ms）周期轮询各业务槽 |\n| 调度周期 | `APP_MAIN_PROCESS_PERIOD_MS` 宏 | 主循环节拍（10ms），各业务 Process 须非阻塞 |\n\n## 硬件号数据流转\n\n**数据通路清单表**：\n\n| 通路 | ①输入源 | ②采集/解析 | 触发·频率 | ③数据落点 | ④消费方 | ⑤输出 |\n|------|---------|-----------|----------|----------|---------|-------|\n| P1 通信串口 | 外部设备/PC 终端 → UART2 RX（GPIO16） | esp-idf uart 驱动 ISR + hal_uart 接收任务事件分发 | 中断触发（帧间隔超时 3 符号 / 缓冲阈值） | uart 驱动 RX 环形缓冲 256B | app_uart 回显处理（回调上下文） | bsp_uart → hal_uart → UART2 TX（GPIO17）原样回发 |\n| P2 运行灯 | 调度节拍（app_main 主循环 10ms） | app_led 闪烁策略（500ms 到期翻转） | 1Hz 槽（主循环轮询，非阻塞） | G_BlinkTick 节拍累加器 | app_led 闪烁策略 | bsp_led → hal_led → GPIO2 板载灯亮灭 |\n| P3 按键 | BOOT 键按下/松开（GPIO0 电平变化） | bsp_key 扫描状态机（`BspKeyTick` 主循环 10ms 驱动，20ms 消抖采样，识别单击/双击/长按/连发） | 轮询槽（主循环轮询，非阻塞） | G_KeyFlag 每键事件标志（0x01~0x40 位图） | app_key 事件消费（`BspKeyCheck` 消费型读取） | 单击 → bsp_led → hal_led 翻转 GPIO2 运行灯 + UART0 日志打印事件 |\n| P4 WiFi 配网 | 手机/电脑连接热点 `ESP32_Config` → 浏览器提交表单（POST /wifi） | hal_http 服务器任务 + bsp_web 表单解析（URL 解码 + 字段拆分 `ssid\\npwd`） | 浏览器请求触发 | 事件回调参数（栈上透传） | app_net 配网处理（`BspWifiConfigSet`） | bsp_wifi → hal_wifi → NVS 持久化 + STA 连接路由器；页面重定向回首页 |\n| P5 串口→网页 | 外部串口设备/COM15 → UART2/UART0 RX | esp-idf uart 驱动 ISR + hal_uart 接收任务事件分发 | 中断触发（帧间隔超时 3 符号） | uart 驱动 RX 环形缓冲 256B | app_net 串口路由（256B 分批） | ① 经合批缓冲（30ms 合帧）→ ws_tx 任务 → WS 广播显示；② bsp_bt → hal_spp → 蓝牙客户端（蓝牙开关控制）；③ app_forward → TCP/UDP 目标 |\n| P6 网页→串口 | 浏览器串口终端发送（WS 帧） | hal_http WS 收帧 + bsp_web 事件上抛 | 浏览器发送触发 | 事件回调参数（仅回调期间有效） | app_net 网页路由 | bsp_uart → UART2+UART0 TX（COM15 串口助手可见）+ app_forward 同步转发 + 回显缓冲→终端显示 |\n| P7 蓝牙→串口 | 手机/电脑蓝牙串口客户端发送（SPP） | hal_spp Bluedroid 事件任务 + bsp_bt 事件转发 | 蓝牙接收触发 | 事件回调参数（仅回调期间有效） | app_net 蓝牙路由 | bsp_uart → hal_uart → UART2 TX（GPIO17）到达外部串口设备 |\n| P8 网络转发（双向） | UART2 RX ↔ TCP/UDP 目标 | app_forward 轮询（非阻塞 connect+select 探测，2s 重连） | 主循环 10ms 槽 | 合批缓冲（显示路径） | app_net / app_forward | 串口→网络：send/sendto；网络→串口：recv 后写 UART2 + 终端显示 + 计数 |\n\n**分阶段流程图**：\n\n```mermaid\nflowchart LR\n    subgraph S1[①输入源]\n        A1[PC串口终端/外部设备<br>UART2 RX GPIO16]\n        A2[app_main主循环节拍<br>10ms调度槽]\n        A3[BOOT键按下/松开<br>GPIO0电平变化]\n        A4[手机/电脑浏览器<br>WiFi配网表单提交]\n        A5[浏览器串口工具<br>WebSocket发送]\n        A6[蓝牙串口客户端<br>SPP发送]\n    end\n    subgraph S2[②采集/解析]\n        B1[esp-idf uart驱动 ISR<br>FromISR入队]\n        B2[hal_uart接收任务<br>事件分发+回调上抛]\n        B2x[app_led闪烁策略<br>500ms翻转]\n        B3[bsp_key扫描状态机<br>10ms驱动20ms消抖采样]\n        B4[hal_http服务器任务<br>bsp_web表单解析/WS收帧]\n        B5[hal_spp Bluedroid事件<br>bsp_bt事件转发]\n    end\n    subgraph S3[③数据缓存/命令]\n        C1[uart驱动RX环形缓冲<br>256B]\n        C2[G_BlinkTick<br>节拍累加器]\n        C3[G_KeyFlag事件标志位图<br>单击/双击/长按/连发]\n        C4[NVS wifi命名空间<br>ssid/pwd持久化]\n    end\n    subgraph S4[④决策]\n        D1[app_uart回显处理<br>超128B分批搬运]\n        D2[运行灯TOGGLE命令<br>BSP_LED_RUN]\n        D3[app_key事件消费<br>BspKeyCheck读后清除]\n        D4[app_net数据路由<br>UART2↔WS/SPP双向互通]\n    end\n    subgraph S5[⑤输出]\n        E1[bsp_uart→hal_uart<br>阻塞发送]\n        E2[UART2 TX GPIO17<br>回显数据/网页蓝牙下发]\n        E3[bsp_led→hal_led<br>GPIO电平输出]\n        E4[GPIO2板载LED<br>1Hz心跳/按键翻转]\n        E5[bsp_web→hal_http<br>WS异步广播]\n        E6[bsp_bt→hal_spp<br>SPP透传发送]\n        E7[浏览器串口工具显示<br>手机/电脑蓝牙接收]\n    end\n    A1 -.中断直达.-> B1\n    B1 -.事件队列.-> B2\n    B1 --> C1\n    B2 -->|回调 P1:RX事件+Len| D1\n    D1 -->|BspUartRead 0超时| C1\n    D1 --> E1 --> E2\n    A2 -->|P2:10ms轮询| B2x --> C2\n    C2 -->|P2:500ms到期| D2 --> E3 --> E4\n    A2 -->|P3:10ms轮询| B3\n    A3 -->|20ms消抖采样| B3 --> C3\n    C3 -->|P3:命中事件| D3\n    D3 -->|单击| E3\n    D3 -->|UART0日志打印| E2\n    A4 -->|P4:POST /wifi| B4\n    B4 -->|P4:WIFI_SAVE事件| D4\n    D4 -->|P4:保存凭据| C4\n    B2 -->|P5:RX事件+Len| D4\n    D4 -->|P5:串口数据| E5 --> E7\n    D4 -->|P5:串口数据| E6 --> E7\n    A5 -->|P6:WS /ws帧| B4\n    B4 -->|P6:WS_DATA事件| D4\n    D4 -->|P6:下发数据| E1\n    A6 -->|P7:SPP数据| B5\n    B5 -->|P7:BT DATA事件| D4\n    D4 -->|P7:下发数据| E1\n```\n\n> 虚线 `-.->` = 中断直达；实线 `-->` = 任务上下文阻塞/轮询。日志通路（UART0）为系统通路，不计入特性表。\n>\n> 下图为基础通路示意；串口→蓝牙/网络转发与 30ms 合批机制见上方通路表（P5/P8）。\n\n## 构建与烧录\n\n```powershell\n# VS Code ESP-IDF 扩展：配置扩展指向 ESP-IDF 安装目录后，用底部状态栏 Build/Flash/Monitor\n# 命令行（每个新终端先激活环境）：\ncd <ESP-IDF安装目录>; .\\export.bat\ncd f:\\00.Code\\11ESP\\ESP-32\nidf.py set-target esp32      # 首次（生成 sdkconfig；sdkconfig.defaults 已指定 esp32，亦可直接 build）\nidf.py build\nidf.py -p COMx flash monitor # COMx 换实际串口号，退出监视 Ctrl+]\nidf.py size                  # 资源占用检查（结果回填 Project_Level_Skill.md 13.4 节）\n```\n\n## 功能验证（回显 Demo）\n\n1. USB-TTL 模块：TX→GPIO16，RX→GPIO17，GND 共地（注意**不要**接模组 GPIO1/3，那是日志/下载口）\n2. PC 串口助手打开 USB-TTL 对应串口，115200-8N1\n3. 烧录后日志口（UART0，板载 USB 转串口，115200）打印 `[app_uart] comm port ready`\n4. 串口助手发送任意字符串（≤128B 一次回完，更长分批），收到相同内容即通路正常\n\n## 功能验证（按键 Demo）\n\n1. 无需接线：默认按键绑定 DevKitC 板载 BOOT 键（GPIO0，低有效）\n2. **单击** BOOT 键：GPIO2 运行灯翻转，日志口打印 `[app_key] key1 single: toggle led`\n3. **双击**（间隔 <50ms+50ms 窗口）：打印 `[app_key] key1 double`\n4. **长按** ≥3s：打印 `[app_key] key1 long`，继续按住每 100ms 打印 `[app_key] key1 repeat`\n5. 换绑任意 GPIO：改 `app_key.c` 顶部 `APP_KEY_1_GPIO_NUM` 宏（或运行时调 `BspKeyBind`），注意 GPIO6~11 黑名单与 GPIO34~39 无内部上下拉约束\n\n## 功能验证（WiFi 配网 / 网页串口 / 蓝牙 Demo）\n\n**准备**：USB-TTL 模块 TX→GPIO16 / RX→GPIO17 / GND 共地（同回显 Demo 接线）；烧录后热点 `ESP32_Config`（密码 `12345678`）自动开启，日志口打印 `[app_net] ...` 系列。\n\n**① WiFi 网页配网（扫描列表选择）**：\n\n1. 手机/电脑连接热点 `ESP32_Config`，浏览器访问 `http://192.168.4.1` → 暗色单页（**配网 / 串口终端 / 转发**三标签，GitHub 风格）\n2. 配网页签点“扫描”（约 2~3s）→ 列表按信号强度排列（ESP32 仅支持 2.4GHz；5GHz 频段的 SSID 物理不可连）\n3. 选择路由器（SSID 自动填入）→ 输密码 → 点“连接”（同步等待最长 12s）：成功显示 IP，失败自动恢复原配置并提示\n4. 重启 ESP32 验证凭据持久化：自动连接无需再配网\n\n> 注：密码错误时重试 20 次后停止自动重连（防死循环），重新提交正确密码即可；也可不经扫描直接手动输入 SSID。\n\n**② 网页串口终端（四路数据源）**：\n\n1. 切到“串口终端”标签自动建立 WebSocket（81 端口）；状态卡 3s 自动刷新（模式/SSID/IP/信号强度/波特率/可用内存/运行时长/收发字节/转发状态）\n2. 接收区显示四路数据：UART2 设备数据、COM15（调试口）数据、网页发送回显、**网络转发入向数据**（30ms 合帧防高频卡顿）\n3. 发送区输入 → 点发送 → UART2 与 COM15 串口助手**同时**收到，且同步走网络转发\n4. 页面可改波特率（300~2000000），NVS 持久化重启保留\n\n**③ 蓝牙 SPP 透传（含转发开关）**：\n\n1. 手机安装蓝牙串口 App（如 Serial Bluetooth Terminal），搜索并连接 `ESP32-UART`（**已配对过的设备在“已配对列表”里，不会出现在搜索列表**）\n2. 日志打印 `[bsp_bt] spp opened`\n3. **转发页签开启“蓝牙转发”开关并保存**（默认关）→ 串口数据同步推到手机 App（串口→蓝牙）\n4. 手机 App 发数据 → 串口助手收到（蓝牙→串口，不受开关影响）；开关状态 NVS 持久化\n\n> **无线环境使用法则（实测踩坑）**：模块插在电脑上或靠近路由器时，电脑 WiFi/USB3.0 噪声与路由器 2.4GHz 会把蓝牙可发现距离从正常 10 米+压缩到约 0.5 米——现象为“搜索时有时无/搜不到”，易误判为固件或硬件故障。**用蓝牙时让模块离开电脑/路由器 1 米以上**。排查路径：①官方例程交叉验证（排除代码）→ ②SDP 直连查询（区分射频通/断）→ ③距离梯度测试（0.5m/2-3m）→ ④充电宝隔离测试（区分干扰 vs 硬件）。另：SPP 服务注册会复位 GAP 设置，设备名/可发现模式须在 `esp_spp_start_srv` 后重新应用。\n\n**④ 热点上网（NAT 中继）**：\n\n1. 前提：① 配网完成且日志已打印 `[app_net] wifi connected`（NAPT 自动开启，日志见 `[hal_wifi] nat on: ap clients online via sta (dns ...)`）\n2. 手机**关闭移动数据**，连接热点 `ESP32_Config`；若此前连过须先“忘记此网络”再连（重新获取 DHCP 下发的 DNS）\n3. 浏览器打开任意网站应正常加载；短视频 App 可正常刷（单射频中继，预期 10~20Mbps，高清可能缓冲）\n4. STA 断网（如关路由器）：热点与 192.168.4.1 配网页仍可用，仅外网断开；路由恢复后 NAPT 自动重开\n\n**⑤ TCP/UDP 转发（UART2 ↔ 网络目标双向透传）**：\n\n1. 转发页签 → 模式选 **TCP 客户端** 或 **UDP** → 填目标 IP 与端口（目标必须是设备可达地址）→ 保存（NVS 持久化重启恢复）\n2. UART2/COM15 收到的数据实时转发到目标；目标发来的数据写入 UART2 并同步显示在网页终端（双向可视）\n3. 验证：PC 网络调试助手本地监听地址绑 `0.0.0.0`，目标填 PC 局域网 IP → 串口助手发数据到网络助手、反向发送到串口\n4. 注意：目标不可达时 TCP 显示“未连接”（诚实），UDP 无连接概念显示已连接但丢包；VMware 虚拟网卡等本机专用网段地址不可作目标；TCP 断开后 2s 自动重连\n\n## MCU 移植提示\n\n更换 MCU（如 ESP32-S3/C3）仅需重写 `hal_uart.c` / `hal_led.c` / `hal_key.c` 内部实现（接口签名不变）+ 调整 `bsp_uart.h` / `hal_led.c` 引脚映射（`hal_key` 无引脚表，任意 GPIO 运行时绑定）；上层 BSP/APP 零改动（见 Project_Level_Skill.md 第 10 节）。\n\n网络功能同理：更换带 WiFi/BT 的其他 ESP 型号重写 `hal_wifi.c` / `hal_http.c` / `hal_spp.c` 内部实现（接口签名不变）；无 WiFi/BT 的 MCU 将 `cfg_modules.h` 对应 `CFG_HAL_*`/`CFG_BSP_*`/`CFG_APP_NET_EN` 置 0，全部模块自动降级为空实现，其余业务不受影响。\n"},{"hash":"ESP/ESP-32-CAM/Readme.md","title":"Readme","relPath":"ESP/ESP-32-CAM/Readme.md","desc":"治法:GOTIP 时记忆节点 BSSID+信道,断线重连 + 单信道直连(无扫描,SoftAP 几乎不断);连续 8 次直连失败自动解除钉住恢复全信道扫(适应节点下线/挪位,连上后重新钉)。","created":"","updated":"","tags":[],"sizeKB":30.4,"_text":"ESP32-CAM 网页视频监控工程功能记录 - 板卡:AI-Thinker ESP32-CAM(SoC:ESP32-D0WDQ6,双核 Xtensa LX6 @ 240MHz,4MB Flash / 实测板载 8MB PSRAM--经典 ESP32 最多映射 4MB) - 传感器:OV3660(实测 PID=0x3660,标称 OV2640 的板子实际装了 OV3660,驱动自动识别;UXGA 上限,QXGA 不启用) - SDK:ESP-IDF v6.1(Windows 激活脚本 ;Linux YYM 机:IDF 仓库 (v6.1 tag,SSH 22 直连克隆)、工具链 (install.sh 须加 走乐鑫镜像,github 直下被拒);构建 );摄像头驱动 esp32-camera 2.1.8(组件仓库自动拉取, 声明) - 版本号规则:同 ESP-32 工程(V主.次.大功能.小功能);当前 V1.4.2.7(硬件供电加固:5V/GND 跨 680µF 电解电容+排线重插;恢复 BOD 欠压检测(带 BOD 过 boot 射频校准+满负载 0 复位);前版 1.4.2.6 邮件忙拒拆分+检测节流 300s+API 在线本地联动让位+vision QVGA 弱信号采样) - 代码仓: 分支 (串口透传工程见 develop 分支;Linux YYM 机本地副本 ,构建产物 );架构/分层规范同 ESP-32 工程(APP→BSP→HAL→ESP-IDF,见仓库 ) - 网页端:暗色单页四标签(配网/视频监控/GPIO 控制/存储),配网栈与网页谱系移植自 develop 分支(ESP8266-develop 参照) 硬件资源占用表 外设 引脚/资源 用途 归属模块 --------------------------------- 摄像头 DVP XCLK=0, SIOD=26, SIOC=27, Y2=5, Y3=18, Y4=19, Y5=21, Y6=36, Y7=39, Y8=34, Y9=35, VSYNC=25, HREF=23, PCLK=22, PWDN=32 OV3660 并口(固定接线) halcam SD 卡槽 CLK=14, CMD=15, D0=2(1-bit 模式;D1=4 留补光灯/D2=12/D3=13 留 GPIO) 抓拍存储 FATFS bspsd 补光灯 GPIO4(与 SD D1 复用,1-bit 模式下归补光灯) 板载高亮 LED halcam 板载红色 LED GPIO33 GPIO 控制页可控 halgpio/bspgpio 剩余可控 GPIO 1/3(UART0 日志口,控制后串口失联)、2/4/12/13/14/15/33 网页 GPIO 控制页 bspgpio 不可用 GPIO0=摄像头 XCLK;GPIO16/17=PSRAM;GPIO6~11=Flash;GPIO34~39 仅输入且被摄像头占用 - - WiFi SoftAP /192.168.4.1 + STA;NAPT 借道上网 配网/监控/NAT 中继 halwifi/bspwifi 下载口 Windows=COM9,Linux YYM 机=/dev/ttyUSB1(CH340,必须 115200--460800 连接后失联;ESP8266 同机占 /dev/ttyUSB0,勿混淆) 烧录/日志 - 遗留Bug记录 ​ 该章节有遗留bug内容均为人工测试发现的bug记录,修改完成后需要填写修复状态和修复时间; 版本 问题记录 测试时间 修复状态 修复时间 :------: ------------------------------------------------------------ ---------- -------- -------- V1.4.2.2 邮件推送界面的功能不能正常发送邮件 2026.10.16 已修复(网络层 V1.4.2.2+交互层+TLS 配置/内存深层三层修复,测试邮件实测送达,见踩坑 28/29/30) 2026.10.19 V1.4.2.2 页面中运行时间的走时是3秒钟跳一次吗,不是一秒跳一次 2026.10.16 已修复(状态轮询 3s→1s,uptime 本身来自 esptimer 精确,纯显示轮询问题) 2026.10.19 V1.4.2.2 人体检测经常出现误判,在没有人的时候也会进行框选然后判断为有人进行计数,是否可以考虑接入一些开源的API来判断识别是否有人,或者加入一些开源的算法来判断是否有人 2026.10.16 已修复(全局光照突变改\"超阈像素占比45%\"判据拦截 AEC/灯光类误报;接入 API 方案不采纳:监控需实时性+内网可用+零调用成本,纯算法优化后已够用,见踩坑 28) 2026.10.19 V1.4.2.2 邮件推送界面勾选有人发送邮件的功能,这里的检测不够灵敏,经常出现人在摄像头的跟前也不会触发检测到有人然后发送邮件 2026.10.16 已修复(两根因:1面积上限 2000 误杀贴近大目标已取消,上限职责改由占比判据承担;2差分膨胀 1 轮连回 JPEG 压缩碎片,周期 350→300ms,见踩坑 28) 2026.10.19 V1.4.2.3 通过邮件发送出去的MP4视频无法正常的播放 2026.10.19 已修复(非文件损坏:ffprobe验证MP4容器合法全帧可解,根因MJPEG编码浏览器/系统播放器不支持;邮件正文加VLC/PotPlayer播放提示) 2026.10.20 V1.4.2.3 存储界面存储的视频不能正常的查看，且缺少邮件发送功能 2026.10.19 已修复(新增GET /replay按容器解帧MJPEG流回放,「查看」改内嵌弹层浏览器原生渲染;「邮」按钮POST /api/mail/sendfile复用SMTP管线;另/api/sd加err字段暴露SD异常+启动打复位原因诊断今早两次意外重启) 2026.10.20 HAL 层功能记录 halcam(摄像头驱动,封装 esp32-camera) 功能 API 说明 ----------------- 初始化 帧缓冲始终按最大档 UXGA + 显式 =960KB×2 分配(PSRAM),用户档位(分辨率/质量/镜像/翻转)init 后经传感器接口应用;PSRAM 缺失降级 DRAM+QVGA 取帧/归还 / 2.1.x 无参(驱动内部固定 4s 超时),帧句柄 void 透传归还 参数设置 运行时可切,流传输中生效于后续帧;档位枚举 QVGA~UXGA 板级映射 状态查询 传感器状态回读,状态 JSON 用 补光灯 GPIO4 推挽输出,上电默认灭 halwifi(WiFi 驱动,APSTA 双模 + NAPT,develop 移植 + NAT 回迁) 同 ESP-32 工程 halwifi(NVS 凭据/扫描/事件回调全套),差异:本工程 V1.1.0.0 回迁了完整 NAPT 借道上网(GOTIP → + 上游 DNS 写入 AP DHCP + 8s 后踢全部 AP 客户端强制重取含正确 DNS 的租约;断开自动关 NAPT)。 + 必须写 。 halhttp(HTTP 服务器,双实例 + 流式 API) 功能 API 说明 ----------------- 双实例启动 80 主实例(页面+/api+快照+SD 下载,4 连接,maxurihandlers=20,urimatchfn=httpdurimatchwildcard);81 流实例(MJPEG 专用,3 连接,sendwaittimeout=2s,ctrlport=32769) URI 注册 含 字段路由到流实例 请求处理 通用 GET/POST 应答;UriGet 供通配路由解析路径 流式响应 / multipart 响应头 + socket 原始 send(连续 3 次 SOSNDTIMEO 超时全零发才判死,瞬时慢客户端不断流) halgpio(通用 GPIO 驱动) :输入浮空/上拉/下拉/推挽输出;GPIO6~11 Flash 黑名单拒绝,34~39 仅允许输入浮空。 实时电平回读(输入/输出均可读)。 BSP 层功能记录 模块 关键点 -------------- bspcam NVS(命名空间 cam)持久化 fsz/jq/hm/vf 四键;帧率统计(两次查询差折算,页面 3s 轮询即 3s 均值) bspwifi 同 ESP-32 工程(瞬时断开无限退避重连 V1.3.0.3;认证类限次 20);V1.3.0.6 Mesh 防摇摆:GOTIP 记忆 BSSID+信道钉住(bssidset+channel 直连,重连免全信道扫描),连续 8 次直连失败自动解除重扫全网 bspweb 主实例 16 条路由: 、 、 、 (白名单校验防穿越:仅 ,须含 .jpg,禁 /,长度<16);流实例 。SOI(FFD8) 校验丢弃损坏帧(连续 20 帧损坏才断流,快照重试 3 帧) bspgpio 引脚占用表集中定义(1/2/3/4/12/13/14/15/33 + 复用说明);SD 挂载期间 2/14/15 拒绝控制(动态查询 BspSdMounted);上电不动引脚(全输入态),影子状态记录已配置模式 bspsd 挂载独立任务;写卡工作队列任务;视频录像(V1.2.0.0):AVI(MJPEG) 容器分段滚动(REC年月日-时分秒段号.avi,未对时 RECNOSYNC段号.avi;每段 3000 帧或分辨率变化即换段,收尾回填总帧数/索引可播放);开机自动续录(NVS recsw/recfps);满卡循环覆盖(空闲<200MB 自动删最旧 REC.avi;每段收尾与开段失败路径都触发清理,段序号开机扫目录续接防同名覆盖);单帧写超 8s 看门狗自停;抓拍时间戳命名/降级;文件列表/整读/删除/流式下载(8KB 分块回调,大文件不经内存整缓冲);FATFS 全访问经互斥锁串行化 bspstore 同 ESP-32 工程,命名空间 cam APP 层功能记录 模块 关键点 -------------- appnet 初始化链 bspwifi → store → gpio → sd(异步) → cam → detect → web;联网后 SNTP 对时(录像/抓拍时间戳命名依赖);状态 JSON: (录像另走 /api/rec,检测另走 /api/detect) vision-server(PC) PC 端检测服务(V1.4.2.5 配套):Ubuntu 主机 /home/yym/vision-server;OpenCV 4.10 HOG 行人检测(~200ms/帧,CPU 4核);ThreadingHTTPServer 并发+短读容错;systemd --user 自启(linger 已开);协议同 appvision(POST base64→{boxes 千分比});注意:JSON 必须紧凑分隔符(设备端按\"boxes\":精确匹配,Python 默认带空格会解析失败) bug 修复 V1.4.2.6: 存储页\"邮\"报\"正在发送其他邮件\"=双引擎重复联动+60s节流<单封耗时+PC服务单线程挂死三层叠加;修=节流300s/忙拒拆分/API在线本地让位/QVGA采样20KB appvision 外部视觉检测(V1.4.2.5 新增,API优先+本地回退):HTTP 端点 POST base64<JPEG→{boxes:x,y,w,h,conf,cls千分比};三态模式(0仅本地/1仅API/2API优先);连续3次失败自动回退本地算法,恢复切回;URL/间隔网页可配NVS持久;SPIRAM 48KB base64缓冲;检出目标走本地同套联动(0→1录像+邮件);实测假端点回退/真端点在线/断电保存全通过;适合 CodeProject.AI/YOLO网关/百度云经网关转换 appdetect 人体活动检测+人流量统计(V1.3.0.0 起,纯算法方案--经典 ESP32 无 NN 算力):JPEG 1/8 缩放解码(espjpeg 组件 RGB565→80x60 灰度重采样)→ 背景慢更新(τ≈16s)差分 → 全局光照突变占比判据(45% 丢帧,V1.4.2.3) → 差分膨胀 1 轮(V1.4.2.3) → 洪泛连通域+面积/宽高比人形过滤(无面积上限) → 质心最近邻跟踪(20格半径,2帧确认/3帧丢失)→ 计数线左右状态翻转判进/出(NVS 持久,跨日自动清零);约 3fps 分析任务(300ms 周期,V1.4.2.3);设置 on/sens/line 网页可调持久化;局限:静止目标≈15s 被背景吸收、与背景同色可能漏检 appscene 场景联动(V1.4.2.4 新增):GPIO 输入沿触发→联动输出/拍照邮件/事件录像;4 条规则 NVS 掉电保存;10ms 轮询+50ms 去抖(连续5采样)+10s 冷却;沿类型升/降/双;动作掩码可组合;输出 HoldSecs 自动回退(0=保持);网页 GPIO 页规则配置(增改/触发计数/测试按钮);strapping 脚(GPIO0/12)硬拒+SD 总线脚校验;引脚配置 5s 周期自愈(SD 后台挂载重置 IOMUX);实测:上升沿触发→GPIO4 置高 10s 精确回退✅;坑:场景 API 响应 Content-Length 必须 strlen 按 UTF-8 字节数(中文硬编码长度截断);输出脚自愈重配会清联动电平→自愈只配输入脚 appmail 邮件推送(V1.4.1.x 新增):检测触发/网页测试 → 队列→发送任务;SMTP 隐式 SSL(esp-tls,不挂证书 bundle:QQ/163 下发链缺中间证书);触发瞬间先拍照缓存 SPIRAM(照片与检测时刻对齐,V1.4.1.5);事件录像开启时等段收尾后随邮件附视频(base64 流式分块);60s 节流;配置 NVS 持久;V1.4.2.2 网络层修复:短写循环续传(TLS SOSNDTIMEO 到期返短计数)/30s 总预算/TLS 连接失败自动重试 2 次/GOTIP 后关 STA 省电(DTIM 休眠致下行丢段)/分层错误码(esp 0x8000 系+mbedtls+sock errno,网页映射具体","content":"# ESP32-CAM 网页视频监控工程功能记录\n\n- **板卡**:AI-Thinker ESP32-CAM(SoC:ESP32-D0WDQ6,双核 Xtensa LX6 @ 240MHz,4MB Flash / **实测板载 8MB PSRAM**--经典 ESP32 最多映射 4MB)\n- **传感器**:**OV3660**(实测 PID=0x3660,标称 OV2640 的板子实际装了 OV3660,驱动自动识别;UXGA 上限,QXGA 不启用)\n- **SDK**:ESP-IDF **v6.1**(Windows 激活脚本 `F:\\00.Code\\11ESP\\idf-env.bat`;**Linux YYM 机**:IDF 仓库 `/mnt/sda1/esp-idf`(v6.1 tag,SSH 22 直连克隆)、工具链 `IDF_TOOLS_PATH=/mnt/sda1/espressif`(install.sh 须加 `IDF_GITHUB_ASSETS=dl.espressif.com/github_assets` 走乐鑫镜像,github 直下被拒);构建 `export IDF_TOOLS_PATH=/mnt/sda1/espressif && source /mnt/sda1/esp-idf/export.sh && idf.py build`);摄像头驱动 **esp32-camera 2.1.8**(组件仓库自动拉取,`main/idf_component.yml` 声明)\n- **版本号规则**:同 ESP-32 工程(V主.次.大功能.小功能);当前 **V1.4.2.7**(硬件供电加固:5V/GND 跨 680µF 电解电容+排线重插;恢复 BOD 欠压检测(带 BOD 过 boot 射频校准+满负载 0 复位);前版 1.4.2.6 邮件忙拒拆分+检测节流 300s+API 在线本地联动让位+vision QVGA 弱信号采样)\n- **代码仓**:`https://gitee.com/YYM642443594/ESP.git` 分支 `feature/ESP32-Camer`(串口透传工程见 develop 分支;Linux YYM 机本地副本 `/home/yym/sda1/ESP`,构建产物 `build/esp32_cam.bin`);架构/分层规范同 ESP-32 工程(APP→BSP→HAL→ESP-IDF,见仓库 `Project_Level_Skill.md`)\n- **网页端**:暗色单页四标签(配网/视频监控/GPIO 控制/存储),配网栈与网页谱系移植自 develop 分支(ESP8266-develop 参照)\n\n## 硬件资源占用表\n\n| 外设 | 引脚/资源 | 用途 | 归属模块 |\n|------|-----------|------|----------|\n| 摄像头 DVP | XCLK=0, SIOD=26, SIOC=27, Y2=5, Y3=18, Y4=19, Y5=21, Y6=36, Y7=39, Y8=34, Y9=35, VSYNC=25, HREF=23, PCLK=22, PWDN=32 | OV3660 并口(固定接线) | hal_cam |\n| SD 卡槽 | CLK=14, CMD=15, D0=2(**1-bit 模式**;D1=4 留补光灯/D2=12/D3=13 留 GPIO) | 抓拍存储 FATFS `/sdcard` | bsp_sd |\n| 补光灯 | GPIO4(与 SD D1 复用,1-bit 模式下归补光灯) | 板载高亮 LED | hal_cam |\n| 板载红色 LED | GPIO33 | GPIO 控制页可控 | hal_gpio/bsp_gpio |\n| 剩余可控 GPIO | 1/3(UART0 日志口,控制后串口失联)、2/4/12/13/14/15/33 | 网页 GPIO 控制页 | bsp_gpio |\n| 不可用 | GPIO0=摄像头 XCLK;GPIO16/17=PSRAM;GPIO6~11=Flash;GPIO34~39 仅输入且被摄像头占用 | - | - |\n| WiFi | SoftAP `ESP32_Config`/192.168.4.1 + STA;NAPT 借道上网 | 配网/监控/NAT 中继 | hal_wifi/bsp_wifi |\n| 下载口 | Windows=**COM9**,Linux YYM 机=**/dev/ttyUSB1**(CH340,**必须 115200**--460800 连接后失联;ESP8266 同机占 /dev/ttyUSB0,勿混淆) | 烧录/日志 | - |\n\n\n\n## 遗留Bug记录\n\n​\t该章节有遗留bug内容均为人工测试发现的bug记录,修改完成后需要填写修复状态和修复时间;\n\n|   版本   | 问题记录                                                     | 测试时间   | 修复状态 | 修复时间 |\n| :------: | ------------------------------------------------------------ | ---------- | -------- | -------- |\n| V1.4.2.2 | 邮件推送界面的功能不能正常发送邮件                           | 2026.10.16 | 已修复(网络层 V1.4.2.2+交互层+TLS 配置/内存深层三层修复,测试邮件实测送达,见踩坑 28/29/30) | 2026.10.19 |\n| V1.4.2.2 | 页面中运行时间的走时是3秒钟跳一次吗,不是一秒跳一次          | 2026.10.16 | 已修复(状态轮询 3s→1s,uptime 本身来自 esp_timer 精确,纯显示轮询问题) | 2026.10.19 |\n| V1.4.2.2 | 人体检测经常出现误判,在没有人的时候也会进行框选然后判断为有人进行计数,是否可以考虑接入一些开源的API来判断识别是否有人,或者加入一些开源的算法来判断是否有人 | 2026.10.16 | 已修复(全局光照突变改\"超阈像素占比>45%\"判据拦截 AEC/灯光类误报;接入 API 方案不采纳:监控需实时性+内网可用+零调用成本,纯算法优化后已够用,见踩坑 28) | 2026.10.19 |\n| V1.4.2.2 | 邮件推送界面勾选有人发送邮件的功能,这里的检测不够灵敏,经常出现人在摄像头的跟前也不会触发检测到有人然后发送邮件 | 2026.10.16 | 已修复(两根因:1面积上限 2000 误杀贴近大目标已取消,上限职责改由占比判据承担;2差分膨胀 1 轮连回 JPEG 压缩碎片,周期 350→300ms,见踩坑 28) | 2026.10.19 |\n| V1.4.2.3 | 通过邮件发送出去的MP4视频无法正常的播放 | 2026.10.19 | 已修复(非文件损坏:ffprobe验证MP4容器合法全帧可解,根因MJPEG编码浏览器/系统播放器不支持;邮件正文加VLC/PotPlayer播放提示) | 2026.10.20 |\n| V1.4.2.3 | 存储界面存储的视频不能正常的查看，且缺少邮件发送功能 | 2026.10.19 | 已修复(新增GET /replay按容器解帧MJPEG流回放,「查看」改内嵌弹层浏览器原生渲染;「邮」按钮POST /api/mail/sendfile复用SMTP管线;另/api/sd加err字段暴露SD异常+启动打复位原因诊断今早两次意外重启) | 2026.10.20 |\n\n\n\n## HAL 层功能记录\n\n### hal_cam(摄像头驱动,封装 esp32-camera)\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 初始化 | `HalCamInit(pCfg)` | **帧缓冲始终按最大档 UXGA + 显式 `jpeg_buffer_size`=960KB×2 分配**(PSRAM),用户档位(分辨率/质量/镜像/翻转)init 后经传感器接口应用;PSRAM 缺失降级 DRAM+QVGA |\n| 取帧/归还 | `HalCamFbGet(ppJpg,pLen,TimeoutMs)` / `HalCamFbReturn(pFb)` | 2.1.x `esp_camera_fb_get()` **无参**(驱动内部固定 4s 超时),帧句柄 void* 透传归还 |\n| 参数设置 | `HalCamSizeSet/QualitySet/HmirrorSet/VflipSet` | 运行时可切,流传输中生效于后续帧;档位枚举 QVGA~UXGA 板级映射 |\n| 状态查询 | `HalCamSizeGet/QualityGet/HmirrorGet/VflipGet/SensorNameGet/PsramFreeGet` | 传感器状态回读,状态 JSON 用 |\n| 补光灯 | `HalCamFlashLedSet/Get` | GPIO4 推挽输出,上电默认灭 |\n\n### hal_wifi(WiFi 驱动,APSTA 双模 + NAPT,develop 移植 + NAT 回迁)\n\n同 ESP-32 工程 hal_wifi(NVS 凭据/扫描/事件回调全套),差异:本工程 V1.1.0.0 回迁了完整 **NAPT 借道上网**(GOT_IP → `ip_napt_enable` + 上游 DNS 写入 AP DHCP + 8s 后踢全部 AP 客户端强制重取含正确 DNS 的租约;断开自动关 NAPT)。`CONFIG_LWIP_IP_FORWARD`+`CONFIG_LWIP_IPV4_NAPT` 必须写 `sdkconfig.defaults`。\n\n### hal_http(HTTP 服务器,双实例 + 流式 API)\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 双实例启动 | `HalHttpInit()` | 80 主实例(页面+/api+快照+SD 下载,4 连接,**max_uri_handlers=20**,**uri_match_fn=httpd_uri_match_wildcard**);81 流实例(MJPEG 专用,3 连接,send_wait_timeout=2s,ctrl_port=32769) |\n| URI 注册 | `HalHttpUriRegister(pUriCfg)` | `HalHttpUri_S` 含 `StreamIns` 字段路由到流实例 |\n| 请求处理 | `HalHttpReqContentLen/Recv/Respond/UriGet` | 通用 GET/POST 应答;UriGet 供通配路由解析路径 |\n| 流式响应 | `HalHttpStreamOpen(pReq,pBoundary)` / `HalHttpStreamSend(pReq,pBuf,Len)` | multipart 响应头 + socket 原始 send(连续 3 次 SO_SNDTIMEO 超时全零发才判死,瞬时慢客户端不断流) |\n\n### hal_gpio(通用 GPIO 驱动)\n\n`HalGpioSetup(Num,Mode,Level)`:输入浮空/上拉/下拉/推挽输出;GPIO6~11 Flash 黑名单拒绝,34~39 仅允许输入浮空。`HalGpioRead` 实时电平回读(输入/输出均可读)。\n\n## BSP 层功能记录\n\n| 模块 | 关键点 |\n|------|--------|\n| bsp_cam | NVS(命名空间 cam)持久化 fsz/jq/hm/vf 四键;帧率统计(两次查询差折算,页面 3s 轮询即 3s 均值) |\n| bsp_wifi | 同 ESP-32 工程(瞬时断开无限退避重连 V1.3.0.3;认证类限次 20);**V1.3.0.6 Mesh 防摇摆**:GOT_IP 记忆 BSSID+信道钉住(bssid_set+channel 直连,重连免全信道扫描),连续 8 次直连失败自动解除重扫全网 |\n| bsp_web | 主实例 16 条路由:`/`、`/api/status|scan|wifi|cam|flash|gpio|sd|sd/save|sd/del|reboot|resetwifi`、`/capture`、`/sd/*`(白名单校验防穿越:仅 `A-Za-z0-9_.`,须含 .jpg,禁 /,长度<16);流实例 `/stream`。**SOI(FFD8) 校验丢弃损坏帧**(连续 20 帧损坏才断流,快照重试 3 帧) |\n| bsp_gpio | 引脚占用表集中定义(1/2/3/4/12/13/14/15/33 + 复用说明);**SD 挂载期间 2/14/15 拒绝控制**(动态查询 BspSdMounted);上电不动引脚(全输入态),影子状态记录已配置模式 |\n| bsp_sd | **挂载独立任务**;**写卡工作队列任务**;**视频录像(V1.2.0.0):AVI(MJPEG) 容器分段滚动(REC_年月日-时分秒_段号.avi,未对时 REC_NOSYNC_段号.avi;每段 3000 帧或分辨率变化即换段,收尾回填总帧数/索引可播放);开机自动续录(NVS recsw/recfps);满卡循环覆盖(空闲<200MB 自动删最旧 REC_*.avi;每段收尾与开段失败路径都触发清理,段序号开机扫目录续接防同名覆盖);单帧写超 8s 看门狗自停**;抓拍时间戳命名/降级;文件列表/整读/删除/**流式下载(8KB 分块回调,大文件不经内存整缓冲)**;FATFS 全访问经互斥锁串行化 |\n| bsp_store | 同 ESP-32 工程,命名空间 cam |\n\n## APP 层功能记录\n\n| 模块 | 关键点 |\n|------|--------|\n| app_net | 初始化链 bsp_wifi → store → gpio → sd(异步) → cam → **detect** → web;联网后 SNTP 对时(录像/抓拍时间戳命名依赖);状态 JSON:`ver/mode/ssid/ip/rssi/heap/psram/uptime/size/quality/fps/clients/sensor/sd/sdcap/sdfree`(录像另走 /api/rec,检测另走 /api/detect) |\n| vision-server(PC) | **PC 端检测服务(V1.4.2.5 配套)**:Ubuntu 主机 /home/yym/vision-server;OpenCV 4.10 HOG 行人检测(~200ms/帧,CPU 4核);ThreadingHTTPServer 并发+短读容错;systemd --user 自启(linger 已开);协议同 app_vision(POST base64→{boxes 千分比});注意:JSON 必须紧凑分隔符(设备端按\"boxes\":[精确匹配,Python 默认带空格会解析失败) |\n| bug 修复 | V1.4.2.6: 存储页\"邮\"报\"正在发送其他邮件\"=双引擎重复联动+60s节流<单封耗时+PC服务单线程挂死三层叠加;修=节流300s/忙拒拆分/API在线本地让位/QVGA采样20KB |\n| app_vision | **外部视觉检测(V1.4.2.5 新增,API优先+本地回退)**:HTTP 端点 POST base64<JPEG>→{boxes:[[x,y,w,h,conf,cls]千分比]};三态模式(0仅本地/1仅API/2API优先);连续3次失败自动回退本地算法,恢复切回;URL/间隔网页可配NVS持久;SPIRAM 48KB base64缓冲;检出目标走本地同套联动(0→1录像+邮件);实测假端点回退/真端点在线/断电保存全通过;适合 CodeProject.AI/YOLO网关/百度云经网关转换 |\n| app_detect | **人体活动检测+人流量统计(V1.3.0.0 起,纯算法方案--经典 ESP32 无 NN 算力)**:JPEG 1/8 缩放解码(esp_jpeg 组件 RGB565→80x60 灰度重采样)→ 背景慢更新(τ≈16s)差分 → **全局光照突变占比判据(>45% 丢帧,V1.4.2.3)** → **差分膨胀 1 轮(V1.4.2.3)** → 洪泛连通域+面积/宽高比人形过滤(无面积上限) → 质心最近邻跟踪(20格半径,2帧确认/3帧丢失)→ 计数线左右状态翻转判进/出(NVS 持久,跨日自动清零);约 3fps 分析任务(300ms 周期,V1.4.2.3);设置 on/sens/line 网页可调持久化;局限:静止目标≈15s 被背景吸收、与背景同色可能漏检 |\n| app_scene | **场景联动(V1.4.2.4 新增)**:GPIO 输入沿触发→联动输出/拍照邮件/事件录像;4 条规则 NVS 掉电保存;10ms 轮询+50ms 去抖(连续5采样)+10s 冷却;沿类型升/降/双;动作掩码可组合;输出 HoldSecs 自动回退(0=保持);网页 GPIO 页规则配置(增改/触发计数/测试按钮);strapping 脚(GPIO0/12)硬拒+SD 总线脚校验;引脚配置 5s 周期自愈(SD 后台挂载重置 IO_MUX);实测:上升沿触发→GPIO4 置高 10s 精确回退✅;**坑:场景 API 响应 Content-Length 必须 strlen 按 UTF-8 字节数(中文硬编码长度截断);输出脚自愈重配会清联动电平→自愈只配输入脚** |\n| app_mail | **邮件推送(V1.4.1.x 新增)**:检测触发/网页测试 → 队列→发送任务;SMTP 隐式 SSL(esp-tls,不挂证书 bundle:QQ/163 下发链缺中间证书);触发瞬间先拍照缓存 SPIRAM(照片与检测时刻对齐,V1.4.1.5);事件录像开启时等段收尾后随邮件附视频(base64 流式分块);60s 节流;配置 NVS 持久;**V1.4.2.2 网络层修复:短写循环续传(TLS SO_SNDTIMEO 到期返短计数)/30s 总预算/TLS 连接失败自动重试 2 次/GOT_IP 后关 STA 省电(DTIM 休眠致下行丢段)/分层错误码(esp 0x8000 系+mbedtls+sock errno,网页映射具体原因)**;**V1.4.2.3 交互修复:测试按钮先自动 POST 当前表单再 test=1(测旧配置坑)** |\n| app_main | 主循环 10ms 槽(当
