前空槽,业务全事件/请求驱动) |\n\n## 数据通路\n\n| 通路 | 输入 → 输出 |\n|------|------------|\n| 视频流 | OV3660 → esp32-camera(PSRAM 双缓冲 LATEST) → `BspCamFbGet` → SOI 校验 → 流实例 :81 multipart 推送(单任务单观看路) |\n| 快照 | 同上取帧 → 主实例 /capture 一次性应答(与流互不阻塞) |\n| SD 抓拍 | 取帧+SOI 校验 → `/sdcard/CAM_xxxx.jpg` → 列表/下载(/sd/* 通配)/删除 |\n| 配网 | 浏览器表单 → /api/wifi(同步 12s)→ NVS + STA 连接(失败恢复原配置) |\n| NAT 中继 | AP 客户端 → NAPT 改写 → STA 上行(DNS 经 DHCP 下发上游网关) |\n\n## 实测性能与环境(2026-10-10,STA 回传)\n\n- VGA q12:**~22fps**(20KB/帧,3.7Mbps);UXGA q10:**~2.7fps**(199KB/帧,传感器读出物理上限)--监控建议 VGA/SVGA\n- 供电:摄像头+WiFi 峰值电流高,5V ≥2A;弱供会 brownout 反复重启。**根治实测(2026-10-21):5V/GND 跨 680µF 电解电容**(极性/耐压≥6.3V,尽量贴近引脚),WiFi 射频大电流冲击不再拉跌电压,ping 延迟 ~100ms→~5ms;接口动力测试(3 路并发 MJPEG)0 复位\n- 上游网络:PC Windows ICS 热点(YYM_1339,192.168.137.0/24)实测**极不稳**(设备反复被拒/掉线),测试优先直连路由器\n\n## 踩坑记录(按定位顺序)\n\n1. **esp32-camera 2.1.8 @ IDF6.1 API 变更**:`esp_camera_fb_get()` 无参(2.0.x 收超时参数);`^2.0.3` 依赖解析到 2.1.8\n2. **JPEG 帧缓冲按初始档位 宽×高/5 估算**(cam_hal.c `CONFIG_CAMERA_JPEG_MODE_FRAME_SIZE_AUTO`):运行时切大分辨率 → 帧超出缓冲截断 → `cam_hal: NO-SOI` 花屏卡顿。**治法:`camera_config_t.jpeg_buffer_size` 显式给 UXGA 级 960KB,且初始化即按最大档分配**\n3. **httpd `max_uri_handlers` 默认 8**:主实例 10+ 条路由第 9 条起注册失败(本工程踩过 10 条 → 尾巴三条失败),显式设 20\n4. **esp_http_server 每实例单任务**:URI 处理器内联执行(httpd_uri.c),死循环流处理器独占实例 → /stream 必须独立实例;/capture 放主实例才不被流阻塞\n5. **httpd URI 默认精确匹配**:`/sd/*` 通配路由必须 `Cfg.uri_match_fn = httpd_uri_match_wildcard`,否则 404(httpd 内建 404 是 text/html,与处理器 404 可区分)\n6. **通配下载白名单要含小写字母**:`CAM_0001.jpg` 的 `.jpg` 是小写,只放行 A-Z/0-9/_/. 会把合法文件 404\n7. **main 组件显式 PRIV_REQUIRES 后失去\"默认依赖全部组件\"**:esp_wifi/esp_http_server/nvs_flash/esp_timer/heap 等须逐一列出\n8. **IDF6.1 `sdmmc_slot_config_t` 在 legacy 头**(esp_driver_sdmmc/legacy/include/driver/sdmmc_host.h,sdmmc_cmd.h 不再带入);**memset 零值会把 CD/WP 配成 GPIO0(=摄像头 XCLK!)**--必须显式 `SDMMC_SLOT_NO_CD/NO_WP`;未用数据脚用 `GPIO_NUM_NC`\n9. **SD 卡疑似劣质三症状**:写入成功但掉电文件丢失 / 目录扫描偶发为空 / 驱动探测挂死(症状:启动后所有模块打印消失=主任务卡死在挂载里,WiFi 日志来自事件任务具迷惑性)。**治法:挂载独立任务化**;换卡并用 PC 读卡器验真(H2testw)\n10. **CH340 COM9 烧录 460800 失联**(芯片能连、切波特率后无响应),固定 115200;另一块 CH340 板在 COM3 勿混淆\n11. **路由器环境已变**:YYM_4G/YYM_5G → 现 **YYM55**(2.4G ch1);PC 侧另有 ICS 热点 YYM_1339(192.168.137.0/24,极不稳且 DHCP 会换地址--2026-10-10 从 .199 变 .90,\"设备失联\"先查新 IP)\n12. PSRAM 实测 8MB 只映射 4MB(经典 ESP32 地址空间限制,日志 \"map as much as we can\" 属正常)\n13. **FreeRTOS 任务隔离是治卡顿的正解**:两次实践--SD 挂载后台任务化(驱动挂死不阻塞启动链)、SD 写卡工作队列化(HTTP 提交即应答+超时短路);劣质卡最坏只拖死单个 sd_* 任务,摄像头/网页/GPIO 全不受影响\n14. **开机 CAM 序号扫描禁用 stat 循环**:9999 次 stat 找最大序号在无 CAM_ 文件时要跑 30~60s,把 mounted 日志/自动录像全堵在后面(表象:\"启动后模块打印消失\");改目录一次遍历解析 CAM_号(~100ms)\n15. **段式写入器的 memset 自伤**:开段函数入口 memset 段结构体,而调用方把段结构体内的 Name/Width/Height 预填后再传入(pName 就是 pAvi->Name 别名)→ 名字被清空 fopen(\"/sdcard/\") 失败、尺寸归零致每段 1 帧无限换段;治法:名字/宽高改参数传入,结构体只存不预填\n16. **大文件下载必须流式**:为快照设计的 1MB 整读缓冲会拒掉录像文件(5MB+)→ 下载 404;定长响应头(Content-Length)+ 8KB 分块 socket 推送,内存占用与文件大小无关\n17. **esp_jpeg 组件可作检测解码器**:`esp_jpeg_decode` 支持 1/2/1/4/1/8 缩放(RGB565/888),VGA JPEG→80x60 仅约 10-15ms @240MHz;esp32-camera 自带该依赖(conversions),main 显式 PRIV_REQUIRES espressif__esp_jpeg 即可用\n18. **检测帧源与流/录像共享 fb 队列**:多消费者 fb_get 各自分到部分帧(2fps 检测+10fps 录像+流媒体 ≈13fps ≤ 传感器能力);检测解码后自建固定 80x60 网格重采样,任意分辨率统一处理\n19. **断网重连策略(V1.3.0.3)**:断开必须按原因分类--认证类(密码错:reason 15/202/204)限次防死循环;瞬时类(NO_AP_FOUND/BEACON_TIMEOUT 等,如路由器重启、热点还没开)**无限退避重连**(前 3 次立即,后 5s→30s 循环)。旧版 20 次总限会在 PC 重启期间 ICS 热点关闭几分钟的场景下永久掉线(实测:设备开机永远连不上)\n20. **PC 重启会换 COM 口**:USB 重新枚举导致 CH340 从 COM9 变 COM4(2026-10-12 实测);烧录前先 `Get-CimInstance Win32_PnPEntity | ? Name -match CH340` 枚举当前口;Windows ICS 热点(YYM_1339)重启后可能自动关闭且极不稳,长期部署应改连主路由\n21. **Linux YYM 机首次构建环境(2026-10-15)**:IDF 克隆须走 `git@github.com:22` 直连(HTTPS 被墙、`ssh.github.com:443` 被热点 captive DNS 劫持到 192.168.4.1);ssh config 里 `Host github.com → ssh.github.com:443` 会让 `--recursive` 子模块克隆 rc=128,绕法 `GIT_SSH_COMMAND='ssh -F /dev/null -i ~/.ssh/id_ed25519_esp8266'`;工具链 install.sh 必加 `IDF_GITHUB_ASSETS=dl.espressif.com/github_assets` 镜像;export 前必须 `export IDF_TOOLS_PATH=/mnt/sda1/espressif`(否则默认找 ~/.espressif 报 python_env 不存在);烧录 `idf.py -p /dev/ttyUSB1 -b 115200 flash`\n22. **ESP32 板插入 Linux 不出串口=USB 枚举失败(error -71)**:dmesg 表现 `device descriptor read/64, error -71` 反复重试后 `unable to enumerate`(线材/接触/供电问题,与 CH340 驱动无关);换插拔/换口后恢复;同机 ESP8266 的 serial_sim.py 会因同类 USB 抖动写失败 -71 退出,烧录前后记得 `ps | grep serial_sim` 补拉起\n23. **idf.py monitor 非 TTY 也能用**:stdin 非 TTY 时自动进非交互模式(支持 expect/sleep 子命令),重定向日志后 grep 关键启动行(`hal_cam ready/bsp_web ready/app_net ready`)即可无头验证;首帧 NO-SOI 是 OV3660 上电初始化现象,第三帧起正常,固件 SOI 校验兜底\n24. **页面\"加载后卡死/按钮全无反应\"=JS 语法错误被浏览器静默丢弃(V1.3.0.4)**:detRender 检测线同步 if 块少一个闭合 `}`,整个 `<script>` 解析失败,所有 onclick 不绑定(页面骨架/文字照常显示,纯 curl 和 /api/status 探测发现不了);排查法:把下发 HTML 的 script 段抽出来 `node --check`;预防法:页面改动后构建前先做该校验\n25. **SD 统计对不上账 + 满卡死锁(V1.3.0.5,四处)**:1`/api/sd` 文件列表硬截 40 条而驱动存 128 条→\"可见文件合计 102MB vs 已用 7.5GB\"对不上账,修=列表上限对齐驱动+JSON 缓冲 4096→8192;2满卡清理只挂在\"手动停止录像\"分支,自动续录/写满自停/开段失败路径全不清理→卡满永久滞留,修=每段收尾+开段失败都清理;3清理删除上限 Guard<200,卡上碎片文件超 200 个时删不到 KEEP_FREE 就放弃,修=1024(反正\"无可删/删失败\"会提前退出);4录像段序号 G_RecSeq 开机重置为 1+`fopen wb`=未对时 NOSYNC 命名开机同名静默覆盖旧录像(抓拍 G_SnapSeq 有续号而录像没有,移植时漏了),修=挂载后目录一次遍历取 REC_*_NNNN 最大段号+1。教训:**统计类功能必须拿\"驱动真实计数\"对账(串口 `list refresh: N files` 日志)**,API 返回的列表数≠卡上真实文件数\n\n26. **Mesh/多 AP 同名环境 SoftAP \"消失\"(V1.3.0.6)**:环境里同名 SSID 有 3 个 BSSID(信道 1/6/11),ESP32 STA 按信号选节点,位置差时摇摆关联到 -80dBm 弱节点→beacon 丢失(`state: run -> init (0x2c0/0x9c0)`)循环断连;**每次断连重连都要全信道扫描 2~3s,单射频 APSTA 下扫描期间 SoftAP 停发信标且 AP 信道跟随 STA 跳变(日志 `ap channel adjust o:6,1 n:11,2`)→外部看 AP 忽隐忽现/彻底搜不到,已连客户端被踢**--表象是\"WiFi 搜不到\",实际 STA 在疯狂重连。治法:GOT_IP 时记忆节点 BSSID+信道,断线重连 `bssid_set=true`+`channel` 单信道直连(无扫描,SoftAP 几乎不断);连续 8 次直连失败自动解除钉住恢复全信道扫(适应节点下线/挪位,连上后重新钉)。诊断抓手:`nmcli -f SSID,BSSID,CHAN,SIGNAL dev wifi list` 看同名多 BSSID;串口 grep `connected with` 对比历次 bssid\n\n27. **JPEG 残影排查与 EOI 校验加固(V1.3.0.7)**:用户实测\"物体快速移动时画面偶发小残影\"。排查:软件链路无截断/错位可能(fb 960KB 远大于 VGA 帧;HalHttpStreamSend 循环补发保 Content-Length 对位),残影主体是**物理特性**--OV3660 逐行曝光(一帧上下行曝光时刻不同→快移物体形变)+ 室内曝光时间 20~40ms(运动模糊)+ VGA q12 高压缩块效应(运动边缘高频细节被丢成细碎\"蚊子噪声\"块,运动一停下帧即干净);**防御性加固**:原 BspWebJpegOk/BspSdJpegOk 仅查 SOI 头(FFD8),半截截断帧静默过检--流端浏览器解码半截 JPEG 会**保留上一帧局部内容**(真\"残影\"式软件成因)、录像端坏帧进 AVI 花屏;补查 EOI 尾(FFD9)后流/抓拍/录像全部入口拦截首尾损坏帧。教训:**\"看起来像软件问题的现象先量化物理成因再动代码\",帧完整性校验头尾都要查(单查 SOI 拦不住尾部截断)**\n\n28. **四项实测 bug 的根因与修法(V1.4.2.3,2026-10-19)**:\n    - **\"人在跟前反而不触发\"(漏报两根因)**:1旧面积上限 `DET_MAX_AREA=2000` 本意拦截\"全局变化\",但人贴近镜头占屏 40%+ ≈2000+ 格直接被误杀--目标大小与光照突变是两个维度,不能拿面积上限当全局判据;2JPEG 高压缩下大目标差分图碎裂成多个小块,各自小于面积门槛被滤(膨胀 1 轮十字连通后修复,单像素噪声膨胀后仅 5 格十字仍小于门槛不引误报)。检测周期 350→300ms。**教训:面积上限这种\"全屏级 Guard\"要拿真实目标尺寸分布校准,贴脸目标恰恰是最大的合法目标**\n    - **无人时误判有人(误报)**:AEC 步进/开关灯时全帧均匀超阈产生大域伪目标。修法:全局光照突变改\"超阈像素占比>45% 丢帧\"判据(光照突变占比常 >80%,局部人目标 <40%,分界清晰);丢帧时背景照常快更新,下一帧起新光照立即生效。**关于接入开源 API/NN:不采纳--监控要 24h 实时(API 延迟+配额+断网失效),经典 ESP32 无 NN 算力(ESP-DL 人形模型仅 S3),占比判据+膨胀+跟踪确认已把误报压住**\n    - **运行时间 3 秒跳一次**:uptime 来自 `esp_timer_get_time()/1e6` 本身精确,纯网页轮询 setInterval(refresh,3000) 所致,改 1s。注意 fps 显示是两次 /api/status 查询差折算,1s 窗口仍有效(>0.5s 下限)但数值轻微跳动\n    - **邮件不能正常发送(两层叠加)**:网络层 V1.4.2.2 已修(短写续传/30s 预算/自动重试/关 STA 省电);交互层 V1.4.2.3 补修--测试按钮直接 `test=1` 不落表单,填完不点保存就测试=测设备里旧配置必败,现测试前自动把当前表单 POST 一遍。**教训:配置页有\"保存\"和\"测试\"两个动作时,测试必须先隐式保存(或禁用测试直到已保存),用户不会按你想的顺序操作**\n29. **Linux YYM 机 IDF 环境二次踩坑(2026-10-19)**:1系统 python3 从 3.10 升到 3.12 后 venv 软链 `python_env/idf6.1_py3.10_env/bin/python3` 跟着指向 3.12,export 报 rich 缺失/环境不存在--修法:重建软链指向 `/usr/bin/python3.10`,且 export 前加 `IDF_PYTHON_ENV_PATH` 显式指定;2build 目录残留半配置状态会在 `toolchain/cflags` 尾部残留自引用 `@cflags` 行,gcc 报 `too many @-files encountered`(响应文件递归)--修法:`rm -rf build` 全新配置;3cmake 用 /usr/bin 的 3.28(IDF 要求 4.0.3 但兼容),ninja 未装走 Unix Makefiles;4烧录口权限:yym 不在 dialout 组且无 sudo 免密,`chmod 666 /dev/ttyUSB1` 需提权(长期解法 `sudo usermod -aG dialout yym` 后重新登录);5**idf.py set-target/fullclean 重生成 sdkconfig 会丢弃手工改动**--ESP_TLS_INSECURE/SKIP_SERVER_CERT_VERIFY 曾只改在 sdkconfig(c6c4deb),fullclean 后静默回归,邮件 TLS 直接 0x8017(No server verification option set),**所有 sdkconfig 手工改动必须同步写进 sdkconfig.defaults**\n30. **邮件 TLS 深层根因(2026-10-19 终版)**:0x8017 有两层:1上面坑29-5 的证书跳过配置丢失;2**MBEDTLS_INTERNAL_MEM_ALLOC=y(默认)强制 SSL 走内部 RAM**--检测+事件录像+流媒体并发时内部 RAM 挤干,mbedtls_ssl_setup 的 in_buf(16KB,MBEDTLS_SSL_IN_CONTENT_LEN)+out_buf(4KB)calloc 失败返回 tls=141(=PSA_ERROR_INSUFFICIENT_MEMORY,MBEDTLS_ERR_SSL_ALLOC_FAILED 在 PSA 化后不再是负十六进制而是 PSA 码)-->esp 层 0x8017。修=CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y(SSL 缓冲走 8MB PSRAM,邮件低频后台任务性能无感)+app_mail 任务栈 8192→12288。诊断抓手:/api/mail 的 err/whex/sock 三元组+串口 grep \"ssl_setup returned\";**教训:自由堆大的系统也要盯内部 RAM 专用的分配链,PSA 化后 ALLOC_FAILED 错误码形态变了(141 而非 -0x7F00 系)**\n\n31. **USB 供电临界全套定位与硬件根治(2026-10-20~21)**:表象四连环--boot 循环(SW_RESET 伪装)/自发重启(09:02、10:14、17:xx、21:xx 无操作触发)/SD 间歇异常/cam_hal NO-SOI 帧损坏,同根因 **电脑 USB 供电临界,WiFi phy_init 射频校准瞬时 500mA+ 把 5V 拉跌**。定位链:复位原因日志(新加)对时间点对账 → 串口抓到 `E BOD: Brownout detector was triggered`;曾救急 sdkconfig 禁 BOD 换稳定(⚠️ 副作用:真跌压时 flash 写有损坏风险,且 brownout 复位后日志变 POWERON_RESET 与真拔电不可分,只能靠时间点对账)。**硬件根治:5V/GND 跨 680µF 电解电容**(≥470µF,极性别接反,耐压≥6.3V,引脚尽量短贴板)。验证法(模板可复用):①uptime 连续性监测(回落=复位) ②接口压力测试脚本(单路→3 路并发 MJPEG 60s→检测 API 连打,BOD 开关各跑一轮,0 复位+sensor 在线=过) ③ping 延迟旁证(~100ms 抖→~5ms 稳)。附带发现:**插拔电容碰 FPC 排线会让 sensor 上电 ~60s 后掉线**(sensor:none+heap 释放 2.2→4.1MB,SD 正常),重插排线即愈,别误判成电容问题。sudo 直跑 idf.py flash 会触发 component_manager 的 ESP_IDF_VERSION 环境变量 bug(TypeError),绕法=sudo 直接跑 venv python -m esptool write-flash @flash_args\n\n## 版本历史\n\n| 版本 | 日期 | 提交 | 说明 |\n|------|------|------|------|\n| V1.4.2.7 | 10-21 | caef606 | 【硬件+配置】供电问题闭环：5V/GND 跨 680µF 电解电容（USB 供电临界→WiFi 射频校准拉跌 5V→BOD 循环根治）；恢复 CONFIG_ESP_BROWNOUT_DET=y 并同步 sdkconfig.defaults 防回归；带 BOD 过射频校准+满负载压测 0 复位；摄像头排线接触→sensor 上电 60s 掉线问题一并修复（见踩坑 31） |\n| V1.4.2.3 | 10-19 | 70c3b8e | 【修复】四项实测 bug：①邮件测试前自动落当前表单（测旧配置必败的交互坑）②状态轮询 3s→1s（运行时间每秒跳）③检测误报：全局光照突变改超阈占比>45%判据，取消面积上限 2000（误杀贴脸大目标）④差分膨胀 1 轮连回 JPEG 压缩碎片（大/远目标碎裂漏检），周期 350→300ms |\n| V1.3.0.7 | 10-16 | f916f52 | 【加固】JPEG 帧完整性校验补 EOI 尾标记(FFD9)——原仅查 SOI，截断帧静默过检（流端浏览器解码半截 JPEG 保留上一帧局部内容=残影式缺陷，录像端坏帧花屏）；流/抓拍/录像全入口生效。快移残影主体为物理特性（逐行曝光+运动模糊+高压缩块效应），详见踩坑 27 |\n| V1.3.0.6 | 10-15 | 585c251 | 【修复】Mesh 多 AP 环境 AP \"消失\":STA 钉住 BSSID+信道免扫描重连;8 次失败自动解锁重扫。含 SD 劣质卡 write stall 观测记录(8s 看门狗自停正常兜底) |\n| V1.3.0.5 | 10-15 | 5ad2ca6 | 【修复】SD 统计/回收四处:网页列表 40→128 条(缓冲 8192);满卡清理每段收尾+开段失败都执行;清理上限 200→1024;段序号开机续接防 NOSYNC 同名覆盖。实测 free 124→266MB 自动回收 |\n| V1.3.0.4 | 10-15 | 9ebe5c0 | 【修复】配网页所有按钮无反应:detRender 少闭合大括号致整个 script 被浏览器丢弃(V1.3.0.x 检测 UI 引入的 JS 回归) |\n| V1.3.0.3 | 10-15 | dfe2dae | 【修复】开机连不上网:瞬时断开改无限退避重连(前 3 次立即,后 5s→30s 循环自愈),认证类限次 |\n| V1.3.0.0 | 10-12 | - | 【新增】人体活动检测+人流量统计(纯算法:差分+连通域+质心跟踪+计数线) |\n| V1.2.0.0 | 10-11 | - | 【新增】SD 视频录像 AVI(MJPEG) 分段滚动+满卡循环覆盖+开机自动续录 |\n| V1.1.0.0 | 10-10 | - | 【增强】NAPT 借道上网回迁(AP 客户端经 STA 上行) |\n| V1.0.x | 10-08~ | - | 初版:配网/视频流/抓拍/GPIO 控制/SD 管理 |\n\n## 构建与烧录\n\n```powershell\ncmd /c \"call F:\\00.Code\\11ESP\\idf-env.bat && cd /d F:\\00.Code\\11ESP\\ESP && idf.py build\"\ncmd /c \"call F:\\00.Code\\11ESP\\idf-env.bat && cd /d F:\\00.Code\\11ESP\\ESP && idf.py -p COM9 -b 115200 flash\"\n```\n\n- **Linux YYM 机**:`export IDF_TOOLS_PATH=/mnt/sda1/espressif && source /mnt/sda1/esp-idf/export.sh && cd /home/yym/sda1/ESP && idf.py build`;烧录 `idf.py -p /dev/ttyUSB1 -b 115200 flash`\n- `flash` 保留 NVS(配网/摄像头设置不丢);改 `sdkconfig.defaults` 后须删 `sdkconfig` 重新生成(坑同 ESP-32 工程)\n- 验证:串口 115200 看 `app start → ap ready → hal_cam ready → bsp_web ready → app_net ready`;`/api/status` 最省事的端到端探针\n"},{"hash":"ESP/ESP-8266/Cloud_Protocol.md","title":"Cloud_Protocol","relPath":"ESP/ESP-8266/Cloud_Protocol.md","desc":"物联网云平台接入协议速查 来源：巴法官方文档（cloud.bemfa.com/docs/src/）实测核实 + 阿里云/OneNET 官方签名规范。","created":"","updated":"","tags":[],"sizeKB":8.4,"_text":"物联网云平台接入协议速查 来源：巴法官方文档（cloud.bemfa.com/docs/src/）实测核实 + 阿里云/OneNET 官方签名规范。 2026-09 巴法接入调试中沉淀；TCP 8344 与 MQTT 9501 已实测在线，其余待实测。 巴法云 bemfa.com TCP 8344（文本协议，键值对 分隔， 结尾） 指令 报文 应答 ------------------ 订阅 才算成功 发布 订阅+拉历史 回推保留消息 取时间 拉历史 心跳 任意 结尾数据，推荐 要点： - res=1 = 成功，res=0 = 失败/重复（勿凭直觉反着猜） - 心跳周期：65s 不发即掉线（建议 25s） - 多主题订阅：topic 逗号分隔，≤8 个 - 主题后缀语义： 群发（不回推给自己）； 只存云端不推送； 订阅不计入设备在线 - 下行推送格式： （兼容解析：行内搜 ） - TCP 主题在 TCP 控制台建，与 MQTT 控制台主题互不相通 MQTT - 端口：9501 明文 / 9503 TLS(不是9502) / 9504 wss(path /wss) - 认证：clientId = uid(私钥) 即可；user/pass 随意（不存在鉴权绑定） - 能力：QoS0/1 + retain；QoS2 会被强制下线（多次可致账号异常） - 错误时降级用 user/pass 鉴权（user=appID, pass=secretKey） 阿里云 IoT（TLS 8883，固件已实现未实测） - username = - password = - 时间戳为固定值（免 RTC 方案） - 默认透传主题： （需在控制台建，发布+订阅权限） - 企业版实例接入域名不同，需自填 host - 三元组 = ProductKey / DeviceName / DeviceSecret OneNET（MQTT over TLS 8883，固件已实现，V1.0.2.13 时期实测） - token 鉴权：version ，res= ，et= ，method=md5 - 签名密钥 = AccessKey 先 base64 解码再 HMAC-MD5（不是直接用字符串）——2026-09-30 用真实凭据 PC 复现验证：该算法 CONNACK rc=0 认证通过 ✅ - payload 为原始字节（OneJSON 物模型未实现，接物模型需另加包装层） - 三元组 = 产品ID / 设备名 / AccessKey - ⚠️ 实测平台侧问题（待控制台核实）：认证正常但发任何 PUBLISH 即被服务器静默断链（~3s EOF，无 DISCONNECT/错误码；任意主题——含 $sys 物模型主题与自定义主题，任意载荷——含合法 OneJSON）；只发 PINGREQ/PINGRESP 可长期存活。PC 与固件双端同现象 → 非固件 bug，疑产品接入模式/物模型强校验配置问题 - 附：keepalive 内完全无任何报文时，服务端 ~1.5×keepalive 断链（60s→实测 90s）属标准 MQTT 行为，勿误判 腾讯云 IoT Explorer（MQTT 1883 明文·密钥认证，固件已实现 V1.0.4.0） - 接入点： （密钥认证走 1883 明文；8883 仅证书认证用——官方文档 634/32546 核实，与阿里/OneNET 全 TLS 不同） - username = - 格式 ；sdkappid=12010126 为官方固定值；connid 自定义（固件固定 xcom1）；expiry 固定 4102444800（2100 年，免 RTC） - password = - PSK 先 base64 解码再 HMAC-SHA1（同 OneNET\"先解码\"思路）；摘要 hex 小写；尾部拼 算法声明段 - 签名串就是整个 username，不含独立时间戳参数（时效在 expiry 里） - clientId = - 默认主题 ：官方默认权限发布+订阅双向通吃，无需控制台建主题（与阿里不同） - 固件：BearSSL HMAC-SHA1 纯算法（AppCloudHmacSha1）；签名经官方 C 工具对拍一致；CONNECT flags 0xC2 照旧 - 三元组 = 产品ID / 设备名 / 设备密钥(PSK) - 板端验证：CONNECT 被 broker 接受（cloudtag=3/cloudon=1）；平台控制台收发实测待真实设备凭据 华为云 IoTDA（MQTT 1883 明文·密钥认证，固件已实现 V1.0.5.0） - 接入点： （明文 MQTT；8883=MQTTS 需平台 CA 证书；域名格式经官方 SDK 0.8.0 更新日志核实） - username = deviceid（设备注册后平台返回的 24 位十六进制 ID，不是设备名） - clientId = （官方四段式，下划线分隔）： - 段 2 身份标识类型固定 0=设备 ID 直连；段 3 密码签名类型：0=HMACSHA256 不校验时间戳、1=校验（固件用 0） - timestamp 格式 UTC （10 位，官方 SDK GetClientTimesStamp：gmtime 取年月日时）；不校验时间也必须带（官方 3009 明文规定） - password = （64 位小写 hex） - 方向铁律：HMAC 密钥=时间戳字符串，内容=secret（官方 SDK EncryptWithHMac 源码 ；官方文档测试向量 secret=12345678/ts=2025041401 → 对拍一致）——与\"内容=时间戳\"的直觉相反，记反必被拒（0x04 用户名或密码错误） - 密钥认证 secret 用原文，不做 base64 解码（OneNET accesskey/腾讯 PSK 才需要） - 无 RTC 时 timestamp=1970010100 也能过（签名类型 0 不校验时间），NTP 同步后自动变真实时间 - 默认主题（ 系统主题族，官方 3004）： - 上行 ：平台不校验消息格式，可发裸串（透传保真）或 系统格式 - 下行 ：CONNACK 后平台自动订阅全部 QoS0 系统主题，设备端无需发 SUBSCRIBE（华为特性，与腾讯/阿里不同） - 自定义主题 需显式订阅 - 属性上报走 （需产品模型，固件未用）；命令下发 固件统一当下行数据处理 - 固件：BearSSL HMAC-SHA256 纯算法（AppCloudHmacSha256，32B 摘要）；槽位 5（cloudhw 前缀）；云端需先建产品+设备，注册方式选\"密钥\"并自行填写 secret - 三元组 = 产品ID（组域名）/ 设备ID / 设备密钥(secret) - 验证状态：签名算法经官方 SDK 源码+官方测试向量双核实；控制台收发实测待真实凭据 通用 MQTT 底层备忘（手工组包） - CONNECT 可变头： +\\x04（3.1.1），flags 0xC2 = clean session + username + password 三位必须随 payload 声明，keepalive 60s - 订阅/发布走 QoS0 最简路径；解析用显式状态机（HDR→LEN→TOPIC→PAYLOAD），每字节 门控防 TCP 分段撕裂 - ESP8266 上 BearSSL： → → （16B）；SHA1 版换 （20B，腾讯云用）；SHA256 版换 （32B，华为云用） 实测踩坑补充（2026-09-23） - CONNACK 解析陷阱：CONNACK = 四字节，返回码在第 4 字节；若把\"剩余长度02\"当 payload 校验（ ），服务器明明接受（rc=0）也会被误判为拒绝——表现为设备永远\"未连接\"而平台无任何异常。巴法 9501 实测命中此坑，已修。 - 诊断方法：固件埋 cloudtag（阶段）/clouderr（计数）/cloudrc（最近 CONNACK 返回码）暴露到 /api/status，一次烧录即可定位卡点，比串口打印干净（串口是数据通道不可占用）。 - 巴法 MQTT 控制台需单独建 MQTT 类型主题（如 sensor004）；TCP 主题与 MQTT 主题不互通。 - OneNET 排查方法论（2026-09-30 补）：PC 端 Python 手工组 MQTT 报文（与固件同款 token/CONNECT）+ 分组对照实验（只连 / 只 PINGREQ / 发包），可把\"连上就断\"这类问题干净地分离为固件侧 vs 平台侧；注意实验脚本自身的 EOF/SSLError 检测要先写对（吞异常会造成\"活着\"的假阴性，本次实测踩过）。","content":"# 物联网云平台接入协议速查\n\n> 来源：巴法官方文档（cloud.bemfa.com/docs/src/）实测核实 + 阿里云/OneNET 官方签名规范。\n> 2026-09 巴法接入调试中沉淀；TCP 8344 与 MQTT 9501 已实测在线，其余待实测。\n\n## 巴法云 bemfa.com\n\n### TCP 8344（文本协议，键值对 `&` 分隔，`\\r\\n` 结尾）\n\n| 指令 | 报文 | 应答 |\n|------|------|------|\n| 订阅 | `cmd=1&uid={私钥}&topic={主题}\\r\\n` | `cmd=1&res=1` 才算成功 |\n| 发布 | `cmd=2&uid={私钥}&topic={主题}&msg={URL编码}\\r\\n` | `cmd=2&res=1` |\n| 订阅+拉历史 | `cmd=3&uid=&topic=\\r\\n` | 回推保留消息 |\n| 取时间 | `cmd=7&uid=\\r\\n` | |\n| 拉历史 | `cmd=9&uid=&topic=\\r\\n` | |\n| 心跳 | 任意 `\\r\\n` 结尾数据，推荐 `ping\\r\\n` | `cmd=0&res=1` |\n\n要点：\n- **res=1 = 成功，res=0 = 失败/重复**（勿凭直觉反着猜）\n- 心跳周期：65s 不发即掉线（建议 25s）\n- 多主题订阅：topic 逗号分隔，≤8 个\n- 主题后缀语义：`/set` 群发（不回推给自己）；`/up` 只存云端不推送；`/app` 订阅不计入设备在线\n- 下行推送格式：`cmd=3&uid=&topic=&msg=...`（兼容解析：行内搜 `&msg=`）\n- **TCP 主题在 TCP 控制台建，与 MQTT 控制台主题互不相通**\n\n### MQTT\n\n- 端口：**9501 明文 / 9503 TLS(不是9502) / 9504 wss(path /wss)**\n- 认证：clientId = uid(私钥) 即可；user/pass 随意（不存在鉴权绑定）\n- 能力：QoS0/1 + retain；**QoS2 会被强制下线**（多次可致账号异常）\n- `clientId` 错误时降级用 user/pass 鉴权（user=appID, pass=secretKey）\n\n## 阿里云 IoT（TLS 8883，固件已实现未实测）\n\n- username = `{DeviceName}`\n- password = `base64( hmac_md5(DeviceSecret, \"productKey{pk}&deviceName{dn}&timestamp2524576000000&\") )`\n  - 时间戳为固定值（免 RTC 方案）\n- 默认透传主题：`/{pk}/{dn}/data`（需在控制台建，发布+订阅权限）\n- 企业版实例接入域名不同，需自填 host\n- 三元组 = ProductKey / DeviceName / DeviceSecret\n\n## OneNET（MQTT over TLS 8883，固件已实现，V1.0.2.13 时期实测）\n\n- token 鉴权：version `2018-10-31`，res=`products/{pid}/devices/{dn}`，et=`4102444800`，method=md5\n- 签名密钥 = **AccessKey 先 base64 解码**再 HMAC-MD5（不是直接用字符串）——2026-09-30 用真实凭据 PC 复现验证：该算法 CONNACK rc=0 认证通过 ✅\n- payload 为原始字节（OneJSON 物模型未实现，接物模型需另加包装层）\n- 三元组 = 产品ID / 设备名 / AccessKey\n- **⚠️ 实测平台侧问题（待控制台核实）**：认证正常但**发任何 PUBLISH 即被服务器静默断链**（~3s EOF，无 DISCONNECT/错误码；任意主题——含 $sys 物模型主题与自定义主题，任意载荷——含合法 OneJSON）；只发 PINGREQ/PINGRESP 可长期存活。PC 与固件双端同现象 → 非固件 bug，疑产品接入模式/物模型强校验配置问题\n- 附：keepalive 内完全无任何报文时，服务端 ~1.5×keepalive 断链（60s→实测 90s）属标准 MQTT 行为，勿误判\n\n## 腾讯云 IoT Explorer（MQTT 1883 明文·密钥认证，固件已实现 V1.0.4.0）\n\n- 接入点：`{productKey}.iotcloud.tencentdevices.com:1883`（**密钥认证走 1883 明文**；8883 仅证书认证用——官方文档 634/32546 核实，与阿里/OneNET 全 TLS 不同）\n- username = `{pid}{dn};12010126;xcom1;4102444800`\n  - 格式 `{productId}{deviceName};{sdkappid};{connid};{expiry}`；sdkappid=12010126 为官方固定值；connid 自定义（固件固定 xcom1）；expiry 固定 4102444800（2100 年，免 RTC）\n- password = `hex( hmac_sha1( b64dec(PSK), username ) );hmacsha1`\n  - **PSK 先 base64 解码**再 HMAC-SHA1（同 OneNET\"先解码\"思路）；摘要 hex 小写；尾部拼 `;hmacsha1` 算法声明段\n  - 签名串就是整个 username，不含独立时间戳参数（时效在 expiry 里）\n- clientId = `{pid}{dn}`\n- 默认主题 `{pid}/{dn}/data`：官方默认权限**发布+订阅双向通吃**，无需控制台建主题（与阿里不同）\n- 固件：BearSSL `br_sha1_vtable` HMAC-SHA1 纯算法（AppCloudHmacSha1）；签名经官方 `qcloud_iot_mqtt_sign` C 工具对拍一致；CONNECT flags 0xC2 照旧\n- 三元组 = 产品ID / 设备名 / 设备密钥(PSK)\n- 板端验证：CONNECT 被 broker 接受（cloudtag=3/cloudon=1）；平台控制台收发实测待真实设备凭据\n\n## 华为云 IoTDA（MQTT 1883 明文·密钥认证，固件已实现 V1.0.5.0）\n\n- 接入点：`{product_id}.iot-mqtts.cn-north-4.myhuaweicloud.com:1883`（明文 MQTT；8883=MQTTS 需平台 CA 证书；域名格式经官方 SDK 0.8.0 更新日志核实）\n- username = device_id（设备注册后平台返回的 24 位十六进制 ID，不是设备名）\n- clientId = `{device_id}_0_0_{timestamp}`（官方四段式，下划线分隔）：\n  - 段 2 身份标识类型固定 0=设备 ID 直连；段 3 密码签名类型：0=HMACSHA256 **不校验时间戳**、1=校验（固件用 0）\n  - timestamp 格式 UTC `YYYYMMDDHH`（10 位，官方 SDK GetClientTimesStamp：gmtime 取年月日时）；不校验时间也必须带（官方 3009 明文规定）\n- password = `hex( hmac_sha256( timestamp, secret ) )`（64 位小写 hex）\n  - **方向铁律：HMAC 密钥=时间戳字符串，内容=secret**（官方 SDK EncryptWithHMac 源码 `HMAC(EVP_sha256(), key=timestamp, msg=secret)`；官方文档测试向量 secret=12345678/ts=2025041401 → `c75150e6...c820a` 对拍一致）——与\"内容=时间戳\"的直觉相反，记反必被拒（0x04 用户名或密码错误）\n  - 密钥认证 secret 用原文，**不做 base64 解码**（OneNET access_key/腾讯 PSK 才需要）\n  - 无 RTC 时 timestamp=1970010100 也能过（签名类型 0 不校验时间），NTP 同步后自动变真实时间\n- 默认主题（`$oc` 系统主题族，官方 3004）：\n  - 上行 `$oc/devices/{device_id}/sys/messages/up`：**平台不校验消息格式**，可发裸串（透传保真）或 `{\"content\":...}` 系统格式\n  - 下行 `$oc/devices/{device_id}/sys/messages/down`：**CONNACK 后平台自动订阅全部 QoS0 系统主题**，设备端无需发 SUBSCRIBE（华为特性，与腾讯/阿里不同）\n  - 自定义主题 `$oc/devices/{device_id}/user/{xxx}` 需显式订阅\n- 属性上报走 `$oc/devices/{device_id}/sys/properties/report`（需产品模型，固件未用）；命令下发 `sys/commands/request_id=` 固件统一当下行数据处理\n- 固件：BearSSL `br_sha256_vtable` HMAC-SHA256 纯算法（AppCloudHmacSha256，32B 摘要）；槽位 5（cloudhw_ 前缀）；云端需先建产品+设备，注册方式选\"密钥\"并自行填写 secret\n- 三元组 = 产品ID（组域名）/ 设备ID / 设备密钥(secret)\n- 验证状态：签名算法经官方 SDK 源码+官方测试向量双核实；控制台收发实测待真实凭据\n\n## 通用 MQTT 底层备忘（手工组包）\n\n- CONNECT 可变头：`MQTT`+\\x04（3.1.1），flags **0xC2** = clean session + username + password 三位必须随 payload 声明，keepalive 60s\n- 订阅/发布走 QoS0 最简路径；解析用显式状态机（HDR→LEN→TOPIC→PAYLOAD），每字节 `available()` 门控防 TCP 分段撕裂\n- ESP8266 上 BearSSL：`br_hmac_key_init(&kc,&br_md5_vtable,key,len)` → `br_hmac_update` → `br_hmac_out`（16B）；SHA1 版换 `br_sha1_vtable`（20B，腾讯云用）；SHA256 版换 `br_sha256_vtable`（32B，华为云用）\n\n## 实测踩坑补充（2026-09-23）\n\n- **CONNACK 解析陷阱**：CONNACK = `20 02 <session-present> <return-code>` 四字节，返回码在**第 4 字节**；若把\"剩余长度02\"当 payload 校验（`a==2&&b==0`），服务器明明接受（rc=0）也会被误判为拒绝——表现为设备永远\"未连接\"而平台无任何异常。巴法 9501 实测命中此坑，已修。\n- 诊断方法：固件埋 cloudtag（阶段）/clouderr（计数）/cloudrc（最近 CONNACK 返回码）暴露到 /api/status，一次烧录即可定位卡点，比串口打印干净（串口是数据通道不可占用）。\n- 巴法 MQTT 控制台需单独建 MQTT 类型主题（如 sensor004）；TCP 主题与 MQTT 主题不互通。\n- **OneNET 排查方法论（2026-09-30 补）**：PC 端 Python 手工组 MQTT 报文（与固件同款 token/CONNECT）+ 分组对照实验（只连 / 只 PINGREQ / 发包），可把\"连上就断\"这类问题干净地分离为固件侧 vs 平台侧；**注意实验脚本自身的 EOF/SSLError 检测要先写对**（吞异常会造成\"活着\"的假阴性，本次实测踩过）。\n"},{"hash":"ESP/ESP-8266/Project_Level_Skill.md","title":"Project_Level_Skill","relPath":"ESP/ESP-8266/Project_Level_Skill.md","desc":"嵌入式项目架构规范（跨仓库形态 · 通用模板） TOC 0. 使用说明 本文档为跨工程通用模板，可直接复制到任意 MCU 工程根目录使用，无需任何修改。","created":"","updated":"","tags":[],"sizeKB":21.7,"_text":"嵌入式项目架构规范（跨仓库形态 · 通用模板） TOC 0. 使用说明 本文档为跨工程通用模板，可直接复制到任意 MCU 工程根目录使用，无需任何修改。 正文统一使用占位符引用工程参数，使用时按当前工程实际结构对应取值。 0.1 仓库形态 二选一，两种形态共用本文档全部规范，仅代码物理位置与版本管理方式不同： 形态 结构 的含义 ------------------------------ 形态A：主仓库 + 子仓库 HAL 在主仓库，DRV/BSP/APP 在独立 Git 仓库 Git Submodule（第 10 章适用） 形态B：单仓库 HAL 与 DRV/BSP/APP 在同一仓库 主仓库内普通模块目录（第 10 章不适用） 形态B 下，正文中的 （含\"子仓库\"一词及 ）统一读作该模块目录及其 Readme，其余规则一字不改。 0.2 标注约定 - 占位符（如 、 、 、 ）：正文通用规则一律使用占位符，禁止写死工程名，各工程按实际值对应 - 固定目录名（如 ）：为保持跨工程统一而约定的固定名称，各工程必须使用同名目录，不得改名，因此正文直接写出、不作参数化 - （示例）：纯说明性举例，不构成对当前工程的约束 --- 1. 适用范围 适用于基于官方外设驱动库的 C 语言嵌入式项目，使用 Git 管理，支持主仓库 + 子仓库与单仓库两种形态（见第 0.1 节）。 核心目标：HAL 作为主仓库与上层模块的硬件抽象边界，DRV/BSP/APP 与具体 MCU 隔离，实现跨产品代码最大程度复用。 --- 2. 总体架构 软件依赖（严格单向）： 层级 职责 一句话 -------------------- HAL MCU 硬件抽象 MCU 怎么操作 DRV 具体芯片/器件驱动 芯片怎么操作 BSP 当前产品硬件封装 硬件怎么组织 APP 产品业务逻辑 功能怎么实现 --- 3. 命名规范 3.1 文件名前缀（区分层级） 层级 文件前缀 示例 ---------------------- HAL DRV BSP APP 公共 (层级无关配置头, 各层均可包含) 3.2 接口名前缀（CamelCase） 层级 接口前缀 示例 ---------------------- HAL DRV BSP APP 3.3 变量命名 变量类型 命名规则 示例 -------------------------- 全局变量（含 static 文件级变量） + PascalCase 、 局部变量 PascalCase（大驼峰） 、 结构体类型 PascalCase + 结构体指针类型 + PascalCase + 结构体变量 PascalCase 结构体指针变量 + PascalCase 枚举类型 PascalCase + 枚举成员 + UPPERSNAKECASE 、 结构体 typedef 必须同时定义类型和指针类型： 枚举定义示例： 3.4 规则 - 文件名：全小写 + 层级前缀，如 - 函数名：CamelCase + 层级前缀，如 - 全局变量必须以 开头，如 ；static 文件级变量同样以 开头（不区分是否 static） - 结构体类型以 结尾，枚举类型以 结尾 - 指针类型加 前缀，如 - 文件名和接口名必须同时体现层级 3.5 函数注释规范（Doxygen） 子仓库中所有函数（含 内部函数）的定义上方必须有 Doxygen 风格中文注释块，格式统一： 3.5.1 标签必填规则 标签 必填条件 内容要求 -------------------------- 所有函数必填 一句话说明\"做什么\"；禁止写\"无\"/\"略\" 有参数的函数必填 逐参数一行，写明取值范围、单位或格式（如 、 ） 非 函数必填 写明各返回值含义（如 、 ）； 函数省略本行 存在下表任一场景时必填 无注意事项的简单函数可省 3.5.2 必填场景 场景 注释示例 ---------------- 阻塞/耗时 、 超时与重试 调用前置条件 、 调用周期/上下文 、 缓冲区限制 、 副作用 仅写显存类 引脚/资源风险 3.5.3 检查方法 逐文件扫描 中每个函数定义（正则 定位），向上回溯确认紧邻的注释块： 1. 缺 注释块 → 判定缺函数说明 2. 有注释块但缺 或内容敷衍（\"无\"/\"略\"）→ 判定说明不合格 3. 函数命中 3.5.2 任一场景但缺 → 判定缺注意事项 4. 有参数但缺 、非 但缺 → 判定参数/返回值未标注 输出格式： 清单，全部修复后方可通过 Code Review。 3.6 函数实现长度规范 单个函数的功能实现尽量控制在 10~20 行（不含注释与空行），太长会影响阅读与维护。 - 超过 20 行时，优先按功能拆分为职责单一的子函数（如状态机各分支、初始化/收发/保活各环节独立成函数） - 拆分后每个子函数同样遵循本规范；查表、长 分发等结构性代码可适当放宽 - 拆分收益：主流程一眼可读，子函数可独立测试与复用 检查方法：扫描各函数 与配对 之间的有效代码行数，超过 20 行的函数列出清单逐个评估；确无拆分边界的，在函数注释 中说明保留原因。 --- 4. 目录设计 4.1 子仓库统一 inc/src 结构 子仓库内部不按软件层级建目录，统一使用 + ，通过文件名前缀区分层级。 禁止： 正确： 4.2 为什么用 inc/src 而非分层目录 1. 目录结构简单，模块增加不产生目录膨胀 2. 文件名前缀已能明确层级 3. IDE 工程直接配置 + 即可 4. 搜索 / / 可快速定位同层所有文件 --- 5. 各层职责 HAL（主仓库） 负责：GPIO、UART、I2C、SPI、CAN、ADC、PWM、TIMER、DMA、EXTI、FLASH、RTC、NVIC、SysTick 等 MCU 外设。 不负责：传感器业务、产品逻辑、协议解析、状态机。 HAL 是主仓库与 的接口边界，上层模块只依赖 HAL 抽象接口，不依赖具体 MCU 型号。 DRV 负责：具体芯片初始化、寄存器配置、通信、原始数据读取与转换。 例如： 、 、 、 、 （示例） DRV 只能通过 HAL 访问 MCU 硬件，禁止直接操作寄存器或外设指针。 BSP 负责：当前产品硬件资源与 DRV 之间的组合、封装和适配。 例如： （调用 ）、 （调用 ）（示例） APP 负责：产品功能、状态机、数据处理、故障处理、通信等业务逻辑。 APP 通过 BSP 访问硬件，不直接调用 DRV 或 HAL。 --- 6. 依赖规则 6.1 调用链示例 6.2 函数调用层级限制 任意调用链的函数层级不得超过 5 层（入口函数为第 1 层，每下钻一级 +1，厂商库调用同样计入）： 规则： 1. 跨层主链路 APP→BSP→DRV→HAL 已占 4 层，中间至多再引入 1 层封装 2. 超过 5 层视为封装过碎或业务逻辑下沉过深，应合并中间函数或上提业务判断 3. 禁止递归调用；确需使用时按最坏展开深度计入层级，并静态评估栈占用 --- 7. 新增代码层级判断 代码内容 所属层 ------------------ GPIO/UART/I2C/SPI/ADC/PWM/TIMER/FLASH 操作 HAL 具体芯片寄存器操作（MPU6050/INA226/SHT3X/OLED） DRV 产品硬件描述（电池电压、设备温度、产品按键） BSP 产品功能逻辑（电池管理、传感器融合、服务器通信） APP 反例：DRV 中写低电量判断/充电控制/上传服务器 → 应放 APP。APP 中直接 → 应通过 BSP→DRV→HAL。 --- 8. HAL 接口稳定性 HAL 接口一旦确定，不应频繁修改函数原型。扩展时优先：增加参数、增加新接口、增加配置结构体，保留旧接口兼容。 HAL 禁止直接操作（示例）： 这些操作必须封装在 HAL 中，对上层透明。 --- 9. MCU 迁移 更换 MCU（如 STM32F103 → GD32F303，示例）时，原则上只需修改 HAL，DRV/BSP/APP 尽可能不变。 9.1 迁移原则 - 子仓库通过 抽象接口访问硬件，不直接依赖任何 MCU 厂商头文件 - 移植的核心任务是在主仓库中用新 MCU 的 SDK 重新实现 HAL 层接口 - 子仓库的 HAL 接口清单、移植步骤和检查清单见 的「MCU移植指南」章节 9.2 迁移阶段 9.3 迁移检查项 (Code Review) - 子仓库零直接依赖 MCU 厂商头文件（无厂商 直接包含）？ - 子仓库无直接寄存器操作（无 形式）？ - HAL 层接口已按 「MCU移植指南」清单全部实现？ - 「MCU移植指南」检查清单已逐项确认？ --- 10. Git Submodule 管理（仅形态A） 不同产品锁定不同 Submodule Commit，互不影响。 --- 11. 内存与中断规范 内存 - 优先使用 、 、固定长度 Buffer、RingBuffer - 减少/避免全局 Buffer 和重复 Buffer - 原则上不使用 中断 中断中只做：读取必要数据 → 写入 Buffer → 设置标志 → 退出。 禁止在中断中执行：长时间循环、阻塞等待、协议解析、大量 printf、浮点计算、长延时。 --- 12. 编译资源检查（MAP 文件分析） 12.1 检查方法 每次编译后， 在输出目录生成 文件。打开 MAP 文件末尾，找到以下三行： 12.2 字段说明 MAP 字段 含义 对应 MCU 资源 ------------------------------ Total RO Size Code + RO Data（只读代码+常量） 占用 Flash Total RW Size RW Data + ZI Data（已初始化+未初始化变量） 占用 SRAM Total ROM Size Code + RO Data + RW Data（实际烧写到Flash的总量） 占用 Flash RW Data 会被存储在 Flash 中，启动时搬运到 SRAM，因此同时占用 Flash 和 SRAM。 12.3 判定规则 将 MAP 文件中的实际占用与所选 的实际 Flash / SRAM 容量对照： 状态 条件 处理 ------------------ ✅ 正常 Flash < 80% 且 SRAM < 80% 无需操作 ⚠️ 警告 Flash ≥ 80% 或 SRAM ≥ 80% 优化代码体积/内存占用 🔴 危险 Flash ≥ 95% 或 SRAM ≥ 95% 必须优化，否则无法继续开发 弱符号兜底检查（条件项）：若工程使用了弱符号兜底文件（如 ，为全部 HAL 公开接口提供 空实现/错误码实现），正式构建后检查 MAP 中该文件应无存活符号——出现存活符号即说明存在\"被上层引用但 HAL 未实现\"的接口，需补齐实现或裁剪上层功能开关。HAL 全实现时兜底文件被强符号覆盖剔除，Flash 占用为 0。维护纪律：HAL 新增公开接口须同步兜底文件补 stub。 编译结果是随每次构建变化的项目数据，不记录于本模板；如需留存历史趋势，记录到 等工程自有文档，避免模板被逐次修改。 --- 13. 功能记录维护 13.1 记录规则 每实现一个新功能，必须同步更新对应范围的 Readme： 范围 文件 记录范围 ---------------------- 主仓库 HAL 层功能（UART/Timer/GPIO/ADC/SPI/I2C 等） 子仓库 BSP/DRV/APP 层功能（串口封装/解析/调度/驱动等） 形态B（单仓库）下，两份记录合并为同一 Readme 的两个章节，记录范围与更新规则不变。 13.2 记录格式 每个模块按统一格式记录： 13.3 更新时机 1. 新增 HAL/BSP/APP 接口时 2. 修改已有接口原型时 3. 删除接口时 4. Code Review 前确认记录已同步 13.4 Code Review 补充检查项 - 主仓库 Readme 已同步 HAL 新增功能？ - 子仓库 Readme 已同步 BSP/DRV/APP 新增功能？ - 每个硬件号的数据流转图已同步更新？（第 13.5 节） 13.5 硬件号数据流转 子仓库 Readme 必须为特性表登记的每个硬件号维护两份材料： 1. 数据通路清单表（主）—— 逐条通路，一表看全\"源→采集→缓存→消费→输出\" 2. 分阶段流程图（辅）—— Mermaid ，按五阶段分组 通路阶段模型（所有硬件号统一）： 清单表格式（每条通路一行，通路编号 P1/P2... 与图中边标注对应；下表为格式示例）： 流程图要求： 1. 五个 subgraph 按阶段命名： / / / / 2. 每个节点标注：所属模块（层前缀）+ 引脚/串口 + 频率或触发方式 3. 边标注通路编号（P1/P2...）与数据内容；虚线 = 中断直达，实线 = 主循环轮询/阻塞 4. 数据左进右出：输入源在最左，物理输出在最右，天然无回边交叉 多硬件号差异速览表（硬件号≥2 时必填；下表为格式示例）： 更新时机（任一触发即须更新清单表+图）： - 特性表功能位或串口字段变化 - 新增/删除模块 - 采样频率槽调整（如超声波 10Hz → 20Hz） - 中断回调注册关系变化 检查要点（Code Review 时逐项核对）： - 清单表通路集合与特性表该行功能位/串口字段一致（无多画/漏画）？ - 每条通路各环节（②③④⑤）对应的调用/数据结构真实存在于代码？ - 中断链（虚线）与主循环链（实线）区分标注？触发方式（中断/轮询/阻塞/AT按需）写实？ - 频率槽标注与 的 调度表一致？ - 图中边编号(P1...)与清单表通路一一对应？ - 多硬件号差异速览表已维护且结论正确？ --- 14. Code Review 检查项 架构 - 主仓库只维护 HAL？ - 只有 + （形态A 时为 Submodule）？ - 遵循 单向依赖？ 命名 - 文件前缀： / / / ？ - 接口前缀： / / / ？ - 文件级变量（含 static） 前缀？ - 结构体 + 指针类型？枚举 后缀？ 注释 - 所有函数（含 ）定义上方均有 Doxygen 注释块？（第 3.5.3 节方法扫描） - 每个函数均有 功能说明，无敷衍内容？ - 有参数的函数逐参数标注 （","content":"# 嵌入式项目架构规范（跨仓库形态 · 通用模板）\n\n[TOC]\n\n\n## 0. 使用说明\n\n> 本文档为跨工程通用模板，可直接复制到任意 MCU 工程根目录使用，**无需任何修改**。\n> 正文统一使用占位符引用工程参数，使用时按当前工程实际结构对应取值。\n\n### 0.1 仓库形态\n\n`<仓库形态>` 二选一，两种形态共用本文档全部规范，仅代码物理位置与版本管理方式不同：\n\n| 形态 | 结构 | `<子仓库>` 的含义 |\n|------|------|------------------|\n| 形态A：主仓库 + 子仓库 | HAL 在主仓库，DRV/BSP/APP 在独立 Git 仓库 | Git Submodule（第 10 章适用） |\n| 形态B：单仓库 | HAL 与 DRV/BSP/APP 在同一仓库 | 主仓库内普通模块目录（第 10 章不适用） |\n\n形态B 下，正文中的 `<子仓库>`（含\"子仓库\"一词及 `<子仓库Readme>`）统一读作该模块目录及其 Readme，其余规则一字不改。\n\n### 0.2 标注约定\n\n- **占位符**（如 `<子仓库>`、`<厂商库目录>`、`<IDE>`、`<MCU>`）：正文通用规则一律使用占位符，禁止写死工程名，各工程按实际值对应\n- **固定目录名**（如 `01.HAL`）：为保持跨工程统一而约定的固定名称，各工程必须使用同名目录，不得改名，因此正文直接写出、不作参数化\n- **（示例）**：纯说明性举例，不构成对当前工程的约束\n\n---\n\n## 1. 适用范围\n\n适用于基于官方外设驱动库的 C 语言嵌入式项目，使用 Git 管理，支持**主仓库 + 子仓库**与**单仓库**两种形态（见第 0.1 节）。\n\n核心目标：**HAL 作为主仓库与上层模块的硬件抽象边界，DRV/BSP/APP 与具体 MCU 隔离，实现跨产品代码最大程度复用。**\n\n---\n\n## 2. 总体架构\n\n```text\n主工程/\n├── <厂商库目录>/              ← 官方库 (CMSIS + 外设驱动库)\n├── 01.HAL/                    ← MCU 硬件抽象层 (主仓库维护，固定目录名，见 0.2)\n│   ├── inc/\n│   └── src/\n├── <子仓库>/                  ← DRV/BSP/APP 所在目录\n│   ├── inc/                   ←   形态A: Git Submodule (独立仓库)\n│   └── src/                   ←   形态B: 主仓库内普通模块目录\n└── <IDE工程目录>/\n```\n\n软件依赖（严格单向）：\n\n```text\nAPP → BSP → DRV → HAL → 厂商官方库 → MCU\n```\n\n| 层级 | 职责 | 一句话 |\n|------|------|--------|\n| HAL | MCU 硬件抽象 | MCU 怎么操作 |\n| DRV | 具体芯片/器件驱动 | 芯片怎么操作 |\n| BSP | 当前产品硬件封装 | 硬件怎么组织 |\n| APP | 产品业务逻辑 | 功能怎么实现 |\n\n---\n\n## 3. 命名规范\n\n### 3.1 文件名前缀（区分层级）\n\n| 层级 | 文件前缀 | 示例 |\n|------|----------|------|\n| HAL | `hal_` | `hal_uart.c` |\n| DRV | `drv_` | `drv_mpu6050.c` |\n| BSP | `bsp_` | `bsp_battery.c` |\n| APP | `app_` | `app_parse.c` |\n| 公共 | `cfg_` | `cfg_modules.h` (层级无关配置头, 各层均可包含) |\n\n### 3.2 接口名前缀（CamelCase）\n\n| 层级 | 接口前缀 | 示例 |\n|------|----------|------|\n| HAL | `Hal` | `HalUartInit()` |\n| DRV | `Drv` | `DrvMpu6050GetData()` |\n| BSP | `Bsp` | `BspBatteryCurrentGet()` |\n| APP | `App` | `AppParseProcess()` |\n\n### 3.3 变量命名\n\n| 变量类型 | 命名规则 | 示例 |\n|----------|----------|------|\n| 全局变量（含 static 文件级变量） | `G_` + PascalCase | `G_SystemTick`、`G_RxBuf` |\n| 局部变量 | PascalCase（大驼峰） | `DataLen`、`RecvCount` |\n| 结构体类型 | PascalCase + `_S` | `HalUartRxBuffer_S` |\n| 结构体指针类型 | `p` + PascalCase + `_S` | `pHalUartRxBuffer_S` |\n| 结构体变量 | PascalCase | `HalUartRxBuffer` |\n| 结构体指针变量 | `p` + PascalCase | `pHalUartRxBuffer` |\n| 枚举类型 | PascalCase + `_E` | `RunFreCtrl_E` |\n| 枚举成员 | `层级_` + UPPER_SNAKE_CASE | `HAL_UART_1`、`RUN_100Hz` |\n\n结构体 typedef 必须同时定义类型和指针类型：\n\n```c\ntypedef struct\n{\n    unsigned char buf[HAL_UART_RX_BUF_SIZE];\n    unsigned int  head;\n    unsigned int  tail;\n    unsigned int  count;\n} HalUartRxBuffer_S, *pHalUartRxBuffer_S;\n```\n\n枚举定义示例：\n\n```c\ntypedef enum\n{\n    HAL_UART_1 = 1,\n    HAL_UART_2,\n    HAL_UART_3\n} HalUartPort_E;\n```\n\n### 3.4 规则\n\n- 文件名：全小写 + 层级前缀，如 `drv_ina226.c`\n- 函数名：CamelCase + 层级前缀，如 `DrvIna226Init()`\n- 全局变量必须以 `G_` 开头，如 `G_SystemTick`；static 文件级变量同样以 `G_` 开头（不区分是否 static）\n- 结构体类型以 `_S` 结尾，枚举类型以 `_E` 结尾\n- 指针类型加 `p` 前缀，如 `pHalUartRxBuffer_S`\n- 文件名和接口名必须同时体现层级\n\n### 3.5 函数注释规范（Doxygen）\n\n子仓库中**所有函数（含 `static` 内部函数）**的定义上方必须有 Doxygen 风格中文注释块，格式统一：\n\n```c\n/**\n * @brief 一句话功能说明\n * @param 参数名 参数含义说明（含取值范围/单位/格式）\n * @retval 返回值说明（各返回值含义）\n * @note 注意事项\n */\n```\n\n#### 3.5.1 标签必填规则\n\n| 标签 | 必填条件 | 内容要求 |\n|------|----------|----------|\n| `@brief` | 所有函数必填 | 一句话说明\"做什么\"；禁止写\"无\"/\"略\" |\n| `@param` | 有参数的函数必填 | 逐参数一行，写明取值范围、单位或格式（如 `0~127, 单位像素`、`\"%d\"/\"%.1f\"格式串`） |\n| `@retval` | 非 `void` 函数必填 | 写明各返回值含义（如 `0成功 -1失败`、`BSP_WIFI_OK/BSP_WIFI_ERROR`）；`void` 函数省略本行 |\n| `@note` | 存在下表任一场景时必填 | 无注意事项的简单函数可省 |\n\n#### 3.5.2 `@note` 必填场景\n\n| 场景 | 注释示例 |\n|------|----------|\n| 阻塞/耗时 | `最坏阻塞约15s，勿在中断中调用`、`I2C整屏刷新约10ms` |\n| 超时与重试 | `重试3次，单次超时15s` |\n| 调用前置条件 | `须在Init后调用`、`须先Attach绑定引脚，否则写操作被忽略` |\n| 调用周期/上下文 | `必须在1ms定时中断中调用`、`1Hz主循环轮询调用，不可重入` |\n| 缓冲区限制 | `输出缓冲区至少InLen*2+1字节`、`payload超长自动截断` |\n| 副作用 | `写入前自动整页擦除，同页旧数据一并清除` |\n| 仅写显存类 | `仅写显存，需调用Refresh后屏幕才更新` |\n| 引脚/资源风险 | `PA13/PA14为SWD调试口，黑名单拒绝绑定` |\n\n#### 3.5.3 检查方法\n\n逐文件扫描 `<子仓库>/src/*.c` 中每个函数定义（正则 `^[a-zA-Z_][a-zA-Z0-9_ \\*]*\\([^;]*\\)\\s*$` 定位），向上回溯确认紧邻的注释块：\n\n1. 缺 `/**` 注释块 → 判定**缺函数说明**\n2. 有注释块但缺 `@brief` 或内容敷衍（\"无\"/\"略\"）→ 判定**说明不合格**\n3. 函数命中 3.5.2 任一场景但缺 `@note` → 判定**缺注意事项**\n4. 有参数但缺 `@param`、非 `void` 但缺 `@retval` → 判定**参数/返回值未标注**\n\n输出格式：`文件名:行号 函数名 缺失项` 清单，全部修复后方可通过 Code Review。\n\n### 3.6 函数实现长度规范\n\n单个函数的功能实现**尽量控制在 10~20 行**（不含注释与空行），太长会影响阅读与维护。\n\n- 超过 20 行时，优先按功能拆分为职责单一的子函数（如状态机各分支、初始化/收发/保活各环节独立成函数）\n- 拆分后每个子函数同样遵循本规范；查表、长 `switch-case` 分发等结构性代码可适当放宽\n- 拆分收益：主流程一眼可读，子函数可独立测试与复用\n\n检查方法：扫描各函数 `{` 与配对 `}` 之间的有效代码行数，超过 20 行的函数列出清单逐个评估；确无拆分边界的，在函数注释 `@note` 中说明保留原因。\n\n---\n\n## 4. 目录设计\n\n### 4.1 子仓库统一 inc/src 结构\n\n子仓库内部**不按软件层级建目录**，统一使用 `inc/` + `src/`，通过文件名前缀区分层级。\n\n禁止：\n\n```text\n<子仓库>/\n├── APP/\n├── BSP/\n└── DRV/\n```\n\n正确：\n\n```text\n<子仓库>/\n├── inc/\n│   ├── app_main.h\n│   ├── bsp_sensor.h\n│   └── drv_mpu6050.h\n└── src/\n    ├── app_main.c\n    ├── bsp_sensor.c\n    └── drv_mpu6050.c\n```\n\n### 4.2 为什么用 inc/src 而非分层目录\n\n1. 目录结构简单，模块增加不产生目录膨胀\n2. 文件名前缀已能明确层级\n3. IDE 工程直接配置 `src/*.c` + `inc/` 即可\n4. 搜索 `drv_` / `bsp_` / `app_` 可快速定位同层所有文件\n\n---\n\n## 5. 各层职责\n\n### HAL（主仓库）\n\n负责：GPIO、UART、I2C、SPI、CAN、ADC、PWM、TIMER、DMA、EXTI、FLASH、RTC、NVIC、SysTick 等 MCU 外设。\n\n**不负责**：传感器业务、产品逻辑、协议解析、状态机。\n\nHAL 是主仓库与 `<子仓库>` 的接口边界，上层模块只依赖 HAL 抽象接口，不依赖具体 MCU 型号。\n\n### DRV\n\n负责：具体芯片初始化、寄存器配置、通信、原始数据读取与转换。\n\n例如：`drv_mpu6050`、`drv_ina226`、`drv_sht3x`、`drv_oled`、`drv_ml307`（示例）\n\n**DRV 只能通过 HAL 访问 MCU 硬件，禁止直接操作寄存器或外设指针。**\n\n### BSP\n\n负责：当前产品硬件资源与 DRV 之间的组合、封装和适配。\n\n例如：`bsp_battery`（调用 `drv_ina226`）、`bsp_sensor`（调用 `drv_mpu6050`）（示例）\n\n### APP\n\n负责：产品功能、状态机、数据处理、故障处理、通信等业务逻辑。\n\n**APP 通过 BSP 访问硬件，不直接调用 DRV 或 HAL。**\n\n---\n\n## 6. 依赖规则\n\n```text\n允许：  APP→BSP   BSP→DRV   DRV→HAL\n        任意层→cfg_modules.h (层级无关编译配置头, 只含宏开关)\n        任意层→HAL公开类型 (仅类型引用豁免: 上层对外接口可用HalGpioPort_E、\n        串口号枚举等HAL公开类型作参数, 类型引用不构成跳层调用依赖;\n        仍禁止调用Hal*函数或依赖HAL内部实现)\n\n禁止：  APP→DRV   APP→HAL   BSP→HAL   BSP→APP\n        DRV→BSP   DRV→APP   HAL→任意上层\n```\n\n### 6.1 调用链示例\n\n```text\nAppBatteryProcess()\n    ↓\nBspBatteryCurrentGet()\n    ↓\nDrvIna226GetCurrent()\n    ↓\nHalI2cRead()\n    ↓\nI2C 外设 → INA226\n```\n\n### 6.2 函数调用层级限制\n\n任意调用链的函数层级**不得超过 5 层**（入口函数为第 1 层，每下钻一级 +1，厂商库调用同样计入）：\n\n```text\n第1层 AppBatteryProcess()\n  └ 第2层 BspBatteryCurrentGet()\n      └ 第3层 DrvIna226GetCurrent()\n          └ 第4层 HalI2cRead()\n              └ 第5层 厂商库函数（示例）   ← 5 层封顶，不得再向下封装\n```\n\n规则：\n\n1. 跨层主链路 APP→BSP→DRV→HAL 已占 4 层，中间至多再引入 1 层封装\n2. 超过 5 层视为封装过碎或业务逻辑下沉过深，应合并中间函数或上提业务判断\n3. 禁止递归调用；确需使用时按最坏展开深度计入层级，并静态评估栈占用\n\n---\n\n## 7. 新增代码层级判断\n\n| 代码内容 | 所属层 |\n|----------|--------|\n| GPIO/UART/I2C/SPI/ADC/PWM/TIMER/FLASH 操作 | HAL |\n| 具体芯片寄存器操作（MPU6050/INA226/SHT3X/OLED） | DRV |\n| 产品硬件描述（电池电压、设备温度、产品按键） | BSP |\n| 产品功能逻辑（电池管理、传感器融合、服务器通信） | APP |\n\n**反例**：DRV 中写低电量判断/充电控制/上传服务器 → 应放 APP。APP 中直接 `I2C_SendData()` → 应通过 BSP→DRV→HAL。\n\n---\n\n## 8. HAL 接口稳定性\n\nHAL 接口一旦确定，不应频繁修改函数原型。扩展时优先：增加参数、增加新接口、增加配置结构体，保留旧接口兼容。\n\nHAL 禁止直接操作（示例）：\n\n```c\nGPIOA->ODR    I2C1->DR    USART1->DR    TIM2->CNT\n```\n\n这些操作必须封装在 HAL 中，对上层透明。\n\n---\n\n## 9. MCU 迁移\n\n更换 MCU（如 STM32F103 → GD32F303，示例）时，**原则上只需修改 HAL**，DRV/BSP/APP 尽可能不变。\n\n### 9.1 迁移原则\n\n- 子仓库通过 `Hal*()` 抽象接口访问硬件，不直接依赖任何 MCU 厂商头文件\n- 移植的核心任务是在主仓库中用新 MCU 的 SDK 重新实现 HAL 层接口\n- 子仓库的 HAL 接口清单、移植步骤和检查清单见 `<子仓库Readme>` 的「MCU移植指南」章节\n\n### 9.2 迁移阶段\n\n```\n阶段1: HAL重建 (主仓库)     — 新建工程/替换官方库/重新实现HAL接口/配置SysTick\n阶段2: 子仓库集成            — 引入<子仓库>(形态A:Submodule/形态B:模块目录)/配置编译/确认零厂商头文件依赖\n阶段3: 硬件适配 (子仓库)     — 调整BSP引脚分配/调整APP层参数\n阶段4: 验证                  — 编译/MAP分析/烧录测试/更新文档\n```\n\n### 9.3 迁移检查项 (Code Review)\n\n- [ ] 子仓库零直接依赖 MCU 厂商头文件（无厂商 `xxx.h` 直接包含）？\n- [ ] 子仓库无直接寄存器操作（无 `外设->` 形式）？\n- [ ] HAL 层接口已按 `<子仓库Readme>`「MCU移植指南」清单全部实现？\n- [ ] `<子仓库Readme>`「MCU移植指南」检查清单已逐项确认？\n\n---\n\n## 10. Git Submodule 管理（仅形态A）\n\n```bash\n# 添加子仓库\ngit submodule add <repo_url> <子仓库>\n\n# 克隆主工程（含子仓库）\ngit clone <project>\ncd <project>\ngit submodule update --init --recursive\n\n# 更新子仓库\ncd <子仓库>\ngit pull\ncd ..\ngit add <子仓库>\ngit commit -m \"Update <子仓库>\"\n```\n\n不同产品锁定不同 Submodule Commit，互不影响。\n\n---\n\n## 11. 内存与中断规范\n\n### 内存\n\n- 优先使用 `const`、`static`、固定长度 Buffer、RingBuffer\n- 减少/避免全局 Buffer 和重复 Buffer\n- 原则上不使用 `malloc/free`\n\n### 中断\n\n中断中只做：读取必要数据 → 写入 Buffer → 设置标志 → 退出。\n\n**禁止**在中断中执行：长时间循环、阻塞等待、协议解析、大量 printf、浮点计算、长延时。\n\n---\n\n## 12. 编译资源检查（MAP 文件分析）\n\n### 12.1 检查方法\n\n每次编译后，`<IDE>` 在输出目录生成 `.map` 文件。打开 MAP 文件末尾，找到以下三行：\n\n```text\nTotal RO  Size (Code + RO Data)                XXXXX (  XX.XXkB)\nTotal RW  Size (RW Data + ZI Data)             XXXXX (  XX.XXkB)\nTotal ROM Size (Code + RO Data + RW Data)      XXXXX (  XX.XXkB)\n```\n\n### 12.2 字段说明\n\n| MAP 字段 | 含义 | 对应 MCU 资源 |\n|----------|------|--------------|\n| Total RO Size | Code + RO Data（只读代码+常量） | 占用 Flash |\n| Total RW Size | RW Data + ZI Data（已初始化+未初始化变量） | 占用 SRAM |\n| Total ROM Size | Code + RO Data + RW Data（实际烧写到Flash的总量） | 占用 Flash |\n\n> **RW Data** 会被存储在 Flash 中，启动时搬运到 SRAM，因此同时占用 Flash 和 SRAM。\n\n### 12.3 判定规则\n\n将 MAP 文件中的实际占用与所选 `<MCU>` 的实际 Flash / SRAM 容量对照：\n\n```\nFlash 占用 = Total ROM Size\nSRAM 占用  = Total RW Size\n\nFlash 使用率 = Flash 占用 / MCU Flash 总量 × 100%\nSRAM 使用率  = SRAM 占用  / MCU SRAM 总量 × 100%\n```\n\n| 状态 | 条件 | 处理 |\n|------|------|------|\n| ✅ 正常 | Flash < 80% 且 SRAM < 80% | 无需操作 |\n| ⚠️ 警告 | Flash ≥ 80% 或 SRAM ≥ 80% | 优化代码体积/内存占用 |\n| 🔴 危险 | Flash ≥ 95% 或 SRAM ≥ 95% | 必须优化，否则无法继续开发 |\n\n**弱符号兜底检查（条件项）**：若工程使用了弱符号兜底文件（如 `hal_stub.c`，为全部 HAL 公开接口提供 `__weak` 空实现/错误码实现），正式构建后检查 MAP 中该文件应**无存活符号**——出现存活符号即说明存在\"被上层引用但 HAL 未实现\"的接口，需补齐实现或裁剪上层功能开关。HAL 全实现时兜底文件被强符号覆盖剔除，Flash 占用为 0。维护纪律：HAL 新增公开接口须同步兜底文件补 stub。\n\n> 编译结果是随每次构建变化的项目数据，**不记录于本模板**；如需留存历史趋势，记录到 `<主仓库Readme>` 等工程自有文档，避免模板被逐次修改。\n\n---\n\n## 13. 功能记录维护\n\n### 13.1 记录规则\n\n每实现一个新功能，必须同步更新对应范围的 Readme：\n\n| 范围 | 文件 | 记录范围 |\n|------|------|----------|\n| 主仓库 | `<主仓库Readme>` | HAL 层功能（UART/Timer/GPIO/ADC/SPI/I2C 等） |\n| 子仓库 | `<子仓库Readme>` | BSP/DRV/APP 层功能（串口封装/解析/调度/驱动等） |\n\n形态B（单仓库）下，两份记录合并为同一 Readme 的两个章节，记录范围与更新规则不变。\n\n### 13.2 记录格式\n\n每个模块按统一格式记录：\n\n```markdown\n### 模块名\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 功能A | `FuncA()` | 简要说明 |\n| 功能B | `FuncB()` | 简要说明 |\n```\n\n### 13.3 更新时机\n\n1. 新增 HAL/BSP/APP 接口时\n2. 修改已有接口原型时\n3. 删除接口时\n4. Code Review 前确认记录已同步\n\n### 13.4 Code Review 补充检查项\n\n- [ ] 主仓库 Readme 已同步 HAL 新增功能？\n- [ ] 子仓库 Readme 已同步 BSP/DRV/APP 新增功能？\n- [ ] 每个硬件号的数据流转图已同步更新？（第 13.5 节）\n\n### 13.5 硬件号数据流转\n\n子仓库 Readme 必须为**特性表登记的每个硬件号**维护**两份材料**：\n\n1. **数据通路清单表**（主）—— 逐条通路，一表看全\"源→采集→缓存→消费→输出\"\n2. **分阶段流程图**（辅）—— Mermaid `flowchart LR`，按五阶段分组\n\n**通路阶段模型**（所有硬件号统一）：\n\n```\n①输入源 → ②采集/解析(BSP·DRV·APP) → ③数据缓存/命令 → ④决策(APP) → ⑤输出\n```\n\n**清单表格式**（每条通路一行，通路编号 P1/P2... 与图中边标注对应；下表为格式示例）：\n\n```markdown\n| 通路 | ①输入源 | ②采集/解析 | 触发·频率 | ③数据落点 | ④消费方 | ⑤输出 |\n|------|---------|-----------|----------|----------|---------|-------|\n| P1 避障 | HC-SR04(PB5/PB6) | app_func 阻塞测距 | 10Hz槽 | DistCm缓存 | app_car 避障状态机 | 电机+舵机 |\n| P3 语音 | 语音模块(UART2) | AppCarVoiceRxIsr置码 | RXNE中断→10Hz消费 | G_VoiceCmd | app_car | 电机+舵机 |\n```\n\n**流程图要求**：\n\n1. 五个 subgraph 按阶段命名：`①输入源`/`②采集/解析`/`③数据缓存/命令`/`④决策`/`⑤输出`\n2. 每个节点标注：所属模块（层前缀）+ 引脚/串口 + 频率或触发方式\n3. 边标注通路编号（P1/P2...）与数据内容；**虚线 `-.->` = 中断直达，实线 `-->` = 主循环轮询/阻塞**\n4. 数据左进右出：输入源在最左，物理输出在最右，天然无回边交叉\n\n**多硬件号差异速览表**（硬件号≥2 时必填；下表为格式示例）：\n\n```markdown\n| 维度 | C000 | C001 |\n|------|------|------|\n| 主动采集源 | ... | ... |\n| 中断链 | ... | ... |\n| 闭环决策 | 无(指令直控) | app_car状态机 |\n```\n\n**更新时机**（任一触发即须更新清单表+图）：\n\n- 特性表功能位或串口字段变化\n- 新增/删除模块\n- 采样频率槽调整（如超声波 10Hz → 20Hz）\n- 中断回调注册关系变化\n\n**检查要点**（Code Review 时逐项核对）：\n\n- [ ] 清单表通路集合与特性表该行功能位/串口字段一致（无多画/漏画）？\n- [ ] 每条通路各环节（②③④⑤）对应的调用/数据结构真实存在于代码？\n- [ ] 中断链（虚线）与主循环链（实线）区分标注？触发方式（中断/轮询/阻塞/AT按需）写实？\n- [ ] 频率槽标注与 `app_main.c` 的 `AppProcess` 调度表一致？\n- [ ] 图中边编号(P1...)与清单表通路一一对应？\n- [ ] 多硬件号差异速览表已维护且结论正确？\n\n---\n\n## 14. Code Review 检查项\n\n**架构**\n- [ ] 主仓库只维护 HAL？\n- [ ] `<子仓库>` 只有 `inc/` + `src/`（形态A 时为 Submodule）？\n- [ ] 遵循 `APP → BSP → DRV → HAL` 单向依赖？\n\n**命名**\n- [ ] 文件前缀：`hal_` / `drv_` / `bsp_` / `app_`？\n- [ ] 接口前缀：`Hal` / `Drv` / `Bsp` / `App`？\n- [ ] 文件级变量（含 static）`G_` 前缀？\n- [ ] 结构体 `_S` + `p` 指针类型？枚举 `_E` 后缀？\n\n**注释**\n- [ ] 所有函数（含 `static`）定义上方均有 `/** */` Doxygen 注释块？（第 3.5.3 节方法扫描）\n- [ ] 每个函数均有 `@brief` 功能说明，无敷衍内容？\n- [ ] 有参数的函数逐参数标注 `@param`（含取值范围/单位）？\n- [ ] 非 `void` 函数标注 `@retval`（各返回值含义）？\n- [ ] 阻塞/超时/前置条件/调用周期/副作用等场景已用 `@note` 标注注意事项？（第 3.5.2 节场景表）\n\n**函数设计**\n- [ ] 单个函数功能实现尽量控制在 10~20 行，超长已按功能拆分为职责单一的子函数？（第 3.6 节）\n- [ ] 任意调用链函数层级 ≤ 5 层（入口函数起算，含厂商库调用，无递归）？（第 6.2 节）\n\n**分层**\n- [ ] DRV 只通过 HAL 访问硬件，无寄存器直接操作？\n- [ ] BSP 无业务逻辑，只做硬件封装？\n- [ ] APP 不直接调用 DRV 或 HAL？\n\n**移植**\n- [ ] 更换 MCU 只需修改 HAL？\n- [ ] HAL 接口保持兼容？\n- [ ] 第 9.3 节迁移检查项已逐项确认？\n\n**资源**\n- [ ] Flash 使用率 < 80%？\n- [ ] SRAM 使用率 < 80%？\n- [ ] 若使用弱符号兜底文件：MAP 中无兜底文件存活符号？（有 = 存在未实现的 HAL 接口，见第 12.3 节）\n\n**文档**\n- [ ] 主仓库 Readme 已同步 HAL 新增功能？\n- [ ] 子仓库 Readme 已同步 BSP/DRV/APP 新增功能？\n- [ ] 每个硬件号的数据流转图（Mermaid）已同步更新且与特性表/调度表一致？（第 13.5 节）\n\n---\n\n## 15. 架构总则\n\n> 主仓库只维护 HAL，DRV/BSP/APP 集中在 `<子仓库>`（形态A 为 Submodule，形态B 为仓库内模块目录）。\n> 子仓库统一 `inc/src` 目录，通过 `hal_/drv_/bsp_/app_` 文件名前缀和 `Hal/Drv/Bsp/App` 接口前缀区分层级。\n> 严格遵循 `APP → BSP → DRV → HAL` 单向依赖，软件层级通过文件名、接口名和调用关系体现，不通过目录体现。\n> 本文档为通用模板，工程差异通过占位符体现，复制到任意新工程无需任何修改。\n"},{"hash":"ESP/ESP-8266/Readme.md","title":"Readme","relPath":"ESP/ESP-8266/Readme.md","desc":"防克隆芯片绑定功能记录（appbind / V1.0.2.12） 纯离线场景防\"整片 flash 拷贝到其它板子直接用\"：ESP8266 无 Secure Boot/Flash 加密，采用软件层芯片身份绑定（eFuse 芯片 ID 不随 flash dump 走）。","created":"","updated":"","tags":[],"sizeKB":47.3,"_text":"ESP8266-XCOM 串口 WiFi 透传器 工程功能记录 TOC 工程概述 - MCU：ESP8266（NodeMCU v2，板载 CH340 USB 转串口，WiFi 仅 2.4GHz） - SDK：PlatformIO + Arduino 框架（env ，LittleFS，唯一外部库 links2004/WebSockets） - 架构： 单向依赖（形态B 单仓库：HAL 在 ，BSP/APP 在 ），规范见 ProjectLevelSkill.md - 定位：串口 ↔ WiFi 双向透传 + 物联网云桥 + GPIO 网页控制（闹钟定时）；当前版本 V1.0.5.20（develop） 工程目标（2026-09-30 确立，后续迭代对照实现） 1. UART 数据可通过 TCP/UDP/MQTT/HTTP 协议透传转发 2. UART 发送和接收到的数据均在网页串口终端显示 3. 物联网平台支持主流平台连接：阿里云、OneNET、腾讯云、巴法云、华为云（五家全通，V1.0.5.0） 4. GPIO 控制支持电平控制、PWM 控制、定时控制 5. 配网页面支持 WiFi 配网、设备重启、清除配网 6. 所有的功能实现应该遵循ProjectLevelSkill.md文档要求 7. WiFi连接在配置存在的情况支持自动重连 8. 转发的功能以及物联网平台的功能以及GPIO的相关功能在断电重启的情况的应该保持跟断电前的行为相同 目标达成现状（2026-09-30 对照） 目标 现状 缺口 ------------------ 1 转发协议 TCP✅ UDP✅ MQTT✅ HTTP✅（V1.0.3.0 端到端实测） 无（目标达成） 2 双向终端显示 串口→终端✅；转发下行→终端✅（AppTerminalBroadcast）；云下行→终端✅；网页发送回显✅ 无 3 云平台 阿里✅ OneNET✅ 巴法✅ 腾讯✅ 华为✅（V1.0.5.0 已接入） 五家云平台全部打通 ✅ 4 GPIO 控制 电平✅ PWM✅ ONCE 倒计时✅ DAILY 每日闹钟✅（掉电保存） 无 5 配网页 WiFi 配网✅ 重启 ✅ 清配网 ✅ 无 华为云 IoTDA 已接入（V1.0.5.0）：MQTT 1883 明文，鉴权=HMAC-SHA256 密码推导（官方 SDK 源码 + 官方文档双核实，签名类型 0 不校验时间戳），云配置槽位扩 6 槽（cloudhw 前缀），复用手工组包架构 - 仓库：ESP8266；远程经 SSH 别名 - 架构铁律：串口=数据通道，生产固件禁止任何 DBG/调试打印；AP 热点常开 + 全异步（主循环非阻塞） - 云配置分槽：四平台凭据独立存 config.txt（cloudali/cloudone/cloudbf/cloudtx 前缀），cloudproto 记当前选择；加载后须 AppCloudCfgSelect 带出生效（V1.0.2.6） 遗留Bug记录 ​ 该章节有遗留bug内容均为人工测试发现的bug记录，修改完成后需要填写修复状态和修复时间; 版本 问题记录 测试时间 修复状态 修复时间 :-------: ------------------------------------------------------------ ---------- -------- -------- V1.0.3.0 UDP端发送给串口的数据在模块的网页串口中断无显示，且串口端也没有收到，UDP端可以收到转发过去的数据； 2026.09.30 已修复 V1.0.3.0 GPIO控制页的设备时间应该i同 ig.txt（cloudali_/cloudone_/cloudbf_/cloudtx_ 前缀），cloudproto 记当前选择；加载后须 AppCloudCfgSelect 带出生效（V1.0.2.6）\n\n\n\n## 遗留Bug记录\n\n​\t该章节有遗留bug内容均为人工测试发现的bug记录，修改完成后需要填写修复状态和修复时间;\n\n|   版本    | 问题记录                                                     | 测试时间   | 修复状态 | 修复时间 |\n| :-------: | ------------------------------------------------------------ | ---------- | -------- | -------- |\n| V1.0.3.0  | UDP端发送给串口的数据在模块的网页串口中断无显示，且串口端也没有收到，UDP端可以收到转发过去的数据； | 2026.09.30 | 已修复   |          |\n| V1.0.3.0  | GPIO控制页的设备时间应该i同A0模拟对齐，时间应该同释放对齐    | 2026.09.30 | 已修复   |          |\n| V1.0.5.2  | 设备在连接网络后因意外情况断联后无法自动重连必须要手动复位设备才会重连上 | 2026.10.12 | 已修复   |          |\n| V1.0.5.19 | 循环发送的间隔不能设置小100的值,设置小于100的值时会被还原为1000 | 2026.10.14 | 已修复 (V1.0.5.20) | 2026.10.14 |\n| V1.0.5.21 | 设备运行一段时间后出现WiFi搜索不到，板子的板载LED灯也不闪烁，电脑通过IP地址与板子的连接断开，通过RST复位后设备恢复正常 |  |  |  |\n\n\n\n## 目录结构（模块化架构，2026-09 重构）\n\n```text\n01.HAL/                  ← MCU 硬件抽象（hal_gpio/hal_pwm/hal_uart/hal_wifi/hal_fs/hal_adc…）\nmodules/\n├── inc/                 ← BSP/APP 头文件\n│   ├── app_web_page.h   ← 单页门户（PROGMEM 内置 HTML/JS，5 标签：配网/终端/转发/物联网平台/GPIO控制）\n│   ├── bsp_gpio.h       ← GPIO 通道封装：7 路输出 + PWM + ONCE/DAILY 定时（闹钟）\n│   ├── app_config.h     ← /config.txt 键值载入/事务式原子保存（含 GPIO/闹钟快照）\n│   └── app_cloud.h      ← 云抽象层：4 平台×多接入方式，手工组 MQTT 报文 + BearSSL TLS\n└── src/                 ← 实现（app_main 主循环调度 / app_web 13 条路由 / bsp_uart 成帧三路分发…）\nsrc/main.cpp             ← 极薄入口（setup/loop → AppMainSetup/AppMainLoop）\npatches/                 ← WebSockets 库补丁（心跳误杀/读超时杀连接修复 + README；libdeps 重装后须重新覆盖）\nplatformio.ini           ← nodemcuv2 / littlefs / WebSockets@^2.4.1（构建过滤含 01.HAL 与 modules）\nREADME.md                ← 仓库门面\nProject_Level_Skill.md   ← 工程架构规范（层级命名/注释/提交约定）\n```\n\n依赖单向：`main → APP(app_*) → BSP(bsp_*) → HAL(hal_*) → Arduino 核心`；主循环全轮询无阻塞。\n\n\n\n## 硬件资源占用表\n\n| 外设 | 引脚/资源 | 用途 | 归属模块 |\n|------|-----------|------|----------|\n| UART0 | GPIO1(TX)/GPIO3(RX)，默认 115200-8N1（网页在线改，存 LittleFS） | 数据口：透传通道，**挂生产业务，禁止打印** | bsp_uart / app_terminal |\n| GPIO2 | 板载 LED，低电平点亮 | 状态指示（灯语三态，由系统统一控制） | bsp_led |\n| WiFi | 射频；AP `ESP8266-XCOM-xxxx` @192.168.4.1 常开 + STA | AP 供配网/内网访问，STA 连路由（凭据持久化，断线自动重连：5s 节拍退避 15/30/60s，门户使用中暂停但封顶 5min 强制试连，V1.0.5.3） | drv_wifi / bsp_wifi / app_main |\n| HTTP | 80 端口 ESP8266WebServer | 单页门户 + 13 条 API 路由；**首页必须发 `Cache-Control: no-store`** | bsp_web / app_web |\n| WebSocket | 81 端口 WebSocketsServer | 网页串口终端二进制通道（串口数据广播 / 网页下发） | app_terminal |\n| LittleFS | `/config.txt`（key=value 全部配置） | 配网/串口/转发/云平台/GPIO电平/PWM/闹钟/芯片绑定持久化，事务式原子保存（临时文件+rename） | drv_storage / app_config |\n| mDNS | `xcom.local` | 局域网域名（辅助发现） | bsp_net |\n| NTP | ntp.aliyun.com / pool.ntp.org，东八区 | 上行就绪后同步；就绪后解锁每日闹钟 | app_main |\n| GPIO 输出 | D0/D1/D2/D5/D6/D7/D8 七通道（D1/D2 与按键手势共用，D8 启动须低） | 网页开关/PWM 调光/闹钟定时，状态掉电保存 | bsp_gpio |\n| FLASH 键 | GPIO0 | 长按清配网 / 短按双击手势输出（与 D1/D2 联动） | bsp_key |\n\n\n\n## 网页 API 记录\n\n| 方法 | 路由 | 参数 | 说明 |\n|------|------|------|------|\n| GET | `/` | — | 内置单页门户（gzip 压缩 PROGMEM+`Content-Encoding: gzip`，明文源码经 scripts/build_web_gz.py 预构建生成；no-store 头防升级后浏览器旧缓存瘫页） |\n| GET | `/api/status` | — | 全量状态 JSON（ver/ssid/cfgssid/wifi/ip/led/baud/fw*/cloud*/cloudtag/clouderr/cloudrc/tx/rx/heap/wfail/rst/lp*/slow/devap/devws）；devws=纯计数不发 ping（V1.0.5.19）；cfgssid=配置保存的 ssid，与 ssid（当前连接，未连上时=AP 名）分开，页面可区分「没保存」与「没连上」（V1.0.5.16） |\n| GET | `/api/scan` | — | 异步扫描周边热点（首次 202+空表，再次取结果；不阻塞 AP 信标） |\n| POST | `/api/wifi` | ssid&pass | 连接并持久化 |\n| POST | `/api/serial` | baud | 在线改波特率并持久化 |\n| POST | `/api/forward` | proto(0/1/2/3)&ip&port&mqtt参数 | 转发配置：0 关 / 1 TCP 客户端 / 2 UDP / 3 MQTT 客户端 |\n| POST | `/api/cloud` | proto(0~5)&tra&pk&id&ps… | 云平台配置；变更即生效（`cloudApply` 断开重连） |\n| GET | `/api/gpio` | — | 七通道状态 JSON（lv/duty/pwm + tmrmode/tmrremain/tmrlv/tmrhh/tmrmm + timeok/now 时分秒 + key/led/adc） |\n| POST | `/api/gpio` | ch&val / ch&duty / ch&tmode | 电平开关 / PWM 占空比 / 定时：`tmode=once&sec&tmrlv`、`tmode=daily&hh&mm&tmrlv`、`tmode=off` |\n| GET | `/api/multi` | — | 串口终端多条发送条目（内容+勾选） |\n| POST | `/api/multi` | idx&data&checked | 保存单条多条发送条目（静默 3s 落盘） |\n| POST | `/api/reboot` | — | 重启 |\n| POST | `/api/resetwifi` | — | 清配网重启（回 AP 模式） |\n| WS | `:81` | 二进制帧 | 串口终端双向通道；网页下发帧直写 UART0 |\n\n> 注意：固件只注册 GET/POST 实际用到的方法，`curl -I`（HEAD 请求 `/`）返回 404 属正常现象。\n\n\n\n## GPIO 控制与闹钟功能记录（bsp_gpio / app_web）\n\n| 功能 | 接口/机制 | 说明 |\n|------|-----------|------|\n| 七路输出通道 | `BspGpioOutSet` / `BspGpioPwmSet` | D0/D1/D2/D5/D6/D7/D8；D0(GPIO16) 不支持 PWM；上电全部初始化低电平安全态 |\n| 电平/PWM 掉电保存 | `gpio_lv` / `gpio_duty` CSV 键 | 输出变更置脏，主循环静默 3s 落盘（避免拖滑条频繁写 Flash）；开机恢复 |\n| 倒计时定时 ONCE | `BspGpioTimerOnce(ch,lv,sec)` | 1~86400s，到期切电平后自动清除；毫秒计时，易失（不保存） |\n| 每日闹钟 DAILY | `BspGpioTimerDaily(ch,lv,hh,mm)` | 每日 hh:mm 切电平，需 NTP 就绪（`timeok=1`）；同日去重（LastDay），次日同点重复 |\n| **闹钟掉电保存** | `gpio_tmr/tmrlv/tmrhh/tmrmm` CSV 四键 | 设置/取消即置脏随 3s 静默落盘；开机 `BspGpioTimerDailyRestore` 恢复（不要求时钟就绪，NTP 同步后自然生效） |\n| 定时调度 | `BspGpioTimerPoll()` 主循环轮询 | 内含软时钟走表（每秒推进当日秒数，跨日天数+1）；到期复用 `BspGpioOutSet`（脏标记/停 PWM 一致） |\n| 网页面板 | app_web_page.h `tOpen`/`tHide` | 每通道独立展开；**10s 无操作自动收起**（面板内点击/输入重置计时；定时按钮点开再点关闭；取消即清计时）；2s 轮询刷新在输入 number 时自动跳过，不打断输入 |\n| **设备时钟本地走秒（V1.0.2.13）** | app_web_page.h `todSet`/`todFmt`/`#todclk` | 底部\"设备时间\"不再等 2s 轮询：每次 `/api/gpio` 响应用 `nowhh/mm/ss` 校准本地基准，前端 250ms tick 走秒渲染，不累积漂移；切离 GPIO 页同步停表。修\"时间显示慢约 1s\"（秒级显示只能 2s 跳格的轮询渲染所致） |\n\n\n\n## 串口透传层功能记录（app_terminal / bsp_uart）\n\n| 功能 | 函数 | 说明 |\n|------|------|------|\n| 串口接收成帧 | `serialRxPoll()` | 轮询 UART0 RX 写入 256B 成帧缓冲 `sbuf`；**满缓冲立即成帧 + 首字节起 30ms 静默成帧**（帧间隔聚合，兼顾低延迟与批处理效率） |\n| 三路同步分发 | `serialFlushBuf()` | 一帧串口数据同时：① `ws.broadcastBIN` 网页终端 ② `forwardPush` 转发客户端 ③ `cloudPush` 云上行队列；并累计 `rxCount` |\n| 网络下行写回 | WS 事件 / `netToSerial()` | 网页 WS 帧、转发客户端（TCP 客户端/UDP）收到的数据直接 `Serial.write` 到设备 |\n| 转发客户端管理 | `forwardLoop()` | TCP 客户端模式断线 2s 间隔自动重连；UDP 模式 `begin` 后无连接开销；无路由不发起连接 |\n| 状态指示 | `ledLoop()` | 三态闪烁策略见硬件资源表（STA 心跳 / AP 慢闪 / 连接快闪） |\n\n\n\n## 转发功能记录（app_forward / app_config）\n\n| 功能 | 函数 | 说明 |\n|------|------|------|\n| 三种转发模式 | `G_Cfg.Fwd.Proto` | 0=关 / 1=TCP 客户端 / 2=UDP / 3=MQTT 客户端 / 4=HTTP 客户端；TCP/UDP 双向透传，MQTT 上行发布+下行订阅；HTTP=串口数据攒批 POST（octet-stream）+ 响应体写回串口（下行）+ 空闲 1s GET 探询 |\n| **HTTP 转发（V1.0.3.0）** | `AppFwdHttpStart/Maintain/BodyDone` | 手工 HTTP/1.1 报文 Connection:close 短连接；非阻塞状态机（待响应/收头/收体，总超时 8s；Content-Length 或断链判收完）；上一事务未完成时新数据丢弃不排队（防堆积）；配置字段 HttpPath（fhttp_ 槽位键，4 槽扩 5 槽）；**实测：1Hz 串口上行 213B、echo 服务回写 130B、空闲探询 1s 周期精准** |\n| **按协议分槽存储（V1.0.2.10）** | `AppConfigFwdSet/Select/Migrate` | 每协议独立一组键（ftcp_/fudp_/fmqtt_ 前缀）存完整配置（地址/端口/MQTT 全套凭据），fwproto 只记选择；切协议时 `AppConfigFwdSelect` 从槽位带出，互不覆盖；旧版 fw* 单组键由 `AppFwdCfgMigrate` 一次性迁入当前协议槽位 |\n| 切换与保存语义 | `/api/forward` 的 `sel=1` | 网页协议单选 onchange 带 `sel=1` → 后端只带出槽位忽略表单；保存按钮不带 sel → 写入当前协议槽位。**二者必须区分**，否则保存请求被误当切换、表单被静默丢弃（V1.0.2.8 实测踩坑） |\n| 局域网直连豁免（V1.0.2.10） | `AppFwdTargetLanIp()` | 目标为私网/环回 IP 字面量时不受无互联网 NTP 门控限制（connect 毫秒级无 DNS），纯内网转发可持续保持连接；域名/公网目标仍需等 NTP 同步 |\n| 连接维护 | `AppFwdTcpMaintain/AppFwdMqttMaintain` | 断线指数退避重连 4s→16s→64s→256s 封顶 300s；无路由或网页忙时不发起阻塞连接 |\n\n\n\n## 物联网云桥功能记录（app_cloud）\n\n| 功能 | API | 说明 |\n|------|-----|------|\n| 配置结构 | `CloudCfg cc` | proto：0 关 / 1 阿里云 / 2 OneNET / 3 巴法云 / 4 腾讯云；tra（巴法）：0 TCP8344 / 1 MQTT9501 / 2 MQTTS9503；pk/id/ps/pub/sub 按平台复用（腾讯 pk=产品ID，id=设备名，ps=PSK） |\n| 配置持久化 | `cloudLoad()` / `cloudSaveTo()` | 挂接在 main 的 config.txt 读写流程；五平台槽位键（cloudali_/cloudone_/cloudbf_/cloudtx_/cloudhw_ 前缀，各存 pk/id/ps/pub/sub，巴法多 tra），cloudproto 记当前选择；旧版单组 cloud* 键由 `AppCloudCfgMigrate` 一次性迁入 |\n| **腾讯云接入（V1.0.4.0）** | `AppCloudTencentPass()` / `AppCloudHmacSha1()` | 接入点 `{pid}.iotcloud.tencentdevices.com:1883`（密钥认证明文；8883 仅证书认证用）；username=`{pid}{dn};12010126;xcom1;4102444800`（sdkappid 官方固定值，expiry 固定 2100 免 RTC），password=`hex(hmac_sha1(b64dec(PSK), username));hmacsha1`；clientId=`{pid}{dn}`；默认主题 `{pid}/{dn}/data` 官方默认权限双向通吃（无需控制台建主题）；签名经官方 `qcloud_iot_mqtt_sign` C 工具对拍一致；**板端验证 CONNECT 被接受（tag=3/cloudon=1），控制台收发实测待真实凭据** |\n| **华为云接入（V1.0.5.0）** | `AppCloudHuaweiPass()` / `AppCloudHmacSha256()` / `AppCloudHwTimestamp()` | 接入点 `{product_id}.iot-mqtts.cn-north-4.myhuaweicloud.com:1883`（明文 MQTT；8883 为 MQTTS 需 CA 证书）；username=device_id；clientId=`{device_id}_0_0_{UTC YYYYMMDDHH}`（四段式：身份标识类型 0=设备ID，签名类型 0=HMACSHA256 不校验时间戳，官方 3009）；password=`hex(hmac_sha256(UTC时间戳, secret))`——**密钥=时间戳、内容=secret**（官方 SDK `EncryptWithHMac` 源码+官方文档测试向量双核实，方向极易记反）；timestamp 仿官方 SDK `GetClientTimesStamp()` gmtime 取 UTC（格式 YYYYMMDDHH），无 RTC 时为 1970010100（类型 0 不校验时间故可用），NTP 同步后自动变真实时间；上行默认主题 `$oc/devices/{device_id}/sys/messages/up`（平台不校验消息格式，串口裸流直发=透传保真），下行 `sys/messages/down` 由平台 CONNACK 后自动订阅 QoS0 系统主题、免显式 SUBSCRIBE；BearSSL br_sha256_vtable 新增 HMAC-SHA256 纯算法；云端需先在 IoTDA 控制台创建产品/设备并获得 device_id、secret |\n| 上行队列 | `AppCloudPush()` / `AppCloudMarkSerialIo()` | 1024B 环形队列，满丢最旧；发布条件 = **串口静默>500ms 或 距上次发布>1s**（\"且\"会永久饿死持续流式数据——实测教训） |\n| 主泵 | `AppCloudLoop()` | 主循环每圈调用：未连接按退避（4s→16s→64s→256s 封顶 300s）重连；TCP 模式 25s `ping\\r\\n` 心跳；MQTT 模式 30s PINGREQ；会话断开自动重建 |\n| 连接建立 | `AppCloudStart()` | 按平台/接入方式选明文 `WiFiClient` 或 TLS `WiFiClientSecure`（`setInsecure()` + `setBufferSizes(256,512)`，无 MFLN 探测）；腾讯云密钥认证走 1883 明文；巴法 TCP 发 `cmd=1` 订阅、其余发 MQTT CONNECT |\n| 在线判定 | `AppCloudTcpLine()` / CONNACK 解析 | TCP 模式收到 `cmd=1&res=1` 才置在线（防假连接）；MQTT 模式解析 CONNACK，**返回码在第 4 字节**（`20 02 <session-present> <rc>`），rc=0 在线并自动 SUBSCRIBE |\n| 下行分发 | `AppCloudParsePackets()` 内部 | 云下行数据 URL 解码后：`Serial.write` 到设备 + 镜像广播网页终端；TCP 行内搜 `&msg=` 兼容解析 |\n| 签名/编码 | `AppCloudAliyunPass()` / `AppCloudOnenetToken()` / `AppCloudTencentPass()` / `AppCloudHmacMd5()` / `AppCloudHmacSha1()` / `AppCloudB64Enc()` / `AppCloudUrlEnc()` | 阿里云 password=base64(hmac_md5(ds,\"productKey…&timestamp2524576000000&\"))；OneNET token 版本 2018-10-31（AccessKey 先 b64 解码再 HMAC-MD5）；腾讯云 password=hex(hmac_sha1(b64dec(PSK),username));hmacsha1（BearSSL br_sha1_vtable 纯算法）；全部手工实现零依赖 |\n| 运行诊断 | cloudtag / clouderr / cloudrc（状态 JSON） | tag：1 TCP 连不上 2 等 CONNACK 3 在线 4 CONNACK 拒绝 5 CONNACK 超时 6/7 中途断开；err 累计异常次数；rc 最近 CONNACK 返回码——**免串口打印即可远程定位卡点** |\n\n> 手工 MQTT 规范：CONNECT flags 必须 **0xC2**（clean session + username + password 声明位，0x02 会被标准 broker 拒连）；QoS0 最简路径；报文解析显式状态机（HDR→LEN→TOPIC→PAYLOAD），每字节 `available()` 门控防 TCP 分段撕裂。\n\n\n\n## 防克隆芯片绑定功能记录（app_bind / V1.0.2.12）\n\n纯离线场景防\"整片 flash 拷贝到其它板子直接用\"：ESP8266 无 Secure Boot/Flash 加密，采用软件层芯片身份绑定（eFuse 芯片 ID 不随 flash dump 走）。\n\n| 功能 | 接口/机制 | 说明 |\n|------|-----------|------|\n| 绑定值计算 | `AppBindCalc()` HMAC-MD5(盐,\"bind-\"+芯片ID) 前 4 字节 hex 8 字符 | 盐 `xcombind1` 防芯片 ID 全空间预计算；BearSSL 纯算法库零新增依赖（app_cloud 同款） |\n| 首次静默绑定 | `bindid` 键为空视为首次启动，写入绑定值 | **缺失一律视为首次启动，绝不惩罚**（防误伤真实设备）；走事务原子写 |\n| 不匹配计数 | `bindfl` 键连续不匹配开机次数 | 绑定不匹配先 +1 落盘；**宽容 3 次**（`APP_BIND_FAIL_LIMIT`）才降级：产线对拷/维修换板留窗口 + 稀释\"改动即变砖\"的时机信号 |\n| 沉默降级 | `AppBindFailActive()` → AppMainSetup 短路 | 不起 AP/门户/STA/终端/转发/云，LED 常灭，主循环仅 `BspSysYield()` 喂狗；全程零输出不暴露校验存在（串口本就禁打印，天然合规） |\n| 计数落盘自保护 | `AppConfigSave()` 失败则不降级顺延重试 | 计数没写进去就不惩罚，宁慢勿误 |\n\n**数据通路**：①输入=flash bindid + eFuse 芯片ID → ②采集=AppConfigLoad / ESP.getChipId → ③缓存=G_BindId/G_BindFl → ④决策=AppBindInit 开机 HMAC 比对+计数 → ⑤输出=降级标志短路主流程 / 正常启动\n\n```mermaid\nflowchart LR\n    A[flash bindid/bindfl + eFuse 芯片ID] --> B[AppConfigLoad + AppBindInit HMAC 计算]\n    B --> C{G_BindId 比对}\n    C -->|缺失| D[静默写入绑定+落盘]\n    C -->|匹配| E[清零计数, 正常启动]\n    C -->|不匹配| F[bindfl+1 落盘]\n    F -->|≥3 次| G[沉默降级: 短路 setup, loop 仅喂狗]\n    F -->|<3 次| H[本次正常运行]\n```\n\n> 边界（诚实声明）：防的是非技术用户顺手克隆，**防不了会逆向固件 patch 掉校验分支的专业抄袭者**；硬件级防护只有换 ESP32-C3（Flash 加密+Secure Boot v2，离线同样生效）。\n\n\n\n## 硬件号数据流转\n\n**数据通路清单表**：\n\n| 通路 | ①输入源 | ②采集/解析 | 触发·频率 | ③数据落点 | ④消费方 | ⑤输出 |\n|------|---------|-----------|----------|----------|---------|-------|\n| P1 串口→网页 | 外部设备 → UART0 RX | `serialRxPoll()` 256B 成帧（满/30ms 静默） | loop 轮询 | sbuf | `serialFlushBuf()` | `ws.broadcastBIN` :81 → 浏览器串口终端 |\n| P2 串口→转发 | 同上（同帧双投） | 同上 | 同上 | sbuf | `forwardPush()` | fwClient(TCP)/fwUdp(UDP) → 远端服务器 |\n| P3 串口→云 | 同上（同帧三投） | 同上 | 同上 | cloudQ 环形 1024B | `cloudLoop()` 发布泵（500ms 静默或 1s 批） | MQTT PUBLISH / 巴法 TCP cmd=2 → 云平台 |\n| P4 网页→串口 | 浏览器 WS :81 帧 | `onWsEvent` | 浏览器发送触发 | ws 收帧缓冲 | WS_DATA 分支 | `Serial.write` → 外部设备 |\n| P5 转发→串口 | 远端 TCP/UDP 数据 | `netToSerial()` | 连接存在时 loop 轮询 | netRbuf | 转发下行分支 | `Serial.write` → 外部设备 |\n| P6 云→串口 | 云平台下行推送 | `cloudParsePackets()` 状态机 + URL 解码 | 服务器推送触发 | cloudRxB 384B | 云下行分支 | ① `Serial.write` → 设备 ② `wsBroadcastBin` 镜像网页终端 |\n| P7 LED 状态 | WiFi/主循环节拍 | `ledLoop()` 三态状态机 | loop 轮询 | ledState | 闪烁策略 | GPIO2 板载灯（低有效） |\n\n**分阶段流程图**：\n\n```mermaid\nflowchart LR\n    subgraph S1[①输入源]\n        A1[外部串口设备<br>UART0 RX]\n        A2[浏览器串口终端<br>WS :81 帧]\n        A3[远端服务器<br>TCP客户端/UDP]\n        A4[云平台下行推送<br>MQTT/TCP 8344]\n    end\n    subgraph S2[②采集/解析]\n        B1[serialRxPoll<br>256B成帧 满/30ms静默]\n        B2[onWsEvent<br>WS收帧]\n        B3[netToSerial<br>转发收包]\n        B4[cloudParsePackets<br>MQTT状态机/TCP行解析<br>URL解码]\n    end\n    subgraph S3[③数据缓存]\n        C1[sbuf 256B<br>成帧缓冲]\n        C2[cloudQ 1024B环形<br>满丢最旧]\n        C3[cloudRxB 384B<br>下行缓冲]\n    end\n    subgraph S4[④决策]\n        D1[serialFlushBuf<br>三路同步分发]\n        D2[cloudLoop 发布泵<br>静默500ms或满1s]\n        D3[cloudStart 会话管理<br>15s超时/10s退避重连]\n    end\n    subgraph S5[⑤输出]\n        E1[ws.broadcastBIN :81<br>网页终端显示]\n        E2[fwClient/fwUdp<br>远端服务器]\n        E3[MQTT PUBLISH / cmd=2<br>巴法/阿里云/OneNET]\n        E4[Serial.write<br>外部设备执行]\n    end\n    A1 --> B1 --> C1 --> D1\n    D1 --> E1\n    D1 --> E2\n    D1 -->|cloudPush+MarkIo| C2\n    C2 --> D2 --> E3\n    A2 --> B2 --> E4\n    A3 --> B3 --> E4\n    A4 --> B4 --> C3 --> E4\n    B4 -.镜像.-> E1\n    D3 <-->|keepalive 25s/30s| E3\n```\n\n> 串口上行一帧三投（P1/P2/P3 同源）；两条下行路径（P4/P5 本地、P6 云）都直达 `Serial.write`；云下行同时镜像网页终端，方便观察。\n\n\n\n## 云平台接入矩阵\n\n| 平台 | proto | 接入方式 | 端口 | 鉴权 | 实测状态 |\n|------|-------|---------|------|------|---------|\n| 巴法云 TCP | 3 | tra=0 | 8344 明文 | uid 私钥 | ✅ 端到端实测（上行/下行/在线判定） |\n| 巴法云 MQTT | 3 | tra=1 | 9501 明文 | clientId=uid | ✅ 实测在线（CONNACK 解析修复后） |\n| 巴法云 MQTTS | 3 | tra=2 | 9503 TLS | clientId=uid | ⏳ 代码就绪未实测 |\n| 阿里云 IoT | 1 | TLS | 8883 | 三元组+HMAC-MD5 | ⏳ 待真实凭据 |\n| 腾讯云 IoT | 4 | 密钥认证 MQTT | 1883 明文（8883 仅证书） | `{pid}{dn};12010126;xcom1;{expiry}` + HMAC-SHA1(PSK) | ⚙️ V1.0.4.0 已实现；板端 CONNECT 验证通过（tag=3）；控制台收发实测待真实凭据 |\n| 华为云 IoTDA | 5 | 密钥认证 MQTT | 1883 明文（8883=MQTTS 需 CA） | clientId=`{id}_0_0_{ts}`，password=HMAC-SHA256(ts, secret) | ⚙️ V1.0.5.0 已实现；签名经官方 SDK 源码+官方测试向量对拍一致；控制台收发实测待真实凭据 |\n| OneNET | 2 | TLS | 8883 | token 2018-10-31 | ⚠️ 实测（V1.0.2.13 固件+PC 双重复现）：认证通过（CONNACK rc=0）但**发任何 PUBLISH 即被服务器静默断链**（~3s EOF，任意主题/载荷含合法 OneJSON）；只发 PINGREQ 可长期存活 → 非固件问题，疑产品级配置（接入模式/物模型强校验），待控制台核实 |\n\n协议细节（指令表/签名格式/主题后缀语义）见 [Cloud_Protocol.md](Cloud_Protocol.md)；版本逐条修改记录见下文「版本修改史」章节。\n\n\n\n## 构建与烧录\n\n```bash\nPYTHONPATH=/home/yym/.local/lib/python3.8/site-packages ~/.local/bin/pio run   # 编译（先确认 grep -rc DBG src/ modules/ 为 0）\n**一键脚本（推荐，跨 Linux 机器零配置）**：\n\n```bash\n./flash.sh                 # 自动探测 /dev/ttyUSB* → /dev/ttyACM*\n./flash.sh /dev/ttyUSB0    # 显式指定串口\nFLASH_PORT=/dev/ttyUSB1 FLASH_BAUD=115200 ./flash.sh   # 环境变量方式\n```\n\n脚本能力：pio 三路径查找（PATH/~/.local/bin/~/.platformio/penv）；pyserial 缺失自动补 PYTHONPATH；CH340 tcflush 怪癖经 runpy 注入补丁；esptool.py→esptool CLI→pio upload 三级回退；烧录前自动停占口进程（如 serial_sim.py）并在出口自动恢复；**烧录前 serial_sim 未在跑的，烧完自动拉起**（默认找 /mnt/sda1/test/serial_sim.py，可用 SERIAL_SIM_PATH 覆盖；串口=当前烧录口、波特率=FLASH_BAUD；f576978，2026-10-14 实测：清场烧录后 sim 自动启动、板端 rx 持续增长）。2ec9d0b 初版一次跑通。\n\n**一键验证（烧录后回归）**：\n\n```bash\n./verify.sh                 # 自动连板子 AP → 9 组 13 项检查 → 自动切回原 WiFi\n./verify.sh 192.168.137.50  # PC 与设备同网段时直接指定 IP\n```\n\n覆盖：status 基线（JSON/heap/RSSI）、串口数据流（rx 增长=serial_sim 在跑）、WS :81 可达、门户页完整性（V1.0.5.6 起=拉取 gzip 体裁剪解压并与本地 app_web_page.h 逐字节比对+no-store 检查）、API 路由（scan 异步 202=正常）、GPIO 7 通道、ch3 写读复原（自动恢复原电平）、主循环 12 连采阻塞检测（>800ms 尖峰 FAIL）、云/转发状态快照（公网目标 fwup=0 且 uptime<400s 视为 NTP 门控/退避窗口内属设计行为）。不碰 /api/reboot、/api/resetwifi。出口码 0=全过、1=有 FAIL。\n\n<details><summary>手动等价命令（脚本不可用时）</summary>\n\n```bash\n# 编译：\n# 烧录（内置 CH340 tcflush 怪癖绕法；先 lsof /dev/ttyUSB0 查占用；烧完重启 serial_sim.py）：\nPYTHONPATH=/home/yym/.local/lib/python3.8/site-packages python3 -c \"import serial.serialposix; serial.serialposix.Serial._reset_input_buffer=lambda self: None; import runpy,sys; sys.argv=['esptool.py','--chip','esp8266','--port','/dev/ttyUSB0','--baud','115200','write_flash','0x0','.pio/build/nodemcuv2/firmware.bin']; runpy.run_path('/home/yym/.local/bin/esptool.py',run_name='__main__')\"\n```\n\n</details>\n\n- 烧录会断串口：**烧完必须重启上位机串口脚本**（serial_sim.py）\n- 出厂/换布局：`pio run -t erase`；配置存 LittleFS `/config.txt`\n- 验证舞步：`nmcli dev wifi connect ESP8266-XCOM-9A2A` → `curl http://192.168.4.1/api/status` → `nmcli con up <办公WiFi>`\n\n\n\n## 功能验证\n\n1. 上电 → 热点 `ESP8266-XCOM-9A2A`（MAC 后 4 位）出现，LED 仅 AP 模式 200ms 慢闪\n2. 连热点开 `http://192.168.4.1`：配网标签连路由 → LED 转为 2s 心跳，status JSON `up:1`\n3. 串口终端标签：注入串口数据 → 网页实时显示（P1 通路）；网页发送 → 设备收到（P4 通路）\n4. 物联网平台标签选巴法/uid/主题保存 → `cloudon:1`（诊断 tag=3）；平台控制台下行 → 设备串口收到（P6 通路）；PC 注入串口数据 → 云控制台历史数据出现（P3 通路）\n5. 转发标签填 TCP 服务器 IP:PORT → `nc -l <port>` 收到串口数据（P2 通路）\n\n\n\n## 已知限制\n\n- TLS `setInsecure()` 不验证书链（板子无 RTC 无法校时），传输仍加密，存在理论中间人风险\n- 云上收发为串口原始字节，OneJSON/物模型包装未做\n- 巴法 TCP 主题与 MQTT 主题是**两套独立控制台体系**，跨体系主题不互通\n- 单连接模型：转发目标 1 个、云平台 1 个（不可并发双云）\n- 每日闹钟依赖 NTP：纯 AP 模式（无上行）时钟不可用，`timeok=0` 拒绝设置；闹钟恢复后须等 NTP 同步才触发\n- 倒计时定时（ONCE）为易失设计，重启丢失（仅每日闹钟掉电保存）\n\n\n\n## 踩坑记录\n\n| 库「心跳保护」反杀全部客户端（V1.0.5.19） | links2004/WebSockets 2.7.3 服务端心跳：sendPing 失败（慢客户端堵窗）时 lastPing 不刷新，超时判定用 pi=millis()-lastPing 恒真，每圈 count++ 毫秒级踢光含健康者的所有连接；且 connectedClients() 默认参数竟会发 ping（统计接口高频轮询=ping 洪泛）。教训：**超时计数必须以「ping 真正发出」为前提**；带副作用的查询接口不要用于高频统计；发送与接收共用一个 TCP 超时值时，压小防卡主循环会把读路径也变脆弱（半帧即杀）——读超时应续传而非断连 |\n| 坑 | 教训 |\n|----|------|\n| brltty 抢占 CH340 (1a86:7523) | Ubuntu 经典 bug：`apt remove brltty` + mask brltty-udev |\n| AP \"时隐时现\" | 同步 `scanNetworks()` 阻塞 2-3s 停 beacon；改异步扫描（`scanNetworks(true)` + 202） |\n| 上行\"看不到数据\" | ①模拟脚本没重启 ②发布条件\"且\"饿死流式数据（改\"或\"） |\n| 巴法\"永远未连接\" | ①订阅误用 cmd=2（发布）；②res 语义猜反；③TLS 端口猜 9502（实为 9503）；④CONNACK 剩余长度 02 错当 payload 校验——**协议必须抓官方文档 + 二进制解析逐字节核对，不能凭记忆** |\n| 网页整页瘫 | 浏览器缓存旧页 JS 与新固件 DOM 不匹配；服务端 no-store 根治 |\n| MQTT 全平台被拒 | CONNECT flags 0x02 缺 username/password 声明位；标准 broker 必拒，改 0xC2 |\n| 静态分析穷尽仍无头绪 | 给固件埋诊断字段暴露到 /api/status（tag/err/rc），一次烧录定位——比串口打印合规 |\n| 板子热点连掋 PC 后 git push 突然全部失败 | 板子 captive portal DNS 把所有域名劫持到 192.168.4.1，SSH/HTTPS 全不通；**先切办公网再推远程**（之前能推是 DNS 缓存未过期） |\n| Poll 轮询重绘导致定时面板/输入被打断 | a) 面板展开状态用 JS 变量（tOpen）在重绘时还原；b) 正在输 number 时跳过整轮刷新；c) 新版再加 10s 无操作自动收起，体验与轮询和解 |\n| 无互联网时网页终端数据一卡一卡（≤V1.0.2.6） | 阻塞式 connect 的 DNS+TCP 超时卡死主循环 5~8s，云重试封顶 30s=每 30s 卡一次；**修复=NTP 未同步(time<2000-01-01)即无互联网，跳过建链等 SNTP 后台同步，退避改 4s→16s→64s→256s 封顶 300s（V1.0.2.7）**；边界：若网络放行 TCP 却屏蔽 UDP123，NTP 永不同步则永不建链（罕见环境） |\n| 转发协议切换/保存语义冲突（V1.0.2.8） | 切换与保存都是 POST /api/forward，后端靠 proto≠当前值判断\"切换\"——保存请求恰好换协议时被误判为切换，**表单被静默丢弃还返回 ok**；修复=网页切换请求加 `sel=1` 标记，后端只认 sel=1 为切换；教训：**同一路由多意图必须显式标记，不能靠参数值猜** |\n| 分槽改造丢老配置（V1.0.2.8→.9 升级路径） | 新格式只写槽位键后，旧版 fw* 键在下次保存时被覆盖删除，而老配置还在生效字段没进槽位——首次切换再切回就丢；修复=加载后 `AppFwdCfgMigrate` 把生效配置一次性迁入当前协议槽位（照 AppCloudCfgMigrate 模式）；教训：**改存储格式必须写迁移，覆盖旧键前先检查数据去向** |\n| 网页终端高频小帧卡顿（前端） | 每帧 appendChild+scrollTop=scrollHeight 强制同步布局，帧率越高卡得越狠；修复=文本节点攒入 DocumentFragment，裁剪与滚动合并进 requestAnimationFrame 单次重排（V1.0.2.10） |\n| 重启后云平台永远连不上（cloudpk 空，≤V1.0.2.5） | config.txt 分槽存了各平台凭据（cloudali_/cloudone_/cloudbf_），但加载后没人把当前平台槽位带回生效配置 G_Cfg——MQTT CONNECT 拿空凭据必被拒；**修复=AppConfigLoad 末尾补 AppCloudCfgSelect(proto)**；教训：**读写路径要成对设计**，CfgSet 写 G_Cfg+G_Slot 双份，恢复路径也必须补齐 |\n| 网页串口终端周期性卡 1~2s（V1.0.5.0） | 选了云平台但凭据为空+有互联网：TryConnect 每个退避周期拿空域名 connect，DNS/TCP 同步阻塞主循环数秒，WS 推送停摆；**修复=AppCloudCredOk() 建链前置校验，缺凭据挂起零开销**；教训：connect 前除了 NTP 门控还要查参数有效性——\"看起来不会发生的调用路径\"（空域名）恰恰是用户配了一半的状态 |\n| 验证恢复后凭据非空≠云已连上 | 纯 AP/无互联网环境下只能验到 tag=1（建链失败属预期，DNS 不通）；真实连云需板子联网后看 cloudon:1 |\n| 绑定校验双缓冲混用（V1.0.2.12 自查） | 参考值与本次计算值共用一个缓冲区，`AppBindGet` 一执行就把算好的绑定值覆盖掉；修复=拆 `Id`/`RefId` 两缓冲；教训：**成对出现的输入/参考值各自独立缓冲，命名先区分再写码** |\n| OneNET \"连上就断\"（V1.0.2.12 时期排查） | 现象=一有串口数据就被踢（cloudtag=6，无数据则稳在线）。PC 同 token 复现分组实验：只连/只 PINGREQ→存活 100s+；**发任何 PUBLISH（任意主题/载荷含合法 OneJSON）→~3s 静默 EOF**（无 DISCONNECT 无错误码）→ 踢线条件与固件报文内容无关，疑平台产品配置（接入模式/强校验），待控制台核实；教训：**服务器裸断≠固件 bug，先 PC 复现分离变量（只连/只 ping/发包），别急着改代码**；另外 keepalive=60 完全无流量 ~90s（1.5×）被断属标准 MQTT 超时，非异常 |\n| 设备时钟显示慢约 1s（V1.0.2.13） | 秒级时间在 2s 轮询回调里渲染，只能 2s 跳格且平均滞后 1s；修复=轮询校准基准+前端 250ms 本地走秒（todSet/todFmt）；教训：**秒级显示用\"轮询校准+本地走秒\"模式，别把显示频率绑死在轮询频率上** |\n| 门户大页随机截断只剩骨架（V1.0.5.6） | 三层叠加：①41KB 明文单次 send_P 让 LWIP 一次性铺发送缓冲，heap≈10KB（STA+双云挂载）时 pbuf 失败半路放弃——**大页面必须压缩后存储发送**（gzip 1/3.1，浏览器 Content-Encoding: gzip 全兼容，源码可继续保留明文 rawliteral 由预构建脚本生成）；②sendContent_P 库内忽略 write 返回值，**短写静默丢尾不报错**（实测 19/20 仍截一次）——大体裁剪必须直写 socket 并检查 write 返回值重试；③诊断特征：页面\"有骨架无版本号、标签切不动\"=HTML 尾部被截（版本号/切标签 JS 都在页面尾部），先 curl 全页与 Content-Length 比对再怀疑前端 |\n| WiFi 断联后永不自动重连须手动复位（V1.0.5.2） | “门户使用中暂停重连”门控被永久占死：WS 服务端无心跳→终端页非正常关闭后客户端计数永不归零；AP 挂站点+持续 HTTP 轮询→2min 门户窗口无限续期，DrvWifiStaMaintain 永久跳过重连；**修复=WS enableHeartbeat(15s/3s×2) 剔僵尸 + 暂停封顶 5min 强制试连（V1.0.5.3）**；教训：**暂停/门控类机制必须有上限**，否则保护机制反杀核心功能；占用状态计数必须配心跳/超时自愈，否则一次异常状态就是永久状态 |\n\n\n\n## 版本修改史\n\n> 依据代码仓库 git log 逐条整理（2026-09-30）；早期提交无正式版本号（stage 阶段号/无号），自 V1.0.2.x 起版本号写入 `APP_WEB_VER`（app_web.cpp），规则：小修第四位 +1，大改第三位 +1 且第四位保留。\n\n### V1.0.2.x ~ V1.0.5.x 系列（正式版本号）\n\n| 版本 | 日期 | 提交 | 内容 |\n|------|------|------|------|\n| V1.0.5.20 | 10-14 | e590292 | 【修复】KB 遗留 bug#4：循环发送间隔设 <100 的值被静默还原成 1000——根因=mulStart 钳位逻辑 `if(!(gap>=50)){gap=1000;回填1000}`：合法意图是防 0/负数/非数字，但 50~99 的合法小间隔也被一刀切回 1000，且回填输入框让用户以为设置失败。修复=统一下限 50ms（gap=50 并回填 50），页面间隔说明注明「下限 50」；门户 gz 再生（13383B）。纯前端一处钳位逻辑；RAM 61.3%/Flash 50.6% |\n| V1.0.5.19 | 10-14 | 5a7eacd | 【修复】网页终端「看不到数据/AT 无应答」根治：WS 连接被库心跳机制毫秒级误杀（CLOSE 1002）。根因链条=慢客户端 TCP 窗口堵死 → sendPing 写超时失败且 lastPing 不刷新 → handleHBTimeout 的 pi=millis()-lastPing 持续增大恒超 pongTimeout → 每 loop 圈 pongTimeoutCount++ → 2 次即踢**全部**客户端（含健康者）；叠加读路径同用 100ms TCP 超时，主循环忙时读半帧即 1002。修复=库补丁三处（patches/ 目录：①pingSendOk 记录 ping 是否真发出，未发出只顺延不计数；②读超时半帧保留断点续传不杀连接；③payload 缺失续读）+ app 层（devws 统计改 connectedClients(false) 纯计数不发 ping；广播弃 broadcastBIN 改逐客户端 sendBIN+availableForWrite 跳过堵住客户端；库加 getClientUnsafe）。**libdeps 重装后须把 patches/ 4 文件覆盖回 WebSockets/src/**。serial_sim.py 升 V3 "color":"#3fb27f","desc":"GD32F103 / GD32F303 两个 MCU 平台的 IMU 固件知识：串口丢字节、参数页迁移、指令集、PPS 功能","docs":[{"hash":"IMU/Readme.md","title":"Readme","relPath":"IMU/Readme.md","desc":"IMU 知识库 2026-10-23 重组：原 IMU103303333、IMU303351 两个工程目录合并至本知识库，按 MCU 型号划分目录（一个 MCU 目录 = 一个固件工程），不再按产品号建目录。","created":"","updated":"","tags":[],"sizeKB":4.9,"_text":"IMU 知识库 2026-10-23 重组：原 IMU103303333、IMU303351 两个工程目录合并至本知识库，按 MCU 型号划分目录（一个 MCU 目录 = 一个固件工程），不再按产品号建目录。 产品归属记录在各 MCU 目录 Readme 中；所有 IMU 共用本知识库。 MCU 目录与工程映射 目录（MCU 平台） 固件工程 内核/主频 服务产品 ------------------------------------------------- GD32F103/ IMU103303333 Cortex-M3 @ 108MHz（量产 Loader 布局实测 GD32F103T8） 303、333 GD32F303/ IMU303351 Cortex-M4 @ 120MHz（GD32F303CB） 351 工程名规则解读： 。新工程 = 新 MCU 平台时，在映射表登记并新建同名目录；同平台新增产品只更新对应目录 Readme 的「服务产品」，不新建目录。 目录结构 上位机测试工具（非固件工程） 目录 工程 说明 ------------------ Linux-UartTestVerifDemo/ IMUDemo（分支 ） Linux 串口验证程序 ：数据流统计 / AT 指令验证 / HEX 协议验证（含压力模式），模块功能实现文档 + 源码快照，入口 Readme 与固件工程的关系：该工具依据《用户协议》（AT 第2章 / HEX 3.2章）对固件做黑盒验证，帧格式逐 ID 对照固件 核实（固件为行为权威）；其混流容错、CRC16、帧同步等结论与固件侧串口知识链互为印证。 文档索引 MCU 目录 文档 主题 ---------------------- GD32F103 921600波特率串口丢字节排查报告 五层排查：-O0 放大器 / TX 双路径交织 / 分频门控溢出 / 满态重置索引错位 / SysTick 64 位软件除法（真凶） GD32F103 AC5下packed指针与函数形参不兼容修复报告 形参规则、memcpy 显式 转换、严禁 强转 GD32F103 量产Loader升级SN丢失与参数页安全迁移报告 参数页迁出 Loader 擦除区（唯一安全区 0x08003000/0x08003400）、A/B 双页保护、旧格式迁移体系、复位/升级入口 Flush 兜底 GD32F303 0x091时间戳抖动修复报告 时间戳源锁存位置问题、时基源注入架构（增量契约）、回绕周期一致性 GD32F303 串口丢字节修复报告 SysTick 内 64 位软件除法拖长最高优先级中断致 ORE 丢字节，修复为 32 位硬件除法 Linux-UartTestVerifDemo 模块文档 01~07 三层架构与线程模型 / termios 驱动 / SPSC 无锁队列 / 帧同步+CRC16+统计 / AT·HEX 验证器（混流容错、自动还原、压力模式）/ 构建运行与排障 跨平台知识链（串口丢字节，全平台通用） 核心纪律（三份报告共同沉淀，写中断相关代码前先读）： 1. 优先级高于串口 RX 的中断里，禁用 64 位乘除、 、 （软除法/软浮点数百周期起） 2. 任何可能阻塞 RX 的执行路径，总时长必须显著小于最高波特率下 1 字节时间（921600→10.86µs） 3. 串口接收队列每拍排空；ISR 队列满时丢弃新字节，禁止满态重置索引 4. 度量 RX 丢失率前先确认 TX 单一路径，否则回显法结果不可信 归档规则 1. 报告按所属工程（MCU 平台）归档入对应目录；同平台新产品的报告同样入该目录，产品号记录在报告正文与目录 Readme 2. 跨平台通用经验不单独建目录，沉淀到本索引「跨平台知识链」区并链接原始报告 3. 报告内引用其它报告一律用相对链接（如 ），不写旧工程目录名","content":"# IMU 知识库\n\n> 2026-10-23 重组：原 IMU_103_303_333、IMU_303_351 两个工程目录合并至本知识库，**按 MCU 型号划分目录**（一个 MCU 目录 = 一个固件工程），不再按产品号建目录。\n> 产品归属记录在各 MCU 目录 Readme 中；所有 IMU 共用本知识库。\n\n## MCU 目录与工程映射\n\n| 目录（MCU 平台） | 固件工程 | 内核/主频 | 服务产品 |\n|------------------|----------|-----------|----------|\n| [GD32F103/](GD32F103/) | IMU_103_303_333 | Cortex-M3 @ 108MHz（量产 Loader 布局实测 GD32F103T8） | 303、333 |\n| [GD32F303/](GD32F303/) | IMU_303_351 | Cortex-M4 @ 120MHz（GD32F303CB） | 351 |\n\n> 工程名规则解读：`IMU_{MCU}_{产品...}`。新工程 = 新 MCU 平台时，在映射表登记并新建同名目录；同平台新增产品只更新对应目录 Readme 的「服务产品」，不新建目录。\n\n## 目录结构\n\n```text\nIMU/\n├── Readme.md      ← 本索引（工程映射、文档索引、知识链、归档规则）\n├── GD32F103/      ← 工程 IMU_103_303_333（产品 303、333）\n├── GD32F303/      ← 工程 IMU_303_351（产品 351）\n└── Linux-UartTestVerifDemo/ ← 上位机测试工具（Linux 串口验证程序 imu_test）\n```\n\n## 上位机测试工具（非固件工程）\n\n| 目录 | 工程 | 说明 |\n|------|------|------|\n| [Linux-UartTestVerifDemo/](Linux-UartTestVerifDemo/) | IMUDemo（分支 `feature/LinuxUartTestVerifDemo`） | Linux 串口验证程序 `imu_test`：数据流统计 / AT 指令验证 / HEX 协议验证（含压力模式），模块功能实现文档 + 源码快照，入口 [Readme](Linux-UartTestVerifDemo/Readme.md) |\n\n> 与固件工程的关系：该工具依据《用户协议》（AT 第2章 / HEX 3.2章）对固件做黑盒验证，帧格式逐 ID 对照固件 `bsp_parse.c` 核实（固件为行为权威）；其混流容错、CRC16、帧同步等结论与固件侧串口知识链互为印证。\n\n## 文档索引\n\n| MCU 目录 | 文档 | 主题 |\n|----------|------|------|\n| GD32F103 | [921600波特率串口丢字节排查报告](GD32F103/921600波特率串口丢字节排查报告.md) | 五层排查：-O0 放大器 / TX 双路径交织 / 分频门控溢出 / 满态重置索引错位 / SysTick 64 位软件除法（真凶） |\n| GD32F103 | [AC5下packed指针与函数形参不兼容修复报告](GD32F103/AC5下packed指针与函数形参不兼容修复报告.md) | `__packed T *` 形参规则、memcpy 显式 `(void *)` 转换、严禁 `(float *)` 强转 |\n| GD32F103 | [量产Loader升级SN丢失与参数页安全迁移报告](GD32F103/量产Loader升级SN丢失与参数页安全迁移报告.md) | 参数页迁出 Loader 擦除区（唯一安全区 0x08003000/0x08003400）、A/B 双页保护、旧格式迁移体系、复位/升级入口 Flush 兜底 |\n| GD32F303 | [0x091时间戳抖动修复报告](GD32F303/0x091时间戳抖动修复报告.md) | 时间戳源锁存位置问题、时基源注入架构（增量契约）、回绕周期一致性 |\n| GD32F303 | [串口丢字节修复报告](GD32F303/串口丢字节修复报告.md) | SysTick 内 64 位软件除法拖长最高优先级中断致 ORE 丢字节，修复为 32 位硬件除法 |\n| Linux-UartTestVerifDemo | [模块文档 01~07](Linux-UartTestVerifDemo/Doc/01-架构与线程模型.md) | 三层架构与线程模型 / termios 驱动 / SPSC 无锁队列 / 帧同步+CRC16+统计 / AT·HEX 验证器（混流容错、自动还原、压力模式）/ 构建运行与排障 |\n\n## 跨平台知识链（串口丢字节，全平台通用）\n\n```text\n[GD32F303] 0x091时间戳抖动修复报告             [GD32F303] 串口丢字节修复报告                [GD32F103] 921600波特率串口丢字节排查报告\n选定\"SysTick ISR 时基差值累加\"方案 ──回归──▶ dwt.h 64 位软件除法拖长最高优先级中断 ──修复──▶ 32 位硬件除法\n                                                                                        ▲\n                                                            103 平台同款根因，排查报告参照 351（GD32F303 工程）修复经验闭环\n```\n\n核心纪律（三份报告共同沉淀，写中断相关代码前先读）：\n\n1. 优先级高于串口 RX 的中断里，禁用 64 位乘除、`printf`、`double`（软除法/软浮点数百周期起）\n2. 任何可能阻塞 RX 的执行路径，总时长必须显著小于最高波特率下 1 字节时间（921600→10.86µs）\n3. 串口接收队列每拍排空；ISR 队列满时丢弃新字节，禁止满态重置索引\n4. 度量 RX 丢失率前先确认 TX 单一路径，否则回显法结果不可信\n\n## 归档规则\n\n1. 报告按**所属工程（MCU 平台）**归档入对应目录；同平台新产品的报告同样入该目录，产品号记录在报告正文与目录 Readme\n2. 跨平台通用经验不单独建目录，沉淀到本索引「跨平台知识链」区并链接原始报告\n3. 报告内引用其它报告一律用相对链接（如 `../GD32F303/xxx.md`），不写旧工程目录名\n"},{"hash":"IMU/GD32F103/921600波特率串口丢字节排查报告.md","title":"921600波特率串口丢字节排查报告","relPath":"IMU/GD32F103/921600波特率串口丢字节排查报告.md","desc":"921600 波特率串口丢字节排查报告（2026-10-23） 一、测试现象 - 上位机以 921600bps 与设备通信时丢字节：帧 CRC16 校验失败、\"干净丢失\" （整字节消失，无半字节/噪声特征），且偏向帧后段字节 - 特征性极强…","created":"","updated":"","tags":[],"sizeKB":4.6,"_text":"921600 波特率串口丢字节排查报告（2026-10-23） 一、测试现象 - 上位机以 921600bps 与设备通信时丢字节：帧 CRC16 校验失败、\"干净丢失\" （整字节消失，无半字节/噪声特征），且偏向帧后段字节 - 特征性极强的表象：\"老固件正常、新固件丢\"，但两版间 USART0 ISR 源码未变 - 115200bps 下同一固件完全正常 二、字节时间预算（定位的前提） 波特率 每字节时间 RX 中断预算 结论 ------------------------------------- 921600 10.86µs 12µs（4字节FIFO缓冲） 任何 10µs 的中断推迟都可能 ORE 丢字节 115200 86.8µs 174µs 各类抖动均免疫，无法用于复现 921600 下的核心矛盾：RX 中断被推迟超过一个字节时间 → 硬件 ORE（overrun）→ 干净的整字节丢失。排查目标即\"谁推迟了 RX 中断\"。 三、五层排查（按发现顺序，逐层收窄） 层1：编译优化等级 -O0（放大器，非唯一根因） - 现象：ISR 源码未变，\"老固件正常新固件丢\" → 优先查工程设置而非源码 - 根因：-O0 使 USART0 ISR 膨胀到 10~20µs，单独就足以超过 12µs 字节预算 - 修复：编译优化等级必须 -O1 及以上 - 教训：-O0 是放大器而非唯一根因——升到 -O1 后丢包率下降但未归零， 说明还有别的推迟源 层2：USART0 双 TX 路径交织（独立的 TX 侧问题，排查中顺带发现） - 现象：上位机日志出现乱码前缀、AT 应答 \"OK\" 丢失 - 根因：存在两条并发 TX 路径—— 直写 DATA 寄存器 + TBE 中断驱动的环形缓冲，两者同时发送时字节交织 - 修复：printf 一律重定向到 环形缓冲单一路径 - 重要经验（351 项目验证）：回显法测得的丢失率 ≠ RX 丢失率—— TX 侧还在丢，必须先把 TX 收敛到单一路径，才能用回显法可信地度量 RX 层3：指令解析任务挂入分频门控（独立的队列溢出问题） - 现象：指令偶发丢失、队列溢出 - 根因：指令解析曾挂在 100Hz 分频门控内——921600bps 下 10ms 涌入约 921 字节，超过 512 深度的接收队列 → 硬件级溢出 - 修复：串口接收队列必须每拍（1ms）排空；指令解析严禁挂入分频门控 层4：ISR 中满态重置队列索引（独立的字节错位问题） - 现象：偶发整帧 CRC16 错误 - 根因：ISR 在队列满时重置写索引（front），与主循环 并发 改写同一索引 → 字节错位（丢的不止一个字节，整帧错位） - 修复：ISR 满时直接丢弃新字节即可，禁止满态重置索引 层5（真凶）：SysTick 调用链中的 64 位软件除法 排除以上四层后丢包仍未归零，最终定位： - 根因：Cortex-M3 无硬件除法， （64 位软件除法） 耗时约 1.5~3µs+；SysTick（优先级 0）执行期间把 USART0 RX 中断 （优先级 1）推迟——推迟量逼近字节时间 10.86µs → 偶发 ORE 干净丢字节 - 定量吻合：丢失率 ≈ SysTick 窗口 / 1ms ≈ 0.3%/字节，与实测一致 - 修复： / 中 64 位除法改为 32 位除法—— （108MHz 主频）恰好整除，换算因子可在编译期算出， 32 位除法与 64 位版本数值精确等价（参照知识库 GD32F303 平台 串口丢字节修复报告） - 验证：72540 字节连续收发零丢失 四、防御规范（后续约束） 1. 中断路径（含中断调用的任何函数链）禁止： - 64 位除法/取模（ 每次吞掉 1.5~3µs+） - / 浮点格式化（软浮点 每帧数百 µs） - 运算（软浮点库，单次数十 µs 起） 2. 串口接收队列每拍排空；指令解析严禁挂入分频门控 3. ISR 队列满时丢弃新字节，禁止满态重置索引 4. printf 统一走环形缓冲单一路径，禁止 fputc 直写 DATA 寄存器 5. 编译优化等级保持 -O1 及以上；\"老固件正常新固件丢\"且 ISR 源码未变时， 优先查工程 Optim 设置 6. 度量 RX 丢失率前先确认 TX 单一路径，否则回显法结果不可信","content":"# 921600 波特率串口丢字节排查报告（2026-10-23）\n\n## 一、测试现象\n\n- 上位机以 **921600bps** 与设备通信时丢字节：帧 CRC16 校验失败、\"干净丢失\"\n  （整字节消失，无半字节/噪声特征），且**偏向帧后段字节**\n- 特征性极强的表象：**\"老固件正常、新固件丢\"**，但两版间 USART0 ISR 源码未变\n- 115200bps 下同一固件完全正常\n\n## 二、字节时间预算（定位的前提）\n\n| 波特率 | 每字节时间 | RX 中断预算 | 结论 |\n|--------|-----------|------------|------|\n| 921600 | **10.86µs** | 12µs（4字节FIFO缓冲） | 任何 >10µs 的中断推迟都可能 ORE 丢字节 |\n| 115200 | 86.8µs | 174µs | 各类抖动均免疫，无法用于复现 |\n\n921600 下的核心矛盾：**RX 中断被推迟超过一个字节时间 → 硬件 ORE（overrun）→\n干净的整字节丢失**。排查目标即\"谁推迟了 RX 中断\"。\n\n## 三、五层排查（按发现顺序，逐层收窄）\n\n### 层1：编译优化等级 -O0（放大器，非唯一根因）\n\n- **现象**：ISR 源码未变，\"老固件正常新固件丢\" → 优先查工程设置而非源码\n- **根因**：-O0 使 USART0 ISR 膨胀到 **10~20µs**，单独就足以超过 12µs 字节预算\n- **修复**：编译优化等级必须 **-O1 及以上**\n- **教训**：-O0 是放大器而非唯一根因——升到 -O1 后丢包率下降但未归零，\n  说明还有别的推迟源\n\n### 层2：USART0 双 TX 路径交织（独立的 TX 侧问题，排查中顺带发现）\n\n- **现象**：上位机日志出现乱码前缀、AT 应答 \"OK\" 丢失\n- **根因**：存在两条并发 TX 路径——`fputc` 直写 DATA 寄存器 +\n  TBE 中断驱动的环形缓冲，两者同时发送时**字节交织**\n- **修复**：printf 一律重定向到 `uart0_send_buf` 环形缓冲**单一路径**\n- **重要经验（351 项目验证）**：**回显法测得的丢失率 ≠ RX 丢失率**——\n  TX 侧还在丢，必须先把 TX 收敛到单一路径，才能用回显法可信地度量 RX\n\n### 层3：指令解析任务挂入分频门控（独立的队列溢出问题）\n\n- **现象**：指令偶发丢失、队列溢出\n- **根因**：指令解析曾挂在 100Hz 分频门控内——921600bps 下 **10ms 涌入约\n  921 字节**，超过 512 深度的接收队列 → 硬件级溢出\n- **修复**：**串口接收队列必须每拍（1ms）排空**；指令解析严禁挂入分频门控\n\n### 层4：ISR 中满态重置队列索引（独立的字节错位问题）\n\n- **现象**：偶发整帧 CRC16 错误\n- **根因**：ISR 在队列满时重置写索引（front），与主循环 `BspDeQueue` 并发\n  改写同一索引 → **字节错位**（丢的不止一个字节，整帧错位）\n- **修复**：ISR 满时**直接丢弃新字节**即可，禁止满态重置索引\n\n### 层5（真凶）：SysTick 调用链中的 64 位软件除法\n\n排除以上四层后丢包仍未归零，最终定位：\n\n```text\nSysTick_Handler (优先级0, 1kHz)\n  └─ BspSysTickMs()\n       └─ G_UsTimeSource()                      ← 时基源注入调用\n            └─ dwt_us_from_cycles32()\n                 └─ 64位除法 (__aeabi_uldivmod)  ← ★ 真凶\n```\n\n- **根因**：Cortex-M3 **无硬件除法**，`__aeabi_uldivmod`（64 位软件除法）\n  耗时约 **1.5~3µs+**；SysTick（优先级 0）执行期间把 USART0 RX 中断\n  （优先级 1）推迟——推迟量逼近字节时间 10.86µs → 偶发 ORE 干净丢字节\n- **定量吻合**：丢失率 ≈ SysTick 窗口 / 1ms ≈ **0.3%/字节**，与实测一致\n- **修复**：`dwt.h`/`dwt.c` 中 64 位除法改为 **32 位除法**——\n  `Fcpu/1e6 = 108`（108MHz 主频）恰好整除，换算因子可在编译期算出，\n  32 位除法与 64 位版本**数值精确等价**（参照知识库 GD32F303 平台 [串口丢字节修复报告](../GD32F303/串口丢字节修复报告.md)）\n- **验证**：**72540 字节连续收发零丢失**\n\n## 四、防御规范（后续约束）\n\n1. **中断路径（含中断调用的任何函数链）禁止**：\n   - 64 位除法/取模（`__aeabi_uldivmod` 每次吞掉 1.5~3µs+）\n   - `printf` / 浮点格式化（软浮点 `%f` 每帧数百 µs）\n   - `double` 运算（软浮点库，单次数十 µs 起）\n2. 串口接收队列**每拍排空**；指令解析严禁挂入分频门控\n3. ISR 队列满时**丢弃新字节**，禁止满态重置索引\n4. printf 统一走环形缓冲单一路径，禁止 fputc 直写 DATA 寄存器\n5. 编译优化等级保持 **-O1 及以上**；\"老固件正常新固件丢\"且 ISR 源码未变时，\n   优先查工程 Optim 设置\n6. 度量 RX 丢失率前先确认 TX 单一路径，否则回显法结果不可信\n"},{"hash":"IMU/GD32F103/AC5下packed指针与函数形参不兼容修复报告.md","title":"AC5下packed指针与函数形参不兼容修复报告","relPath":"IMU/GD32F103/AC5下packed指针与函数形参不兼容修复报告.md","desc":"三、修复方案 1. 助手形参声明为 （正确解） - 源参数 （普通结构）不受影响，读写两侧类型独立 - 与原逐字段赋值编译语义完全一致——不是新行为，是把原行为显式化 2. memcpy 目标显式加 转换 指针 → 允许显式转换；memcpy 本身逐字节搬运， 不假设对齐，拷贝结果与逐字段赋值逐位一","created":"","updated":"","tags":[],"sizeKB":4.1,"_text":"AC5 下 packed 结构成员指针与函数形参不兼容修复报告（2026-10-23） 一、测试现象 bspdatainteraction.c 推送帧填充逻辑重构后（提取 3 个共用填充助手函数）， Keil AC5（V5.06 update 7）编译报 24 个同型错误： 全部指向新助手函数的调用点与直连 memcpy： 二、根因分析 推送目标结构体均为 （协议帧布局，禁止编译器填充）： - packed 结构不做对齐填充，成员实际偏移由前序成员逐字节累加 （上例 偏移 11），首地址普遍非 4 字节对齐 - AC5 对 packed 结构成员数组取地址/退化得到的指针类型是 （不是 ）——该类型告知编译器 \"目标可能非对齐\"，经它访问自动生成非对齐安全代码 - ARMCC 类型规则： 不可隐式转换为 ， 连 也不行 → 传给 / 形参即报 167 为什么旧代码从未报错：旧实现全部逐字段赋值 （ ），左值经 元素访问，从不取数组成员地址传参—— 编译器一直在背后做非对齐安全访问，重构把这段\"隐式行为\"显式化时踩坑。 三、修复方案 1. 助手形参声明为 （正确解） - 源参数 （普通结构）不受影响，读写两侧类型独立 - 与原逐字段赋值编译语义完全一致——不是新行为，是把原行为显式化 2. memcpy 目标显式加 转换 指针 → 允许显式转换；memcpy 本身逐字节搬运， 不假设对齐，拷贝结果与逐字段赋值逐位一致。 四、风险辨析（为什么不用 强转） - 强转成普通 后，编译器按 4 字节对齐假设生成 LDR/STR 字访问， 甚至可能向量化为 LDM/STM（这些指令不允许非对齐地址）→ 非对齐 HardFault 或数据损坏 - 行为依赖 配置与编译器优化决策，属于不可移植的未定义行为 五、约束规范（后续红线） 1. 跨函数传递 成员指针，形参必须声明为 2. 指针传给 memcpy 等期望 的接口，必须显式 转换 3. 严禁 强转 packed 成员指针——非对齐字访问隐患 4. packed 结构是协议帧布局：只在组包/拆包边界使用； 内部算法数据结构保持自然对齐（如 ArithmeticDataS），避免 packed 传染 5. 提取共用助手函数收敛重复代码时，注意 packed 成员地址传参这一 逐字段赋值时代不存在的坑——AC5 的 167 在编译期全部拦下， 不会带病上线（本例 24 错即编译期拦截）","content":"# AC5 下 __packed 结构成员指针与函数形参不兼容修复报告（2026-10-23）\n\n## 一、测试现象\n\nbsp_data_interaction.c 推送帧填充逻辑重构后（提取 3 个共用填充助手函数），\nKeil AC5（V5.06 update 7）编译报 **24 个同型错误**：\n\n```text\nerror: #167: argument of type \"__packed float *\" is incompatible\n       with parameter of type \"float *\"\n```\n\n全部指向新助手函数的调用点与直连 memcpy：\n\n```c\nBspPushFillImuNorm(OriginalData.accel, OriginalData.gyro, &OriginalData.temp, pArithmeticData);\nmemcpy(MasterData3DGraphics.accel, pArithmeticData->Accel, sizeof(MasterData3DGraphics.accel));\n```\n\n## 二、根因分析\n\n推送目标结构体均为 `__packed struct`（协议帧布局，禁止编译器填充）：\n\n```c\ntypedef __packed struct\n{\n    unsigned char ack_result;      /* 偏移 0  */\n    unsigned long long time;       /* 偏移 1  */\n    unsigned short int frequency;  /* 偏移 9  */\n    float accel[3];                /* 偏移 11 ←★ 非 4 字节对齐 */\n    ...\n} MasterData3DGraphics_S;\n```\n\n- **packed 结构不做对齐填充**，成员实际偏移由前序成员逐字节累加\n  （上例 `accel` 偏移 11），首地址普遍非 4 字节对齐\n- AC5 对 packed 结构成员数组取地址/退化得到的指针类型是\n  **`__packed float *`**（不是 `float *`）——该类型告知编译器\n  \"目标可能非对齐\"，经它访问自动生成非对齐安全代码\n- ARMCC 类型规则：`__packed T *` **不可隐式转换**为 `T *`，\n  连 `void *` 也不行 → 传给 `float *`/`void *restrict` 形参即报 #167\n\n**为什么旧代码从未报错**：旧实现全部逐字段赋值\n（`OriginalData.accel[0] = pArithmeticData->Accel[0];`），左值经\n`__packed float *` 元素访问，从不取数组成员地址传参——\n**编译器一直在背后做非对齐安全访问，重构把这段\"隐式行为\"显式化时踩坑**。\n\n## 三、修复方案\n\n### 1. 助手形参声明为 `__packed float *`（正确解）\n\n```c\nstatic void BspPushFillImuNorm(__packed float *pAccel, __packed float *pGyro,\n                               __packed float *pTemp, const pArithmeticData_S pSrc)\n{\n    for (int i = 0; i < 3; i++)\n    {\n        pAccel[i] = pSrc->Accel[i];  /* 编译器生成非对齐安全代码,与原逐字段赋值同类 */\n        pGyro[i] = pSrc->Gyro[i];\n    }\n    pAccel[3] = sqrtf(...);          /* 模值槽位 */\n}\n```\n\n- 源参数 `pArithmeticData`（普通结构）不受影响，读写两侧类型独立\n- **与原逐字段赋值编译语义完全一致**——不是新行为，是把原行为显式化\n\n### 2. memcpy 目标显式加 `(void *)` 转换\n\n```c\nmemcpy((void *)MasterData3DGraphics.accel, pArithmeticData->Accel,\n       sizeof(MasterData3DGraphics.accel));  /* 逐字节拷贝,对齐无关,天然安全 */\n```\n\n`__packed` 指针 → `void *` 允许**显式**转换；memcpy 本身逐字节搬运，\n不假设对齐，拷贝结果与逐字段赋值逐位一致。\n\n## 四、风险辨析（为什么不用 `(float *)` 强转）\n\n```c\n/* 错误解(编译能过,留隐患): */\nBspPushFillImuNorm((float *)OriginalData.accel, ...);\n```\n\n- 强转成普通 `float *` 后，编译器按 **4 字节对齐假设**生成 LDR/STR 字访问，\n  甚至可能向量化为 LDM/STM（这些指令**不允许**非对齐地址）→ 非对齐 HardFault\n  或数据损坏\n- 行为依赖 `CCR.UNALIGN_TRP` 配置与编译器优化决策，属于不可移植的未定义行为\n\n## 五、约束规范（后续红线）\n\n1. **跨函数传递 `__packed struct` 成员指针，形参必须声明为 `__packed T *`**\n2. `__packed` 指针传给 memcpy 等期望 `void *` 的接口，必须**显式 `(void *)` 转换**\n3. **严禁 `(float *)` 强转 packed 成员指针**——非对齐字访问隐患\n4. packed 结构是协议帧布局：只在**组包/拆包边界**使用；\n   内部算法数据结构保持自然对齐（如 ArithmeticData_S），避免 packed 传染\n5. 提取共用助手函数收敛重复代码时，注意 packed 成员地址传参这一\n   逐字段赋值时代不存在的坑——AC5 的 #167 在编译期全部拦下，\n   不会带病上线（本例 24 错即编译期拦截）\n"},{"hash":"IMU/GD32F103/Readme.md","title":"Readme","relPath":"IMU/GD32F103/Readme.md","desc":"GD32F103 平台（工程 IMU103303333） - 固件工程：IMU103303333（工程名规则： ） - 硬件平台：GD32F103，Cortex-M3 @ 108MHz（量产 Loader 布局实测 GD32F103T8） …","created":"","updated":"","tags":[],"sizeKB":1.3,"_text":"GD32F103 平台（工程 IMU103303333） - 固件工程：IMU103303333（工程名规则： ） - 硬件平台：GD32F103，Cortex-M3 @ 108MHz（量产 Loader 布局实测 GD32F103T8） - 服务产品：303、333（同工程多产品，不再按产品分目录，产品归属以报告正文为准） 文档索引 文档 主题 ------------ 921600波特率串口丢字节排查报告 五层排查：-O0 放大器 / TX 双路径交织 / 分频门控溢出 / 满态重置索引错位 / SysTick 64 位软件除法（真凶）；末尾附防御规范 AC5下packed指针与函数形参不兼容修复报告 形参规则、memcpy 显式 转换、严禁 强转（协议帧 packed 结构） 量产Loader升级SN丢失与参数页安全迁移报告 参数页迁出 Loader 擦除区（唯一安全区 0x08003000/0x08003400）、A/B 双页保护、旧格式迁移体系、复位/升级入口 Flush 兜底 跨平台参考 - GD32F303/串口丢字节修复报告：同款 64 位除法根因的先例修复（32 位硬件除法数值精确等价推导）","content":"# GD32F103 平台（工程 IMU_103_303_333）\n\n- **固件工程**：IMU_103_303_333（工程名规则：`IMU_{MCU}_{产品...}`）\n- **硬件平台**：GD32F103，Cortex-M3 @ 108MHz（量产 Loader 布局实测 GD32F103T8）\n- **服务产品**：303、333（同工程多产品，不再按产品分目录，产品归属以报告正文为准）\n\n## 文档索引\n\n| 文档 | 主题 |\n|------|------|\n| [921600波特率串口丢字节排查报告](921600波特率串口丢字节排查报告.md) | 五层排查：-O0 放大器 / TX 双路径交织 / 分频门控溢出 / 满态重置索引错位 / SysTick 64 位软件除法（真凶）；末尾附防御规范 |\n| [AC5下packed指针与函数形参不兼容修复报告](AC5下packed指针与函数形参不兼容修复报告.md) | `__packed T *` 形参规则、memcpy 显式 `(void *)` 转换、严禁 `(float *)` 强转（协议帧 packed 结构） |\n| [量产Loader升级SN丢失与参数页安全迁移报告](量产Loader升级SN丢失与参数页安全迁移报告.md) | 参数页迁出 Loader 擦除区（唯一安全区 0x08003000/0x08003400）、A/B 双页保护、旧格式迁移体系、复位/升级入口 Flush 兜底 |\n\n## 跨平台参考\n\n- [GD32F303/串口丢字节修复报告](../GD32F303/串口丢字节修复报告.md)：同款 64 位除法根因的先例修复（32 位硬件除法数值精确等价推导）\n"},{"hash":"IMU/GD32F103/量产Loader升级SN丢失与参数页安全迁移报告.md","title":"量产Loader升级SN丢失与参数页安全迁移报告","relPath":"IMU/GD32F103/量产Loader升级SN丢失与参数页安全迁移报告.md","desc":"量产 Loader 升级 SN 丢失与参数页安全迁移报告（2026-10-23） 一、测试现象 - 量产设备（develop 旧固件）执行量产 Loader 升级后，SN 序列号丢失 - 部分场景配置项（波特率、推送配置、量程）同样丢失，重…","created":"","updated":"","tags":[],"sizeKB":6.8,"_text":"量产 Loader 升级 SN 丢失与参数页安全迁移报告（2026-10-23） 一、测试现象 - 量产设备（develop 旧固件）执行量产 Loader 升级后，SN 序列号丢失 - 部分场景配置项（波特率、推送配置、量程）同样丢失，重启后回到出厂默认值 - 后续排查发现升级链路还有第二个隐患：配置后 2 秒内立即复位/升级，配置丢失 二、根因分析 根因1：旧参数页地址落在量产 Loader 的擦除范围内 - 量产 Loader 升级 APP 时硬编码擦除到 0x0801FFFF，旧参数页 0x08004400 在擦除范围内 → 升级即丢 -
