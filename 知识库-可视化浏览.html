.3，\nCMake -G Ninja -B build\\cli-Debug，全量 70 步约 1 分钟。\n\n## 源码结构（与本知识相关部分）\n\n- `Code/CommTools/ViewModel/CommandViewModel.cpp` — Hex 指令注册（initCommandGroups）/ 发送构建（buildPayload）/ 回复解析（handleReceivedData）\n- `Code/CommTools/bsp/Help/DataParser.h` — 协议结构体（Hex*_S 系列，`#pragma pack(1)`）\n- `Code/CommTools/bsp/Common/crc.cpp` — CRC16：init=0x3692、poly=0x8408（LSB-first）\n- `Code/CommTools/View/Component/DebugPage.qml` — XCOM 风格调试页\n- `Doc/协议规范/IMU-用户协议.md` — 协议唯一事实来源；`指令解析方案.md` — 开发规范\n\n## 记录索引\n\n- 2026-10-10 [HexCommands 实现核对与修复报告](Doc/HexCommands-实现核对与修复报告.md) — 17 条指令全量核对、5 处修复、COM8 实测证据\n- 2026-10-10 [XCOM 功能对照报告](Doc/XCOM功能对照报告.md) — DebugPage vs ATK-XCOM\n- 2026-10-10 [波形页优化报告](Doc/波形页优化报告.md) — 卡顿三根因、Y轴自适应、鼠标缩放/平移查看（X轴§11 / Y轴§13）、**滚轮无效根因§14（qmlcachegen 编译下 MouseArea.onWheel 失效，改用 WheelHandler）**、数据入口过滤根因(§12)、自测钩子与实测数据\n- 2026-10-10 [蓝牙功能实现](Doc/蓝牙功能实现.md) — Windows 原生双栈(WinRT AEP 扫描+Winsock SPP 免配对直连，Qt Bluetooth 缺失且 Windows 不支持经典 SPP)、cppwinrt 踩坑(/permissive-/experimental-coroutine/runtimeobject)、--btscan 实测 20s 扫到 12 台\n- 2026-10-15 [页面切换卡顿优化报告](Doc/页面切换卡顿优化报告.md) — 第三轮 B7：调试页日志/字节计数 500ms→100ms（10Hz XCOM 级跟手）+ 串口枚举异步化 refreshSerialPortsAsync（根除串口/蓝牙面板快速切换卡顿，Windows 同步枚举阻塞 UI 10-100ms）；COM3@921600 页 0 真实数据验证\n- 2026-10-15 [页面切换卡顿优化报告](Doc/页面切换卡顿优化报告.md) — 两轮共 5 批次：P0（QList<double>/seq 增量日志/perfLog 门控/RelWithDebInfo）+ P1/P2（页面 3-6 Loader 延迟加载、波形 C++ 侧供数 fillChart 彻底消灭数组转换与 Qt.point 分配、--serial/--cyclepages 自测钩子）；COM3@921600 真实设备全链路验证（注意设备波特率 921600）；B5（QML_ELEMENT AOT）因 Qt6.11+MSVC 命名空间元对象链接 C2737 回退，重试路径见报告\n- 2026-10-15 [页面切换卡顿优化报告](Doc/页面切换卡顿优化报告.md) — P0 三连修：①13 通道波形属性 QVariantList→QList<double>（消除每 tick 16 绑定×1500 点 QVariant 装箱转换）②调试页日志改后端 seq 增量拉取 rxLogsSince/lastLogSeq（替代每次全量拷贝 5000 条）③perfLog 默认关闭（COMMTOOLS_PERF_LOG 开启）；新增 RelWithDebInfo 构建目录（jom 须 -DCMAKE_MAKE_PROGRAM 全路径）；--simulate 像素计数 + --btscan 日志链路 0 错误验证\n- 2026-10-10 [协议开发规范](Doc/协议开发规范.md)（项目内 `指令解析方案.md` 修复后快照）\n"},{"hash":"QT-Tools/Doc/HexCommands-实现核对与修复报告.md","title":"HexCommands-实现核对与修复报告","relPath":"QT-Tools/Doc/HexCommands-实现核对与修复报告.md","desc":"HexCommands 实现核对与修复报告（2026-10-10） 依据 （3.2.2 指令总览 + 3.2.3/3.2.4 详细定义 + 4.2 示例）对 / 全量核对，并在 COM8 实机（921600 8N1） 验证。","created":"","updated":"","tags":[],"sizeKB":4.8,"_text":"HexCommands 实现核对与修复报告（2026-10-10） 依据 （3.2.2 指令总览 + 3.2.3/3.2.4 详细定义 + 4.2 示例）对 / 全量核对，并在 COM8 实机（921600 8N1） 验证。 一、核对结论：17 条输入指令全部实现 三层（注册 initCommandGroups / 构建 buildPayload / 回复解析 handleReceivedData）齐全： 报文ID 名称 结构体 载荷 实测 ---------------------------------- 0x00 0x03 版本查询 VisonPacket 0B ✅ APP=V3.0.0.4 HW=V1.0.0.0 0x00 0x04 推送频率 HzPacket 1B ✅ 0x05=50Hz（与 AT+CONFIG 一致） 0x00 0x05 修改蓝牙名称 SnPacket 16B —（写 FLASH，未实测） 0x00 0x06 算法模式 AlgorithmPacket 1B ✅ 0x03=6轴自研 0x00 0x07 数据流状态 APacket 1B ✅ 0x00=关闭 0x00 0x08 磁力计校准 APacket 1B —（需静止，未实测） 0x00 0x11 推送报文ID控制 HexMsgID0011S 3B ✅ 0x0010 关/开均有应答 0x00 0x12 PPS开关控制 HexPPS0012S 10B ✅ 18B 回复布局一致 0x00 0x14 复位重启 HexReset0014S 9B —（重启设备，未实测） 0x00 0x15 IMU坐标系 HexImuCoordinate0015S 10B ✅ 0x00C8=200（与 AT 一致） 0x00 0x16 串口波特率 HexRecvUart0016S 12B ✅ 0x000E1000=921600（与 AT 一致） 0x00 0x17 CAN波特率 HexCanBaudRate0017S 12B ✅ 0x03E8=1000Kbps 0x00 0x18 SN号查询 HexSN0018S 9B ✅ 32B 布局一致；SN 全零见下文 0x00 0x19 时间设置 HexDateTime0019S(发送) 15B ✅ 回复 16B 无日期字段 0x00 0x20 零偏校准 HexZeroOffset0020S 9B —（需静止，未实测） 0x01 0x01 A值查询与设置 APacket 1B ✅ 收发帧与协议 4.2.4.1 示例逐字节相同 0x01 0x03 电池电量查询 PowerPacket 1B ✅ 9B 布局一致（当前读数 0） 推送帧 0x0001/0x0002/0x0009/0x0010/0x0013/0x0102 亦已注册解析。发送帧头 7B （AA 55 cmd id op len16LE）、vlen=7+载荷+2、CRC16(0x3692/0x8408) 均与协议一致。 二、发现的问题与修复（gitee 1c7e2f7） 1. 0x19 回复解析不符协议（已修复）：协议 3.2.3.14 回复=头部(6)+Reserved8+CRC16 共16B、无日期字段；原代码误用 23B 发送结构体解析（越界+乱码时间）。改为按偏移解析。实测回复 恰为 16B，证实修复正确。 2. 0x01 0x03 显示文案（已修复）：原显示\"A值信息/用户A值\"，改为\"电池电量信息/电量: n %\"。 3. 0x11 载荷字节序（已修复）：协议 DATA1=CMD、DATA2=ID、DATA3=开关；原实现要求输入字节序颠倒值（0x0010 须输 0x1000）。改为按报文ID原值输入，高字节→DATA1、低字节→DATA2。实测 （关）与 （开）设备均正常应答。 4. SN 字节序（保持现状）：代码显示前反转 16B；实测设备二进制与 AT+SN? 返回的 SN 均为全 0x00，无法用真实 SN 判定字节序；全零下两种显示等价（空串）。待固件写入真实 SN 后再验证。 5. 帮助文案（已修复）：0x11 data1 更正为\"目标报文ID（如 0x0001/0x0002/0x0010/0x0013，高字节=CMD）\"；0x12 data1/data2 更正为 PPS开关状态/PPS模式。 6. 文档（已修复）： §8.1 中 0x19 条目由\"用户数据推送链路设置 HexDataLink0019S\"更正为\"时间设置 HexDateTime0019S\"，并补修改记录。 三、COM8 实测证据摘录（2026-10-10 11:44） 验证脚本（PowerShell + .NET SerialPort，复刻工程 CRC16）：已归档于 OpenClaw workspace ；要点： 包裹单元素返回、 与逗号优先级、 函数内用 Write-Host 防止污染返回管道。 四、遗留事项 - SN 字节序：待固件写入真实 SN 后复核（见问题4） - 0x05/0x08/0x14/0x20 未实测（写 FLASH / 需静止 / 触发重启），代码层已核对与协议一致 - 电量读数恒 0：疑似 USB 供电无电池，待带电池复测","content":"# HexCommands 实现核对与修复报告（2026-10-10）\n\n依据 `Doc/协议规范/IMU-用户协议.md`（3.2.2 指令总览 + 3.2.3/3.2.4 详细定义 + 4.2 示例）对\n`CommandViewModel.cpp` / `DataParser.h` 全量核对，并在 **COM8 实机（921600 8N1）** 验证。\n\n## 一、核对结论：17 条输入指令全部实现\n\n三层（注册 initCommandGroups / 构建 buildPayload / 回复解析 handleReceivedData）齐全：\n\n| 报文ID | 名称 | 结构体 | 载荷 | 实测 |\n|--------|------|--------|------|------|\n| 0x00 0x03 | 版本查询 | VisonPacket | 0B | ✅ APP=V3.0.0.4 HW=V1.0.0.0 |\n| 0x00 0x04 | 推送频率 | HzPacket | 1B | ✅ 0x05=50Hz（与 AT+CONFIG 一致） |\n| 0x00 0x05 | 修改蓝牙名称 | SnPacket | 16B | —（写 FLASH，未实测） |\n| 0x00 0x06 | 算法模式 | AlgorithmPacket | 1B | ✅ 0x03=6轴自研 |\n| 0x00 0x07 | 数据流状态 | APacket | 1B | ✅ 0x00=关闭 |\n| 0x00 0x08 | 磁力计校准 | APacket | 1B | —（需静止，未实测） |\n| 0x00 0x11 | 推送报文ID控制 | HexMsgID0011_S | 3B | ✅ 0x0010 关/开均有应答 |\n| 0x00 0x12 | PPS开关控制 | HexPPS0012_S | 10B | ✅ 18B 回复布局一致 |\n| 0x00 0x14 | 复位重启 | HexReset0014_S | 9B | —（重启设备，未实测） |\n| 0x00 0x15 | IMU坐标系 | HexImuCoordinate0015_S | 10B | ✅ 0x00C8=200（与 AT 一致） |\n| 0x00 0x16 | 串口波特率 | HexRecvUart0016_S | 12B | ✅ 0x000E1000=921600（与 AT 一致） |\n| 0x00 0x17 | CAN波特率 | HexCanBaudRate0017_S | 12B | ✅ 0x03E8=1000Kbps |\n| 0x00 0x18 | SN号查询 | HexSN0018_S | 9B | ✅ 32B 布局一致；SN 全零见下文 |\n| 0x00 0x19 | 时间设置 | HexDateTime0019_S(发送) | 15B | ✅ 回复 16B 无日期字段 |\n| 0x00 0x20 | 零偏校准 | HexZeroOffset0020_S | 9B | —（需静止，未实测） |\n| 0x01 0x01 | A值查询与设置 | APacket | 1B | ✅ 收发帧与协议 4.2.4.1 示例逐字节相同 |\n| 0x01 0x03 | 电池电量查询 | PowerPacket | 1B | ✅ 9B 布局一致（当前读数 0） |\n\n推送帧 0x0001/0x0002/0x0009/0x0010/0x0013/0x0102 亦已注册解析。发送帧头 7B\n（AA 55 cmd id op len16LE）、v_len=7+载荷+2、CRC16(0x3692/0x8408) 均与协议一致。\n\n## 二、发现的问题与修复（gitee 1c7e2f7）\n\n1. **0x19 回复解析不符协议（已修复）**：协议 3.2.3.14 回复=头部(6)+Reserved[8]+CRC16 共16B、无日期字段；原代码误用 23B 发送结构体解析（越界+乱码时间）。改为按偏移解析。实测回复 `AA 55 00 19 10 00 00…00 21 0E` 恰为 16B，证实修复正确。\n2. **0x01 0x03 显示文案（已修复）**：原显示\"A值信息/用户A值\"，改为\"电池电量信息/电量: n %\"。\n3. **0x11 载荷字节序（已修复）**：协议 DATA1=CMD、DATA2=ID、DATA3=开关；原实现要求输入字节序颠倒值（0x0010 须输 0x1000）。改为按报文ID原值输入，高字节→DATA1、低字节→DATA2。实测 `00 10 00`（关）与 `00 10 01`（开）设备均正常应答。\n4. **SN 字节序（保持现状）**：代码显示前反转 16B；实测设备二进制与 AT+SN? 返回的 SN **均为全 0x00**，无法用真实 SN 判定字节序；全零下两种显示等价（空串）。待固件写入真实 SN 后再验证。\n5. **帮助文案（已修复）**：0x11 data1 更正为\"目标报文ID（如 0x0001/0x0002/0x0010/0x0013，高字节=CMD）\"；0x12 data1/data2 更正为 PPS开关状态/PPS模式。\n6. **文档（已修复）**：`指令解析方案.md` §8.1 中 0x19 条目由\"用户数据推送链路设置 HexDataLink0019_S\"更正为\"时间设置 HexDateTime0019_S\"，并补修改记录。\n\n## 三、COM8 实测证据摘录（2026-10-10 11:44）\n\n```\nCRC 自检: AA 55 01 01 00 0A 00 00 → 0xB0CA（协议示例 CA B0）PASS\n0x0101 A值: TX AA 55 01 01 00 0A 00 00 CA B0 / RX AA 55 01 01 09 00 00 8B 08   ← 与文档 4.2.4.1 完全一致\n0x0019 时间设置(2026-10-10 11:44:58, RAM):\n  TX(24B) AA 55 00 19 01 18 00 EA 07 0A 0A 0B 2C 3A +8×00 C1 9A\n  RX(16B) AA 55 00 19 10 00 +8×00 21 0E      ← v_len=0x10，无日期字段，证实修复①\n0x0011 报文推送控制(RAM): TX … 00 10 00 → RX(9B) 应答；TX … 00 10 01 → RX(9B) 应答\nAT+CONFIG: UARTBaudRate:921600 CoordinateSystem:200 DataPushFre:50Hz  ← 与 0x16/0x15/0x04 二进制查询交叉一致\nAT+SN?: SN:(16×0x00) ← SN 未烧写\n```\n\n验证脚本（PowerShell + .NET SerialPort，复刻工程 CRC16）：已归档于\nOpenClaw workspace `verify-com8.ps1`；要点：`@()` 包裹单元素返回、`-band` 与逗号优先级、\n函数内用 Write-Host 防止污染返回管道。\n\n## 四、遗留事项\n\n- SN 字节序：待固件写入真实 SN 后复核（见问题4）\n- 0x05/0x08/0x14/0x20 未实测（写 FLASH / 需静止 / 触发重启），代码层已核对与协议一致\n- 电量读数恒 0：疑似 USB 供电无电池，待带电池复测\n"},{"hash":"QT-Tools/Doc/XCOM功能对照报告.md","title":"XCOM功能对照报告","relPath":"QT-Tools/Doc/XCOM功能对照报告.md","desc":"DebugPage 与 ATK-XCOM 功能对照报告（2026-10-10） 对象： （1212 行）+ + Main/CommViewModel。","created":"","updated":"","tags":[],"sizeKB":3.5,"_text":"DebugPage 与 ATK-XCOM 功能对照报告（2026-10-10） 对象： （1212 行）+ + Main/CommViewModel。 对照基准：正点原子 ATK-XCOM 2.x。 结论 核心功能全覆盖，且有数处优于 XCOM 的实现；缺 4 项 XCOM 功能（发送文件、编码选择、自定义波特率输入、毫秒级时间戳），1 处行为差异（清除接收同时清零 S/R 计数）。 已实现（与 XCOM 对应） 串口配置（SerialPanel 侧栏） - ✅ 端口选择 + 刷新、波特率（9600~1382400 预设 9 档）、数据位 5/6/7/8、停止位 1/1.5/2、校验 无/奇/偶 - ✅ RTS / DTR 控制 - ✅ 打开/关闭串口（红绿指示灯，XCOM 同款）、参数摘要行（COM3 115200 8N1 风格） 接收显示区 - ✅ 16进制显示 ↔ 文本互转（切换时已收数据整体重渲染） - ✅ 时间戳前缀（秒级） - ✅ 黑底白字（默认）/ 白底黑字切换 - ✅ 停止显示/恢复（暂停期间统计照常、恢复不补显——XCOM 行为）、接收显示开关 - ✅ 清除接收、保存窗口（文件对话框，HEX/时间戳格式可选，UTF-8 落盘） - ✅ 行不折断 + 横向滚动条、鼠标拖选任意字符区间 + Ctrl+C、自动跟随最新（上翻查看历史时暂停跟随） - ✅ 只显示 RX（发送不回显，XCOM 同款） 发送区（单条/多条 TabBar） - ✅ 单条：文本/HEX 发送、发送新行（\\r\\n，HEX 模式禁用）、定时发送 + 周期 10~60000ms、Ctrl+Enter 发送、清除发送 - ✅ 多条：每页 20 条（10 行 × 2 列）、页数动态增删（首页/上一页/下一页/尾页 + 添加页/删除页）、行内\"循环\"勾选（加入循环队列）、底部全局 HEX 开关、循环发送 + 周期、发送新行 - ✅ 多条发送内容自动持久化（%APPDATA%\\CommTools\\debugpage.ini，500ms 防抖，退出兜底）——优于 XCOM 的手动保存 状态栏 - ✅ 连接指示灯、S/R 收发字节计数（双击清零）、CTS/DSR/DCD 实时状态、系统时间时钟 优于 XCOM 的实现 - seq 增量同步 + 5000 条上限 + 250 条裁剪迟滞（避免每批整体重建） - 多条发送配置含单条发送状态统一 ini 自动保存（XCOM 需手动导出/导入） - 暂停/恢复基于后端单调 seq，高频流下不丢帧不错位 未实现 / 差异（XCOM 有） 功能 说明 建议 --------------------- 1 发送文件 XCOM 可选择文件按 HEX/文本发出 补充：QFileDialog + 分块发送（注意大文件流控） 2 编码选择 XCOM 支持 GBK/UTF-8 等编码收发；当前文本仅 UTF-8（sendData/sendHexData） 补充：QStringDecoder/Encoder 切换，AT 调试 GBK 场景有用 3 自定义波特率 波特率仅预设 9 档 ComboBox，不可手输 补充：editable ComboBox 4 毫秒级时间戳 当前秒级；XCOM 为 hh:mm:ss.zzz 低成本增强：后端日志时间戳加 .zzz 5 行为差异：清除接收同时重置 S/R 计数 XCOM 清显示不清计数 保持或拆分为两个按钮，二选一 相关实现要点（复踩坑） - TextArea 在 Qt6 必须包 ScrollView 滚动；贴底判断/强制贴底须驱动其内部 Flickable 的 contentY - 外置 ScrollBar 声明会覆盖 Basic 样式内置实例，必须复刻 parent/x/y/height 定位绑定 - 多条发送键 = \"页.条目\"，删除页时后页数据整体前移；QVariantMap 键清洗风险 → JSON 字符串存储 - 定时/循环发送 Timer 恢复须显式 start()（checked 绑定只刷 UI 不启动）","content":"# DebugPage 与 ATK-XCOM 功能对照报告（2026-10-10）\n\n对象：`Code/CommTools/View/Component/DebugPage.qml`（1212 行）+ `SerialPanel.qml` + Main/CommViewModel。\n对照基准：正点原子 ATK-XCOM 2.x。\n\n## 结论\n\n**核心功能全覆盖，且有数处优于 XCOM 的实现；缺 4 项 XCOM 功能（发送文件、编码选择、自定义波特率输入、毫秒级时间戳），1 处行为差异（清除接收同时清零 S/R 计数）。**\n\n## 已实现（与 XCOM 对应）\n\n### 串口配置（SerialPanel 侧栏）\n- ✅ 端口选择 + 刷新、波特率（9600~1382400 预设 9 档）、数据位 5/6/7/8、停止位 1/1.5/2、校验 无/奇/偶\n- ✅ RTS / DTR 控制\n- ✅ 打开/关闭串口（红绿指示灯，XCOM 同款）、参数摘要行（COM3 115200 8N1 风格）\n\n### 接收显示区\n- ✅ 16进制显示 ↔ 文本互转（切换时已收数据整体重渲染）\n- ✅ 时间戳前缀（秒级）\n- ✅ 黑底白字（默认）/ 白底黑字切换\n- ✅ 停止显示/恢复（暂停期间统计照常、恢复不补显——XCOM 行为）、接收显示开关\n- ✅ 清除接收、保存窗口（文件对话框，HEX/时间戳格式可选，UTF-8 落盘）\n- ✅ 行不折断 + 横向滚动条、鼠标拖选任意字符区间 + Ctrl+C、自动跟随最新（上翻查看历史时暂停跟随）\n- ✅ 只显示 RX（发送不回显，XCOM 同款）\n\n### 发送区（单条/多条 TabBar）\n- ✅ 单条：文本/HEX 发送、发送新行（\\r\\n，HEX 模式禁用）、定时发送 + 周期 10~60000ms、Ctrl+Enter 发送、清除发送\n- ✅ 多条：每页 20 条（10 行 × 2 列）、页数动态增删（首页/上一页/下一页/尾页 + 添加页/删除页）、行内\"循环\"勾选（加入循环队列）、底部全局 HEX 开关、循环发送 + 周期、发送新行\n- ✅ 多条发送内容自动持久化（%APPDATA%\\CommTools\\debugpage.ini，500ms 防抖，退出兜底）——优于 XCOM 的手动保存\n\n### 状态栏\n- ✅ 连接指示灯、S/R 收发字节计数（双击清零）、CTS/DSR/DCD 实时状态、系统时间时钟\n\n### 优于 XCOM 的实现\n- seq 增量同步 + 5000 条上限 + 250 条裁剪迟滞（避免每批整体重建）\n- 多条发送配置含单条发送状态统一 ini 自动保存（XCOM 需手动导出/导入）\n- 暂停/恢复基于后端单调 seq，高频流下不丢帧不错位\n\n## 未实现 / 差异（XCOM 有）\n\n| # | 功能 | 说明 | 建议 |\n|---|------|------|------|\n| 1 | 发送文件 | XCOM 可选择文件按 HEX/文本发出 | 补充：QFileDialog + 分块发送（注意大文件流控） |\n| 2 | 编码选择 | XCOM 支持 GBK/UTF-8 等编码收发；当前文本仅 UTF-8（sendData/sendHexData） | 补充：QStringDecoder/Encoder 切换，AT 调试 GBK 场景有用 |\n| 3 | 自定义波特率 | 波特率仅预设 9 档 ComboBox，不可手输 | 补充：editable ComboBox |\n| 4 | 毫秒级时间戳 | 当前秒级；XCOM 为 hh:mm:ss.zzz | 低成本增强：后端日志时间戳加 .zzz |\n| 5 | 行为差异：清除接收同时重置 S/R 计数 | XCOM 清显示不清计数 | 保持或拆分为两个按钮，二选一 |\n\n## 相关实现要点（复踩坑）\n\n- TextArea 在 Qt6 必须包 ScrollView 滚动；贴底判断/强制贴底须驱动其内部 Flickable 的 contentY\n- 外置 ScrollBar 声明会覆盖 Basic 样式内置实例，必须复刻 parent/x/y/height 定位绑定\n- 多条发送键 = \"页.条目\"，删除页时后页数据整体前移；QVariantMap 键清洗风险 → JSON 字符串存储\n- 定时/循环发送 Timer 恢复须显式 start()（checked 绑定只刷 UI 不启动）\n"},{"hash":"QT-Tools/Doc/协议开发规范.md","title":"协议开发规范","relPath":"QT-Tools/Doc/协议开发规范.md","desc":"协议开发规范 1. 概述 本文档定义了 IMU 协议开发的标准规范，包括协议文档编写规范和代码实现规范。","created":"","updated":"","tags":[],"sizeKB":13.9,"_text":"协议开发规范 1. 概述 本文档定义了 IMU 协议开发的标准规范，包括协议文档编写规范和代码实现规范。遵循此规范可以快速完成新协议的添加或现有协议的修改。 --- 2. 协议文档编写规范 2.1 文档结构 协议文档必须包含以下章节： 章节 标题 内容要求 ---------------------- 3.2.2 输入有效数据定义规则 指令总览表 3.2.3.X 指令详细定义 每个指令的发送/回复结构 2.2 指令总览表格式 位置: 表格必须包含以下列： 报文ID 名称 Cmd SubId 支持操作 ------------------------------------ 0x00 0x03 版本查询 0 0x03 查询 0x00 0x04 传感器数据推送频率设置与查询 0 0x04 查询/RAM/FLASH ... ... ... ... ... 规范要求: - 报文ID第二字节（SubId）必须使用十六进制表示（如 、 ） - Cmd 值使用十进制（0 或 1） - 支持操作从以下选项中选择：查询、RAM、FLASH、查询/RAM、查询/FLASH、查询/RAM/FLASH 2.3 指令详细定义格式 位置: 每个指令必须包含以下内容： 2.3.1 发送结构 字段 偏移 长度 类型 说明 ------------------------------ DATA1 7 1 unsigned char 开关状态 DATA2 8 1 unsigned char PPS模式 Reserved 9 8 unsigned char8 预留 CRC16 17 2 unsigned short 2.3.2 回复结构 字段 偏移 长度 类型 说明 ------------------------------ DATA1 6 1 unsigned char 开关状态 DATA2 7 1 unsigned char PPS模式 Reserved 8 8 unsigned char8 预留 CRC16 16 2 unsigned short 规范要求: - 偏移从 0 开始计数 - 类型必须使用标准 C 类型（unsigned char, unsigned short, unsigned int, float 等） - 预留字段必须标注 - 必须包含 CRC16 字段 --- 3. 代码实现规范 3.1 文件位置 文件 职责 ------------ 定义数据结构 实现指令注册、发送、接收处理 3.2 结构体定义规范 位置: 命名规则: 格式要求: - 使用 语法 - 必须包含 字段 - 字段顺序与协议文档一致 - 最后必须包含 字段 - 使用 和 确保字节对齐 示例: 3.3 指令注册规范 位置: 格式要求: - 使用 注册指令 - 必须使用十六进制值 - 为显示序号（十进制，按顺序递增） - 和 使用 包装 示例: 3.4 发送数据构建规范 位置: 格式要求: - 值 必须使用十六进制 - 根据协议文档的发送结构构建 payload - 预留字段填 0 - 返回 示例: 3.5 回调数据处理规范 位置: 格式要求: - 值 必须使用十六进制 - 使用对应结构体解析数据 - 格式化输出文本，包含类型名称、字段值、CRC16 - 预留字段显示为十六进制 示例: --- 4. 新增指令标准流程 4.1 步骤清单 4.2 模板代码 模板1：结构体定义 模板2：指令注册 模板3：发送数据构建 模板4：回调数据处理 --- 5. 命名规范 5.1 结构体命名 规则 示例 ------------ Hex{名称缩写}{Cmd}{SubId}S HexPPS0012S 名称缩写使用大写 PPS, IMU, CAN, UART Cmd 和 SubId 使用两位十六进制 00, 01, 11, 12 5.2 变量命名 规则 示例 ------------ 结构体实例使用小写 , 数组名使用复数 , 布尔值使用 is/has 前缀 , 5.3 注释规范 规则 示例 ------------ 结构体上方添加 字段使用 注释 case 语句添加注释 --- 6. 常见错误与排查 6.1 错误分类 错误类型 表现 常见原因 -------------------------- 编译错误 结构体未定义 忘记在 DataParser.h 中定义 运行时退出 程序启动后立即退出 SubId 使用了十进制 指令不匹配 发送后无响应 case 值与注册的 subId 不一致 数据解析错误 显示数据异常 结构体字段顺序/大小与协议不一致 6.2 排查清单 --- 7. 协议版本管理 7.1 修改记录 当协议文档更新时，需记录以下信息： 修改日期 修改内容 影响文件 ------------------------------ 2026-07-16 新增 PPS开关控制指令 DataParser.h, CommandViewModel.cpp 2026-10-10 修复 0x19 回复按协议(头部+预留+CRC16)解析、0x11 载荷字节序(报文ID原值输入)、0x01 0x03 电量显示文案；0x19 条目名更正为时间设置 CommandViewModel.cpp ... ... ... 7.2 兼容性处理 - 新增指令：按标准流程添加，不影响现有功能 - 修改指令：检查是否需要保留旧版本兼容 - 删除指令：标记为废弃，保留代码但不再注册 --- 8. 现有指令参考 8.1 已实现指令 报文ID 名称 结构体 buildPayload handleReceivedData ------------------------------------------------------- 0x00 0x03 版本查询 VisonPacket ✅ ✅ 0x00 0x04 传感器数据推送频率 HzPacket ✅ ✅ 0x00 0x05 修改蓝牙名称 SnPacket ✅ ✅ 0x00 0x06 算法模式查询与设置 AlgorithmPacket ✅ ✅ 0x00 0x07 当前数据推送状态配置/查询 APacket ✅ ✅ 0x00 0x08 磁力计校准 APacket ✅ ✅ 0x00 0x11 推送报文ID控制 HexMsgID0011S ✅ ✅ 0x00 0x12 PPS开关控制 HexPPS0012S ✅ ✅ 0x00 0x14 复位重启 HexReset0014S ✅ ✅ 0x00 0x15 IMU坐标系设置 HexImuCoordinate0015S ✅ ✅ 0x00 0x16 串口波特率设置与查询 HexRecvUart0016S ✅ ✅ 0x00 0x17 CAN波特率设置与查询 HexCanBaudRate0017S ✅ ✅ 0x00 0x18 SN号查询 HexSN0018S ✅ ✅ 0x00 0x19 时间设置 HexDateTime0019S ✅ ✅ 0x00 0x20 零偏校准 HexZeroOffset0020S ✅ ✅ 0x01 0x01 A值查询与设置 APacket ✅ ✅ 0x01 0x03 电池电量查询 PowerPacket ✅ ✅ --- 9. 注意事项 1. 十六进制一致性：所有 SubId 必须使用十六进制表示（如 ），禁止使用十进制（如 ） 2. 结构体对齐：使用 确保字节对齐 3. 字段顺序：结构体字段顺序必须与协议文档一致 4. 字节序：协议使用小端格式，注意多字节字段的解析 5. 预留字段：发送时填0，接收时可显示为十六进制 6. CRC16：回复数据中包含 CRC16 校验，需验证或显示 7. 编译验证：每次修改后必须编译运行验证","content":"# 协议开发规范\n\n## 1. 概述\n\n本文档定义了 IMU 协议开发的标准规范，包括协议文档编写规范和代码实现规范。遵循此规范可以快速完成新协议的添加或现有协议的修改。\n\n---\n\n## 2. 协议文档编写规范\n\n### 2.1 文档结构\n\n协议文档必须包含以下章节：\n\n| 章节 | 标题 | 内容要求 |\n|------|------|----------|\n| 3.2.2 | 输入有效数据定义规则 | 指令总览表 |\n| 3.2.3.X | 指令详细定义 | 每个指令的发送/回复结构 |\n\n### 2.2 指令总览表格式\n\n**位置**: `3.2.2 输入有效数据定义规则`\n\n表格必须包含以下列：\n\n| 报文ID | 名称 | Cmd | SubId | 支持操作 |\n|--------|------|-----|-------|----------|\n| 0x00 0x03 | 版本查询 | 0 | 0x03 | 查询 |\n| 0x00 0x04 | 传感器数据推送频率设置与查询 | 0 | 0x04 | 查询/RAM/FLASH |\n| ... | ... | ... | ... | ... |\n\n**规范要求**:\n- 报文ID第二字节（SubId）**必须使用十六进制**表示（如 `0x03`、`0x11`）\n- Cmd 值使用十进制（0 或 1）\n- 支持操作从以下选项中选择：查询、RAM、FLASH、查询/RAM、查询/FLASH、查询/RAM/FLASH\n\n### 2.3 指令详细定义格式\n\n**位置**: `3.2.3.X 指令名称`\n\n每个指令必须包含以下内容：\n\n#### 2.3.1 发送结构\n\n| 字段 | 偏移 | 长度 | 类型 | 说明 |\n|------|------|------|------|------|\n| DATA1 | 7 | 1 | unsigned char | 开关状态 |\n| DATA2 | 8 | 1 | unsigned char | PPS模式 |\n| Reserved | 9 | 8 | unsigned char[8] | 预留 |\n| CRC16 | 17 | 2 | unsigned short | |\n\n#### 2.3.2 回复结构\n\n| 字段 | 偏移 | 长度 | 类型 | 说明 |\n|------|------|------|------|------|\n| DATA1 | 6 | 1 | unsigned char | 开关状态 |\n| DATA2 | 7 | 1 | unsigned char | PPS模式 |\n| Reserved | 8 | 8 | unsigned char[8] | 预留 |\n| CRC16 | 16 | 2 | unsigned short | |\n\n**规范要求**:\n- 偏移从 0 开始计数\n- 类型必须使用标准 C 类型（unsigned char, unsigned short, unsigned int, float 等）\n- 预留字段必须标注 `Reserved`\n- 必须包含 CRC16 字段\n\n---\n\n## 3. 代码实现规范\n\n### 3.1 文件位置\n\n| 文件 | 职责 |\n|------|------|\n| `bsp/Help/DataParser.h` | 定义数据结构 |\n| `ViewModel/CommandViewModel.cpp` | 实现指令注册、发送、接收处理 |\n\n### 3.2 结构体定义规范\n\n**位置**: `bsp/Help/DataParser.h`\n\n**命名规则**: `Hex{名称缩写}{Cmd}{SubId}_S`\n\n**格式要求**:\n- 使用 `typedef struct` 语法\n- 必须包含 `user_head_t head` 字段\n- 字段顺序与协议文档一致\n- 最后必须包含 `quint16 Crc16` 字段\n- 使用 `#pragma pack(push, 1)` 和 `#pragma pack(pop)` 确保字节对齐\n\n**示例**:\n\n```cpp\n/* PPS开关控制 0012 */\ntypedef struct\n{\n    user_head_t head;   ///< 协议头部\n    quint8 CtrlStatus;  ///< PPS开关状态 0:关闭 1:开启\n    quint8 PPSMode;     ///< PPS模式 0:无效 1:PPS校准内部时间戳\n    quint8 Reserved[8]; ///< 预留\n    quint16 Crc16;      ///< CRC16校验\n} HexPPS0012_S, *pHexPPS0012_S;\n```\n\n### 3.3 指令注册规范\n\n**位置**: `CommandViewModel.cpp initCommands()`\n\n**格式要求**:\n- 使用 `QVariantMap` 注册指令\n- `subId` **必须使用十六进制**值\n- `id` 为显示序号（十进制，按顺序递增）\n- `label` 和 `description` 使用 `QString::fromUtf8()` 包装\n\n**示例**:\n\n```cpp\ngroup0.append(QVariantMap{\n    {\"id\", 18}, \n    {\"label\", QString::fromUtf8(\"PPS开关控制\")}, \n    {\"cmd\", 0}, \n    {\"subId\", 0x12},   // ⚠️ 必须使用十六进制\n    {\"description\", QString::fromUtf8(\"PPS开关控制\")}\n});\n```\n\n### 3.4 发送数据构建规范\n\n**位置**: `CommandViewModel.cpp buildPayload(quint8 cmd, quint8 id)`\n\n**格式要求**:\n- `case` 值 **必须使用十六进制**\n- 根据协议文档的发送结构构建 payload\n- 预留字段填 0\n- 返回 `QByteArray`\n\n**示例**:\n\n```cpp\ncase 0x12:  // ⚠️ 必须使用十六进制\n{\n    QByteArray payload(10, 0);\n    payload[0] = static_cast<char>(data1Value & 0xFF);\n    quint8 data2Value = parseHexValue(m_selectedData2);\n    payload[1] = static_cast<char>(data2Value & 0xFF);\n    return payload;\n}\n```\n\n### 3.5 回调数据处理规范\n\n**位置**: `CommandViewModel.cpp handleReceivedData(quint8 cmd, quint8 id, const QByteArray &data)`\n\n**格式要求**:\n- `case` 值 **必须使用十六进制**\n- 使用对应结构体解析数据\n- 格式化输出文本，包含类型名称、字段值、CRC16\n- 预留字段显示为十六进制\n\n**示例**:\n\n```cpp\ncase 0x12:  // ⚠️ 必须使用十六进制\n{\n    HexPPS0012_S ppsPacket = CommImpl::ByteArrayToStructure<HexPPS0012_S>(data);\n    text += QString::fromUtf8(\"【类型】: PPS开关控制\\n\");\n    text += QString::fromUtf8(\"开关状态: %1\\n\").arg(ppsPacket.CtrlStatus == 1 ? QString::fromUtf8(\"开启\") : QString::fromUtf8(\"关闭\"));\n    text += QString::fromUtf8(\"PPS模式: %1\\n\").arg(ppsPacket.PPSMode == 1 ? QString::fromUtf8(\"PPS校准内部时间戳\") : QString::fromUtf8(\"无效\"));\n    QByteArray reservedData(reinterpret_cast<const char *>(ppsPacket.Reserved), 8);\n    QString reservedHex = reservedData.toHex().toUpper();\n    text += QString::fromUtf8(\"预留: %1\\n\").arg(reservedHex);\n    text += QString::fromUtf8(\"CRC16:    0x%1\\n\").arg(ppsPacket.Crc16, 4, 16, QChar('0')).toUpper();\n    break;\n}\n```\n\n---\n\n## 4. 新增指令标准流程\n\n### 4.1 步骤清单\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│ 1. 阅读协议文档                                             │\n│    找到指令总览表和详细定义章节                              │\n└─────────────────────────────────────────────────────────────┘\n                            ↓\n┌─────────────────────────────────────────────────────────────┐\n│ 2. 在 DataParser.h 中定义结构体                             │\n│    按照命名规则 Hex{名称缩写}{Cmd}{SubId}_S                 │\n└─────────────────────────────────────────────────────────────┘\n                            ↓\n┌─────────────────────────────────────────────────────────────┐\n│ 3. 在 CommandViewModel.cpp initCommands() 中注册指令        │\n│    subId 必须使用十六进制                                   │\n└─────────────────────────────────────────────────────────────┘\n                            ↓\n┌─────────────────────────────────────────────────────────────┐\n│ 4. 在 CommandViewModel.cpp buildPayload() 中处理发送数据     │\n│    case 值必须使用十六进制                                   │\n└─────────────────────────────────────────────────────────────┘\n                            ↓\n┌─────────────────────────────────────────────────────────────┐\n│ 5. 在 CommandViewModel.cpp handleReceivedData() 中处理回调   │\n│    case 值必须使用十六进制                                   │\n└─────────────────────────────────────────────────────────────┘\n                            ↓\n┌─────────────────────────────────────────────────────────────┐\n│ 6. 编译运行验证                                             │\n│    确保无编译错误，程序正常启动运行                          │\n└─────────────────────────────────────────────────────────────┘\n```\n\n### 4.2 模板代码\n\n#### 模板1：结构体定义\n\n```cpp\n/* {指令名称} {Cmd}{SubId} */\ntypedef struct\n{\n    user_head_t head;   ///< 协议头部\n    // 按协议文档顺序添加字段\n    quint8 Reserved[8]; ///< 预留\n    quint16 Crc16;      ///< CRC16校验\n} Hex{名称缩写}{Cmd}{SubId}_S, *pHex{名称缩写}{Cmd}{SubId}_S;\n```\n\n#### 模板2：指令注册\n\n```cpp\ngroup{Cmd}.append(QVariantMap{\n    {\"id\", 显示序号}, \n    {\"label\", QString::fromUtf8(\"{指令名称}\")}, \n    {\"cmd\", {Cmd}}, \n    {\"subId\", 0x{SubId}},   // ⚠️ 必须使用十六进制\n    {\"description\", QString::fromUtf8(\"{描述}\")}\n});\n```\n\n#### 模板3：发送数据构建\n\n```cpp\ncase 0x{SubId}:  // ⚠️ 必须使用十六进制\n{\n    QByteArray payload({长度}, 0);\n    // 设置数据字段\n    return payload;\n}\n```\n\n#### 模板4：回调数据处理\n\n```cpp\ncase 0x{SubId}:  // ⚠️ 必须使用十六进制\n{\n    Hex{名称缩写}{Cmd}{SubId}_S packet = CommImpl::ByteArrayToStructure<Hex{名称缩写}{Cmd}{SubId}_S>(data);\n    text += QString::fromUtf8(\"【类型】: {指令名称}\\n\");\n    // 格式化输出字段值\n    text += QString::fromUtf8(\"CRC16:    0x%1\\n\").arg(packet.Crc16, 4, 16, QChar('0')).toUpper();\n    break;\n}\n```\n\n---\n\n## 5. 命名规范\n\n### 5.1 结构体命名\n\n| 规则 | 示例 |\n|------|------|\n| Hex{名称缩写}{Cmd}{SubId}_S | HexPPS0012_S |\n| 名称缩写使用大写 | PPS, IMU, CAN, UART |\n| Cmd 和 SubId 使用两位十六进制 | 00, 01, 11, 12 |\n\n### 5.2 变量命名\n\n| 规则 | 示例 |\n|------|------|\n| 结构体实例使用小写 | `ppsPacket`, `canPacket` |\n| 数组名使用复数 | `Acceleration`, `Reserved` |\n| 布尔值使用 is/has 前缀 | `IsValid`, `CtrlStatus` |\n\n### 5.3 注释规范\n\n| 规则 | 示例 |\n|------|------|\n| 结构体上方添加 `/* 指令名称 CmdSubId */` | `/* PPS开关控制 0012 */` |\n| 字段使用 `///` 注释 | `///< PPS开关状态 0:关闭 1:开启` |\n| case 语句添加注释 | `case 0x12: /* PPS开关控制 */` |\n\n---\n\n## 6. 常见错误与排查\n\n### 6.1 错误分类\n\n| 错误类型 | 表现 | 常见原因 |\n|----------|------|----------|\n| 编译错误 | 结构体未定义 | 忘记在 DataParser.h 中定义 |\n| 运行时退出 | 程序启动后立即退出 | SubId 使用了十进制 |\n| 指令不匹配 | 发送后无响应 | case 值与注册的 subId 不一致 |\n| 数据解析错误 | 显示数据异常 | 结构体字段顺序/大小与协议不一致 |\n\n### 6.2 排查清单\n\n```\n□ 检查所有 case 语句是否使用十六进制（如 case 0x11）\n□ 检查 initCommands() 中 subId 是否使用十六进制（如 0x11）\n□ 检查结构体字段顺序是否与协议文档一致\n□ 检查结构体字段类型和长度是否与协议文档一致\n□ 检查 CRC16 字段是否在最后\n□ 检查是否包含 user_head_t head 字段\n□ 检查是否使用 #pragma pack(push, 1)\n```\n\n---\n\n## 7. 协议版本管理\n\n### 7.1 修改记录\n\n当协议文档更新时，需记录以下信息：\n\n| 修改日期 | 修改内容 | 影响文件 |\n|----------|----------|----------|\n| 2026-07-16 | 新增 PPS开关控制指令 | DataParser.h, CommandViewModel.cpp |\n| 2026-10-10 | 修复 0x19 回复按协议(头部+预留+CRC16)解析、0x11 载荷字节序(报文ID原值输入)、0x01 0x03 电量显示文案；0x19 条目名更正为时间设置 | CommandViewModel.cpp |\n| ... | ... | ... |\n\n### 7.2 兼容性处理\n\n- 新增指令：按标准流程添加，不影响现有功能\n- 修改指令：检查是否需要保留旧版本兼容\n- 删除指令：标记为废弃，保留代码但不再注册\n\n---\n\n## 8. 现有指令参考\n\n### 8.1 已实现指令\n\n| 报文ID | 名称 | 结构体 | buildPayload | handleReceivedData |\n|--------|------|--------|--------------|-------------------|\n| 0x00 0x03 | 版本查询 | VisonPacket | ✅ | ✅ |\n| 0x00 0x04 | 传感器数据推送频率 | HzPacket | ✅ | ✅ |\n| 0x00 0x05 | 修改蓝牙名称 | SnPacket | ✅ | ✅ |\n| 0x00 0x06 | 算法模式查询与设置 | AlgorithmPacket | ✅ | ✅ |\n| 0x00 0x07 | 当前数据推送状态配置/查询 | APacket | ✅ | ✅ |\n| 0x00 0x08 | 磁力计校准 | APacket | ✅ | ✅ |\n| 0x00 0x11 | 推送报文ID控制 | HexMsgID0011_S | ✅ | ✅ |\n| 0x00 0x12 | PPS开关控制 | HexPPS0012_S | ✅ | ✅ |\n| 0x00 0x14 | 复位重启 | HexReset0014_S | ✅ | ✅ |\n| 0x00 0x15 | IMU坐标系设置 | HexImuCoordinate0015_S | ✅ | ✅ |\n| 0x00 0x16 | 串口波特率设置与查询 | HexRecvUart0016_S | ✅ | ✅ |\n| 0x00 0x17 | CAN波特率设置与查询 | HexCanBaudRate0017_S | ✅ | ✅ |\n| 0x00 0x18 | SN号查询 | HexSN0018_S | ✅ | ✅ |\n| 0x00 0x19 | 时间设置 | HexDateTime0019_S | ✅ | ✅ |\n| 0x00 0x20 | 零偏校准 | HexZeroOffset0020_S | ✅ | ✅ |\n| 0x01 0x01 | A值查询与设置 | APacket | ✅ | ✅ |\n| 0x01 0x03 | 电池电量查询 | PowerPacket | ✅ | ✅ |\n\n---\n\n## 9. 注意事项\n\n1. **十六进制一致性**：所有 SubId 必须使用十六进制表示（如 `0x11`），**禁止使用十进制**（如 `17`）\n2. **结构体对齐**：使用 `#pragma pack(push, 1)` 确保字节对齐\n3. **字段顺序**：结构体字段顺序必须与协议文档一致\n4. **字节序**：协议使用小端格式，注意多字节字段的解析\n5. **预留字段**：发送时填0，接收时可显示为十六进制\n6. **CRC16**：回复数据中包含 CRC16 校验，需验证或显示\n7. **编译验证**：每次修改后必须编译运行验证"},{"hash":"QT-Tools/Doc/波形页优化报告.md","title":"波形页优化报告","relPath":"QT-Tools/Doc/波形页优化报告.md","desc":"实时波形页优化报告（2026-10-10） 用户反馈两个问题：①软件运行一段时间后卡顿；②波形页 Y 轴量程固定，看不出实时变化。","created":"","updated":"","tags":[],"sizeKB":20.7,"_text":"实时波形页优化报告（2026-10-10） 用户反馈两个问题：①软件运行一段时间后卡顿；②波形页 Y 轴量程固定，看不出实时变化。 本文档记录根因、修复方案与实测证据。gitee 提交：波形页重构（develop，2026-10-10）。 一、卡顿根因（三个，全部修复） 1. rebuildNeeded 全清重建尖峰（主因） - 后端 存储裁剪到 1500 点后发 ， 旧 QML 收到后 清空全部 series，下一 tick 一次性重建 4 图 × 3 系 × 1500 点 = 1.8 万点 → 主线程阻塞尖峰。 - 修复： 改为整窗重绘（同一 JS 块内 ， 场景图只同步一次）。裁剪对组件透明， 监听整个删除。 2. remove(0,n) 前删 O(n) - 旧代码每 tick 追加新点后从 series 头部删除旧点（O(n) 搬移+整缓冲重传）。 - 修复：整窗重绘天然消除索引/前删状态。 3. DebugPage 隐藏页日志全量过滤（设备场景） - DebugPage 位于 StackLayout（非 Loader）， 对 （QVariantMap 列表）做 O(上限) 全量过滤+JS 重建，无可见性守卫。 设备 50Hz 推流时即使停在波形页也被逐帧唤醒——\"运行一段时间后卡顿\"的来源 （日志滚动窗口填满后成本恒定在满量）。 - 修复： + 补同步 （seq 增量机制天然支持，切回页面看到离开期间的全部日志，XCOM 行为不变）。 二、Y 轴固定 → 自适应 - 旧：固定量程（角速度 ±500°/s、静态噪声 ±1°/s 仅占画布 0.2% → 视觉直线）。 - 新： （默认开）——可见窗口数据 min/max + 15% 边距，吸附 1-2-5 nice 刻度 （约 4 主刻度），迟滞策略：数据越界立即扩、范围大于目标 2.5 倍才缩，避免轴抖动。 - 图例带实时数值（彩色等宽字体），网格线可见，线宽 2px，Y 轴标签精度随量程自适应 （≥200 → %.0f、≥20 → %.1f、否则 %.2f）。一键\"自适应Y:开/关\"切回固定量程。 - 自适应数学已用运行时插桩逐字验证：数据 -3.75,2.98→轴-5,5、-4.12,9.11→-10,15、 -75.0,49.6→-100,100。 - X 窗口自适应： ，启动初期自动放大细节。 三、顺带修复：模拟数据 float 精度 bug 用 （epoch 秒 ≈1.79e9，float 步长 128s） → 所有模拟值恒定、曲线为水平直线。改为相对时间基准 ； yaw 由无界斜坡 改为 。 四、实测证据（同机 30s / 模拟 100Hz / QSGRENDERTIMING） 指标 旧代码 新代码 --------- sync（主线程阻塞）≥10ms 次数 15 2（含启动 1 次） sync ≥20ms 11 1（启动） sync p99 8ms 4ms 稳态 sync 最大 32ms ~5ms sync 平均 0.64ms 0.63ms render 平均 1.25ms 2.06ms（整窗重传的 GPU 代价，不阻塞 UI） - 旧代码尖峰节奏 ≈ 每 2s 一次（对应 rebuild 周期），稳态突发簇 21-32ms。 - 抓屏像素分析：旧=各系列单条 40px 扁平线；新=曲线纵向铺开 ~100px/230px 画区（≈43%， 与 ±5 数据在 ±10 nice 量程的预期 50% 吻合）。 - 证据 PNG（开发机 workspace）： （旧·平线）、 （新·自适应波形）。 五、自测钩子（回归验证用） 注意：QML 调 C++ setter 须用属性赋值（ 走 QPROPERTY WRITE）， 直接调 会因非 QINVOKABLE 抛 TypeError（曾致测试空跑，已踩坑）。 另：QML 不允许给未声明属性赋值（\"Cannot assign to non-existent property\"）。 六、遗留 - COM8 实机体验建议用户确认（GUI 无法自动开串口自测；模拟路径与实机共用同一渲染管线， 且数据率更高）。 - DebugPage 可见时的日志链路仍是 O(上限) 过滤/次——可改为增量 信号， 列为后续优化项。 七、用户反馈迭代（同日 12:38） 1. Y 轴标题与刻度值重叠：移除 axisY 的 ，单位并入卡片标题 （如“角速度实时曲线 (°/s)”），彻底消除重叠并释放绘图区宽度（gitee f7d37e8）。 2. 去掉自适应切换按钮：Y 轴自适应为唯一行为；顺带清理 yMin/yMax/yAxisLabel/ autoScaleY 冗余属性与固定量程分支（注意：删除 QML 属性必须同步删除 MainView 委托 里的同名绑定，否则 Cannot assign to non-existent property 导致整页加载失败）。 八、用户反馈迭代三（同日 12:41）：X/Y 轴刻度字号自适应 诉求：全部展开时轴文字部分看不清。排查发现两层根因： 1. QtGraphs 2D 轴无 labelFont 属性（QAbstractAxis 只有 labelDelegate: Component）。 刻度文字样式须经 设置； 官方文档：delegate 应为 Text 或含 （框架对其赋值）。 2. GraphsView 刻度拥挤时会整行隐藏：窗口 1200×800 四图全展开（每图 ~150px）时 默认固定字号刻度全部被隐藏（debug.log 证实 delegate 实例 vis=false）——这才是 “看不清”的根源；1920×1040 下同密度刻度正常渲染。 修复（gitee 1756dd0）： - ，X/Y 轴共用； 全部展开→9px 保刻度不被隐藏；单图放大→16px。深灰 475569 提升白底对比度。 - main.cpp 自测钩子新增 （如 1920x1040）验证不同布局。 - 验证：1920×1040 抓屏 Y 标签带 18-21 物理 px（≈13 逻辑 px，与公式吻合）、 1200×800 下更小更少（GraphsView 拥挤管理），两尺寸 0 QML 错误。 踩坑记录： - delegate 在窗口构建期创建（此时 graphsView.height=0，字号绑定初始为下限）， 字号须用绑定而非创建期快照，布局完成后自动更新；框架后续夏用实例并赋 text （630 次 text 更新 vs 96 次创建）。 - 像素验证脚本必须按 DPR 换算物理坐标（本机 grab：1920×1040→2884×1760=DPR1.5； 1200×800→2400×1600=DPR2），否则窗口错位全部扫空。 - GraphsView 红色曲线(EF4444)会命中“红色文字”像素判定（R170,G<90,B<90）， 探针配色需避开系列色（纯蓝0000FF 可与系列蓝3B82F6 区分：G 通道 0 vs 130）。 九、用户反馈迭代四（同日 13:25）：Hex页接收区显示不全 + 波形页自选报文源 诉求①：HexCommands 页接收区数据显示不全 - 根因：原代码把 ScrollBar 直接挂在 TextArea 上，但 TextArea 并非 Flickable （无 contentY/contentHeight）——滚动条是死的，超出视口的长文本被 clip 直接裁掉， 无法滚动查看。（验证：给 TextArea 写 onContentYChanged 直接报 ，编译期坐实。） - C++ 侧叠加因素：推送模式下 整帧替换 （50Hz 只显示最新一帧），多行帧文本在替换间隙根本读不完。 - 修复（gitee 87e9f74）： 1. Flickable 包裹 + 附加属性（Qt 文档标准结构） ——滚动真正生效，ScrollBar 挂在 Flickable 上； 2. 自动跟随：新内容到达时滚到底部（Qt.callLater 等布局完成）， 用户上翻阅读时暂停跟随（onContentYChanged 更新 followTail）； 3. “暂停显示”冻结按钮：定格当前文本便于读完整帧，数据仍在后台接收解析。 诉求②：波形页直接选择报文源（不依赖 Hex 页配置） - 协议 3.2.3.7：推送报文ID控制 = 0x00 0x11 帧，DATA1=CMD、DATA2=ID、DATA3=开关； 可控报文 0x0001/0x0002/0x0010/0x0013。 - 新增 ：不读 Hex 页的 mselectedData1/Data2/Op，独立构帧（OP 固定 0x01 = 配置到 RAM，运行时生效不保存）。 - MainView 波形页头部新增：数据源 ComboBox（0x0010/0x0001/0x0013）+ 停止推送按钮。 切换时先关其它传感器源再开目标源——多源同时推送会交错 addDataPoint 致波形混叠； 0x0002 设备状态未列入（图表不消费）。 - 注意：sendPushIdControl 与 sendCommand 一样会清空接收区等待应答， Hex 页暂停显示的冻结快照不受影响。 十、主图数据页三格式保存 / 波形页推送开关 / 串口记忆（2026-10-10） 诉求①：主图数据页数据记录与 CSV/TXT/MAT 保存 - 为什么加录制器：图表缓冲是 1500 点滚动窗口（超限裁剪），“保存所有数据”必须有 完整历史缓冲。DataPlotViewModel 新增 RecRow 全历史录制（startRecording/ stopRecording/clearRecording/saveRecording + recording/recordedRows 属性）， 在 onUpdateTimeout 的 mdataMutex 锁内批量追加；扩展字段（温度/频率/A/W/ 四元数/PPS/UserA/电量/设备时间）用同 tick 已提交的 mlatest 快照与 12 通道配对； 200 万行上限自动停（内存保护）。 - 27 列：Times(相对首录行)+AX..MZ+AccNorm/GyroNorm+Q1~Q4+Temp(C)/Freq(Hz)/ PpsLock/PpsMode/UserA/Battery(%)/TsUs(us)/DateTime。CSV 逗号、TXT 制表符； 值用 QString::number(v,'g',10)（float 与 ms 时间戳无损），QTextStream setLocale(QLocale::c()) 锁定小数点为 '.'。 - MAT 手写 MATLAB Level 5（v6 兼容）小端，零第三方依赖： - 128B 头 = 116 描述 + 8 保留 + uint16 版本 0x0100 + \"IM\"（小端标志）； - miMATRIX 四子元素：array flags(miUINT32: class+0) / dims(miINT32) / name(miINT8) / data(miDOUBLE)，每子元素 8 字节对齐填充； - 26 个数值字段各 n×1 double 列向量（MATLAB 变量名：Times、AX..MZ、AccNorm、 GyroNorm、Q1..Q4、TempC、FreqHz、PpsLock、PpsMode、UserA、Battery、TsUs）； - DateTime 为 n×L 列主序 UTF-16 char 矩阵（空串补空格，MATLAB cellstr() 取每行）， 元素(i,j)=codesi+jn； - double 经 memcpy 写出，依赖宿主小端（x86/ARM64 Windows 均满足）。 - 原生保存对话框：部署目录缺 QuickDialogs2 插件，QML FileDialog 会加载失败； AppSettings.selectSaveFile（原生 QFileDialog，返回 {path, filter}）， QML 侧按过滤器自动补扩展名。 - 验证：--autorecord <dir 钩子（0.5s 起录、seconds-1 停录同时落盘三格式）； Python 规范回读脚本 verifymat.py（独立解析器）与 CSV 列交叉比对： 27 变量/670 行，AX 与 Times 与 CSV 完全一致，DateTime 矩阵 n/L/维度正确。 1 对同毫秒相邻行 = 模拟定时器抖动（真实数据特性，录制器不丢不重排）。 - 踩坑：build 目录未部署 Qt DLL，独立运行 exe 需先前置 Qt/MinGW bin 到 PATH， 否则 0xC0000135（DLL not found）秒退且不写任何日志。 诉求②：波形页推送开关改版（取代第九节独占下拉） - 前版“数据源 ComboBox（切换时关其它源）”改为 0x0001 传感器1 / 0x0002 设备状态 / 0x0010 传感器2 / 0x0013 传感器3 四路独立 Switch，可任意组合（0x0002 补入， 其状态字段由主图数据页消费）；仅开 0x0013 时四张图即 0013 数据；多路同开会混叠。 - Switch.toggled() 仅用户操作发射；“全部关闭”复位 checked 不会重发帧， 由按钮内显式循环发关帧，无重复发送。 - 开关为期望状态语义，设备实际以应答为准（调试日志/Hex 页接收区）。 诉求③：串口波特率全列表 + 记忆 - baudCombo 31 档（300…4000000，含 921600/1382400/1M/2M/3M/4M 等）+ editable:true + IntValidator(50–4000000) 支持手输任意波特率（驱动不支持时打开报错）； - 记忆：AppSettings.saveSerialConfig/loadSerialConfig（QSettings → %APPDATA%\\CommTools\\settings.ini 的 Serial 组），任一参数变更即保存；启动时 波特率/停止位/数据位/校验即时恢复，串口号待列表加载后仅自动匹配一次（避免覆盖手选）； 打开串口同步用 editText（手输值生效）。 提交 - bsp 子模","content":"# 实时波形页优化报告（2026-10-10）\n\n用户反馈两个问题：①软件运行一段时间后卡顿；②波形页 Y 轴量程固定，看不出实时变化。\n本文档记录根因、修复方案与实测证据。gitee 提交：波形页重构（develop，2026-10-10）。\n\n## 一、卡顿根因（三个，全部修复）\n\n### 1. rebuildNeeded 全清重建尖峰（主因）\n- 后端 `DataPlotViewModel` 存储裁剪到 1500 点后发 `rebuildNeeded`，\n  旧 QML 收到后 `resetChart()` 清空全部 series，下一 tick 一次性重建\n  4 图 × 3 系 × 1500 点 = **1.8 万点** → 主线程阻塞尖峰。\n- 修复：`updateChart()` 改为**整窗重绘**（同一 JS 块内 `clear()+append(批量)`，\n  场景图只同步一次）。裁剪对组件透明，`onRebuildNeeded` 监听整个删除。\n\n### 2. remove(0,n) 前删 O(n)\n- 旧代码每 tick 追加新点后从 series 头部删除旧点（O(n) 搬移+整缓冲重传）。\n- 修复：整窗重绘天然消除索引/前删状态。\n\n### 3. DebugPage 隐藏页日志全量过滤（设备场景）\n- DebugPage 位于 StackLayout（非 Loader），`onLogsChanged → syncLogs → rxLogs()`\n  对 `mainVM.logs`（QVariantMap 列表）做 **O(上限) 全量过滤+JS 重建**，无可见性守卫。\n  设备 50Hz 推流时即使停在波形页也被逐帧唤醒——\"运行一段时间后卡顿\"的来源\n  （日志滚动窗口填满后成本恒定在满量）。\n- 修复：`if (!root.visible) { logDirty = true; return }` + `onVisibleChanged` 补同步\n  （seq 增量机制天然支持，切回页面看到离开期间的全部日志，XCOM 行为不变）。\n\n## 二、Y 轴固定 → 自适应\n\n- 旧：固定量程（角速度 ±500°/s、静态噪声 ±1°/s 仅占画布 0.2% → 视觉直线）。\n- 新：`autoScaleY`（默认开）——可见窗口数据 min/max + 15% 边距，吸附 **1-2-5 nice 刻度**\n  （约 4 主刻度），迟滞策略：数据越界立即扩、范围大于目标 2.5 倍才缩，避免轴抖动。\n- 图例带**实时数值**（彩色等宽字体），网格线可见，线宽 2px，Y 轴标签精度随量程自适应\n  （≥200 → %.0f、≥20 → %.1f、否则 %.2f）。一键\"自适应Y:开/关\"切回固定量程。\n- 自适应数学已用运行时插桩逐字验证：数据 [-3.75,2.98]→轴[-5,5]、[-4.12,9.11]→[-10,15]、\n  [-75.0,49.6]→[-100,100]。\n- X 窗口自适应：`min(windowSec=30s, 数据跨度)`，启动初期自动放大细节。\n\n## 三、顺带修复：模拟数据 float 精度 bug\n\n`onSimulateTimeout` 用 `float t = timestamp/1000.0f`（epoch 秒 ≈1.79e9，float 步长 128s）\n→ 所有模拟值恒定、曲线为水平直线。改为相对时间基准 `m_simStartTimestamp`；\nyaw 由无界斜坡 `t*10` 改为 `fmod(t*20, 360)`。\n\n## 四、实测证据（同机 30s / 模拟 100Hz / QSG_RENDER_TIMING）\n\n| 指标 | 旧代码 | 新代码 |\n|---|---|---|\n| sync（主线程阻塞）≥10ms 次数 | **15** | **2**（含启动 1 次） |\n| sync ≥20ms | 11 | 1（启动） |\n| sync p99 | 8ms | 4ms |\n| 稳态 sync 最大 | 32ms | ~5ms |\n| sync 平均 | 0.64ms | 0.63ms |\n| render 平均 | 1.25ms | 2.06ms（整窗重传的 GPU 代价，不阻塞 UI） |\n\n- 旧代码尖峰节奏 ≈ 每 2s 一次（对应 rebuild 周期），稳态突发簇 21-32ms。\n- 抓屏像素分析：旧=各系列单条 40px 扁平线；新=曲线纵向铺开 ~100px/230px 画区（≈43%，\n  与 ±5 数据在 ±10 nice 量程的预期 50% 吻合）。\n- 证据 PNG（开发机 workspace）：`wave-baseline2.png`（旧·平线）、`wave-after3.png`（新·自适应波形）。\n\n## 五、自测钩子（回归验证用）\n\n```\nCommTools.exe --simulate --seconds 30 --grab out.png    # 100Hz 模拟数据+波形页+抓屏\n# 外部设 QSG_RENDER_TIMING=1，帧耗时写入 exe 目录 debug.log\n# 解析：Select-String 'frame rendered in' + 正则 'sync=(\\d+)'\n```\n注意：QML 调 C++ setter 须用属性赋值（`vm.simulating = true` 走 Q_PROPERTY WRITE），\n直接调 `setSimulating()` 会因非 Q_INVOKABLE 抛 TypeError（曾致测试空跑，已踩坑）。\n另：QML 不允许给未声明属性赋值（\"Cannot assign to non-existent property\"）。\n\n## 六、遗留\n\n- COM8 实机体验建议用户确认（GUI 无法自动开串口自测；模拟路径与实机共用同一渲染管线，\n  且数据率更高）。\n- DebugPage 可见时的日志链路仍是 O(上限) 过滤/次——可改为增量 `logAppended(entry)` 信号，\n  列为后续优化项。\n\n## 七、用户反馈迭代（同日 12:38）\n\n1. **Y 轴标题与刻度值重叠**：移除 axisY 的 `titleText`，单位并入卡片标题\n   （如“角速度实时曲线 (°/s)”），彻底消除重叠并释放绘图区宽度（gitee f7d37e8）。\n2. **去掉自适应切换按钮**：Y 轴自适应为唯一行为；顺带清理 yMin/yMax/yAxisLabel/\n   autoScaleY 冗余属性与固定量程分支（注意：删除 QML 属性必须同步删除 MainView 委托\n   里的同名绑定，否则 Cannot assign to non-existent property 导致整页加载失败）。\n\n## 八、用户反馈迭代三（同日 12:41）：X/Y 轴刻度字号自适应\n\n诉求：全部展开时轴文字部分看不清。排查发现两层根因：\n\n1. **QtGraphs 2D 轴无 labelFont 属性**（QAbstractAxis 只有 labelDelegate: Component）。\n   刻度文字样式须经 `labelDelegate: Text { color; font.pixelSize }` 设置；\n   官方文档：delegate 应为 Text 或含 `property string text`（框架对其赋值）。\n2. **GraphsView 刻度拥挤时会整行隐藏**：窗口 1200×800 四图全展开（每图 ~150px）时\n   默认固定字号刻度全部被隐藏（debug.log 证实 delegate 实例 vis=false）——这才是\n   “看不清”的根源；1920×1040 下同密度刻度正常渲染。\n\n修复（gitee 1756dd0）：\n\n- `axisFontPx = clamp(round(graphsView.height / 18), 9, 16)`，X/Y 轴共用；\n  全部展开→9px 保刻度不被隐藏；单图放大→16px。深灰 #475569 提升白底对比度。\n- main.cpp 自测钩子新增 `--size WxH`（如 1920x1040）验证不同布局。\n- 验证：1920×1040 抓屏 Y 标签带 18-21 物理 px（≈13 逻辑 px，与公式吻合）、\n  1200×800 下更小更少（GraphsView 拥挤管理），两尺寸 0 QML 错误。\n\n踩坑记录：\n\n- delegate 在窗口构建期创建（此时 graphsView.height=0，字号绑定初始为下限），\n  字号须用绑定而非创建期快照，布局完成后自动更新；框架后续夏用实例并赋 text\n  （630 次 text 更新 vs 96 次创建）。\n- 像素验证脚本必须按 DPR 换算物理坐标（本机 grab：1920×1040→2884×1760=DPR1.5；\n  1200×800→2400×1600=DPR2），否则窗口错位全部扫空。\n- GraphsView 红色曲线(#EF4444)会命中“红色文字”像素判定（R>170,G<90,B<90），\n  探针配色需避开系列色（纯蓝#0000FF 可与系列蓝#3B82F6 区分：G 通道 0 vs 130）。\n\n## 九、用户反馈迭代四（同日 13:25）：Hex页接收区显示不全 + 波形页自选报文源\n\n### 诉求①：HexCommands 页接收区数据显示不全\n\n- **根因**：原代码把 ScrollBar 直接挂在 TextArea 上，但 TextArea 并非 Flickable\n  （无 contentY/contentHeight）——滚动条是死的，超出视口的长文本被 clip 直接裁掉，\n  无法滚动查看。（验证：给 TextArea 写 onContentYChanged 直接报\n  `Cannot assign to non-existent property`，编译期坐实。）\n- **C++ 侧叠加因素**：推送模式下 `m_receivedDataText = pendingDataText` 整帧替换\n  （50Hz 只显示最新一帧），多行帧文本在替换间隙根本读不完。\n- **修复（gitee 87e9f74）**：\n  1. Flickable 包裹 + `TextArea.flickable: TextArea{...}` 附加属性（Qt 文档标准结构）\n     ——滚动真正生效，ScrollBar 挂在 Flickable 上；\n  2. 自动跟随：新内容到达时滚到底部（Qt.callLater 等布局完成），\n     用户上翻阅读时暂停跟随（onContentYChanged 更新 followTail）；\n  3. “暂停显示”冻结按钮：定格当前文本便于读完整帧，数据仍在后台接收解析。\n\n### 诉求②：波形页直接选择报文源（不依赖 Hex 页配置）\n\n- 协议 3.2.3.7：推送报文ID控制 = 0x00 0x11 帧，DATA1=CMD、DATA2=ID、DATA3=开关；\n  可控报文 0x0001/0x0002/0x0010/0x0013。\n- 新增 `Q_INVOKABLE sendPushIdControl(msgIdHex, on)`：不读 Hex 页的\n  m_selectedData1/Data2/Op，独立构帧（OP 固定 0x01 = 配置到 RAM，运行时生效不保存）。\n- MainView 波形页头部新增：数据源 ComboBox（0x0010/0x0001/0x0013）+ 停止推送按钮。\n  **切换时先关其它传感器源再开目标源**——多源同时推送会交错 addDataPoint 致波形混叠；\n  0x0002 设备状态未列入（图表不消费）。\n- 注意：sendPushIdControl 与 sendCommand 一样会清空接收区等待应答，\n  Hex 页暂停显示的冻结快照不受影响。\n\n## 十、主图数据页三格式保存 / 波形页推送开关 / 串口记忆（2026-10-10）\n\n### 诉求①：主图数据页数据记录与 CSV/TXT/MAT 保存\n\n- 为什么加录制器：图表缓冲是 1500 点滚动窗口（超限裁剪），“保存所有数据”必须有\n  完整历史缓冲。DataPlotViewModel 新增 RecRow 全历史录制（startRecording/\n  stopRecording/clearRecording/saveRecording + recording/recordedRows 属性），\n  在 onUpdateTimeout 的 m_dataMutex 锁内批量追加；扩展字段（温度/频率/|A|/|W|/\n  四元数/PPS/UserA/电量/设备时间）用同 tick 已提交的 m_latest* 快照与 12 通道配对；\n  200 万行上限自动停（内存保护）。\n- 27 列：Time_s(相对首录行)+AX..MZ+AccNorm/GyroNorm+Q1~Q4+Temp(C)/Freq(Hz)/\n  PpsLock/PpsMode/UserA/Battery(%)/TsUs(us)/DateTime。CSV 逗号、TXT 制表符；\n  值用 QString::number(v,'g',10)（float 与 ms 时间戳无损），QTextStream\n  setLocale(QLocale::c()) 锁定小数点为 '.'。\n- MAT 手写 MATLAB Level 5（v6 兼容）小端，零第三方依赖：\n  - 128B 头 = 116 描述 + 8 保留 + uint16 版本 0x0100 + \"IM\"（小端标志）；\n  - miMATRIX 四子元素：array flags(miUINT32: class+0) / dims(miINT32) / name(miINT8) /\n    data(miDOUBLE)，每子元素 8 字节对齐填充；\n  - 26 个数值字段各 n×1 double 列向量（MATLAB 变量名：Time_s、AX..MZ、AccNorm、\n    GyroNorm、Q1..Q4、Temp_C、Freq_Hz、PpsLock、PpsMode、UserA、Battery、TsUs）；\n  - DateTime 为 n×L 列主序 UTF-16 char 矩阵（空串补空格，MATLAB cellstr() 取每行），\n    元素(i,j)=codes[i+j*n]；\n  - double 经 memcpy 写出，依赖宿主小端（x86/ARM64 Windows 均满足）。\n- 原生保存对话框：部署目录缺 QuickDialogs2 插件，QML FileDialog 会加载失败；\n  AppSettings.selectSaveFile（原生 QFileDialog，返回 {path, filter}），\n  QML 侧按过滤器自动补扩展名。\n- 验证：--autorecord <dir> 钩子（0.5s 起录、seconds-1 停录同时落盘三格式）；\n  Python 规范回读脚本 verify_mat.py（独立解析器）与 CSV 列交叉比对：\n  27 变量/670 行，AX 与 Time_s 与 CSV 完全一致，DateTime 矩阵 n/L/维度正确。\n  1 对同毫秒相邻行 = 模拟定时器抖动（真实数据特性，录制器不丢不重排）。\n- 踩坑：build 目录未部署 Qt DLL，独立运行 exe 需先前置 Qt/MinGW bin 到 PATH，\n  否则 0xC0000135（DLL not found）秒退且不写任何日志。\n\n### 诉求②：波形页推送开关改版（取代第九节独占下拉）\n\n- 前版“数据源 ComboBox（切换时关其它源）”改为 0x0001 传感器1 / 0x0002 设备状态 /\n  0x0010 传感器2 / 0x0013 传感器3 四路独立 Switch，可任意组合（0x0002 补入，\n  其状态字段由主图数据页消费）；仅开 0x0013 时四张图即 0013 数据；多路同开会混叠。\n- Switch.toggled() 仅用户操作发射；“全部关闭”复位 checked 不会重发帧，\n  由按钮内显式循环发关帧，无重复发送。\n- 开关为期望状态语义，设备实际以应答为准（调试日志/Hex 页接收区）。\n\n### 诉求③：串口波特率全列表 + 记忆\n\n- baudCombo 31 档（300…4000000，含 921600/1382400/1M/2M/3M/4M 等）+\n  editable:true + IntValidator(50–4000000) 支持手输任意波特率（驱动不支持时打开报错）；\n- 记忆：AppSettings.saveSerialConfig/loadSerialConfig（QSettings →\n  %APPDATA%\\CommTools\\settings.ini 的 Serial 组），任一参数变更即保存；启动时\n  波特率/停止位/数据位/校验即时恢复，串口号待列表加载后仅自动匹配一次（避免覆盖手选）；\n  打开串口同步用 editText（手输值生效）。\n\n### 提交\n\n- bsp 子模块 QT_BSP `8bd847a`（AppSettings 记忆 + 原生保存框）；主仓 QT-Tools `6a16c07`；\n  自测：`--simulate --seconds 12 --autorecord <dir>` 三格式全 true、双页 0 QML 错误。\n\n## 十一、波形页推送开关回退 + 波形图鼠标缩放/平移（2026-10-10）\n\n### 诉求①：四路开关回退为下拉选择（后按用户要求再去掉停止按钮）\n\n- 按用户要求：第十节的四路独立 Switch 撤销，恢复原“数据源 ComboBox”\n  （0x0010/0x0001/0x0013 互斥切换）；后续再按要求移除“停止推送”按钮，\n  波形页仅保留数据源下拉（切换源时仍先关其它源再开目标源，行为同第九节）。\n\n### 诉求②：波形图鼠标缩放/平移查看\n\n- 背景：GraphsView 2D 默认不消费滚轮/拖拽，自加 MouseArea 交互层实现：\n  - 滚轮：上滚放大/下滚缩小，以光标位置为不动点（每档 1.25 倍，最小跨度 0.05s）；\n  - 左键拖拽：平移查看历史（内容随手势），位置限幅允许越出首尾 5% 空白；\n  - 恢复实时三途径：拖到最右沿自动恢复（hi ≥ tLast 即 followLive=true）/\n    图内双击 / 头部“回到实时”按钮（仅查看模式可见）；\n  - 查看模式（followLive=false）下 tick 照常整窗重绘，新进入可视窗的数据即时可见；\n    Y 轴仍按可视区间自适应（nice+迟滞逻辑复用）；\n  - Pause 冻结 tick 刷新但鼠标查看仍可用（renderWindow 独立于 updateChart 的暂停闸门）。\n- 实现要点：updateChart 拆为入口（暂停/收起闸门）+ renderWindow（纯重绘）；\n  applyInspectRange 统一限幅（跨度 0.05s～dataSpan×1.1、首尾 5% 边距）并顺带判定\n  是否自动回跟；点集构建循环补 t > xMax break（时间戳升序，查看模式省遍历）。\n- 自测：构建 9/9；--simulate 10s 截图 0 QML 错误（滚轮/拖拽为交互功能需实机体验）。\n\n### 提交\n\n- 主仓 QT-Tools `c7a0d29`；bsp 无改动。\n\n## 十二、波形数据不正常根因修复（2026-10-10）\n\n### 现象\n\n- 实机连接后“可以看到数据，但显示的波形数据不正常”（Hex/调试页有数据，波形冻结/空白或异常）。\n\n### 根因①（主）：数据入口被 Hex 页选中命令过滤\n\n- 五个数据入口 onNewSensorData(0x0001)/onNewSensorDataPacket(0x0010)/onNewStatusPacket(0x0002)/\n  onNewSensorData0013(0x0013)/onNewAllData 全部以 isCommandSelected(cmd,id) 起手——\n  要求 Hex 页当前选中命令与到达报文一致才送入图表。\n- 波形页“数据源”下拉（sendPushIdControl）只发 0x00 0x11 帧切换设备推送，不更新 Hex 页选中项：\n  Hex 页选错/未选（selectedCommand 为空）时数据全部被丢弃 → 波形冻结，数据只在 Hex/调试页可见。\n- 修复：五处解除过滤，到达即绘图。波形页下拉独占切换（选中即关其它源）天然防混叠；\n  Hex 页选中项回归“编辑/测试命令”本职，不再约束绘图。\n\n### 根因②：0x0001 设备微秒时间戳当毫秒用\n\n- onNewSensorData 将 data.Timestamp（协议 3.1.3.4，单位 us，quint64）直接作为图表时间戳，\n  而其它路径均用 PC 毫秒（QDateTime::currentMSecsSinceEpoch）——X 轴时间快 1000 倍。\n- 修复：图表时间戳统一 PC 毫秒；设备 us 时间戳保留在扩展信息 tsUs（主图页列/录制文件 TsUs 列）。\n\n### 排查方法记录\n\n- 构建目录 debug.log 无实机会话 → 用户运行的是部署版 exe（各自目录有自己的日志），\n  build 目录日志只能看到自测记录。\n- 从“数据可见但波形不动”定位到收包与绘图之间必有过滤层，顺藤摸瓜 grep addDataPoint 上游。\n\n### 提交\n\n- 主仓 `72cdc8c`（移除停止推送按钮）、`8a7f9da`（本节两根因修复）；bsp 无改动；\n  **实机复测通过**（2026-10-10 17:58 用户确认波形恢复正常）。\n\n## 十三、波形页 Y 轴缩放/平移查看（2026-10-10 20:00）\n\n### 诉求\n\n- 实时数据波形界面需要在波形显示数据区域对波形放大/缩小。第十一节已有 X 轴滚轮缩放，\n  本次补齐 Y 轴（幅值）缩放与平移，波形可在 X/Y 两个方向自由放大缩小。\n\n### 实现（仅 LineChartWidget.qml，+87/-17）\n\n- **Shift+滚轮**：以光标为中心缩放 Y 轴（每档 1.25 倍；屏幕 y 向下、值域向上，\n  光标值 = yMax − (y/高)×跨度）；兼容系统把 Shift+滚轮转成水平滚动的输入\n  （angleDelta.y=0 时取 angleDelta.x 定方向）。\n- **Ctrl+滚轮**：X+Y 双轴同缩；无修饰滚轮仍为纯 X 缩放（第十一节行为不变）。\n- **右键拖拽**：Y 平移（抓取点保持在光标下，拖下=看更大值）；左键拖拽仍为 X 平移。\n- **Y 手动模式**：`applyYRange` 统一限幅（跨度 1e-6～1e9 绝对限幅，各通道量纲差异大）\n  后置 `yManual=true`；`renderWindow` 手动分支直接套用 `yViewMin/yViewMax`，\n  与实时跟随解耦——实时滚动中也可锁定量程（超出范围数据由 GraphsView 裁剪）。\n- **恢复自适应**：双击/「回到实时」恢复跟随且 Y 回自适应；手动期间头部出现\n  「Y自适应」按钮一键恢复（不退出历史查看模式）；Clear 也复位 yManual。\n- 卡片头部新增灰色 9px 操作提示（滚轮:X缩放 Shift+滚轮:Y缩放 Ctrl+滚轮:双轴\n  左/右键拖拽:X/Y平移 双击:复原），原占位 Item 换为右对齐 elide 文本。\n\n### 自测\n\n- MSVC 增量构建通过；`--simulate --seconds 8 --size 1600x900 --grab` 抓屏，\n  进程 0 错误退出；像素分析三系列色齐全（蓝 759/红 1087/绿 1020，步长 2px 采样）。\n- 滚轮/拖拽为交互功能需实机体验（同第十一节）。\n\n### 提交\n\n- 主仓 QT-Tools gitee `9c9328c`（develop）；bsp 无改动。\n\n## 十四、滚轮缩放无效根因：qmlcachegen 编译下 MouseArea.onWheel 失效（2026-10-10 21:00）\n\n### 现象\n\n- 第十一/十三节的滚轮缩放实机完全无效（用户 20:35 反馈；debug.log 确认 20:33 会话运行的就是最新构建，非旧 exe 问题）。\n\n### 排查（三轮对照注入实验 + 源码定论）\n\n1. OS 级 SendInput 注入滚轮 → onWheel 不触发。\n2. main.cpp `--wheel x,y,n` 钩子进程内 `sendEvent(win, QWheelEvent)`（Qt::ScrollUpdate/NotSynthesized，与真实 OS 滚轮同构；scenePosition 验证正确）→ onWheel 仍不触发，且窗口级 `accepted=false`（无任何 item 消费，排除“被谁吞了”）。\n3. 同位置加 WheelHandler 探针 → **WheelHandler 能收到，MouseArea.onWheel 收不到**。\n4. 读 qtdeclarative 6.11.1 源码定论：`QQuickMouseArea::wheelEvent` 里 `we.setAccepted(d->isWheelConnected())` ——\n   发射 wheel 信号前用 `IS_SIGNAL_CONNECTED` 检查连接；**qmlcachegen/qmlsc AOT 编译的 onWheel 处理器不计入\n   isSignalConnected** → MouseArea 视为无人监听，直接忽略滚轮（不 accept，继续冒泡）。\n- 顺带排除的两个假说：`unsetDefaultWheelHandler()` 是 3D 图类型（QQuickGraphsItem）方法，\n  2D GraphsView 上调用直接 ReferenceError；2D `QGraphsView::wheelEvent` 在 axisRenderer 未处理时 `event->ignore()`，不消费。\n- 验证手段：--wheel 注入 + 临时日志看轴跨度变化；也可开 QT_LOGGING_RULES=qt.quick.wheel.target=true 观察派发。\n\n### 修复\n\n- 滚轮缩放改用 `WheelHandler { target: null; acceptedDevices: Mouse|TouchPad }` 实现：\n  指针处理器在 item wheelEvent 之前被 offer，且不依赖信号连接检查，实测可靠收到。\n- 按用户要求：滚轮无修饰键直接缩放（X+Y 双轴、光标为不动点、每档 1.25 倍）；移除卡片头部操作提示文字。\n- 保留：左键拖拽 X 平移、右键拖拽 Y 平移、双击/「回到实时」复原 + Y 回自适应、Y 手动模式「Y自适应」按钮。\n- MouseArea 仅保留拖拽/双击（鼠标按键路径不受 isWheelConnected 问题影响）。\n- main.cpp 自测钩子保留 `--wheel x,y,n` 供滚轮链路回归。\n\n### 验证\n\n- `--simulate --seconds 16 --size 1600x900 --wheel 800,180,4`：每次注入 X/Y 跨度精确 ÷1.25\n  （X: 5.28→2.70s，Y: 16→8.19），0 QML 错误。\n- 注意：WheelHandler 不取独占 grab，窗口级 event accepted 仍为 false ——\n  判断缩放是否生效看轴跨度/画面变化，不看 accepted。\n\n### 提交\n\n- 主仓 QT-Tools gitee `2d3f2f0`（develop）；bsp 无改动。\n"},{"hash":"QT-Tools/Doc/蓝牙功能实现.md","title":"蓝牙功能实现","relPath":"QT-Tools/Doc/蓝牙功能实现.md","desc":"蓝牙功能实现（扫描 + SPP 连接，2026-10-10） 需求：扫描周边蓝牙设备 + 连接其它蓝牙设备（串口数据链路）。","created":"","updated":"","tags":[],"sizeKB":4.7,"_text":"蓝牙功能实现（扫描 + SPP 连接，2026-10-10） 需求：扫描周边蓝牙设备 + 连接其它蓝牙设备（串口数据链路）。 技术选型：为什么不用 Qt Bluetooth 项 结论 ------ 本机 Qt 6.11.1 MSVC 安装 未安装 Qt Bluetooth 模块（lib/dll 均无） 即便安装 Qt 蓝牙在 Windows 上不支持经典 SPP/RFCOMM 客户端连接（WinRT 后端仅 LE），扫描可用但\"连接串口设备\"走不通 采用 Windows 原生双栈：WinRT （扫描）+ Winsock （连接） 实现（bsp ，pimpl 隔离） - 扫描： ， AQS 同时匹配经典蓝牙协议 与 BLE ；属性取 DeviceAddress/SignalStrength/IsPaired/IsConnected。AEP 依赖 Windows 后台持续发现， 周边设备几秒内陆续上报。25s 自动停止；结果按 RSSI 降序限 64 条，200ms 合批。 - 跨线程纪律：WinRT 回调在线程池触发，回调内只提取纯值（QString/qint64/bool） 再 投递 UI——绝不跨线程持有 WinRT 投影对象。 - 连接：worker 线程非阻塞 + 8s 超时 → SPP（ 0x1101，无需预先配对，ESP32/HC-05 类 SPP 服务端直连）。成功后回阻塞模式 recv 循环， 数据经队列信号回 UI；断开 = 即刻解除阻塞 recv。发送 防卡 UI。 - 数据链路：CommViewModel 把 接到与串口同一 DataParser 管线（协议帧解析/波形/日志/录制全复用）； 自动切换 CommType。 UI（BluetoothPanel 侧栏，SidePanel 注入 mainVM） 扫描/停止/清空按钮、设备列表（名称/地址/RSSI/已配对徽标，单击选中双击直连）、 手动地址输入连接/断开、适配器与连接状态行。MainViewModel 门面转发 。 踩坑记录（编译/链接） 1. cppwinrt 头要求 （仅对 BluetoothService.cpp 设置 source 属性，避免影响全局）。 2. MSVC 14.51 下 winrt 头拉 → 硬错误，需 。 3. winrt 头必须在 windows.h 之前包含（rpcndr 的 宏冲突）；winsock2.h 在 windows.h 之前。 4. Impl（QObject 派生类的嵌套）里裸调 被 QObject::connect 名字遮蔽 → 必须 。 5. 是 DeviceInformation 的静态工厂，不是 DeviceWatcher 成员。 6. 链接缺 → 未解析。 7. （BluetoothApis.lib）查适配器可用性。 验证 - （main.cpp 自测钩子，1.5s 起扫、N 秒停止并把设备写入 debug.log）： 本机（MediaTek 适配器）实测 20s 扫到 12 台——已配对 S100 / XFW-BT（paired=true，AEP 缓存项 RSSI=0）、 美的电器 ×2、多台 BLE（无广播名显示地址），按信号强度降序（-45 → -88 dBm）。 - 启动 0 QML 错误；SPP 连接为交互功能需实机连 ESP32/HC-05 类设备复测 （扫描/收发管线与串口共用，风险集中在 RFCOMM 直连本身）。 提交 - bsp QTBSP （BluetoothService 重写）；主仓 QT-Tools （CMake/CommViewModel/MainViewModel/BluetoothPanel/SidePanel/--btscan 钩子）。 迭代（同日 23:00，用户反馈：扫描可用但找不到连接操作） - 根因不是连接功能缺失，而是操作不可见：底部「连接」按钮在未选中设备时被 enabled 条件置灰， 失败原因只写调试日志，面板内无任何连接中/失败反馈。 - 改进（bsp + 主仓 ）： 1. 设备列表每行内嵌「连接」按钮（未连接时显示），点击即连该设备；双击/底部按钮仍可用； 2. 状态行直显连接状态（未连接/连接中…/已连接/连接失败，含颜色）； 3. 失败原因红字显示在面板内：bluetoothError 信号链 Service::errorOccurred → CommViewModel::bluetoothError → MainViewModel::btError → 面板 onBtError； 4. doConnect 重试不再阻塞 UI（上一次尝试在 8s 超时期间重点连接时，改为 ioRunning=false+closesocket 解除阻塞后再 join）。 - 教训：面板类交互功能必须有行内动作入口 + 状态/错误就地反馈，只写日志等于无反馈。","content":"# 蓝牙功能实现（扫描 + SPP 连接，2026-10-10）\n\n需求：扫描周边蓝牙设备 + 连接其它蓝牙设备（串口数据链路）。\n\n## 技术选型：为什么不用 Qt Bluetooth\n\n| 项 | 结论 |\n|---|---|\n| 本机 Qt 6.11.1 MSVC 安装 | **未安装 Qt Bluetooth 模块**（lib/dll 均无） |\n| 即便安装 | Qt 蓝牙在 Windows 上**不支持经典 SPP/RFCOMM 客户端连接**（WinRT 后端仅 LE），扫描可用但\"连接串口设备\"走不通 |\n| 采用 | **Windows 原生双栈**：WinRT `DeviceWatcher`（扫描）+ Winsock `AF_BTH/BTHPROTO_RFCOMM`（连接） |\n\n## 实现（bsp `Model/Bluetooth/BluetoothService`，pimpl 隔离）\n\n- **扫描**：`DeviceInformation::CreateWatcher(aqs, props, DeviceInformationKind::AssociationEndpoint)`，\n  AQS 同时匹配经典蓝牙协议 `{E0CBF06C-…}` 与 BLE `{BB7BB05E-…}`；属性取\n  DeviceAddress/SignalStrength/IsPaired/IsConnected。AEP 依赖 Windows 后台持续发现，\n  周边设备几秒内陆续上报。25s 自动停止；结果按 RSSI 降序限 64 条，200ms 合批。\n- **跨线程纪律**：WinRT 回调在线程池触发，回调内**只提取纯值**（QString/qint64/bool）\n  再 `QMetaObject::invokeMethod(Qt::QueuedConnection)` 投递 UI——绝不跨线程持有 WinRT 投影对象。\n- **连接**：worker 线程非阻塞 `::connect` + `select` 8s 超时 → SPP（`SerialPortServiceClass_UUID`\n  0x1101，**无需预先配对**，ESP32/HC-05 类 SPP 服务端直连）。成功后回阻塞模式 recv 循环，\n  数据经队列信号回 UI；断开 = `closesocket` 即刻解除阻塞 recv。发送 `SO_SNDTIMEO=3s` 防卡 UI。\n- **数据链路**：CommViewModel 把 `BluetoothService::dataReceived` 接到与串口**同一** DataParser\n  管线（协议帧解析/波形/日志/录制全复用）；`connectBluetooth(address)` 自动切换 CommType。\n\n## UI（BluetoothPanel 侧栏，SidePanel 注入 mainVM）\n\n扫描/停止/清空按钮、设备列表（名称/地址/RSSI/已配对徽标，单击选中双击直连）、\n手动地址输入连接/断开、适配器与连接状态行。MainViewModel 门面转发\n`btDevices/btDiscovering/btAvailable/startBtDiscovery/stopBtDiscovery/clearBtDevices/connectBluetooth/disconnectBluetooth`。\n\n## 踩坑记录（编译/链接）\n\n1. cppwinrt 头要求 **`/permissive-`**（仅对 BluetoothService.cpp 设置 source 属性，避免影响全局）。\n2. MSVC 14.51 下 winrt 头拉 `<experimental/coroutine>` → 硬错误，需\n   `_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS`。\n3. winrt 头必须在 windows.h **之前**包含（rpcndr 的 `interface` 宏冲突）；winsock2.h 在 windows.h 之前。\n4. Impl（QObject 派生类的嵌套）里裸调 `connect(...)` 被 **QObject::connect 名字遮蔽** → 必须 `::connect`。\n5. `CreateWatcher` 是 **DeviceInformation 的静态工厂**，不是 DeviceWatcher 成员。\n6. 链接缺 `runtimeobject.lib` → `WINRT_IMPL_RoGetActivationFactory/RoOriginateLanguageException` 未解析。\n7. `BluetoothFindFirstRadio`（BluetoothApis.lib）查适配器可用性。\n\n## 验证\n\n- `CommTools.exe --btscan 20`（main.cpp 自测钩子，1.5s 起扫、N 秒停止并把设备写入 debug.log）：\n  本机（MediaTek 适配器）实测 **20s 扫到 12 台**——已配对 S100 / XFW-BT（paired=true，AEP 缓存项 RSSI=0）、\n  美的电器 ×2、多台 BLE（无广播名显示地址），按信号强度降序（-45 → -88 dBm）。\n- 启动 0 QML 错误；SPP 连接为交互功能需实机连 ESP32/HC-05 类设备复测\n  （扫描/收发管线与串口共用，风险集中在 RFCOMM 直连本身）。\n\n## 提交\n\n- bsp QT_BSP `62b83f8`（BluetoothService 重写）；主仓 QT-Tools `2e65002`\n  （CMake/CommViewModel/MainViewModel/BluetoothPanel/SidePanel/--btscan 钩子）。\n\n## 迭代（同日 23:00，用户反馈：扫描可用但找不到连接操作）\n\n- 根因不是连接功能缺失，而是**操作不可见**：底部「连接」按钮在未选中设备时被 enabled 条件置灰，\n  失败原因只写调试日志，面板内无任何连接中/失败反馈。\n- 改进（bsp `73da505` + 主仓 `b056758`）：\n  1. 设备列表**每行内嵌「连接」按钮**（未连接时显示），点击即连该设备；双击/底部按钮仍可用；\n  2. 状态行直显连接状态（未连接/连接中…/已连接/连接失败，含颜色）；\n  3. **失败原因红字显示在面板内**：bluetoothError 信号链\n     Service::errorOccurred → CommViewModel::bluetoothError → MainViewModel::btError → 面板 onBtError；\n  4. doConnect 重试不再阻塞 UI（上一次尝试在 8s 超时期间重点连接时，改为\n     ioRunning=false+closesocket 解除阻塞后再 join）。\n- 教训：面板类交互功能必须有**行内动作入口 + 状态/错误就地反馈**，只写日志等于无反馈。\n"},{"hash":"QT-Tools/Doc/页面切换卡顿优化报告.md","title":"页面切换卡顿优化报告","relPath":"QT-Tools/Doc/页面切换卡顿优化报告.md","desc":"页面切换卡顿优化报告（P0 + P1/P2 批次） 日期：2026-10-15 · 分支 develop · 工程仓库：gitee QT-Tools 问题现象 串口数据接入后，在不同页面间快速来回切换时出现明显卡顿。","created":"","updated":"","tags":[],"sizeKB":12.9,"_text":"页面切换卡顿优化报告（P0 + P1/P2 批次） 日期：2026-10-15 · 分支 develop · 工程仓库：gitee QT-Tools 问题现象 串口数据接入后，在不同页面间快速来回切换时出现明显卡顿。 根因分析（三源叠加 + Debug 放大） 1. 数据绑定转换风暴（主因）： 13 个数据列表属性（ ）共用一个 NOTIFY。波形页 4 张图 × 4 数组绑定 = 16 个 绑定，每次 都全量重转换：1500 点 × 16 ≈ 24000 次 QVariant→JS 装箱转换/次。触发源：10Hz 刷新定时器 + 每次进入数据页 的立即 emit。绑定不受页面可见性门控，停在主图数据页时，隐藏的波形图绑定照常全量烧。 2. 调试页日志全量拷贝： 为 QVariantList（上限 5000 条 QVariantMap）。DebugPage 每次全量读取并逐条深度转换为 JS 再过滤 RX。串口流下每 500ms 一次；切回调试页 再补一次突发。 3. 七页全量常驻（本批未改，P1 项）：StackLayout 七页启动即全部实例化（仅波形页 Loader 延迟），每次切页全树可见性切换 + 布局重排，Quick3D 场景显隐还触发场景同步。 4. 放大器：日常运行为 Debug 构建（MSVC /Od 无优化 + Qt Debug DLL）。 修复内容（行为不变） 修改 文件 说明 --------------------- 1 13 个属性 → DataPlotViewModel.h/.cpp QML 侧 接口完全不变（JS number 数组），消除每元素 QVariant 装箱/解包；exportChartData 相应简化（float 通道精度不变：float→double 精确，输出同为 'g' 6 位） 2 日志 seq 增量拉取 CommViewModel.h/.cpp、MainViewModel.h、DebugPage.qml 新增 / （门面 MainViewModel 转发）； / 改增量拉取，删除全量 ；O(新增条目) 替代 O(5000) 全量拷贝 3 perfLog 默认关闭 DataPlotViewModel.cpp、CommViewModel.cpp 环境变量 开启才写 perflog.txt；此前热路径每 N 次调用（onNewSensorData %500、addLog %200、onUpdateTimeout %50…）在解析线程开-写-关文件 4 RelWithDebInfo 构建 build/DesktopQt6111MSVC202264bit-RelWithDebInfo + ；必须 指向 jom.exe 完整路径（jom 不在 PATH，否则 try-compile \"no such file or directory\" 失败） 验证（2026-10-15） - Debug 增量构建 ；RelWithDebInfo 配置 + 全量构建 - 截图精确像素计数（System.Drawing LockBits）：blue/red/green = 2992/3709/4245（Debug）、2993/3382/4359（RelWithDebInfo）——三色曲线正常渲染，数据链路无回归 - ：蓝牙扫到 7 台设备；发现日志走 addLog→logTimer→logsChanged→syncLogs→ 全链路，运行窗口 0 QML 错误（无 TypeError/\"is not a function\"） - perflog.txt 在自测期间零写入（门控生效；最后一次写入为用户旧版会话 21:39:53） - 编译坑记录：QVariant 无 成员（那是 QMap 接口），须 ，否则 C2672/C2440 遗留与后续建议 - 既有 bug（非本批引入）： （用户 21:34 手动运行旧版时 debug.log 记录，姿态仪页 Canvas 半径参数偶发非法），待专项排查 - P1：页面 3-6（命令面板/3D 模型/姿态仪/固件升级）Loader 延迟加载；波形数据绑定按页可见性门控；C++ 类型注册进 qtaddqmlmodule（QMLELEMENT，绑定 AOT 编译） - P2：波形数据 C++ 侧喂入（QXYSeries::replace，消灭每 tick 约 1.8 万个 Qt.point 分配）；日志改 QAbstractListModel（现成 LogModel 类未使用） - 小项：POSTBUILD →按需拷贝（resource 含 su7 模型较大）；onLogTimerTimeout 裁剪循环 removeFirst→erase 批量；main.cpp 硬编码→环境变量守卫； 疑似死代码（grep 无调用方） --- P1/P2 批次（2026-10-15 第二轮，提交 c3e9e8b / 664a2f1 / e26aa0e） 已落地 修改 提交 说明 --------------------- B1 自测钩子 --serial/--cyclepages + 小项四连 c3e9e8b 真实串口全链路验证（连接→解析→波形像素断言，无数据 4.5s 自动发 0x0010 推送使能）； 每 1.5s 轮页压力测试；资源拷贝 copydirectoryifdifferent；日志裁剪单次 erase；移除强制 QSGINFO；清理死代码 isCommandSelected。设备实测：COM3 波特率 921600（协议文档默认值，帧头 0xAA 0x55，50Hz 推送约 11.5KB/s；115200 下全是乱码） B2 页面 3-6 Loader 延迟加载 664a2f1 CommandPanel / Model3DView(Quick3D，GPU 最重) / AttitudeIndicatorView / FirmwareUpgradePage 首次进入才创建（参照波形页模式，active 置位后常驻）；启动不再同步实例化全部七页 B3+B4 波形 C++ 侧供数 fillChart e26aa0e DataPlotViewModel 新增 （C++ 构建可见窗口点集并整批 replace(QList<QPointF)，返回 yLo,yHi）+ timeFirst/timeLast/pointCount；LineChartWidget 重写：图例改 provider.latest 标量绑定，缩放/拖拽边界改 timeFirst/timeLast，四个数组属性与对应绑定全部移除。效果：每 tick 13 通道 QVariant→JS 全量转换 + 约 1.8 万次 Qt.point JS 分配彻底归零（仅波形页可见时由 C++ 直接喂系列） 验证证据（COM3@921600 真实设备） - 滚轮注入断言： xSpan 每档精确 ×0.8（3.72→2.976→2.3808），WheelHandler→applyInspectRange(provider 边界)→fillChart 全链路（注意 (800,300) 落在卡片标题栏不会触发，非回归；accepted=false 是指针处理器派发常态，断言看跨度日志） - 真实数据渲染像素：B3+B4 后 2043/4722/4736；RelWithDebInfo 全量重建后 3307/3324/5404 - 轮页压力（真实数据 + 1.5s×21 次切页）：数据流不中断、0 QML 错误 - 1500 点滚动窗口 + 200 点迟滞裁剪行为与设计一致（points 序列 1507→1500→1587…） B5（QMLELEMENT AOT）已完成（父仓 7efc33a / bsp dcf75e9，2026-10-15） 目标达成：qmlRegisterType 运行时注册 → qtaddqmlmodule(SOURCES) + QMLELEMENT 编译期注册，qmlcachegen 获得 C++ 类型信息做 AOT 绑定编译。 旧根因归档（重要更正）：上轮回退时把 C2737/C2338 归因于枚举 staticMetaObject 跨 TU 链接，实测不成立——用 moc+MSVC 最小复现矩阵（V1 类版枚举+前置声明指针→复现 C2338+C2737；V2 同枚举+完整指针类型→编译通过）证明：唯一根因是 MainViewModel.h 的 前置声明指针触发 qmetatype.h 的 C2338（\"Pointer Meta Types must either point to fully-defined types…\"），C2737 只是其级联（constexpr 求值失败 → staticMetaObject 无法 constinit 初始化）。moc 生成的 跨 TU 在 MSVC 2022/Qt 6.11.1 下编译链接与运行均无害（Qt 6.11 的 link<T 仅取 &MO 地址，链接器解析）。CommandViewModel 幸免只因它没有前置声明指针参数，与枚举无关。修复：MainViewModel.h 直接 （无循环包含），无需 QDECLAREOPAQUEPOINTER，也无需 EnumCommon 命名空间化/独立模块。给 qtaddqmlmodule 加 SOURCES 后目标内所有类的元类型检查严格化：任何 QPROPERTY/signal/QINVOKABLE 签名里的前置声明指针都会炸；CommViewModel 的前置声明仅用于普通方法与成员，不受影响。 本轮新坑（Qt 6.11.1 实测）：迁移后 QML 加载非确定性失败 ——失败点随进程漂移（Model3D/Attitude/FirmwareUpgrade/MainViewModel 轮流出错，同一 exe；QTHASHSEED=0 时稳定复现于同一处 → 依赖 QHash 布局；Qt 对非 0 种子值会拒绝）。切割实验：动态 +显式 逐类型实例化 7/7 全 OK（注册侧完好）→ 病灶在 qmlcachegen 编译单元的\"同模块隐式导入\"类型解析。修复：实例化模块 C++ 类型的 QML 文件显式 （MainView.qml / FirmwareUpgradePage.qml / ProtocolDocPage.qml），main.cpp 改 （Qt 6.5+ 规范）；显式导入后 4/4 次加载全绿（含 seed=0）。 模块解析机制备注：本工程模块资源前缀是 （qtstandardprojectsetup），qrc qmldir 不在任何 import path 下——模块解析依赖构建目录里 exe 旁的磁盘 qmldir（ ， 回指 qrc）；删掉该目录则 。 改动清单：CMakeLists（6 VM+DocLoader 移入 qtaddqmlmodule SOURCES）、7 头加 QMLELEMENT+qqmlintegration 头（CommandViewModel 原残留宏转正）、main.cpp 删 8 处 qmlRegisterType（含未使用的 ModelImporter 死注册）与 loadFromModule、3 QML 文件 import 替换；bsp DocLoader.h（dcf75e9）。验证：jom 100%；--simulate 加载×4 全绿；--wheel 3 档注入 accepted、xSpan 每档 ×0.8 精确（3.7428→2.9943→2.3954→1.9163）；COM3@921600 真机 28s 全绿（connected=true×14、points 121→1391 单调、recvBytes 5k→170k、latestAx≈-0.5g）；--serial+--cyclepages 真实数据 3 轮 0 QML 错误。 工具链坑记录 - PowerShell 5.1 Get-Content 默认按 GBK 读无 BOM UTF-8 文件 → 写回即双重乱码（本轮 7 个头文件中招，git checkout 恢复）。批量改  日志 seq 增量拉取 | CommViewModel.h/.cpp、MainViewModel.h、DebugPage.qml | 新增 `Q_INVOKABLE rxLogsSince(fromSeq)` / `lastLogSeq()`（门面 MainViewModel 转发）；`syncLogs`/`resumeLogs` 改增量拉取，删除全量 `rxLogs()`；O(新增条目) 替代 O(5000) 全量拷贝 |\n| 3 | perfLog 默认关闭 | DataPlotViewModel.cpp、CommViewModel.cpp | 环境变量 `COMMTOOLS_PERF_LOG` 开启才写 perf_log.txt；此前热路径每 N 次调用（onNewSensorData %500、addLog %200、onUpdateTimeout %50…）在解析线程开-写-关文件 |\n| 4 | RelWithDebInfo 构建 | build/Desktop_Qt_6_11_1_MSVC2022_64bit-RelWithDebInfo | `NMake Makefiles JOM` + `CMAKE_PREFIX_PATH=D:/software/22.QT/6.11.1/msvc2022_64`；**必须 `-DCMAKE_MAKE_PROGRAM=` 指向 jom.exe 完整路径**（jom 不在 PATH，否则 try-compile \"no such file or directory\" 失败） |\n\n## 验证（2026-10-15）\n\n- Debug 增量构建 `[100%]`；RelWithDebInfo 配置 + 全量构建 `[100%]`\n- `--simulate 8s --size 1600x900 --grab` 截图精确像素计数（System.Drawing LockBits）：blue/red/green = **2992/3709/4245**（Debug）、**2993/3382/4359**（RelWithDebInfo）——三色曲线正常渲染，数据链路无回归\n- `--page 0 --btscan 10`：蓝牙扫到 **7 台设备**；发现日志走 addLog→logTimer→logsChanged→syncLogs→`rxLogsSince` 全链路，运行窗口 **0 QML 错误**（无 TypeError/\"is not a function\"）\n- perf_log.txt 在自测期间零写入（门控生效；最后一次写入为用户旧版会话 21:39:53）\n- 编译坑记录：QVariant 无 `.value(\"key\")` 成员（那是 QMap 接口），须 `.toMap().value()`，否则 C2672/C2440\n\n## 遗留与后续建议\n\n- **既有 bug（非本批引入）**：`AttitudeIndicatorView.qml:77 Error: Incorrect argument radius`（用户 21:34 手动运行旧版时 debug.log 记录，姿态仪页 Canvas 半径参数偶发非法），待专项排查\n- **P1**：页面 3-6（命令面板/3D 模型/姿态仪/固件升级）Loader 延迟加载；波形数据绑定按页可见性门控；C++ 类型注册进 qt_add_qml_module（QML_ELEMENT，绑定 AOT 编译）\n- **P2**：波形数据 C++ 侧喂入（QXYSeries::replace，消灭每 tick 约 1.8 万个 Qt.point 分配）；日志改 QAbstractListModel（现成 LogModel 类未使用）\n- **小项**：POST_BUILD `copy_directory`→按需拷贝（resource 含 su7 模型较大）；onLogTimerTimeout 裁剪循环 removeFirst→erase 批量；main.cpp `QSG_INFO=1` 硬编码→环境变量守卫；`CommViewModel::isCommandSelected` 疑似死代码（grep 无调用方）\n\n---\n\n# P1/P2 批次（2026-10-15 第二轮，提交 c3e9e8b / 664a2f1 / e26aa0e）\n\n## 已落地\n\n| # | 修改 | 提交 | 说明 |\n|---|------|------|------|\n| B1 | 自测钩子 --serial/--cyclepages + 小项四连 | c3e9e8b | `--serial PORT[:baud]` 真实串口全链路验证（连接→解析→波形像素断言，无数据 4.5s 自动发 0x0010 推送使能）；`--cyclepages` 每 1.5s 轮页压力测试；资源拷贝 copy_directory_if_different；日志裁剪单次 erase；移除强制 QSG_INFO；清理死代码 isCommandSelected。**设备实测：COM3 波特率 921600**（协议文档默认值，帧头 0xAA 0x55，50Hz 推送约 11.5KB/s；115200 下全是乱码） |\n| B2 | 页面 3-6 Loader 延迟加载 | 664a2f1 | CommandPanel / Model3DView(Quick3D，GPU 最重) / AttitudeIndicatorView / FirmwareUpgradePage 首次进入才创建（参照波形页模式，active 置位后常驻）；启动不再同步实例化全部七页 |\n| B3+B4 | 波形 C++ 侧供数 fillChart | e26aa0e | DataPlotViewModel 新增 `fillChart(group, s1..s3, xMin, xMax, show1..3)`（C++ 构建可见窗口点集并整批 replace(QList<QPointF>)，返回 [yLo,yHi]）+ timeFirst/timeLast/pointCount；LineChartWidget 重写：图例改 provider.latest* 标量绑定，缩放/拖拽边界改 timeFirst/timeLast，四个数组属性与对应绑定全部移除。**效果：每 tick 13 通道 QVariant→JS 全量转换 + 约 1.8 万次 Qt.point JS 分配彻底归零（仅波形页可见时由 C++ 直接喂系列）** |\n\n## 验证证据（COM3@921600 真实设备）\n\n- 滚轮注入断言：`--wheel 800,150,3` xSpan 每档精确 ×0.8（3.72→2.976→2.3808），WheelHandler→applyInspectRange(provider 边界)→fillChart 全链路（注意 (800,300) 落在卡片标题栏不会触发，非回归；accepted=false 是指针处理器派发常态，断言看跨度日志）\n- 真实数据渲染像素：B3+B4 后 2043/4722/4736；RelWithDebInfo 全量重建后 3307/3324/5404\n- 轮页压力（真实数据 + 1.5s×21 次切页）：数据流不中断、0 QML 错误\n- 1500 点滚动窗口 + 200 点迟滞裁剪行为与设计一致（points 序列 1507→1500→1587…）\n\n## B5（QML_ELEMENT AOT）已完成（父仓 7efc33a / bsp dcf75e9，2026-10-15）\n\n目标达成：qmlRegisterType 运行时注册 → qt_add_qml_module(SOURCES) + QML_ELEMENT 编译期注册，qmlcachegen 获得 C++ 类型信息做 AOT 绑定编译。\n\n**旧根因归档（重要更正）**：上轮回退时把 C2737/C2338 归因于枚举 staticMetaObject 跨 TU 链接，实测**不成立**——用 moc+MSVC 最小复现矩阵（V1 类版枚举+前置声明指针→复现 C2338+C2737；V2 同枚举+完整指针类型→编译通过）证明：**唯一根因是 MainViewModel.h 的 `Q_INVOKABLE setSettingViewModel(class SettingViewModel*)` 前置声明指针触发 qmetatype.h 的 C2338（\"Pointer Meta Types must either point to fully-defined types…\"），C2737 只是其级联**（constexpr 求值失败 → staticMetaObject 无法 constinit 初始化）。moc 生成的 `SuperData::link<EnumCommon::staticMetaObject>` 跨 TU 在 MSVC 2022/Qt 6.11.1 下编译链接与运行均无害（Qt 6.11 的 link<T> 仅取 &MO 地址，链接器解析）。CommandViewModel 幸免只因它没有前置声明指针参数，与枚举无关。修复：MainViewModel.h 直接 `#include \"SettingViewModel.h\"`（无循环包含），无需 Q_DECLARE_OPAQUE_POINTER，也无需 EnumCommon 命名空间化/独立模块。**给 qt_add_qml_module 加 SOURCES 后目标内所有类的元类型检查严格化：任何 Q_PROPERTY/signal/Q_INVOKABLE 签名里的前置声明指针都会炸；CommViewModel 的前置声明仅用于普通方法与成员，不受影响。**\n\n**本轮新坑（Qt 6.11.1 实测）**：迁移后 QML 加载非确定性失败 `MainView.qml:N:5: XxxViewModel is not a type`——**失败点随进程漂移**（Model3D/Attitude/FirmwareUpgrade/MainViewModel 轮流出错，同一 exe；QT_HASH_SEED=0 时稳定复现于同一处 → 依赖 QHash 布局；Qt 对非 0 种子值会拒绝）。切割实验：动态 `QQmlComponent`+显式 `import MainView` 逐类型实例化 7/7 全 OK（注册侧完好）→ 病灶在 **qmlcachegen 编译单元的\"同模块隐式导入\"类型解析**。修复：实例化模块 C++ 类型的 QML 文件**显式 `import MainView`**（MainView.qml / FirmwareUpgradePage.qml / ProtocolDocPage.qml），main.cpp 改 `engine.loadFromModule(\"MainView\", \"MainView\")`（Qt 6.5+ 规范）；显式导入后 4/4 次加载全绿（含 seed=0）。\n\n**模块解析机制备注**：本工程模块资源前缀是 `/`（qt_standard_project_setup），qrc qmldir 不在任何 import path 下——模块解析依赖构建目录里 exe 旁的磁盘 qmldir（`build/.../MainView/qmldir`，`prefer :/MainView/` 回指 qrc）；删掉该目录则 `Module \"MainView\" contains no type named \"MainView\"`。\n\n改动清单：CMakeLists（6 VM+DocLoader 移入 qt_add_qml_module SOURCES）、7 头加 QML_ELEMENT+qqmlintegration 头（CommandViewModel 原残留宏转正）、main.cpp 删 8 处 qmlRegisterType（含未使用的 ModelImporter 死注册）与 loadFromModule、3 QML 文件 import 替换；bsp DocLoader.h（dcf75e9）。验证：jom [100%]；--simulate 加载×4 全绿；--wheel 3 档注入 accepted、xSpan 每档 ×0.8 精确（3.7428→2.9943→2.3954→1.9163）；COM3@921600 真机 28s 全绿（connected=true×14、points 121→1391 单调、recvBytes 5k→170k、latestAx≈-0.5g）；--serial+--cyclepages 真实数据 3 轮 0 QML 错误。\n\n## 工具链坑记录\n\n- **PowerShell 5.1 Get-Content 默认按 GBK 读无 BOM UTF-8 文件 → 写回即双重乱码**（本轮 7 个头文件中招，git checkout 恢复）。批量改源码必须用 [System.IO.File]::ReadAllText($p, UTF8) 或编辑工具\n- edit 工具锚点必须含真实相邻行（import 顺序预设错误会导致找不到匹配）\n- jom/CMake：qt_add_qml_module 加 SOURCES 会对目标内所有 moc 生效元类型严格化，不只是列出的文件\n- **PowerShell `& exe` 不等待 GUI 子系统进程**：Win32 app 立即返回，多个\"顺序\"自测实际并发、debug.log 多实例交错覆写（行中截断）——串行跑自测必须 `| Out-Null` 或 Start-Process -Wait\n- **git checkout/reset 恢复的工作树是 CRLF**（autocrlf，仓库内 LF）：多行 edit 锚点必须带 \\r\\n，LF 锚点只在单行子串匹配时可用\n- **并行会话操作同一工作树**：主线会话 commit 后 reset 清掉了另一会话未提交修改（23:19 全树回退事故）——跨会话共仓时长任务应尽早提交落库，动手前先查 git log 是否有并行新提交\n- **Qt Creator 编辑器未保存缓冲区会“复活”已 stash/回退的改动**：命令行恢复工作区后，Creator 里仍开着的实验文件缓冲区会在构建前保存（或用户手动 Ctrl+S）写回磁盘，重新编出问题版本（表现为闪退/exit -1 且日志带实验代码痕迹）。命令行恢复后必须让 Creator「全部重新载入/Reload All」或关闭对应标签不保存；判别方法：debug.log 出现不属于当前提交的日志行（如实验代码的 loadFromModule/probetype 输出）即缓冲区回写已发生\n\n# B7 批次（2026-10-15 第三轮，提交 da861cb）：调试页流畅度 + 面板切换卡顿\n\n## 问题与根因\n\n1. **调试页接收显示不如 XCOM 流畅**：日志/字节计数刷新定时器 500ms（2Hz），批量跳变不跟手。\n2. **疯狂切换串口/蓝牙配置面板卡顿**：侧栏本身已是双常驻 Loader（只切 visible，非重建）；根因是每次展开串口面板 `refreshSerialPorts() → mainVM.availablePorts()` 在 UI 线程同步调 `QSerialPortInfo::availablePorts()`——Windows 上要走注册表/设备管理器，单次 10-100ms，快速切换即卡。\n\n## 修复\n\n| # | 修改 | 说明 |\n|---|------|------|\n| 1 | CommViewModel 日志定时器 500→**100ms（10Hz）** | P0 增量拉取后单批成本 O(新增条目)，提频无全量拷贝代价；字节计数同步 10Hz，XCOM 级跟手 |\n| 2 | `MainViewModel::refreshSerialPortsAsync()` + `serialPortsReady(QStringList)` 信号 | QtConcurrent 后台线程枚举，QPointer guard + QueuedConnection 回 UI 线程；MainView 面板展开/刷新按钮改走异步，`onSerialPortsReady` 更新 serialPortList |\n\n## 验证（COM3@921600，页 0 可见真实数据 15s）\n\n- 零 QML 错误；数据流 50Hz 正常（points 128→698）\n- `[serial] serialPortsReady count= 4 QList(\"COM3\",\"COM1\",\"COM6\",\"COM5\")`——异步链路端到端工作\n- perf_log 新旧对比：旧 #900→#950 间隔 25s（500ms）；新 50 tick/5s（100ms）✓\n- 注意：链接需关闭运行中的 CommTools（LNK1168），本轮已按项目惯例 taskkill\n"}],"bytes":66867.20000000001},{"id":"linux","name":"Linux-Scripts","dir":"Linux-Scripts/","icon":"🐧","color":"#e05c5c","desc":"常用机环境脚本：Claude Code / OpenClaw 安装配置、FTP 服务、硬盘挂载、依赖清理","docs":[{"hash":"Linux-Scripts/Readme.md","title":"Readme","relPath":"Linux-Scripts/Readme.md","desc":"Linux 常用机脚本 2026-10-26 建：备份自 的常用环境配置脚本。","created":"","updated":"","tags":[],"sizeKB":8.3,"_text":"Linux 常用机脚本 2026-10-26 建：备份自 的常用环境配置脚本。全部通过 语法检查；带 需求的脚本请用 root 运行。 脚本总览 脚本 用途 权限 交互 ------------------------ claude-setup.sh Claude Code 一键安装配置（多平台） 普通用户（链接环节可免 sudo） 菜单 / 免交互均可 openclaw-setup.sh OpenClaw AI 助理网关一键安装配置 普通用户（链接环节可免 sudo） 主菜单 / 免交互均可 setup-ftp.sh vsftpd FTP 服务一键配置（共享 /mnt/sda1/00.FTP） root 无 setupftp.sh vsftpd FTP 服务配置（U 盘目录旧版，含防火墙放行） root 无 setup-hdd-mount.sh 机械硬盘两分区 fstab 开机自动挂载 root 无 cleanup-openclaw-game.sh 卸载 OpenClaw 游戏编译所装的全部依赖 root 无 --- 1. claude-setup.sh — Claude Code 一键安装配置 安装 Node.js（国内镜像、用户目录）+ Claude Code CLI，并把 Claude Code 接入所选模型平台（智谱 GLM / Kimi / DeepSeek / Anthropic 官方 / 第三方中转站 / 自定义），配置写入 （权限 600，旧配置自动备份）。 用法 参数 参数 作用 ------------ / / / / 子命令，分别对应只装环境 / 只配平台 / 查配置 / 诊断 / 帮助；无子命令 = 全流程 指定 API 地址，跳过平台选择菜单（结尾 自动去除） 指定 API Key，跳过输入（输入时不回显） 指定默认主模型（如 ），写入 API 超时秒数，写入 ；不指定时交互菜单选（默认 600 秒） 文件修改权限模式： （每次询问）/ （自动接受编辑）/ （只规划）/ （全自动，有风险）； 等于不写该字段 , 免确认：未指定的项全部取默认值（超时 600s、权限模式不设置、主题跳过） 说明 - 平台预设含官方地址与推荐模型（如 GLM： ），选平台后自动带出；后台小模型（ ）按平台自动设置 - Node.js v20.18.1 装到 （npmmirror 镜像，支持 x64/arm64）；系统已有 Node ≥ 18 则跳过 - 命令链接：有 sudo 时软链到 ；无 sudo 自动改为写 / PATH - 免交互示例： --- 2. openclaw-setup.sh — OpenClaw 一键安装配置 OpenClaw（原 Clawdbot/Moltbot，开源个人 AI 助理网关，可接 WhatsApp/Telegram/Discord 等渠道）的环境安装与模型接入配置，写入 （权限 600，旧配置自动备份）。 用法 参数 参数 作用 ------------ / / / / / 子命令；无参数弹主菜单，有选项但无子命令时按 处理 指定 API 地址，跳过平台菜单（提供商记为 ） 指定 API Key，跳过输入 指定默认模型； 且未指定时用 , 免确认（已有配置直接覆盖；未指定模型给默认值） 说明 - Node 版本要求：OpenClaw 要求 Node ≥ 26.12.1，脚本安装 Node v26.12.1；重装前先删旧目录再解压（避免 npm 新旧混装损坏；全局包如 claude-code 会被清掉并在后续自动恢复） - OpenClaw 经 npmmirror 镜像 npm 全局安装；第二步带 允许内置插件安装脚本（npm 11 默认拦截） - 平台模型全部写入配置（含上下文窗口/最大输出元数据），便于后续切换；完成后提示 （接渠道）/ （启动网关） - 覆盖已有配置前会警告确认（渠道等设置建议先 再改模型） --- 3. setup-ftp.sh — vsftpd FTP 服务一键配置（当前使用版） 安装并配置 vsftpd，把 共享为 FTP 根目录：系统账号登录（yym + 系统密码）、禁止匿名、用户锁定在共享目录内、被动模式端口 40000-40100、开启传输日志。 用法 无参数。流程：装 vsftpd → 备份并重写 → 建共享目录 → → 打印服务状态与 21 端口监听。 配置要点（脚本内写死，如需变更改脚本） 配置项 值 ------------- （登录后直接进入并锁定） NO（禁止匿名） 被动端口 40000~40100 配置备份 --- 4. setupftp.sh — vsftpd FTP 服务配置（U 盘目录旧版） 旧版配置：共享目录为 U 盘 （NTFS，777 权限）。与上一版差异：IPv6 监听、 白名单只允许 yym 登录、ufw 启用时自动放行 20/21/40000-40100 端口。 用法 无参数（脚本头部注释含历史用法示例）。要求 vsftpd 已安装（只改配置不装包）。 配置要点 配置项 值 ------------- 仅 yym YES（NTFS 777 目录必需，否则 vsftpd 拒绝 chroot） 局域网地址 有线 、无线 （脚本输出提示） 两份 FTP 脚本二选一，按共享目录位置选择；重复运行均幂等（先备份原配置）。 --- 5. setup-hdd-mount.sh — 机械硬盘开机自动挂载 把机械硬盘 sda 的两个 ext4 分区按 UUID 写入 开机自动挂载到 、 （挂载点与分区名一致）， 防止硬盘故障卡开机。 用法 无参数。流程：建挂载点 → 备份 fstab → fstab 无对应 UUID 时追加两行配置 → 立即挂载 → 目录所有权给 yym → 打印 fstab 新增内容与挂载结果。 注意 - 脚本内 UUID 为本机（YYM 机）硬盘专用，换机器必须先用 查新 UUID 并改脚本第 15~16 行 - ：硬盘缺席/故障时跳过挂载正常开机；第 5 字段 表示非根分区 fsck - 幂等：grep 检测 UUID 已存在则不重复追加 --- 6. cleanup-openclaw-game.sh — 卸载 OpenClaw 游戏编译依赖 清理为编译 OpenClaw 游戏（SDL 复刻版）而安装的全部依赖： 全家桶 + + ， 后 ，最后检查无残留。 用法 无参数。注意：会连带卸载 与 ，若系统其他开发工作依赖它们请先确认。","content":"# Linux 常用机脚本\n\n> 2026-10-26 建：备份自 `/home/yym/sda1/00.FTP` 的常用环境配置脚本。全部通过 `bash -n` 语法检查；带 `sudo` 需求的脚本请用 root 运行。\n\n## 脚本总览\n\n| 脚本 | 用途 | 权限 | 交互 |\n|------|------|------|------|\n| [claude-setup.sh](claude-setup.sh) | Claude Code 一键安装配置（多平台） | 普通用户（链接环节可免 sudo） | 菜单 / 免交互均可 |\n| [openclaw-setup.sh](openclaw-setup.sh) | OpenClaw AI 助理网关一键安装配置 | 普通用户（链接环节可免 sudo） | 主菜单 / 免交互均可 |\n| [setup-ftp.sh](setup-ftp.sh) | vsftpd FTP 服务一键配置（共享 /mnt/sda1/00.FTP） | root | 无 |\n| [setup_ftp.sh](setup_ftp.sh) | vsftpd FTP 服务配置（U 盘目录旧版，含防火墙放行） | root | 无 |\n| [setup-hdd-mount.sh](setup-hdd-mount.sh) | 机械硬盘两分区 fstab 开机自动挂载 | root | 无 |\n| [cleanup-openclaw-game.sh](cleanup-openclaw-game.sh) | 卸载 OpenClaw 游戏编译所装的全部依赖 | root | 无 |\n\n---\n\n## 1. claude-setup.sh — Claude Code 一键安装配置\n\n安装 Node.js（国内镜像、用户目录）+ Claude Code CLI，并把 Claude Code 接入所选模型平台（智谱 GLM / Kimi / DeepSeek / Anthropic 官方 / 第三方中转站 / 自定义），配置写入 `~/.claude/settings.json`（权限 600，旧配置自动备份）。\n\n### 用法\n\n```bash\nbash claude-setup.sh            # 全流程：安装环境 → 选平台 → 配置 → 验证\nbash claude-setup.sh install    # 仅安装环境（Node.js + Claude Code + 全局命令）\nbash claude-setup.sh config     # 仅配置接入平台（菜单选择 + 输入 Key）\nbash claude-setup.sh show       # 查看当前配置（Token 自动打码）\nbash claude-setup.sh doctor     # 诊断：版本 + API 连通性实测\nbash claude-setup.sh help       # 显示帮助\n```\n\n### 参数\n\n| 参数 | 作用 |\n|------|------|\n| `install` / `config` / `show` / `doctor` / `help` | 子命令，分别对应只装环境 / 只配平台 / 查配置 / 诊断 / 帮助；无子命令 = 全流程 |\n| `--base-url <URL>` | 指定 API 地址，跳过平台选择菜单（结尾 `/` 自动去除） |\n| `--token <KEY>` | 指定 API Key，跳过输入（输入时不回显） |\n| `--model <名称>` | 指定默认主模型（如 `glm-4.6`），写入 `ANTHROPIC_MODEL` |\n| `--timeout <秒>` | API 超时秒数，写入 `API_TIMEOUT_MS`；不指定时交互菜单选（默认 600 秒） |\n| `--perm <模式>` | 文件修改权限模式：`default`（每次询问）/ `acceptEdits`（自动接受编辑）/ `plan`（只规划）/ `bypassPermissions`（全自动，有风险）；`default` 等于不写该字段 |\n| `-y`, `--yes` | 免确认：未指定的项全部取默认值（超时 600s、权限模式不设置、主题跳过） |\n\n### 说明\n\n- 平台预设含官方地址与推荐模型（如 GLM：`glm-5.3-flash|glm-4.6|...`），选平台后自动带出；后台小模型（`ANTHROPIC_SMALL_FAST_MODEL`）按平台自动设置\n- Node.js v20.18.1 装到 `~/.local/share/nodejs`（npmmirror 镜像，支持 x64/arm64）；系统已有 Node ≥ 18 则跳过\n- 命令链接：有 sudo 时软链到 `/usr/local/bin`；无 sudo 自动改为写 `~/.bashrc` / `~/.profile` PATH\n- 免交互示例：`claude-setup.sh config --base-url https://xxx --token sk-xxx --yes`\n\n---\n\n## 2. openclaw-setup.sh — OpenClaw 一键安装配置\n\nOpenClaw（原 Clawdbot/Moltbot，开源个人 AI 助理网关，可接 WhatsApp/Telegram/Discord 等渠道）的环境安装与模型接入配置，写入 `~/.openclaw/openclaw.json`（权限 600，旧配置自动备份）。\n\n### 用法\n\n```bash\nbash openclaw-setup.sh           # 无参数 → 主菜单（安装/配置/查询/诊断）\nbash openclaw-setup.sh full      # 全流程：安装环境 → 选平台 → 配置 → 验证\nbash openclaw-setup.sh install   # 仅安装环境（Node 26 + OpenClaw + 全局命令）\nbash openclaw-setup.sh config    # 仅配置模型接入\nbash openclaw-setup.sh show      # 查看当前配置（Key 自动打码）\nbash openclaw-setup.sh doctor    # 诊断：Node/OpenClaw 版本 + API 连通性\nbash openclaw-setup.sh help      # 显示帮助\n```\n\n### 参数\n\n| 参数 | 作用 |\n|------|------|\n| `full` / `install` / `config` / `show` / `doctor` / `help` | 子命令；无参数弹主菜单，有选项但无子命令时按 `full` 处理 |\n| `--base-url <URL>` | 指定 API 地址，跳过平台菜单（提供商记为 `custom`） |\n| `--token <KEY>` | 指定 API Key，跳过输入 |\n| `--model <名称>` | 指定默认模型；`--yes` 且未指定时用 `claude-sonnet-4-5` |\n| `-y`, `--yes` | 免确认（已有配置直接覆盖；未指定模型给默认值） |\n\n### 说明\n\n- **Node 版本要求**：OpenClaw 要求 Node ≥ 26.12.1，脚本安装 Node v26.12.1；**重装前先删旧目录再解压**（避免 npm 新旧混装损坏；全局包如 claude-code 会被清掉并在后续自动恢复）\n- OpenClaw 经 npmmirror 镜像 npm 全局安装；第二步带 `--allow-scripts` 允许内置插件安装脚本（npm 11 默认拦截）\n- 平台模型全部写入配置（含上下文窗口/最大输出元数据），便于后续切换；完成后提示 `openclaw onboard`（接渠道）/ `openclaw gateway`（启动网关）\n- 覆盖已有配置前会警告确认（渠道等设置建议先 `openclaw onboard` 再改模型）\n\n---\n\n## 3. setup-ftp.sh — vsftpd FTP 服务一键配置（当前使用版）\n\n安装并配置 vsftpd，把 `/mnt/sda1/00.FTP` 共享为 FTP 根目录：系统账号登录（yym + 系统密码）、禁止匿名、用户锁定在共享目录内、被动模式端口 40000-40100、开启传输日志。\n\n### 用法\n\n```bash\nsudo bash setup-ftp.sh\n```\n\n无参数。流程：装 vsftpd → 备份并重写 `/etc/vsftpd.conf` → 建共享目录 → `systemctl enable --now` → 打印服务状态与 21 端口监听。\n\n### 配置要点（脚本内写死，如需变更改脚本）\n\n| 配置项 | 值 |\n|--------|-----|\n| `local_root` | `/mnt/sda1/00.FTP`（登录后直接进入并锁定） |\n| `anonymous_enable` | NO（禁止匿名） |\n| 被动端口 | 40000~40100 |\n| 配置备份 | `/etc/vsftpd.conf.bak-时间戳` |\n\n---\n\n## 4. setup_ftp.sh — vsftpd FTP 服务配置（U 盘目录旧版）\n\n旧版配置：共享目录为 U 盘 `/media/yym/3326F555A9DAFEB8/00.FTP`（NTFS，777 权限）。与上一版差异：IPv6 监听、`userlist` 白名单只允许 yym 登录、**ufw 启用时自动放行 20/21/40000-40100 端口**。\n\n### 用法\n\n```bash\nsudo bash setup_ftp.sh\n```\n\n无参数（脚本头部注释含历史用法示例）。要求 vsftpd 已安装（只改配置不装包）。\n\n### 配置要点\n\n| 配置项 | 值 |\n|--------|-----|\n| `local_root` | `/media/yym/3326F555A9DAFEB8/00.FTP` |\n| `userlist` | `/etc/vsftpd.userlist` 仅 yym |\n| `allow_writeable_chroot` | YES（NTFS 777 目录必需，否则 vsftpd 拒绝 chroot） |\n| 局域网地址 | 有线 `ftp://192.168.1.137/`、无线 `ftp://192.168.4.2/`（脚本输出提示） |\n\n> 两份 FTP 脚本二选一，按共享目录位置选择；重复运行均幂等（先备份原配置）。\n\n---\n\n## 5. setup-hdd-mount.sh — 机械硬盘开机自动挂载\n\n把机械硬盘 sda 的两个 ext4 分区按 **UUID** 写入 `/etc/fstab` 开机自动挂载到 `/mnt/sda1`、`/mnt/sda2`（挂载点与分区名一致），`nofail` 防止硬盘故障卡开机。\n\n### 用法\n\n```bash\nsudo bash setup-hdd-mount.sh\n```\n\n无参数。流程：建挂载点 → 备份 fstab → fstab 无对应 UUID 时追加两行配置 → `mount -a` 立即挂载 → 目录所有权给 yym → 打印 fstab 新增内容与挂载结果。\n\n### 注意\n\n- **脚本内 UUID 为本机（YYM 机）硬盘专用**，换机器必须先用 `blkid` 查新 UUID 并改脚本第 15~16 行\n- `defaults,nofail`：硬盘缺席/故障时跳过挂载正常开机；第 5 字段 `2` 表示非根分区 fsck\n- 幂等：grep 检测 UUID 已存在则不重复追加\n\n---\n\n## 6. cleanup-openclaw-game.sh — 卸载 OpenClaw 游戏编译依赖\n\n清理为编译 OpenClaw 游戏（SDL 复刻版）而安装的全部依赖：`libsdl2-*` 全家桶 + `build-essential` + `cmake`，`apt-get purge` 后 `autoremove`，最后检查无残留。\n\n### 用法\n\n```bash\nsudo bash cleanup-openclaw-game.sh\n```\n\n无参数。**注意**：会连带卸载 `build-essential` 与 `cmake`，若系统其他开发工作依赖它们请先确认。\n"}],"bytes":
